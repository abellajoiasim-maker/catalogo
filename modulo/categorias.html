<div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-6 text-left space-y-4">
    <div class="flex justify-between items-center border-b border-zinc-800 pb-3">
        <h3 class="text-sm font-bold text-white uppercase tracking-wider font-mono">Gerenciador de Categorias / Coleções</h3>
    </div>
    
    <div class="space-y-3">
        <div class="space-y-1">
            <label class="text-[10px] text-zinc-400 uppercase font-bold">Nome de Exibição da Categoria:</label>
            <input type="text" id="catNome" placeholder="Ex: Brincos de Argola" class="w-full bg-black border border-zinc-800 rounded-xl px-3 py-2 text-white outline-none focus:border-[#caa85c]">
        </div>
        <div class="space-y-1">
            <label class="text-[10px] text-zinc-400 uppercase font-bold">Ordem Numérica de Ordenação (Index):</label>
            <input type="number" id="catOrdem" placeholder="0" class="w-full bg-black border border-zinc-800 rounded-xl px-3 py-2 text-white outline-none focus:border-[#caa85c]">
        </div>
        
        <div class="pt-2 grid grid-cols-2 gap-3">
            <button type="button" class="border border-zinc-800 hover:bg-zinc-900 text-zinc-400 py-2.5 rounded-xl font-bold uppercase text-[10px] tracking-wider transition-all">Limpar</button>
            <button type="button" onclick="window.salvarNovaCategoriaItem()" class="bg-[#caa85c] hover:bg-[#bda152] text-black py-2.5 rounded-xl font-black uppercase text-[10px] tracking-wider transition-all text-center">Criar Categoria</button>
        </div>
    </div>
</div>

<script>
    window.salvarCategoriaFirebase = function() {
        var nome = document.getElementById('catNome').value.trim();
        var ordem = document.getElementById('catOrdem').value || 0;
        
        if(!nome) {
            alert("Por favor, preencha o título da categoria.");
            return;
        }
        
        var slugId = nome.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '-').replace(/[^a-z0-9\-]/g, '');
        
        window.db.ref('abella/categories/' + slugId).set({
            id: slugId,
            nome: nome,
            ordem: parseInt(ordem)
        }).then(function() {
            alert("Categoria de produtos catalogada com sucesso!");
            document.getElementById('catNome').value = "";
            document.getElementById('catOrdem').value = "";
        }).catch(function(err) {
            console.error("Falha ao salvar categoria:", err);
        });
    };

    window.carregarBlocoCategorias = function() {
        console.log("Categorias lidas em segundo plano.");
    };
</script>
