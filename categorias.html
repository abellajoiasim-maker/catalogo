<div class="p-6 max-w-6xl mx-auto space-y-6 animate-fade-in">
    <div class="flex items-center justify-between border-b border-gray-100 pb-4">
        <div>
            <h1 class="text-2xl font-bold text-gray-800 flex items-center gap-2">
                <span>📁</span> Gestão de Categorias e Coleções
            </h1>
            <p class="text-sm text-gray-500 mt-1">Gerencie as divisões do seu catálogo, controle visibilidade e organize seus produtos.</p>
        </div>
        <button onclick="abrirModalCategoria()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-5 py-2.5 rounded-xl shadow-sm transition-all flex items-center gap-2 text-sm">
            <span>➕</span> Nova Categoria
        </button>
    </div>

    <div id="grid-categorias" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        <div class="col-span-full text-center py-12 text-gray-400 font-medium">
            ⏳ Carregando categorias...
        </div>
    </div>
</div>

<div id="modalCategoria" class="hidden fixed inset-0 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4 z-50 animate-fade-in">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl space-y-4 relative">
        <div class="flex items-center justify-between border-b border-gray-100 pb-3">
            <h3 id="modalTitulo" class="text-lg font-bold text-gray-800">Nova Categoria</h3>
            <button onclick="fecharModalCategoria()" class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
        </div>
        
        <input type="hidden" id="catId">

        <div class="space-y-3">
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Nome da Categoria</label>
                <input type="text" id="catNome" placeholder="Ex: Anéis, Correntes Bruto" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-gray-800 font-medium focus:ring-2 focus:ring-emerald-500 focus:bg-white outline-none transition-all">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">URL da Imagem / Ícone</label>
                <input type="text" id="catUrlImagem" placeholder="https://linkdafoto.com/imagem.jpg" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-gray-800 font-mono text-sm focus:ring-2 focus:ring-emerald-500 focus:bg-white outline-none transition-all">
            </div>
            
            <div class="border border-dashed border-gray-200 rounded-xl p-2 bg-gray-50 flex items-center justify-center h-28 overflow-hidden">
                <img id="catPreviewModal" src="" alt="Preview" class="hidden h-full object-contain rounded-lg">
                <span id="catPreviewPlaceholder" class="text-xs text-gray-400">Nenhuma imagem carregada</span>
            </div>
        </div>

        <div class="flex items-center justify-end gap-3 border-top border-gray-50 pt-3">
            <button onclick="fecharModalCategoria()" class="bg-gray-100 hover:bg-gray-200 text-gray-600 font-medium px-4 py-2 rounded-xl transition-all text-sm">Cancelar</button>
            <button id="btnSalvarCategoria" onclick="salvarCategoriaFirebase()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-5 py-2 rounded-xl transition-all text-sm">Salvar Registro</button>
        </div>
    </div>
</div>

<script>
    (function inicializarModulo() {
        if (typeof db !== "undefined") {
            escutarCategoriasFirebase();
            
            // Listener em tempo real para o input de imagem atualizar o preview do modal
            document.getElementById('catUrlImagem').addEventListener('input', function(e) {
                const img = document.getElementById('catPreviewModal');
                const placeholder = document.getElementById('catPreviewPlaceholder');
                if(e.target.value.trim() !== "") {
                    img.src = e.target.value.trim();
                    img.classList.remove('hidden');
                    placeholder.classList.add('hidden');
                } else {
                    img.classList.add('hidden');
                    placeholder.classList.remove('hidden');
                }
            });
        } else {
            console.error("Erro: Instância do Firebase (db) não encontrada.");
        }
    })();

    // ESCUTA EM TEMPO REAL (REALTIME DATABASE)
    function escutarCategoriasFirebase() {
        db.ref('categorias').on('value', (snapshot) => {
            const grid = document.getElementById('grid-categorias');
            if (!grid) return;
            
            grid.innerHTML = '';
            const dados = snapshot.val();

            if (!dados) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-12 text-gray-400 border border-dashed border-gray-200 rounded-2xl bg-white">
                        📦 Nenhuma categoria cadastrada até o momento.
                    </div>`;
                return;
            }

            Object.keys(dados).forEach((id) => {
                const cat = dados[id];
                const estaPausado = cat.status === 'pausado';
                const fotoPadrao = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="%23ccc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>';

                const card = document.createElement('div');
                card.className = `bg-white rounded-2xl border border-gray-200 overflow-hidden shadow-xs flex flex-col justify-between transition-all ${estaPausado ? 'opacity-60 grayscale' : ''}`;
                
                card.innerHTML = `
                    <div>
                        <div class="w-full h-40 bg-gray-50 relative flex items-center justify-center border-b border-gray-100 overflow-hidden">
                            <img src="${cat.urlImagem || fotoPadrao}" alt="${cat.nome}" class="w-full h-full object-cover" onerror="this.src='${fotoPadrao}'">
                            ${estaPausado ? '<span class="absolute top-3 left-3 bg-amber-500 text-white font-bold text-[10px] uppercase px-2 py-0.5 rounded-md shadow-sm">⏸️ Pausada</span>' : '<span class="absolute top-3 left-3 bg-emerald-500 text-white font-bold text-[10px] uppercase px-2 py-0.5 rounded-md shadow-sm">🟢 Ativa</span>'}
                        </div>
                        
                        <div class="p-4">
                            <h3 class="font-bold text-gray-800 truncate text-base">${cat.nome}</h3>
                            <p class="text-[11px] text-gray-400 font-mono mt-0.5">ID: ${id}</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-3 border-t border-gray-100 bg-gray-50 divide-x divide-gray-100">
                        <button onclick="editarCategoria('${id}', '${cat.nome}', '${cat.urlImagem || ''}')" class="py-2.5 text-xs font-semibold text-blue-600 hover:bg-blue-50/50 transition-all flex items-center justify-center gap-1">
                            ✏️ Editar
                        </button>
                        <button onclick="alternarStatusCategoria('${id}', '${cat.status || 'ativo'}')" class="py-2.5 text-xs font-semibold ${estaPausado ? 'text-emerald-600 hover:bg-emerald-50/50' : 'text-amber-600 hover:bg-amber-50/50'} transition-all flex items-center justify-center gap-1">
                            ${estaPausado ? '▶️ Ativar' : '⏸️ Pausar'}
                        </button>
                        <button onclick="deletarCategoria('${id}')" class="py-2.5 text-xs font-semibold text-rose-600 hover:bg-rose-50/50 transition-all flex items-center justify-center gap-1">
                            🗑️ Excluir
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        });
    }

    // MODAL WINDOW CONTROL
    function abrirModalCategoria() {
        document.getElementById('modalTitulo').innerText = "Nova Categoria";
        document.getElementById('catId').value = "";
        document.getElementById('catNome').value = "";
        document.getElementById('catUrlImagem').value = "";
        document.getElementById('catPreviewModal').classList.add('hidden');
        document.getElementById('catPreviewPlaceholder').classList.remove('hidden');
        document.getElementById('modalCategoria').classList.remove('hidden');
    }

    function fecharModalCategoria() {
        document.getElementById('modalCategoria').classList.add('hidden');
    }

    // PERSISTÊNCIA: SALVAR / EDITAR
    function salvarCategoriaFirebase() {
        const id = document.getElementById('catId').value;
        const nome = document.getElementById('catNome').value.trim();
        const urlImagem = document.getElementById('catUrlImagem').value.trim();

        if (!nome) {
            alert("⚠️ Insira o nome da categoria!");
            return;
        }

        const btn = document.getElementById('btnSalvarCategoria');
        btn.disabled = true;
        btn.innerText = "⏳ Gravando...";

        const dados = {
            nome: nome,
            urlImagem: urlImagem
        };

        if (id) {
            // Edição: Mantém o status atual se já existir
            db.ref(`categorias/${id}`).update(dados)
                .then(() => fecharEALertar("Categoria atualizada com sucesso!"))
                .catch(erro => tratarErro(erro));
        } else {
            // Nova categoria: Define padrão como ativo
            dados.status = "ativo";
            db.ref('categorias').push(dados)
                .then(() => fecharEALertar("Nova categoria adicionada com sucesso!"))
                .catch(erro => tratarErro(erro));
        }

        function fecharEALertar(msg) {
            alert(`✅ ${msg}`);
            fecharModalCategoria();
            btn.disabled = false;
            btn.innerText = "Salvar Registro";
        }

        function tratarErro(e) {
            alert("❌ Erro ao processar operação.");
            console.error(e);
            btn.disabled = false;
            btn.innerText = "Salvar Registro";
        }
    }

    // PREPARAR FORMULÁRIO PARA EDIÇÃO
    function editarCategoria(id, nome, urlImagem) {
        document.getElementById('modalTitulo').innerText = "Editar Categoria";
        document.getElementById('catId').value = id;
        document.getElementById('catNome').value = nome;
        document.getElementById('catUrlImagem').value = urlImagem;

        const img = document.getElementById('catPreviewModal');
        const placeholder = document.getElementById('catPreviewPlaceholder');
        
        if (urlImagem) {
            img.src = urlImagem;
            img.classList.remove('hidden');
            placeholder.classList.add('hidden');
        } else {
            img.classList.add('hidden');
            placeholder.classList.remove('hidden');
        }

        document.getElementById('modalCategoria').classList.remove('hidden');
    }

    // PAUSAR / ATIVAR CATEGORIA
    function alternarStatusCategoria(id, statusAtual) {
        const novoStatus = statusAtual === 'ativo' ? 'pausado' : 'ativo';
        db.ref(`categorias/${id}`).update({ status: novoStatus })
            .catch(erro => console.error("Erro ao alternar status:", erro));
    }

    // EXCLUIR CATEGORIA
    function deletarCategoria(id) {
        if (confirm("⚠️ Tem certeza absoluta que deseja remover esta categoria?\nIsso pode afetar a exibição de produtos vinculados a ela.")) {
            db.ref(`categorias/${id}`).remove()
                .then(() => alert("✅ Categoria removida com sucesso."))
                .catch(erro => console.error("Erro ao remover:", erro));
        }
    }
</script>
