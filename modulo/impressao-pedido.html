<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- Trava visual inicial: esconde a página até validar a autenticação -->
    <style id="auth-guard-hide">html{visibility:hidden !important;}</style>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impressão de Romaneio • Abella Joias</title>
    
    <!-- Tailwind CSS & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs (Compat v9) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background: white; color: black; }
        .font-cinzel { font-family: 'Cinzel', serif; }
        @media print {
            body { background: white; color: black; padding: 0; margin: 0; }
            .no-print { display: none !important; }
            .break-inside-avoid { break-inside: avoid; }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 p-4 print:p-0 print:bg-white">

    <!-- Container de Ações (Oculto na Impressão) -->
    <div class="no-print max-w-4xl mx-auto mb-4 flex justify-between items-center bg-white p-4 rounded-lg shadow">
        <button onclick="window.history.back()" class="px-4 py-2 bg-gray-200 text-gray-700 rounded hover:bg-gray-300 transition text-sm font-semibold">
            ← Voltar
        </button>
        <button onclick="window.print()" class="px-6 py-2 bg-black text-white rounded hover:bg-gray-800 transition text-sm font-semibold flex items-center gap-2">
            <span>🖨️ Imprimir / Salvar PDF</span>
        </button>
    </div>

    <!-- Mensagem de Erro / Status -->
    <div id="status-mensagem" class="hidden max-w-4xl mx-auto p-4 mb-4 bg-red-100 text-red-700 rounded-lg text-center font-medium no-print"></div>

    <!-- Conteúdo Principal do Romaneio -->
    <main id="romaneio-container" class="max-w-4xl mx-auto bg-white p-8 rounded-lg shadow print:shadow-none print:p-0">
        <div class="text-center py-12 text-gray-500 font-medium">
            Carregando dados do pedido...
        </div>
    </main>

    <!-- Configuração do Firebase & Script de Carregamento -->
    <script>
        // === CONFIGURAÇÃO DO FIREBASE ===
        // Substitua com as suas credenciais caso não estejam em um arquivo separado
        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "SEU_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://SEU_PROJECT_ID.firebaseio.com",
            projectId: "SEU_PROJECT_ID",
            storageBucket: "SEU_PROJECT_ID.appspot.com",
            messagingSenderId: "SEU_SENDER_ID",
            appId: "SEU_APP_ID"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const urlParams = new URLSearchParams(window.location.search);
        const pedidoId = urlParams.get('id');

        // FUNÇÃO DE EXIBIÇÃO DE ERRO
        function exibirErro(mensagem) {
            const statusEl = document.getElementById('status-mensagem');
            const containerEl = document.getElementById('romaneio-container');
            
            statusEl.textContent = mensagem;
            statusEl.classList.remove('hidden');
            
            containerEl.innerHTML = `<div class="text-center py-8 text-red-500 font-semibold">${mensagem}</div>`;
            
            // Remove a trava de visibilidade se houver erro para o usuário enxergar o aviso
            removerAuthGuard();
        }

        // FUNÇÃO PARA LIBERAR A TELA
        function removerAuthGuard() {
            const styleGuard = document.getElementById('auth-guard-hide');
            if (styleGuard) {
                styleGuard.remove();
            }
        }

        // === AUTENTICAÇÃO E CARREGAMENTO DA PÁGINA ===
        firebase.auth().onAuthStateChanged((user) => {
            if (user) {
                // Usuário autenticado com sucesso
                removerAuthGuard();

                if (!pedidoId) {
                    exibirErro("❌ Erro Crítico: ID do pedido ausente na URL.");
                    return;
                }

                carregarDadosRomaneio(pedidoId);
            } else {
                // Usuário não autenticado: Redireciona para o Login sem travar a tela em branco
                window.location.href = "login.html";
            }
        });

        // CARREGAR DADOS DO FIREBASE
        function carregarDadosRomaneio(id) {
            const dbRef = firebase.database().ref('pedidos/' + id);

            dbRef.once('value')
                .then((snapshot) => {
                    if (!snapshot.exists()) {
                        exibirErro("❌ Pedido não encontrado no banco de dados.");
                        return;
                    }

                    const pedido = snapshot.val();
                    renderizarRomaneio(pedido);
                })
                .catch((error) => {
                    console.error("Erro ao buscar pedido:", error);
                    exibirErro("❌ Erro ao carregar informações do pedido.");
                });
        }

        // RENDERIZAÇÃO DO LAYOUT DE IMPRESSÃO
        function renderizarRomaneio(pedido) {
            const container = document.getElementById('romaneio-container');
            
            // Formatação de valores
            const dataPedido = pedido.data ? new Date(pedido.data).toLocaleDateString('pt-BR') : 'N/A';
            const clienteNome = pedido.cliente?.nome || 'Cliente Não Identificado';
            const clienteTelefone = pedido.cliente?.telefone || 'N/A';
            const itens = pedido.itens || [];

            let htmlItens = '';
            let valorTotal = 0;

            itens.forEach((item, index) => {
                const subtotal = (item.preco || 0) * (item.quantidade || 1);
                valorTotal += subtotal;

                htmlItens += `
                    <tr class="border-b border-gray-200 text-sm">
                        <td class="py-2 px-3 text-left font-medium text-gray-700">${index + 1}</td>
                        <td class="py-2 px-3 text-left">${item.nome || 'Item sem nome'}</td>
                        <td class="py-2 px-3 text-center">${item.quantidade || 1}</td>
                        <td class="py-2 px-3 text-right">R$ ${Number(item.preco || 0).toFixed(2)}</td>
                        <td class="py-2 px-3 text-right font-medium">R$ ${subtotal.toFixed(2)}</td>
                    </tr>
                `;
            });

            container.innerHTML = `
                <!-- Cabeçalho do Romaneio -->
                <div class="flex justify-between items-center border-b pb-4 mb-6">
                    <div>
                        <h1 class="font-cinzel text-2xl font-bold tracking-wide text-black uppercase">Abella Joias</h1>
                        <p class="text-xs text-gray-500">Atacado de Joias no Bruto</p>
                    </div>
                    <div class="text-right">
                        <span class="block text-lg font-bold">ROMANEIO #${pedidoId}</span>
                        <span class="text-xs text-gray-500">Data: ${dataPedido}</span>
                    </div>
                </div>

                <!-- Dados do Cliente -->
                <div class="bg-gray-50 p-4 rounded-md mb-6 border border-gray-100 break-inside-avoid">
                    <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Dados do Cliente</h2>
                    <div class="grid grid-cols-2 gap-2 text-sm">
                        <div><strong class="text-gray-600">Cliente:</strong> ${clienteNome}</div>
                        <div><strong class="text-gray-600">Telefone:</strong> ${clienteTelefone}</div>
                    </div>
                </div>

                <!-- Tabela de Itens -->
                <table class="w-full mb-6 text-left border-collapse">
                    <thead>
                        <tr class="border-b-2 border-black text-xs font-bold uppercase text-gray-600">
                            <th class="py-2 px-3 w-12">#</th>
                            <th class="py-2 px-3">Descrição da Peça</th>
                            <th class="py-2 px-3 text-center w-20">Qtd</th>
                            <th class="py-2 px-3 text-right w-28">Unitário</th>
                            <th class="py-2 px-3 text-right w-28">Subtotal</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${htmlItens}
                    </tbody>
                </table>

                <!-- Rodapé e Total -->
                <div class="flex justify-between items-end border-t pt-4 mt-8 break-inside-avoid">
                    <div class="text-xs text-gray-400">
                        <p>Obrigado pela preferência!</p>
                        <p>Documento gerado para conferência de mercadoria.</p>
                    </div>
                    <div class="text-right">
                        <span class="text-sm font-semibold text-gray-600 uppercase block">Valor Total</span>
                        <span class="text-2xl font-bold text-black">R$ ${valorTotal.toFixed(2)}</span>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
