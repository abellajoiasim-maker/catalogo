<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Super Editor V7 • Gestão Avançada</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
  
  <script src="../js/firebase/firebase-config.js"></script>
</head>
<body class="bg-black text-zinc-100 min-h-screen">
  
  <div class="max-w-7xl mx-auto px-4 py-8">
    <header class="flex flex-col md:flex-row md:items-center justify-between pb-6 border-b border-zinc-900 mb-8 gap-4">
      <div>
        <h1 class="text-2xl font-black text-white">PAINEL ADMINISTRATIVO</h1>
        <p class="text-xs text-zinc-500 uppercase tracking-widest">Gestão de Inventário V7</p>
      </div>
      <div class="flex gap-3">
        <button id="btnCriarNovo" data-contexto="produtos" class="px-4 py-2.5 bg-[#caa85c] text-black rounded-xl text-xs font-bold hover:opacity-90 transition-opacity">
          ➕ Criar Item
        </button>
        <button id="btnRefresh" class="px-4 py-2.5 bg-zinc-900 border border-zinc-800 text-zinc-300 rounded-xl text-xs font-bold hover:bg-zinc-800 transition-colors">
          🔄 Sincronizar
        </button>
      </div>
    </header>

    <nav class="flex gap-2 p-1.5 bg-zinc-950 border border-zinc-900 rounded-2xl mb-6 max-w-lg">
      <button data-tab="produtos" class="tab-btn active flex-1 py-2.5 text-xs font-bold rounded-xl bg-[#caa85c] text-black transition-all">📦 Produtos</button>
      <button data-tab="categorias" class="tab-btn flex-1 py-2.5 text-xs font-bold rounded-xl text-zinc-400 hover:text-zinc-200 transition-all">📁 Categorias</button>
      <button data-tab="subcategorias" class="tab-btn flex-1 py-2.5 text-xs font-bold rounded-xl text-zinc-400 hover:text-zinc-200 transition-all">🌿 Subcategorias</button>
    </nav>

    <main id="main-content">
      <section id="tab-produtos" class="tab-content">
        <div id="lista-produtos-container" class="space-y-2">
          <p class="text-center py-10 text-zinc-600 text-sm">Carregando catálogo...</p>
        </div>
      </section>
      <section id="tab-categorias" class="tab-content hidden">
        <div id="lista-categorias-container" class="space-y-2"></div>
      </section>
      <section id="tab-subcategorias" class="tab-content hidden">
        <div id="lista-subcategorias-container" class="space-y-2"></div>
      </section>
    </main>
  </div>

  <script type="module" src="./js/editorApp.js"></script>
</body>
</html>
