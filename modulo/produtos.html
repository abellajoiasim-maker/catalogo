<div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-6 text-left space-y-4">
    <div class="flex justify-between items-center border-b border-zinc-800 pb-3">
        <h3 class="text-sm font-bold text-white uppercase tracking-wider font-mono">Formulário de Cadastro & Edição de Produto</h3>
    </div>
    
    <form id="formProdutoOperacional" onsubmit="event.preventDefault();" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="space-y-1">
                <label class="text-[10px] text-zinc-400 uppercase font-bold">Título do Produto:</label>
                <input type="text" id="prodNome" class="w-full bg-black border border-zinc-800 rounded-xl px-3 py-2 text-white outline-none focus:border-[#caa85c]">
            </div>
            <div class="space-y-1">
                <label class="text-[10px] text-zinc-400 uppercase font-bold">Código Identificador SKU:</label>
                <input type="text" id="prodSku" class="w-full bg-black border border-zinc-800 rounded-xl px-3 py-2 text-white outline-none focus:border-[#caa85c]">
            </div>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="space-y-1">
                <label class="text-[10px] text-zinc-400 uppercase font-bold">Peso Bruto Referência (g):</label>
                <input type="number" step="0.01" id="prodPeso" placeholder="0.00" class="w-full bg-black border border-zinc-800 rounded-xl px-3 py-2 text-white outline-none focus:border-[#caa85c]">
            </div>
            <div class="space-y-1">
                <label class="text-[10px] text-zinc-400 uppercase font-bold">Preço Base Bruto (R$):</label>
                <input type="number" step="0.01" id="prodPreco" placeholder="0.00" class="w-full bg-black border border-zinc-800 rounded-xl px-3 py-2 text-white outline-none focus:border-[#caa85c]">
            </div>
        </div>

        <div class="space-y-1">
            <label class="text-[10px] text-zinc-400 uppercase font-bold">Caminho / URL Pública da Imagem:</label>
            <input type="text" id="prodUrlImagem" placeholder="https://firebasestorage.googleapis.com/..." class="w-full bg-black border border-zinc-800 rounded-xl px-3 py-2 text-xs text-white outline-none focus:border-[#caa85c]">
        </div>
        
        <div class="pt-2 grid grid-cols-2 gap-3">
            <button type="button" onclick="if(window.fecharModalProduto){window.fecharModalProduto();}else{document.getElementById('formProdutoOperacional').reset();}" class="border border-zinc-800 hover:bg-zinc-900 text-zinc-400 py-3 rounded-xl font-bold uppercase text-[10px] tracking-wider transition-all">Cancelar Ação</button>
            <button type="button" onclick="window.salvarDadosProdutoDoForm()" class="bg-[#caa85c] hover:bg-[#bda152] text-black py-3 rounded-xl font-black uppercase text-[10px] tracking-wider transition-all text-center">Salvar Alterações</button>
        </div>
    </form>
</div>

<script>
    // Registro interno da regra operacional de persistência no Firebase Realtime Database
    window.salvarProdutoFirebase = function() {
        var sku = document.getElementById('prodSku').value.trim();
        var nome = document.getElementById('prodNome').value.trim();
        var peso = parseFloat(document.getElementById('prodPeso').value) || 0;
        var preco = parseFloat(document.getElementById('prodPreco').value) || 0;
        var imgUrl = document.getElementById('prodUrlImagem').value.trim();
        
        if(!sku || !nome) {
            alert("Os campos SKU e Nome do Produto são estritamente obrigatórios.");
            return;
        }
        
        window.db.ref('abella/products/' + sku).set({
            sku: sku,
            nome: nome,
            peso: peso,
            precoFinal: preco,
            price: preco,
            image: imgUrl,
            atualizadoEm: new Date().toISOString()
        }).then(function() {
            alert("Produto sincronizado e salvo com sucesso no banco de dados!");
            if(typeof window.fecharModalProduto === 'function') window.fecharModalProduto();
        }).catch(function(err) {
            console.error("Erro ao gravar produto:", err);
            alert("Erro interno ao persistir dados do produto.");
        });
    };

    window.carregarBlocoProdutos = function(forcar) {
        console.log("Módulo de produtos recarregado via Realtime.");
    };
</script>
