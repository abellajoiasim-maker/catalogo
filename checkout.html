<script src="js/firebase/firebase-config.js"></script>

<script src="js/utils/money.js"></script>

<script src="js/utils/storage.js"></script>

<script src="js/services/carrinhoService.js"></script>

<script>

    let configSistema = {
        pix: 5,
        parcelas: 6
    };

    document.addEventListener(
        'DOMContentLoaded',
        async () => {

            await carregarConfiguracoes();

            carregarPersistenciaLocal();

            atualizarResumoCheckout();

        }
    );

    async function carregarConfiguracoes() {

        try {

            const snap =
                await firebase
                    .database()
                    .ref('abella/settings')
                    .once('value');

            if (snap.exists()) {

                const dados =
                    snap.val() || {};

                configSistema.pix =
                    parseFloat(
                        dados.pix ||
                        dados?.empresa?.pix ||
                        5
                    );

                configSistema.parcelas =
                    parseInt(
                        dados.parcelas ||
                        dados?.empresa?.parcelas ||
                        6
                    );

            }

        } catch (e) {

            console.error(
                'Erro ao carregar configurações:',
                e
            );

        }

    }

    function carregarPersistenciaLocal() {

        document
            .querySelectorAll('.local-persist')
            .forEach(el => {

                const salvo =
                    localStorage.getItem(
                        `chk_${el.id}`
                    );

                if (salvo)
                    el.value = salvo;

                el.addEventListener(
                    'input',
                    () => {

                        localStorage.setItem(
                            `chk_${el.id}`,
                            el.value
                        );

                    }
                );

            });

    }

    function obterResumoSeguro() {

        if (
            typeof carrinhoService !== 'undefined'
            &&
            carrinhoService.obterResumo
        ) {

            return carrinhoService.obterResumo();

        }

        if (
            typeof CarrinhoService !== 'undefined'
            &&
            CarrinhoService.calcularTotais
        ) {

            return CarrinhoService.calcularTotais();

        }

        return {
            totalItens:0,
            subtotal:0,
            pesoTotal:0,
            totalPecas:0
        };

    }

    function obterItensSeguro() {

        if (
            typeof carrinhoService !== 'undefined'
            &&
            carrinhoService.obterItens
        ) {

            return carrinhoService.obterItens();

        }

        if (
            typeof CarrinhoService !== 'undefined'
            &&
            CarrinhoService.getItens
        ) {

            return CarrinhoService.getItens();

        }

        return [];

    }

    function atualizarResumoCheckout() {

        const resumo =
            obterResumoSeguro();

        const pagamento =
            document.getElementById(
                'cliPagamento'
            ).value;

        const descontoPix =
            pagamento === 'PIX'
                ? resumo.subtotal * (
                    configSistema.pix / 100
                )
                : 0;

        const totalFinal =
            resumo.subtotal - descontoPix;

        const valorParcela =
            resumo.subtotal /
            configSistema.parcelas;

        document.getElementById(
            'finQtd'
        ).innerText =
            `${resumo.totalItens} pçs`;

        document.getElementById(
            'finPeso'
        ).innerText =
            `${resumo.pesoTotal.toFixed(2)}g`;

        document.getElementById(
            'finPix'
        ).innerText =
            `- ${money.formatar(descontoPix)}`;

        document.getElementById(
            'finParcelamento'
        ).innerText =
            `${configSistema.parcelas}x de ${money.formatar(valorParcela)}`;

        document.getElementById(
            'finTotal'
        ).innerText =
            money.formatar(totalFinal);

    }

    async function processarEEnviarPedido() {

        const nome =
            document.getElementById('cliNome')
            .value.trim();

        const whats =
            document.getElementById('cliWhats')
            .value.trim();

        const localEntrega =
            document.getElementById('entLocal')
            .value.trim();

        const cidade =
            document.getElementById('entCidade')
            .value.trim();

        const pagamento =
            document.getElementById('cliPagamento')
            .value;

        if (
            !nome ||
            !whats ||
            !localEntrega
        ) {

            alert(
                "Preencha Nome, WhatsApp e Local de Entrega."
            );

            return;

        }

        const itens =
            obterItensSeguro();

        if (!itens.length) {

            alert(
                "Seu carrinho está vazio."
            );

            return;

        }

        const resumo =
            obterResumoSeguro();

        const desconto =
            pagamento === 'PIX'
                ? resumo.subtotal * (
                    configSistema.pix / 100
                )
                : 0;

        const totalFinal =
            resumo.subtotal - desconto;

        try {

            const totalPedidosSnapshot =
                await firebase
                    .database()
                    .ref('abella/orders')
                    .once('value');

            const quantidadePedidos =
                totalPedidosSnapshot.numChildren();

            const numeroPedido =
                `AB-${String(
                    quantidadePedidos + 1
                ).padStart(6, '0')}`;

            const novoPedidoRef =
                firebase
                    .database()
                    .ref('abella/orders')
                    .push();

            const pedido = {

                numeroPedido,

                cliente:nome,

                whats,

                cidade,

                formaPagamento:
                    pagamento,

                subtotal:
                    resumo.subtotal,

                desconto,

                total:
                    totalFinal,

                pesoTotal:
                    Number(
                        resumo.pesoTotal.toFixed(2)
                    ),

                totalPecas:
                    resumo.totalItens,

                status:"Novo",

                entrega: {

                    nome:
                        localEntrega

                },

                criadoEm:
                    Date.now(),

                itens

            };

            await novoPedidoRef.set(
                pedido
            );

            let msg =
                `*NOVO PEDIDO - ABELLA JOIAS*\n\n`;

            msg +=
                `*Pedido:* ${numeroPedido}\n`;

            msg +=
                `*Cliente:* ${nome}\n`;

            msg +=
                `*WhatsApp:* ${whats}\n`;

            msg +=
                `*Cidade:* ${cidade}\n`;

            msg +=
                `*Entrega:* ${localEntrega}\n`;

            msg +=
                `*Pagamento:* ${pagamento}\n`;

            msg +=
                `*Peças:* ${resumo.totalItens}\n`;

            msg +=
                `*Peso:* ${resumo.pesoTotal.toFixed(2)}g\n`;

            msg +=
                `*Subtotal:* ${money.formatar(resumo.subtotal)}\n`;

            if (desconto > 0) {

                msg +=
                    `*Desconto PIX:* ${money.formatar(desconto)}\n`;

            }

            msg +=
                `*Total:* ${money.formatar(totalFinal)}\n\n`;

            msg +=
                `_Pedido aguardando conferência financeira._`;

            if (
                typeof carrinhoService !== 'undefined'
                &&
                carrinhoService.limpar
            ) {

                carrinhoService.limpar();

            }

            if (
                typeof CarrinhoService !== 'undefined'
                &&
                CarrinhoService.limpar
            ) {

                CarrinhoService.limpar();

            }

            const url =
                `https://api.whatsapp.com/send?phone=5519988207658&text=${encodeURIComponent(msg)}`;

            window.open(
                url,
                '_blank'
            );

            window.location.href =
                'index.html';

        } catch (erro) {

            console.error(
                "Erro ao criar pedido:",
                erro
            );

            alert(
                "Não foi possível concluir o pedido."
            );

        }

    }

</script>

</body>

async function processarEEnviarPedido() {

    const nome =
        document.getElementById('cliNome')
        .value.trim();

    const whats =
        document.getElementById('cliWhats')
        .value.trim();

    const localEntrega =
        document.getElementById('entLocal')
        .value.trim();

    const cidade =
        document.getElementById('entCidade')
        .value.trim();

    const pagamento =
        document.getElementById('cliPagamento')
        .value;

    if (!nome || !whats || !localEntrega) {

        alert(
            "Preencha Nome, WhatsApp e Local de Entrega."
        );

        return;
    }

    const itens =
        CarrinhoService.getItens();

    if (!itens.length) {

        alert(
            "Seu carrinho está vazio."
        );

        return;
    }

    const resumo =
        CarrinhoService.calcularTotais();

    const desconto =
        pagamento === "PIX"
            ? resumo.descontoPix
            : 0;

    const totalFinal =
        pagamento === "PIX"
            ? resumo.totalPix
            : resumo.subtotal;

    try {

        const totalPedidosSnapshot =
            await firebase
                .database()
                .ref('abella/orders')
                .once('value');

        const quantidadePedidos =
            totalPedidosSnapshot.numChildren();

        const numeroPedido =
            `AB-${String(
                quantidadePedidos + 1
            ).padStart(6, '0')}`;

        const novoPedidoRef =
            firebase
                .database()
                .ref('abella/orders')
                .push();

        const pedido = {

            numeroPedido,

            cliente: nome,

            whats,

            cidade,

            formaPagamento:
                pagamento,

            observacoes: "",

            subtotal:
                resumo.subtotal,

            desconto,

            frete: 0,

            total:
                totalFinal,

            pesoTotal:
                Number(
                    resumo.pesoTotal
                    .toFixed(2)
                ),

            totalPecas:
                resumo.totalPecas,

            status: "Novo",

            entrega: {

                nome:
                    localEntrega,

                endereco: "",

                numero: "",

                bairro: ""
            },

            itens
        };

        await novoPedidoRef.set(
            pedido
        );

        let msg =
            `*NOVO PEDIDO - ABELLA JOIAS*\n\n`;

        msg +=
            `*Pedido:* ${numeroPedido}\n`;

        msg +=
            `*Cliente:* ${nome}\n`;

        msg +=
            `*WhatsApp:* ${whats}\n`;

        msg +=
            `*Cidade:* ${cidade}\n`;

        msg +=
            `*Local Entrega:* ${localEntrega}\n`;

        msg +=
            `*Pagamento:* ${pagamento}\n`;

        msg +=
            `*Peças:* ${resumo.totalPecas}\n`;

        msg +=
            `*Peso:* ${resumo.pesoTotal.toFixed(2)}g\n`;

        msg +=
            `*Subtotal:* ${money.formatar(resumo.subtotal)}\n`;

        if (desconto > 0) {

            msg +=
                `*Desconto PIX:* ${money.formatar(desconto)}\n`;
        }

        msg +=
            `*Total:* ${money.formatar(totalFinal)}\n\n`;

        msg +=
            `_Pedido aguardando conferência financeira._`;

        CarrinhoService.limpar();

        const url =
            `https://api.whatsapp.com/send?phone=5519988207658&text=${encodeURIComponent(msg)}`;

        window.open(
            url,
            '_blank'
        );

        window.location.href =
            'index.html';

    } catch (erro) {

        console.error(
            "Erro ao criar pedido:",
            erro
        );

        alert(
            "Não foi possível concluir o pedido."
        );
    }
}
