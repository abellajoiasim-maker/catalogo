<!-- 
    ARQUIVO: modulo/categorias.html
    ATUALIZADO: v3.5 - Adicionado suporte a imagens 1:1 nas categorias.
    Implementados botões de ação rápidos nos cards (Editar, Pausar e Excluir).
    O modal foi expandido para capturar a URL da imagem e o estado de pausa.
-->
<div class="p-6 max-w-6xl mx-auto space-y-6 animate-fade-in">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between border-b border-zinc-900 pb-4 gap-4">
        <div>
            <h1 class="text-xl font-bold text-white flex items-center gap-2 serif tracking-wider">
                <span>📁</span> GESTÃO DE COLEÇÕES E CATEGORIAS
            </h1>
            <p class="text-xs text-zinc-500 mt-1">Gerencie os nós divisores do catálogo público, imagens de capa e links de filtragem.</p>
        </div>
        <button onclick="window.abrirModalCategoria()" class="bg-[#caa85c] hover:bg-[#bda152] text-black font-bold px-5 py-2.5 rounded-xl transition-all flex items-center gap-2 text-xs uppercase tracking-wider self-start sm:self-auto">
            <span>➕</span> Nova Categoria
        </button>
    </div>

    <!-- GRID DE CATEGORIAS -->
    <div id="grid-categorias" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        <div class="col-span-full text-center py-12 text-zinc-600 font-mono text-xs animate-pulse">
            ⏳ Carregando coleções mapeadas no banco...
        </div>
    </div>
</div>

<!-- MODAL DE CADASTRO E EDIÇÃO DE CATEGORIAS -->
<div id="modalCategoria" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-zinc-950 border border-zinc-900 rounded-2xl max-w-md w-full p-6 space-y-4 relative text-left">
        <div class="flex items-center justify-between border-b border-zinc-900 pb-3">
            <h3 id="modalCategoriaTitulo" class="text-xs font-black uppercase text-[#caa85c] tracking-widest font-mono">Nova Categoria</h3>
            <button onclick="window.fecharModalCategoria()" class="text-zinc-500 hover:text-white transition-all text-xs font-bold">✕</button>
        </div>
        
        <div class="space-y-4 text-xs font-mono">
            <!-- Campo hidden para o ID ao editar uma categoria existente -->
            <input type="hidden" id="catId">
            
            <!-- Campo de Nome -->
            <div class="space-y-1">
                <label class="text-[10px] text-zinc-400 uppercase font-bold">Nome da Coleção *</label>
                <input type="text" id="catNome" placeholder="Ex: Brincos de Argola" class="w-full bg-black border border-zinc-800 rounded-xl px-3 py-2 text-white outline-none focus:border-[#caa85c]">
            </div>

            <!-- NOVO: Campo de URL da Imagem -->
            <div class="space-y-1">
                <label class="text-[10px] text-zinc-400 uppercase font-bold">URL da Imagem da Capa (1:1)</label>
                <input type="text" id="catImagem" placeholder="Cole o link https://... ou gs:// da foto" class="w-full bg-black border border-zinc-800 rounded-xl px-3 py-2 text-white outline-none focus:border-[#caa85c]">
            </div>

            <!-- NOVO: Opção de Pausar Categoria -->
            <div class="flex items-center justify-between bg-zinc-900/40 p-3 rounded-xl border border-zinc-900">
                <div class="space-y-0.5">
                    <label class="text-[10px] text-zinc-300 uppercase font-bold cursor-pointer" for="catPausado">Ocultar Categoria</label>
                    <p class="text-[9px] text-zinc-500">Pausa todas as joias desta categoria na vitrine.</p>
                </div>
                <input type="checkbox" id="catPausado" class="w-4 h-4 accent-[#caa85c] cursor-pointer">
            </div>

            <div class="pt-2 grid grid-cols-2 gap-3">
                <button onclick="window.fecharModalCategoria()" class="border border-zinc-800 hover:bg-zinc-900 text-zinc-400 py-3 rounded-xl font-bold uppercase text-[10px] tracking-wider transition-all">Cancelar</button>
                <button onclick="window.salvarNovaCategoriaItem()" id="btnSalvarCategoria" class="bg-[#caa85c] text-black hover:bg-[#bda152] py-3 rounded-xl font-bold uppercase text-[10px] tracking-wider transition-all">Criar Categoria</button>
            </div>
        </div>
    </div>
</div>
