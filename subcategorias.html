<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta charset="UTF-8">

    <title>Subcategorias • Abella Joias</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        :root{

            --gold:#caa85c;
            --bg:#050505;
            --card:#101010;
            --line:#1f1f1f;

        }

        body{

            background:
                radial-gradient(circle at top,#171717 0%,#050505 45%);

            color:white;

            font-family:'Inter',sans-serif;

            min-height:100vh;

            overflow-x:hidden;

        }

        .serif{
            font-family:'Cinzel',serif;
        }

        .gold{
            color:var(--gold);
        }

        .glass{

            background:rgba(18,18,18,.92);

            backdrop-filter:blur(18px);

            border:1px solid rgba(255,255,255,.06);

        }

        .hover-lift{
            transition:.35s ease;
        }

        .hover-lift:hover{

            transform:translateY(-6px);

            border-color:rgba(202,168,92,.4);

        }

        .hero-glow{

            position:absolute;

            width:600px;
            height:600px;

            background:radial-gradient(circle,var(--gold) 0%,transparent 70%);

            opacity:.06;

            filter:blur(80px);

            pointer-events:none;

        }

        .scrollbar::-webkit-scrollbar{
            width:6px;
        }

        .scrollbar::-webkit-scrollbar-thumb{
            background:#333;
            border-radius:20px;
        }

        .fade-in{
            animation:fade .4s ease forwards;
        }

        @keyframes fade{

            from{
                opacity:0;
                transform:translateY(12px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }

        }

    </style>

</head>

<body>

    <!-- GLOW -->

    <div class="hero-glow top-[-200px] left-[-200px]"></div>

    <div class="hero-glow bottom-[-200px] right-[-200px]"></div>

    <!-- HEADER -->

    <header class="sticky top-0 z-50 border-b border-white/5 bg-black/70 backdrop-blur-2xl">

        <div class="max-w-7xl mx-auto px-4 md:px-8 h-20 flex items-center justify-between gap-4">

            <!-- BRAND -->

            <a href="index.html" class="flex items-center gap-4">

                <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-[#caa85c] to-[#8b6a2b] flex items-center justify-center text-black font-black text-xl">
                    A
                </div>

                <div>

                    <h1 class="serif gold text-lg md:text-2xl uppercase tracking-[0.2em]">
                        Abella Joias
                    </h1>

                    <p class="text-[10px] uppercase tracking-[0.3em] text-zinc-500 mt-1">
                        Catálogo Premium
                    </p>

                </div>

            </a>

            <!-- ACTIONS -->

            <div class="flex items-center gap-3">

                <a
                    href="index.html"
                    class="hidden md:flex h-12 px-6 rounded-2xl glass items-center justify-center text-xs font-black uppercase tracking-[0.2em] hover:border-[#caa85c] transition-all">

                    ← Categorias

                </a>

                <a
                    href="carrinho.html"
                    class="relative h-12 px-6 rounded-2xl bg-[#caa85c] text-black flex items-center justify-center text-xs font-black uppercase tracking-[0.2em]">

                    🛒 Carrinho

                    <span
                        id="cartCount"
                        class="ml-3 bg-black text-white rounded-full min-w-[24px] h-6 px-2 flex items-center justify-center text-[10px]">
                        0
                    </span>

                </a>

            </div>

        </div>

    </header>

    <!-- HERO -->

    <section class="relative overflow-hidden">

        <div class="max-w-7xl mx-auto px-4 md:px-8 py-16 md:py-24">

            <div class="max-w-4xl">

                <p class="gold uppercase tracking-[0.35em] text-xs font-black">
                    Categoria Premium
                </p>

                <h2
                    id="categoriaNome"
                    class="serif text-5xl md:text-7xl font-black leading-none mt-5">
                    Carregando...
                </h2>

                <p
                    id="categoriaDescricao"
                    class="text-zinc-400 text-lg leading-relaxed mt-8 max-w-2xl">
                    Explore as linhas exclusivas da coleção premium Abella Joias.
                </p>

            </div>

        </div>

    </section>

    <!-- LOADING -->

    <div
        id="loading"
        class="max-w-7xl mx-auto px-4 md:px-8 pb-12">

        <div class="glass rounded-[2rem] p-16 text-center">

            <div class="w-16 h-16 border-4 border-zinc-800 border-t-[#caa85c] rounded-full animate-spin mx-auto"></div>

            <p class="text-zinc-500 uppercase tracking-[0.3em] text-xs font-black mt-8">
                Carregando Subcategorias
            </p>

        </div>

    </div>

    <!-- GRID -->

    <main
        id="gridSubcategorias"
        class="max-w-7xl mx-auto px-4 md:px-8 pb-20 hidden">

    </main>

<script src="js/firebase/firebase-config.js"></script>

<script>

    const db =
        firebase.database();

    let categoriaSlug =
        '';

    document.addEventListener(
        'DOMContentLoaded',
        async () => {

            atualizarCarrinho();

            const params =
                new URLSearchParams(
                    window.location.search
                );

            categoriaSlug =
                params.get('id');

            if(!categoriaSlug){

                window.location.href =
                    'index.html';

                return;

            }

            await carregarCategoria();

        }
    );

    function atualizarCarrinho(){

        try{

            const cart =
                JSON.parse(
                    localStorage.getItem(
                        'abellaCart'
                    ) || '[]'
                );

            const total =
                cart.reduce(
                    (acc,item)=>
                        acc + (item.quantidade || 0),
                    0
                );

            document.getElementById(
                'cartCount'
            ).innerText = total;

        }catch(e){

            document.getElementById(
                'cartCount'
            ).innerText = 0;

        }

    }

    function resolverImagemFirebase(url){

        if(!url){

            return 'https://via.placeholder.com/1200x1200/111111/caa85c?text=ABELLA';

        }

        if(url.startsWith('gs://')){

            const semGs =
                url.replace(
                    'gs://',
                    ''
                );

            const primeiraBarra =
                semGs.indexOf('/');

            const bucket =
                semGs.substring(
                    0,
                    primeiraBarra
                );

            const caminho =
                semGs.substring(
                    primeiraBarra + 1
                );

            return `https://firebasestorage.googleapis.com/v0/b/${bucket}/o/${encodeURIComponent(caminho)}?alt=media`;

        }

        return url;

    }

    async function carregarCategoria(){

        try{

            const snap =
                await db.ref(
                    `abella/categories/${categoriaSlug}`
                ).once('value');

            if(!snap.exists()){

                window.location.href =
                    'index.html';

                return;

            }

            const categoria =
                snap.val();

            document.getElementById(
                'categoriaNome'
            ).innerText =
                categoria.name || 'Categoria';

            // SUBCATEGORIAS

            const subcategorias =
                categoria.subcategories || {};

            const listaSubcategorias =
                Object.entries(
                    subcategorias
                );

            // SE NÃO TIVER SUBCATEGORIAS → VAI DIRETO PROS PRODUTOS

            if(listaSubcategorias.length === 0){

                window.location.href =
                    `produtos.html?categoria=${categoriaSlug}`;

                return;

            }

            renderizarSubcategorias(
                listaSubcategorias
            );

        }catch(e){

            console.error(e);

            alert(
                'Erro ao carregar categoria.'
            );

        }

    }

    function renderizarSubcategorias(lista){

        const grid =
            document.getElementById(
                'gridSubcategorias'
            );

        const loading =
            document.getElementById(
                'loading'
            );

        loading.classList.add(
            'hidden'
        );

        grid.classList.remove(
            'hidden'
        );

        grid.innerHTML = `

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 w-full fade-in">

                ${lista.map(([slug,sub],index)=>{

                    const image =
                        resolverImagemFirebase(
                            sub.image ||
                            sub.imagem ||
                            ''
                        );

                    return `

                        <div
                            onclick="abrirProdutos('${slug}')"
                            class="glass rounded-[2rem] overflow-hidden cursor-pointer hover-lift group">

                            <!-- IMAGE -->

                            <div class="aspect-square overflow-hidden relative bg-black">

                                <img
                                    src="${image}"
                                    class="w-full h-full object-cover group-hover:scale-105 transition-all duration-700">

                                <div class="absolute inset-0 bg-gradient-to-t from-black via-black/10 to-transparent"></div>

                                <div class="absolute top-5 left-5">

                                    <div class="bg-black/70 border border-white/10 backdrop-blur-xl rounded-full px-4 py-2 text-[10px] uppercase tracking-[0.25em] font-black">

                                        Subcategoria

                                    </div>

                                </div>

                            </div>

                            <!-- CONTENT -->

                            <div class="p-6">

                                <div class="flex items-center justify-between gap-4">

                                    <div>

                                        <h3 class="text-2xl font-black leading-tight">

                                            ${sub.name || slug}

                                        </h3>

                                        <p class="text-zinc-500 text-sm mt-3">

                                            Clique para explorar os produtos premium desta coleção.

                                        </p>

                                    </div>

                                    <div class="w-14 h-14 rounded-2xl bg-[#caa85c] text-black flex items-center justify-center font-black text-xl shrink-0">

                                        →

                                    </div>

                                </div>

                            </div>

                        </div>

                    `;

                }).join('')}

            </div>

        `;

    }

    function abrirProdutos(subcategoria){

        window.location.href =
            `produtos.html?categoria=${categoriaSlug}&subcategoria=${subcategoria}`;

    }

</script>

</body>
</html>
