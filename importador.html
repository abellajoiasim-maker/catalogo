<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Super Importador Abella Joias</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-storage-compat.js"></script>
    <style>
        body { font-family: sans-serif; background: #0a0a0a; padding: 40px; color: #adadad; }
        .box { max-width: 700px; margin: auto; background: #111; padding: 30px; border: 1px solid #zinc-900; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h2 { color: #caa85c; text-align: center; font-family: sans-serif; font-weight: 900; letter-spacing: -0.05em; text-transform: uppercase; }
        button { background: #caa85c; color: #000; padding: 14px; width: 100%; margin-top: 15px; font-weight: bold; border: none; cursor: pointer; border-radius: 8px; text-transform: uppercase; letter-spacing: 0.05em; transition: all 0.2s; }
        button:hover { brightness: 110%; }
        button:disabled { background: #222; color: #555; cursor: not-allowed; }
        #log { margin-top: 20px; background: #000; color: #adadad; padding: 15px; font-size: 11px; height: 350px; overflow: auto; border-radius: 8px; font-family: monospace; border: 1px solid #222; }
        .success { color: #4caf50; font-weight: bold; } .warn { color: #ff9800; } .error { color: #f44336; font-weight: bold; }
        input[type="file"] { background: #1a1a1a; padding: 10px; width: 100%; border-radius: 8px; border: 1px solid #222; box-sizing: border-box; color: #fff; margin-top: 5px;}
    </style>
</head>
<body>

<div class="box">
    <h2>📦 Super Importador Abella Joias</h2>
    <p style="font-size: 12px; text-align: center; font-family: monospace; color: #555;">Destino Realtime: <span style="color: #caa85c;">/abella/products</span></p>
    
    <div style="margin-top: 15px;">
        <label style="font-size: 11px; font-weight: bold; text-transform: uppercase; font-family: monospace;">Selecione o Arquivo CSV:</label>
        <input type="file" id="csv" accept=".csv">
    </div>
    
    <button id="btn" onclick="importarTudo()">Limpar e Importar para o Catálogo</button>
    <div id="log">Pronto para processamento...</div>
</div>

<script>
// ATENÇÃO: Confirme se estas credenciais batem com o seu Firebase ativo
const firebaseConfig = {
    apiKey: "AIzaSyDPBZSxW8XjtQmDMUknzAyIlFda51MvMJY",
    databaseURL: "https://catalogo-abella-joias-default-rtdb.firebaseio.com",
    storageBucket: "catalogo-abella-joias.firebasestorage.app"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const storage = firebase.storage();

function gerarSlug(txt) {
    if(!txt) return "geral";
    return txt.toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");
}

async function buscarFoto(sku) {
    // Alinhado com as extensões que você costuma gerar nos apps de fotos
    const extensoes = ['.png', '.jpg', '.jpeg', '.PNG', '.JPG'];
    for (const ext of extensoes) {
        try {
            // Varre o Storage na pasta /produtos/
            const ref = storage.ref().child('produtos/' + sku + ext);
            return await ref.getDownloadURL();
        } catch (e) { continue; }
    }
    return "";
}

async function importarTudo() {
    const file = document.getElementById('csv').files[0];
    if(!file) return alert("Selecione o arquivo CSV limpo primeiro.");
    
    // Alerta duplo para segurança antes de apagar
    if(!confirm("⚠️ ATENÇÃO: Isso vai APAGAR TODOS os produtos e categorias atuais da Abella do sistema para entrar a nova planilha. Deseja continuar?")) return;

    const log = document.getElementById('log');
    const btn = document.getElementById('btn');
    btn.disabled = true;
    log.innerHTML = "🗑️ Limpando catálogo antigo da ramificação /abella...<br>";

    try {
        // 1. Deleta tudo da Abella antes de começar o processo
        await db.ref('abella/products').remove();
        await db.ref('abella/categories').remove();
        log.innerHTML += "<span class='success'>✅ Banco de dados zerado com sucesso!</span><br>🚀 Processando nova planilha otimizada...<br>";

        const text = await file.text();
        // Divide o arquivo por linhas e remove o caractere invisível BOM se houver
        const linhas = text.trim().replace(/^\uFEFF/, '').split(/\r?\n/);
        
        let totalProd = 0;
        let categorias = new Set();

        // Começa em i = 1 para pular a linha de títulos (cabeçalho)
        for(let i = 1; i < linhas.length; i++) {
            if(!linhas[i].trim()) continue;

            // Divide a linha estritamente por ponto e vírgula (;)
            const col = linhas[i].split(';');
            if(col.length < 5) continue;

            // Captura as 6 colunas na ordem exata da nova planilha
            const nome = col[0] ? col[0].replace(/"/g, '').trim() : "";
            const skuOriginal = col[1] ? col[1].replace(/"/g, '').trim() : "";
            const nomeCategoria = col[2] ? col[2].replace(/"/g, '').trim() : "Geral";
            
            // Trata o preço (garante formato americano com ponto decimal)
            let precoCru = col[3] ? col[3].replace(/"/g, '').replace('R$', '').trim() : "0";
            precoCru = precoCru.replace(',', '.');
            const preco = parseFloat(precoCru) || 0;

            // Trata o peso (garante formato americano com ponto decimal)
            let pesoCru = col[4] ? col[4].replace(/"/g, '').toLowerCase().replace('g', '').trim() : "0";
            pesoCru = pesoCru.replace(',', '.');
            const peso = parseFloat(pesoCru) || 0;

            // Link da imagem
            const urlImagem = col[5] ? col[5].replace(/"/g, '').trim() : "";

            // Se não tiver SKU ou Nome válido, pula a linha para não quebrar o app
            if(!skuOriginal || !nome || skuOriginal.toLowerCase() === "sku") continue;

            // Higieniza o SKU para virar um ID válido no Firebase
            const skuID = skuOriginal.replace(/[\.\$#\[\]\/]/g, "-");
            const catSlug = gerarSlug(nomeCategoria);

            log.innerHTML += `> Gravando SKU: ${skuOriginal}... `;

            try {
                // 2. Cria/Garante a categoria limpa
                await db.ref('abella/categories/' + catSlug).update({
                    name: nomeCategoria,
                    slug: catSlug,
                    paused: false
                });
                categorias.add(nomeCategoria);

                // 3. Grava o produto na nova estrutura limpa
                await db.ref('abella/products/' + skuID).set({
                    name: nome,
                    sku: skuOriginal,
                    category: catSlug,
                    price: parseFloat(preco.toFixed(2)),
                    weight: parseFloat(peso.toFixed(2)),
                    image: urlImagem,
                    paused: false,
                    promo: 0
                });

                log.innerHTML += `<span class="success">OK 💎</span><br>`;
                totalProd++;
            } catch (e) {
                log.innerHTML += `<span class="error">ERRO: ${e.message}</span><br>`;
            }
            log.scrollTop = log.scrollHeight;
        }

        log.innerHTML += `<br>✅ <b>PROCESSO CONCLUÍDO!</b><br>Produtos catalogados: ${totalProd}<br>Categorias criadas: ${categorias.size}`;
        alert("O catálogo antigo foi apagado e a nova planilha foi importada com sucesso!");

    } catch (err) {
        log.innerHTML += `<span class="error">ERRO CRÍTICO NO ARQUIVO: ${err.message}</span><br>`;
    } finally {
        btn.disabled = false;
    }
}
</script>
</body>
</html>
