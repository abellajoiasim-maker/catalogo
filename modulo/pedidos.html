<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impressão de Romaneio • Abella Joias</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: white; color: black; }
        .font-cinzel { font-family: 'Cinzel', serif; }
        @media print {
            body { background: white; color: black; padding: 0; }
            .no-print { display: none; }
        }
    </style>
</head>
<body class="p-4 md:p-8 bg-white text-black">

    <!-- Botão de Comando Flutuante -->
    <div class="no-print mb-6 flex justify-end">
        <button onclick="window.print()" class="bg-[#caa85c] text-black font-black px-6 py-2 rounded-xl text-xs uppercase tracking-wider shadow-lg hover:bg-[#b5944f] transition-all">
            🖨️ Confirmar Impressão / Salvar PDF
        </button>
    </div>

    <!-- Barra de Carregamento -->
    <div id="loader" class="text-center py-12 text-xs font-mono uppercase tracking-widest text-zinc-500 animate-pulse">
        ⏳ Montando estrutura do romaneio
    </div>

    <!-- Área do Romaneio Comercial -->
    <div id="romaneio-conteudo" class="hidden max-w-4xl mx-auto space-y-6">
        <!-- Cabeçalho Principal -->
        <div class="border-b-2 border-black pb-4 flex justify-between items-end">
            <div>
                <h1 class="text-2xl font-black tracking-widest font-cinzel">ABELLA JOIAS</h1>
                <p class="text-[10px] uppercase font-mono tracking-wider text-zinc-600">Atacado de Joias no Bruto • Limeira/SP</p>
            </div>
            <div class="text-right font-mono text-xs">
                <p class="font-bold">ORDEM DE COMPRA: <span id="doc-id" class="text-zinc-700">#</span></p>
                <p id="doc-data" class="text-zinc-500 text-[10px]"></p>
            </div>
        </div>

        <!-- Dados do Cliente -->
        <div class="grid grid-cols-2 gap-4 bg-zinc-50 p-4 rounded-xl border border-zinc-200 text-xs">
            <div class="space-y-1">
                <p class="font-mono text-[9px] uppercase text-zinc-400 font-bold">Cliente / Atacandista</p>
                <p id="cli-nome" class="font-bold text-sm uppercase">-</p>
                <p id="cli-whats" class="font-mono text-zinc-600">-</p>
            </div>
            <div class="space-y-1">
                <p class="font-mono text-[9px] uppercase text-zinc-400 font-bold">Logística e Expedição</p>
                <p id="cli-destino" class="font-bold uppercase">-</p>
                <p id="cli-pagamento" class="font-mono text-zinc-600 uppercase">-</p>
            </div>
        </div>

        <!-- Destinatário de Renderização Dinâmica -->
        <div id="render-target"></div>

        <!-- Totais Consolidados -->
        <div class="border-t-2 border-black pt-4 grid grid-cols-3 text-center font-mono text-xs font-bold bg-zinc-50 p-3 rounded-xl border border-zinc-200">
            <div>
                <p class="text-[9px] text-zinc-500 uppercase">Total de Peças</p>
                <p id="resumo-qtd" class="text-lg text-black mt-0.5">0 pçs</p>
            </div>
            <div>
                <p class="text-[9px] text-zinc-500 uppercase">Massa Total Bruta</p>
                <p id="resumo-peso" class="text-lg text-black mt-0.5">0.00g</p>
            </div>
            <div id="bloco-financeiro-total">
                <p class="text-[9px] text-zinc-500 uppercase">Valor Consolidado</p>
                <p id="resumo-financeiro" class="text-lg text-black mt-0.5">R$ 0,00</p>
            </div>
        </div>
    </div>

    <!-- Scripts e Conexão de Dependências -->
    <script src="../js/firebase/firebase-config.js"></script>
    <script src="../js/utils/money.js"></script>

    <script>
        if (!window.firebase) {
            throw new Error('Firebase não carregado');
        }

        const dbPedidos = firebase.database();

        const urlParams = new URLSearchParams(window.location.search);
        const pedidoId = urlParams.get('id');
        const layout = urlParams.get('layout') || 'lista'; 
        const tipo = urlParams.get('tipo') || 'financeiro'; 

        const formatarMoedaLocal = (v) => {
            if(window.MoneyUtils && typeof window.MoneyUtils.format === 'function') return window.MoneyUtils.format(v);
            return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v || 0);
        };

        if (!pedidoId) {
            document.getElementById('loader').innerText = "❌ Erro Crítico: ID de pedido ausente na URL.";
        } else {
            carregarDadosRomaneio();
        }

        async function carregarDadosRomaneio() {
            try {
                const snap = await dbPedidos.ref('abella/orders/' + pedidoId).once('value');
                if (!snap.exists()) {
                    document.getElementById('loader').innerText = "❌ Erro: Registro de pedido não localizado no Firebase.";
                    return;
                }

                const p = snap.val();
                
                document.getElementById('doc-id').innerText = p.numeroPedido || p.idPedido || pedidoId; 
                document.getElementById('doc-data').innerText = p.createdAt ? new Date(p.createdAt).toLocaleString('pt-BR') : new Date().toLocaleString('pt-BR');
                document.getElementById('cli-nome').innerText = p.cliente || p.nome || 'Não Identificado';
                document.getElementById('cli-whats').innerText = "Contato: " + (p.whats || p.whatsapp || p.contato || 'N/I');
                document.getElementById('cli-destino').innerText = "Destino: " + (p.cidade || 'Limeira/SP').toUpperCase();
                document.getElementById('cli-pagamento').innerText = "Forma de Pagto: " + (p.formaPagamento || 'Não Informada');

                document.getElementById('resumo-qtd').innerText = `${p.totalPecas || p.qtd || 0} pçs`;
                // CORREÇÃO AQUI: Alterado de resumo-weight para resumo-peso para corresponder ao ID real do HTML
                document.getElementById('resumo-peso').innerText = `${parseFloat(p.pesoTotal || p.peso || 0).toFixed(2)}g`;
                document.getElementById('resumo-financeiro').innerText = formatarMoedaLocal(p.total || p.valorTotal || 0);
                
                if (tipo === 'conferencia') {
                    document.getElementById('bloco-financeiro-total').classList.add('invisible');
                }

                var itens = p.itens || p.produtos || [];
                if (typeof itens === 'object' && !Array.isArray(itens)) itens = Object.values(itens);

                const target = document.getElementById('render-target');
                target.innerHTML = '';

                function renderResumoFinanceiro(p) {
                    return `
                    <div class="mt-6 border-t-2 border-black pt-4">
                        <h3 class="font-bold text-sm mb-3">RESUMO FINANCEIRO</h3>
                        <div class="grid grid-cols-2 gap-2 text-xs">
                            <div>Total de Itens:</div>
                            <div class="text-right">${itens.length || 0}</div>
                            <div>Total de Peças:</div>
                            <div class="text-right">${p.totalPecas || p.qtd || 0}</div>
                            <div>Peso Total:</div>
                            <div class="text-right">${parseFloat(p.pesoTotal || p.peso || 0).toFixed(2)}g</div>
                            <div>Desconto Categoria:</div>
                            <div class="text-right">${formatarMoedaLocal(p.descontoCategoria || 0)}</div>
                            <div>Desconto Peso:</div>
                            <div class="text-right">${formatarMoedaLocal(p.descontoPeso || 0)}</div>
                            <div>Desconto Campanha:</div>
                            <div class="text-right">${formatarMoedaLocal(p.descontoCampanha || 0)}</div>
                            <div class="font-bold border-t pt-2">Valor Final</div>
                            <div class="font-bold text-right border-t pt-2">${formatarMoedaLocal(p.total || p.valorTotal || 0)}</div>
                        </div>
                    </div>`;
                }

                function renderListaConferencia(p, itens) {
                    return `
                        <table class="w-full border-collapse text-xs">
                            <thead>
                                <tr class="border-b border-zinc-200">
                                    <th class="py-2 text-left font-semibold text-zinc-700">SKU</th>
                                    <th class="py-2 text-left font-semibold text-zinc-700">Produto</th>
                                    <th class="py-2 text-center font-semibold text-zinc-700 w-16">Qtd</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-zinc-100">
                                ${itens.map(item => `
                                    <tr class="hover:bg-zinc-50/50">
                                        <td class="py-2 text-left font-mono text-zinc-600">${item.sku || '-'}</td>
                                        <td class="py-2 text-left text-zinc-800">${item.nome || item.name || '-'}</td>
                                        <td class="py-2 text-center text-zinc-900 font-medium">${item.quantidade || 1}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>`;
                }
                
                function renderListaCompleto(p, itens) {
                    return `
                        <table class="w-full text-xs border-collapse">
                            <thead>
                                <tr class="border-b-2 border-black text-left">
                                    <th class="py-2">SKU</th>
                                    <th class="py-2">Produto</th>
                                    <th class="py-2 text-center">Qtd</th>
                                    <th class="py-2 text-center">Peso</th>
                                    <th class="py-2 text-right">Unitário</th>
                                    <th class="py-2 text-right">Total</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-zinc-200">
                            ${itens.map(item => {
                                const qtd = item.quantidade || 1;
                                const unit = item.precoFinal || item.price || item.preco || 0;
                                return `
                                    <tr>
                                        <td class="py-2 font-mono">${item.sku || '-'}</td>
                                        <td class="py-2">${item.nome || item.name || '-'}</td>
                                        <td class="py-2 text-center">${qtd}</td>
                                        <td class="py-2 text-center">${parseFloat(item.peso || item.weight || 0).toFixed(2)}g</td>
                                        <td class="py-2 text-right">${formatarMoedaLocal(unit)}</td>
                                        <td class="py-2 text-right">${formatarMoedaLocal(unit * qtd)}</td>
                                    </tr>`;
                            }).join('')}
                            </tbody>
                        </table>
                        ${renderResumoFinanceiro(p)}`;
                }

                function renderListaCompletoFoto(p, itens) {
                    const totalItens = itens.length;
                    let totalPecas = 0;
                    let pesoTotal = 0;

                    itens.forEach(item => {
                        const qtd = parseInt(item.quantidade || 1);
                        const peso = parseFloat(item.peso || item.weight || 0);
                        totalPecas += qtd;
                        pesoTotal += (peso * qtd);
                    });

                    return `
                    <div class="space-y-6">
                        <table class="w-full border-collapse text-xs">
                            <thead>
                                <tr class="border-b-2 border-black">
                                    <th class="py-2 text-left">Foto</th>
                                    <th class="py-2 text-left">SKU</th>
                                    <th class="py-2 text-left">Produto</th>
                                    <th class="py-2 text-center">Qtd</th>
                                    <th class="py-2 text-center">Peso</th>
                                    <th class="py-2 text-right">Unit.</th>
                                    <th class="py-2 text-right">Total</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${itens.map(item => {
                                    const qtd = parseInt(item.quantidade || 1);
                                    const peso = parseFloat(item.peso || item.weight || 0);
                                    const preco = parseFloat(item.precoFinal || item.price || item.preco || 0);
                                    return `
                                    <tr class="border-b border-zinc-200">
                                        <td class="py-2">
                                            <img src="${item.image || item.imagem || 'https://placehold.co/100'}" style="width:60px;height:60px;object-fit:cover;border:1px solid #ddd;border-radius:6px;" onerror="this.src='https://placehold.co/100'">
                                        </td>
                                        <td class="font-mono">${item.sku || '-'}</td>
                                        <td class="uppercase font-semibold">${item.nome || item.name || '-'}</td>
                                        <td class="text-center font-bold">${qtd}</td>
                                        <td class="text-center">${peso.toFixed(2)}g</td>
                                        <td class="text-right">${formatarMoedaLocal(preco)}</td>
                                        <td class="text-right font-bold">${formatarMoedaLocal(preco * qtd)}</td>
                                    </tr>`;
                                }).join('')}
                            </tbody>
                        </table>

                        <div class="border-t-2 border-black pt-4">
                            <h3 class="font-bold text-sm mb-3 uppercase">Resumo Financeiro</h3>
                            <div class="grid grid-cols-2 gap-y-2 text-xs">
                                <div>Total de Itens</div><div class="text-right">${totalItens}</div>
                                <div>Total de Peças</div><div class="text-right">${totalPecas}</div>
                                <div>Peso Total</div><div class="text-right">${pesoTotal.toFixed(2)}g</div>
                                <div>Subtotal</div><div class="text-right">${formatarMoedaLocal(p.subtotal || p.valorProdutos || p.total || 0)}</div>
                                <div>Desconto Categoria</div><div class="text-right">${formatarMoedaLocal(p.descontoCategoria || 0)}</div>
                                <div>Desconto Peso</div><div class="text-right">${formatarMoedaLocal(p.descontoPeso || 0)}</div>
                                <div>Desconto Campanha</div><div class="text-right">${formatarMoedaLocal(p.descontoCampanha || 0)}</div>
                                <div>Desconto PIX</div><div class="text-right">${formatarMoedaLocal(p.descontoPix || 0)}</div>
                                <div>Frete</div><div class="text-right">${formatarMoedaLocal(p.frete || 0)}</div>
                                <div class="border-t pt-2 font-black text-sm">Total Final</div>
                                <div class="border-t pt-2 text-right font-black text-sm">${formatarMoedaLocal(p.total || p.valorTotal || 0)}</div>
                            </div>
                        </div>
                    </div>`;
                }

                function renderGradeConferencia(p, itens) {
                    let totalPecas = 0;
                    itens.forEach(item => { totalPecas += parseInt(item.quantidade || 1); });

                    return `
                    <div class="space-y-6">
                        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
                            ${itens.map(item => `
                                <div class="border border-zinc-300 rounded-xl p-3 bg-white break-inside-avoid">
                                    <div class="flex justify-between items-start mb-2">
                                        <span class="text-[10px] font-mono text-zinc-500 font-bold">SKU</span>
                                        <span class="bg-black text-white px-2 py-1 rounded-lg text-xs font-black">${item.quantidade || 1}x</span>
                                    </div>
                                    <div class="text-[11px] font-mono text-zinc-700 mb-2 break-all">${item.sku || '-'}</div>
                                    <div class="font-bold uppercase text-sm leading-tight text-black">${item.nome || item.name || '-'}</div>
                                </div>`).join('')}
                        </div>
                        <div class="border-t-2 border-black pt-4">
                            <div class="grid grid-cols-2 gap-3 text-xs">
                                <div>
                                    <div class="text-zinc-500 uppercase font-bold">Total de Itens</div>
                                    <div class="text-lg font-black">${itens.length}</div>
                                </div>
                                <div class="text-right">
                                    <div class="text-zinc-500 uppercase font-bold">Total de Peças</div>
                                    <div class="text-lg font-black">${totalPecas}</div>
                                </div>
                            </div>
                        </div>
                    </div>`;
                }

                function renderGradeCompleto(p, itens) {
                    let totalPecas = 0;
                    let pesoTotal = 0;
                    itens.forEach(item => {
                        totalPecas += parseInt(item.quantidade || 1);
                        pesoTotal += (parseFloat(item.peso || item.weight || 0) * parseInt(item.quantidade || 1));
                    });

                    return `
                    <div class="space-y-6">
                        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
                            ${itens.map(item => {
                                const qtd = parseInt(item.quantidade || 1);
                                const peso = parseFloat(item.peso || item.weight || 0);
                                const preco = parseFloat(item.precoFinal || item.price || item.preco || 0);
                                return `
                                <div class="border border-zinc-300 rounded-xl p-3 bg-white flex flex-col justify-between">
                                    <div>
                                        <div class="flex justify-between items-start mb-2">
                                            <span class="text-[10px] font-mono text-zinc-500 font-bold">SKU</span>
                                            <span class="bg-black text-white px-2 py-1 rounded-lg text-xs font-black">${qtd}x</span>
                                        </div>
                                        <div class="text-[11px] font-mono text-zinc-700 mb-2 break-all">${item.sku || '-'}</div>
                                        <div class="font-bold uppercase text-sm leading-tight text-black mb-3">${item.nome || item.name || '-'}</div>
                                    </div>
                                    <div class="border-t border-zinc-200 pt-2 text-[11px] font-mono space-y-1">
                                        <div class="flex justify-between"><span>Peso</span><span>${peso.toFixed(2)}g</span></div>
                                        <div class="flex justify-between"><span>Unitário</span><span>${formatarMoedaLocal(preco)}</span></div>
                                        <div class="flex justify-between font-bold"><span>Total</span><span>${formatarMoedaLocal(preco * qtd)}</span></div>
                                    </div>
                                </div>`;
                            }).join('')}
                        </div>
                        
                        <div class="border-t-2 border-black pt-4">
                            <h3 class="font-bold text-sm uppercase mb-3">Resumo Financeiro</h3>
                            <div class="grid grid-cols-2 gap-y-2 text-xs">
                                <div>Total de Itens</div><div class="text-right">${itens.length}</div>
                                <div>Total de Peças</div><div class="text-right">${totalPecas}</div>
                                <div>Peso Total</div><div class="text-right">${pesoTotal.toFixed(2)}g</div>
                                <div>Subtotal</div><div class="text-right">${formatarMoedaLocal(p.subtotal || p.valorProdutos || p.total || 0)}</div>
                                <div>Desconto Categoria</div><div class="text-right">${formatarMoedaLocal(p.descontoCategoria || 0)}</div>
                                <div>Desconto Peso</div><div class="text-right">${formatarMoedaLocal(p.descontoPeso || 0)}</div>
                                <div>Desconto Campanha</div><div class="text-right">${formatarMoedaLocal(p.descontoCampanha || 0)}</div>
                                <div>Desconto PIX</div><div class="text-right">${formatarMoedaLocal(p.descontoPix || 0)}</div>
                                <div>Frete</div><div class="text-right">${formatarMoedaLocal(p.frete || 0)}</div>
                                <div class="border-t pt-2 font-black text-sm">Total Final</div>
                                <div class="border-t pt-2 text-right font-black text-sm">${formatarMoedaLocal(p.total || p.valorTotal || 0)}</div>
                            </div>
                        </div>
                    </div>`;
                }

                function renderGradeCompletoFoto(p, itens) {
                    let totalPecas = 0;
                    let pesoTotal = 0;
                    itens.forEach(item => {
                        totalPecas += parseInt(item.quantidade || 1);
                        pesoTotal += (parseFloat(item.peso || item.weight || 0) * parseInt(item.quantidade || 1));
                    });

                    return `
                    <div class="space-y-6">
                        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                            ${itens.map(item => {
                                const qtd = parseInt(item.quantidade || 1);
                                const peso = parseFloat(item.peso || item.weight || 0);
                                const preco = parseFloat(item.precoFinal || item.price || item.preco || 0);
                                return `
                                <div class="border border-zinc-300 rounded-xl overflow-hidden bg-white flex flex-col">
                                    <div class="h-40 bg-zinc-100 border-b border-zinc-200 overflow-hidden">
                                        <img src="${item.image || item.imagem || 'https://placehold.co/400'}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/400'">
                                    </div>
                                    <div class="p-3 flex flex-col flex-1">
                                        <div class="flex justify-between items-start mb-2">
                                            <span class="text-[10px] font-mono text-zinc-500 font-bold">SKU</span>
                                            <span class="bg-black text-white px-2 py-1 rounded-lg text-xs font-black">${qtd}x</span>
                                        </div>
                                        <div class="text-[11px] font-mono text-zinc-700 break-all mb-2">${item.sku || '-'}</div>
                                        <div class="font-bold uppercase text-sm leading-tight text-black mb-3 flex-1">${item.nome || item.name || '-'}</div>
                                        <div class="border-t border-zinc-200 pt-2 space-y-1 text-[11px] font-mono">
                                            <div class="flex justify-between"><span>Peso</span><span>${peso.toFixed(2)}g</span></div>
                                            <div class="flex justify-between"><span>Unitário</span><span>${formatarMoedaLocal(preco)}</span></div>
                                            <div class="flex justify-between font-bold"><span>Total</span><span>${formatarMoedaLocal(preco * qtd)}</span></div>
                                        </div>
                                    </div>
                                </div>`;
                            }).join('')}
                        </div>

                        <div class="border-t-2 border-black pt-4">
                            <h3 class="font-bold text-sm uppercase mb-3">Resumo Financeiro</h3>
                            <div class="grid grid-cols-2 gap-y-2 text-xs">
                                <div>Total de Itens</div><div class="text-right">${itens.length}</div>
                                <div>Total de Peças</div><div class="text-right">${totalPecas}</div>
                                <div>Peso Total</div><div class="text-right">${pesoTotal.toFixed(2)}g</div>
                                <div>Subtotal</div><div class="text-right">${formatarMoedaLocal(p.subtotal || p.valorProdutos || p.total || 0)}</div>
                                <div>Desconto Categoria</div><div class="text-right">${formatarMoedaLocal(p.descontoCategoria || 0)}</div>
                                <div>Desconto Peso</div><div class="text-right">${formatarMoedaLocal(p.descontoPeso || 0)}</div>
                                <div>Desconto Campanha</div><div class="text-right">${formatarMoedaLocal(p.descontoCampanha || 0)}</div>
                                <div>Desconto PIX</div><div class="text-right">${formatarMoedaLocal(p.descontoPix || 0)}</div>
                                <div>Frete</div><div class="text-right">${formatarMoedaLocal(p.frete || 0)}</div>
                                <div class="border-t pt-2 font-black text-sm">Total Final</div>
                                <div class="border-t pt-2 text-right font-black text-sm">${formatarMoedaLocal(p.total || p.valorTotal || 0)}</div>
                            </div>
                        </div>
                    </div>`;
                }

                const modelo = `${layout}_${tipo}`;
                const renderizadores = {
                    lista_conferencia: renderListaConferencia,
                    lista_financeiro: renderListaCompleto,
                    lista_foto: renderListaCompletoFoto,
                    grade_conferencia: renderGradeConferencia,
                    grade_financeiro: renderGradeCompleto,
                    grade_foto: renderGradeCompletoFoto
                };

                const renderizador = renderizadores[modelo];
                if (!renderizador) {
                    throw new Error(`Modelo estrutural não mapeado: ${modelo}`);
                }

                target.innerHTML = renderizador(p, itens);

                document.getElementById('loader').classList.add('hidden');
                document.getElementById('romaneio-conteudo').classList.remove('hidden');

            } catch (err) {
                console.error(err);
                document.getElementById('loader').innerText = "❌ Ocorreu uma exceção crítica ao sincronizar romaneio.";
            }
        }
    </script>
</body>
</html>
