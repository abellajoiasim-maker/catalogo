<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel Administrativo • Abella Joias</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #0b0b0b; color: #eee; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #caa85c; border-radius: 10px; }
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <aside class="w-64 bg-[#111] border-r border-[#222] flex flex-col justify-between shrink-0 z-20">
        <div class="p-6 space-y-6">
            <div class="flex items-center gap-3 border-b border-[#222] pb-4">
                <div class="w-8 h-8 rounded-full bg-[#caa85c] flex items-center justify-center text-black font-black font-mono">A</div>
                <div>
                    <h1 class="text-sm font-bold text-white tracking-tight uppercase">Abella Joias</h1>
                    <p class="text-[10px] text-gray-500 font-medium">Painel Administrativo</p>
               
            </div>
            <nav class="space-y-1" id="menu-navegacao">
                <button onclick="mudarAbaDinamica('pedidos')" id="btn-pedidos" class="tab-btn w-full text-left p-3 rounded-lg text-xs font-semibold bg-zinc-900 text-gray-400 hover:text-white transition-all flex items-center gap-2">📦 Pedidos Recebidos</button>
                <button onclick="mudarAbaDinamica('editor')" id="btn-editor" class="tab-btn w-full text-left p-3 rounded-lg text-xs font-semibold bg-zinc-900 text-gray-400 hover:text-white transition-all flex items-center gap-2">⚡ Editor Full Master</button>
                <button onclick="mudarAbaDinamica('ofertas')" id="btn-ofertas" class="tab-btn w-full text-left p-3 rounded-lg text-xs font-semibold bg-zinc-900 text-gray-400 hover:text-white transition-all flex items-center gap-2">🏷️ Painel de Ofertas</button>
                <button onclick="mudarAbaDinamica('galvanicas')" id="btn-galvanicas" class="tab-btn w-full text-left p-3 rounded-lg text-xs font-semibold bg-zinc-900 text-gray-400 hover:text-white transition-all flex items-center gap-2">🚚 Galvânicas Parceiras</button>
                <button onclick="mudarAbaDinamica('produtos')" id="btn-produtos" class="tab-btn w-full text-left p-3 rounded-lg text-xs font-semibold bg-zinc-900 text-gray-400 hover:text-white transition-all flex items-center gap-2">💍 Gestão de Produtos</button>
                <button onclick="mudarAbaDinamica('categorias')" id="btn-categorias" class="tab-btn w-full text-left p-3 rounded-lg text-xs font-semibold bg-zinc-900 text-gray-400 hover:text-white transition-all flex items-center gap-2">📁 Coleções / Categorias</button>
                <button onclick="mudarAbaDinamica('config')" id="btn-config" class="tab-btn w-full text-left p-3 rounded-lg text-xs font-semibold bg-zinc-900 text-gray-400 hover:text-white transition-all flex items-center gap-2">⚙️ Configurações</button>
            </nav>
        </div>
        <div class="p-4 border-t border-[#222] bg-black/20 text-center text-[10px] text-gray-600 font-mono">
            v3.2.0 • Sistema Modular
        </div>
    </aside>

    <main id="conteudo-dinamico" class="flex-1 overflow-y-auto p-8 custom-scroll relative z-10 bg-[#0b0b0b]">
        <div class="flex items-center justify-center h-full text-zinc-600 italic text-xs">
            Carregando ecossistema operacional...
        </div>
    </main>

    <div id="print-area" class="hidden"></div>

    <script src="admin-logic.js"></script>
</body>
</html>
