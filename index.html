<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="description" content="Abella Joias — Plataforma corporativa premium de pedidos. Compre joias com clareza, segurança e total transparência.">
    <meta name="robots" content="index, follow">
    <meta property="og:title" content="Abella Joias • Catálogo Premium">
    <meta property="og:description" content="Plataforma inteligente de pedidos. Veja pesos, descontos, parcelamentos e economia em tempo real.">
    <meta property="og:type" content="website">
    <title>Abella Joias • Catálogo Premium</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        body {
            background: #050505;
            color: #fff;
            font-family: 'Inter', sans-serif;
        }
        .cinzel { font-family: 'Cinzel', serif; }
        .gold-gradient {
            background: linear-gradient(135deg, #caa85c 0%, #f1e0b5 50%, #caa85c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .gold-bg {
            background: linear-gradient(135deg, #caa85c 0%, #e5ca8d 100%);
        }
        .cat-card {
            background: linear-gradient(180deg, #101010 0%, #0a0a0a 100%);
            border: 1px solid #1a1a1a;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .cat-card:hover {
            transform: translateY(-4px);
            border-color: #caa85c;
            box-shadow: 0 12px 30px rgba(202, 168, 92, 0.08);
        }
        .fallback-container {
            display: none;
            align-items: center;
            justify-content: center;
            background: #121212;
            font-size: 2.5rem;
            z-index: 1;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <header class="w-full max-w-7xl mx-auto px-4 pt-8 md:pt-12 flex justify-center">
        <div class="text-center">
            <div id="logo-container" class="mb-4 flex justify-center">
                <h1 class="cinzel text-3xl md:text-5xl font-bold tracking-[0.2em] gold-gradient">ABELLA JOIAS</h1>
            </div>
            <p class="text-[10px] md:text-xs uppercase tracking-[0.4em] text-zinc-500 font-medium">Atacado de Semijoias • Linha no Bruto</p>
        </div>
    </header>

    <main class="w-full max-w-7xl mx-auto px-4 py-12 flex-1">
        <div class="max-w-xl mx-auto mb-10 relative">
            <input 
                type="text" 
                id="busca" 
                placeholder="PROCURAR CATEGORIA..." 
                class="w-full bg-zinc-900/60 border border-zinc-800 rounded-full px-6 py-3.5 pl-12 text-sm text-zinc-200 placeholder-zinc-600 focus:outline-none focus:border-[#caa85c] transition-all font-medium tracking-wide"
            >
            <span class="absolute left-5 top-1/2 -translate-y-1/2 text-zinc-600 text-lg">🔍</span>
        </div>

        <div id="loading" class="text-center py-20">
            <div class="inline-block w-8 h-8 border-2 border-zinc-700 border-t-[#caa85c] rounded-full animate-spin mb-4"></div>
            <p class="text-xs uppercase tracking-widest text-zinc-500 font-mono">Conectando ao banco de dados...</p>
        </div>

        <div id="no-result" class="hidden text-center py-20">
            <p class="text-sm text-zinc-500 tracking-wide font-medium">NENHUMA CATEGORIA ENCONTRADA PARA A SUA BUSCA.</p>
        </div>

        <div id="grid-categorias" class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6"></div>
    </main>

    <footer class="w-full border-t border-zinc-900 py-6 bg-black">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p class="text-[10px] text-zinc-600 uppercase tracking-widest font-mono">© 2026 Abella Joias. Todos os direitos reservados.</p>
        </div>
    </footer>

    <script src="../js/firebase/firebase-config.js"></script>
    <script>
        // Função para garantir suporte a links gs://, Google Drive ou URLs externas
        function converterGsUrl(url) {
            let stringUrl = String(url ?? '').trim();
            if (!stringUrl) return '';

            if (stringUrl.includes('drive.google.com')) {
                try {
                    let idArquivo = '';
                    if (stringUrl.includes('/d/')) {
                        idArquivo = stringUrl.split('/d/')[1].split('/')[0];
                    } else if (stringUrl.includes('id=')) {
                        idArquivo = stringUrl.split('id=')[1].split('&')[0];
                    }
                    if (idArquivo) return `https://drive.google.com/uc?export=view&id=${idArquivo}`;
                } catch (err) { console.error('Erro link drive:', err); }
            }

            if (stringUrl.startsWith('gs://')) {
                try {
                    const semProtocolo = stringUrl.replace('gs://', '');
                    const primeiraBarra = semProtocolo.indexOf('/');
                    if (primeiraBarra === -1) return stringUrl;
                    const bucket = semProtocolo.substring(0, primeiraBarra);
                    const caminhoArquivo = semProtocolo.substring(primeiraBarra + 1);
                    return `https://firebasestorage.googleapis.com/v1/b/${bucket}/o/${encodeURIComponent(caminhoArquivo)}?alt=media`;
                } catch (e) { console.error('Erro link gs://:', e); }
            }
            return stringUrl;
        }

        function handleImageError(img) {
            img.style.display = 'none';
            const fallback = img.parentNode.querySelector('.fallback-container');
            if (fallback) fallback.style.setProperty('display', 'flex', 'important');
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const grid = document.getElementById('grid-categorias');
            const loading = document.getElementById('loading');
            const noResult = document.getElementById('no-result');

            try {
                if (!window.firebase || !window.firebase.apps.length) {
                    throw new Error("SDK do Firebase ausente ou não configurado.");
                }
                const db = window.firebase.database();
                const path = window.getAbellaPath ? window.getAbellaPath('categories') : 'categories';

                // Monitoramento em Tempo Real (.on('value')): Alterou no editor, muda na hora aqui
                db.ref(path).on('value', (snapshot) => {
                    loading.classList.add('hidden');
                    grid.innerHTML = '';
                    
                    const data = snapshot.val();
                    if (!data) {
                        grid.innerHTML = `<p class="col-span-full text-center text-xs text-zinc-500 py-10">NENHUMA CATEGORIA DISPONÍVEL NO MOMENTO.</p>`;
                        return;
                    }

                    const categoriasOrdenadas = Object.entries(data)
                        .map(([slug, content]) => ({ slug, ...content }))
                        .filter(c => c.active !== false)
                        .sort((a, b) => (a.order || 0) - (b.order || 0));

                    if (categoriasOrdenadas.length === 0) {
                        grid.innerHTML = `<p class="col-span-full text-center text-xs text-zinc-500 py-10">NENHUMA CATEGORIA ATIVA.</p>`;
                        return;
                    }

                    categoriasOrdenadas.forEach(cat => {
                        // Resiliência de dados: Tenta ler chaves novas e antigas para não quebrar nunca
                        const rawImage = cat.gridImage || cat.grid || cat.heroImage || cat.hero || '';
                        const urlFinal = converterGsUrl(rawImage);

                        const card = document.createElement('div');
                        card.className = 'cat-card rounded-2xl overflow-hidden cursor-pointer flex flex-col group';
                        card.onclick = () => {
                            window.location.href = `subcategorias.html?categoria=${encodeURIComponent(cat.slug)}`;
                        };

                        card.innerHTML = `
                            <div class="w-full aspect-square relative bg-zinc-950 overflow-hidden flex items-center justify-center">
                                <div class="fallback-container absolute inset-0 flex items-center justify-center text-zinc-700">📁</div>
                                <img 
                                    src="${urlFinal}" 
                                    alt="${cat.name || cat.slug}" 
                                    class="w-full h-full object-cover relative z-10 group-hover:scale-105 transition-transform duration-700"
                                    onerror="handleImageError(this)"
                                >
                                <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent z-20"></div>
                            </div>
                            <div class="p-4 md:p-5 flex flex-col justify-end flex-1 relative z-30 -mt-12 bg-gradient-to-t from-black via-black/95 to-transparent">
                                <h3 class="cinzel text-sm md:text-base font-bold tracking-wider text-zinc-100 group-hover:text-[#caa85c] transition-colors line-clamp-1">
                                    ${(cat.name || cat.slug).toUpperCase()}
                                </h3>
                                <div class="flex items-center justify-between mt-2 pt-2 border-t border-zinc-900/50">
                                    <span class="text-[9px] md:text-[10px] uppercase font-mono tracking-widest text-zinc-500">Explorar Linha</span>
                                    <span class="text-xs text-[#caa85c] opacity-0 group-hover:opacity-100 translate-x-[-4px] group-hover:translate-x-0 transition-all duration-300">→</span>
                                </div>
                            </div>
                        `;
                        grid.appendChild(card);
                    });
                });

                const inputBusca = document.getElementById('busca');
                if (inputBusca) {
                    inputBusca.addEventListener('input', (e) => {
                        const termo = e.target.value.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
                        const cards = grid.querySelectorAll('.cat-card');
                        let encontrouAlgum = false;

                        cards.forEach(card => {
                            const textoCard = card.querySelector('h3').innerText.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                            if (textoCard.includes(termo)) {
                                card.classList.remove('hidden');
                                encontrouAlgum = true;
                            } else {
                                card.classList.add('hidden');
                            }
                        });

                        if (encontrouAlgum) {
                            noResult.classList.add('hidden');
                        } else {
                            noResult.classList.remove('hidden');
                        }
                    });
                }

            } catch (error) {
                console.error('Falha de Sincronização do Painel:', error);
                if (loading) loading.innerHTML = `<p class="text-xs uppercase text-rose-500 font-mono py-4">⚠️ Falha ao processar requisições na árvore do Firebase.</p>`;
            }
        });
    </script>
</body>
</html>
