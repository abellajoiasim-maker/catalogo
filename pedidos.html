<div class="flex justify-between items-center mb-6">
    <div>
        <h2 class="text-xl font-black text-white uppercase tracking-tight">Módulo de Pedidos Recebidos</h2>
        <p class="text-xs text-gray-500">Fluxo operacional assíncrono isolado com persistência estável</p>
    </div>
    <span id="qtd-pedidos" class="bg-[#caa85c]/10 border border-[#caa85c]/20 text-[#caa85c] px-3 py-1 rounded-full text-xs font-bold font-mono">Carregando contador...</span>
</div>

<div class="mb-4">
    <input id="buscaPedido" type="text" oninput="carregarPedidos()" placeholder="🔍 Buscar cliente por nome..." class="w-full md:w-80 bg-[#111] border border-[#222] p-2.5 rounded-xl text-xs text-white focus:border-[#caa85c] outline-none font-medium">
</div>

<div id="listaPedidos" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
    <div class="col-span-full text-center py-12 text-zinc-600 italic text-xs animate-pulse font-mono">
        Buscando dados ativos na árvore 'orders' do Firebase...
    </div>
</div>

<div id="editorPedido" class="hidden fixed inset-0 bg-black/95 flex items-center justify-center z-50 p-4">
    <div class="bg-[#111] w-full max-w-5xl rounded-2xl p-6 overflow-auto max-h-[95vh] border border-[#333] custom-scroll space-y-6">
        <div class="flex justify-between items-center border-b border-[#222] pb-4">
            <h2 class="text-[#caa85c] font-bold uppercase tracking-tighter text-lg">Editar Estrutura do Pedido</h2>
            <div id="totalPreview" class="text-[#caa85c] font-black text-2xl font-mono">R$ 0,00</div>
        </div>
        
        <div class="grid md:grid-cols-2 gap-4">
            <div class="bg-black/40 p-4 border border-[#222] rounded-xl space-y-2">
                <p class="text-[10px] text-[#caa85c] uppercase font-bold tracking-widest">Dados do Comprador</p>
                <input id="edClienteNome" placeholder="Nome do Cliente" class="w-full bg-[#0b0b0b] border border-[#333] p-2 rounded text-sm text-white focus:border-[#caa85c] outline-none">
                <input id="edClienteTel" placeholder="WhatsApp" class="w-full bg-[#0b0b0b] border border-[#333] p-2 rounded text-sm text-white focus:border-[#caa85c] outline-none">
            </div>
            <div class="bg-black/40 p-4 border border-[#222] rounded-xl space-y-2">
                <p class="text-[10px] text-[#caa85c] uppercase font-bold tracking-widest">Destino da Entrega</p>
                <input id="edRua" placeholder="Rua, Número, Bairro" class="w-full bg-[#0b0b0b] border border-[#333] p-2 rounded text-sm text-white focus:border-[#caa85c] outline-none">
                <input id="edCidade" placeholder="Cidade / Estado" class="w-full bg-[#0b0b0b] border border-[#333] p-2 rounded text-sm text-white focus:border-[#caa85c] outline-none">
            </div>
        </div>

        <div>
            <div class="flex justify-between items-center mb-2">
                <h3 class="text-[#caa85c] font-bold text-sm uppercase italic tracking-wide">Produtos Vinculados</h3>
                <button class="bg-green-950 text-green-400 border border-green-800 hover:bg-green-900 px-3 py-1.5 rounded-lg text-xs font-bold uppercase tracking-wider" onclick="addItemEditor()">+ Inserir Peça (SKU)</button>
            </div>
            <div id="edItens" class="space-y-2 max-h-60 overflow-y-auto custom-scroll pr-1"></div>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 bg-[#1a1a1a] p-4 border border-[#222] rounded-xl">
            <div><label class="text-[10px] text-gray-400 uppercase font-bold block mb-1">Desc. Campanha (R$)</label><input id="edDescPromo" type="number" step="0.01" oninput="recalcularTotalEd()" class="w-full bg-black border border-[#333] p-2 rounded text-sm font-mono text-white"></div>
            <div><label class="text-[10px] text-gray-400 uppercase font-bold block mb-1">Desc. Pix (R$)</label><input id="edDescPix" type="number" step="0.01" oninput="recalcularTotalEd()" class="w-full bg-black border border-[#333] p-2 rounded text-sm font-mono text-white"></div>
            <div><label class="text-[10px] text-gray-400 uppercase font-bold block mb-1">Frete Adicional (R$)</label><input id="edFrete" type="number" step="0.01" oninput="recalcularTotalEd()" class="w-full bg-black border border-[#333] p-2 rounded text-sm font-mono text-white"></div>
            <div><label class="text-[10px] text-gray-400 uppercase font-bold block mb-1">Total Unidades</label><input id="edQtdTotal" type="number" readonly class="w-full bg-black/50 border border-[#333] p-2 rounded text-sm font-mono text-gray-400 cursor-not-allowed"></div>
        </div>

        <div class="flex flex-col md:flex-row gap-2 pt-4 border-t border-[#222]">
            <button class="bg-[#caa85c] text-black font-bold flex-grow py-3 rounded-lg text-sm uppercase tracking-wider hover:brightness-110" onclick="salvarPedidoEditado()">SALVAR ALTERAÇÕES</button>
            <button class="border border-[#333] text-gray-400 py-3 px-6 rounded-lg text-sm font-bold uppercase hover:bg-zinc-900" onclick="fecharEditorPedido()">CANCELAR</button>
        </div>
    </div>
</div>

<script>
    (function() {
        // Verifica se o Firebase já está pronto na janela global, senão aguarda
        if (typeof firebase === 'undefined' || !firebase.apps.length) {
            setTimeout(arguments.callee, 50);
            return;
        }

        const db = firebase.database();
        let todosPedidosLocal = {};
        
        // CORREÇÃO: Adicionado aspas em 'BRL' para não quebrar o script
        const fMoedaLocal = v => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v || 0);

        window.carregarPedidos = function() {
            db.ref('orders').once('value').then(snap => {
                const container = document.getElementById('listaPedidos');
                const badgeCount = document.getElementById('qtd-pedidos');
                if (!container) return;

                if (!snap.exists()) {
                    container.innerHTML = '<div class="text-center py-10 text-gray-600 italic col-span-full">Nenhum pedido localizado na base de dados.</div>';
                    if(badgeCount) badgeCount.innerText = "0 pedidos";
                    return;
                }

                todosPedidosLocal = snap.val();
                const buscaElemento = document.getElementById('buscaPedido');
                const busca = buscaElemento ? buscaElemento.value.toLowerCase().trim() : '';
                let htmlStack = [];
                let count = 0;

                Object.keys(todosPedidosLocal).forEach(id => {
                    const p = todosPedidosLocal[id];
                    const cliente = p.nome || p.cliente || 'Cliente Oculto';
                    if (busca && !cliente.toLowerCase().includes(busca)) return;
                    
                    count++;
                    let totalPecas = 0;
                    if (Array.isArray(p.itens)) {
                        p.itens.forEach(i => totalPecas += (parseInt(i.quantidade || i.qtd) || 1));
                    }

                    const rawTotal = p.total;
                    const totalExibivel = typeof rawTotal === 'number' ? fMoedaLocal(rawTotal) : (rawTotal || 'R$ 0,00');
                    const numeroPedido = id.slice(-6).toUpperCase();

                    htmlStack.push(`
                        <div class="bg-[#111] border border-[#222] p-4 rounded-xl flex flex-col justify-between border border-zinc-800 hover:border-zinc-700 transition-all text-xs space-y-3">
                            <div class="space-y-1">
                                <div class="flex justify-between items-center text-gray-400 font-mono text-[11px]">
                                    <span class="font-bold text-white">Pedido #${numeroPedido}</span>
                                    <span>${p.data ? new Date(p.data).toLocaleString('pt-BR') : ''}</span>
                                </div>
                                <h4 class="text-base font-bold text-white uppercase">${cliente}</h4>
                                <p class="text-xs text-gray-400 font-mono">📱 WhatsApp: ${p.whats || p.telefone || 'Não informado'}</p>
                                <p class="text-xs text-zinc-400 font-mono">📦 Volume Total: <span class="text-[#caa85c] font-bold">${totalPecas} pçs</span></p>
                                <p class="text-xs text-zinc-500 truncate">📍 Endereço: ${p.rua || 'Retirada / Não informado'}</p>
                                <div class="pt-1.5 flex justify-between items-center border-t border-zinc-900/50 mt-1">
                                    <span class="text-[10px] text-gray-500 uppercase font-bold tracking-wider">Total Líquido</span>
                                    <span class="text-sm font-black text-[#caa85c] font-mono">${totalExibivel}</span>
                                </div>
                            </div>
                            <div class="bg-black/40 p-2 rounded-lg border border-zinc-900 space-y-1.5">
                                <div class="flex gap-1.5">
                                    <select id="select-romaneio-${id}" class="bg-zinc-900 border border-zinc-800 text-[11px] text-white p-1 rounded flex-1 outline-none">
                                        <option value="1">1. Conferência de Separação</option>
                                        <option value="2">2. Financeiro e Faturamento</option>
                                        <option value="3">3. Vitrine (Conferência Fotográfica)</option>
                                        <option value="4">4. Grade Comparativa Conf.</option>
                                        <option value="5">5. Grade Financeira Expandida</option>
                                        <option value="6">6. Grade Consolidada Total</option>
                                    </select>
                                    <button onclick="const tipo = document.getElementById('select-romaneio-${id}').value; abrirEditorPedido('${id}'); imprimirRomaneio(parseInt(tipo));" class="bg-[#caa85c] text-black font-bold text-[10px] px-2.5 py-1 rounded hover:brightness-110 uppercase tracking-wider">Imprimir</button>
                                </div>
                            </div>
                            <div class="flex gap-2 pt-2 border-t border-zinc-900">
                                <button onclick="abrirEditorPedido('${id}')" class="flex-1 bg-zinc-800 hover:bg-zinc-700 text-white font-medium py-1 px-2 rounded transition-all text-center">⚙️ Gerenciar / Editar</button>
                                <button onclick="excluirPedido('${id}')" class="bg-red-950/30 hover:bg-red-900/50 text-red-400 border border-red-900/30 py-1 px-2 rounded transition-all">🗑️ Excluir</button>
                            </div>
                        </div>
                    `);
                });

                container.innerHTML = htmlStack.length ? htmlStack.reverse().join('') : '<div class="text-center py-10 text-gray-600 italic col-span-full">Nenhum cliente correspondente.</div>';
                if(badgeCount) badgeCount.innerText = `${count} ${count === 1 ? 'pedido' : 'pedidos'}`;
            }).catch(err => console.error("Erro ao carregar pedidos:", err));
        };

        window.abrirEditorPedido = function(id) {
            window.pedidoEditando = id;
            const p = todosPedidosLocal[id];
            if(!p) return;
            
            document.getElementById('edClienteNome').value = p.nome || p.cliente || '';
            document.getElementById('edClienteTel').value = p.whats || p.telefone || '';
            document.getElementById('edRua').value = p.rua || '';
            document.getElementById('edCidade').value = p.cidade || '';
            document.getElementById('edDescPromo').value = p.descontoPromo || 0;
            document.getElementById('edDescPix').value = p.descontoPix || 0;
            document.getElementById('edFrete').value = p.frete || 0;
            
            renderItensEditor(p.itens || []);
            document.getElementById('editorPedido').classList.remove('hidden');
        };

        function renderItensEditor(itens) {
            const box = document.getElementById('edItens');
            if(!box) return;
            box.innerHTML = '';
            itens.forEach((item, index) => {
                box.innerHTML += `
                    <div class="flex items-center gap-2 bg-black/40 p-2 border border-[#222] rounded-lg">
                        <div class="flex-1 truncate">
                            <div class="text-xs font-bold text-white truncate">${item.nome}</div>
                            <div class="text-[10px] text-gray-500 font-mono">SKU: ${item.sku || 'N/A'} | Preço: ${fMoedaLocal(item.precoFinal || item.price || item.preco)}</div>
                        </div>
                        <div class="flex items-center gap-1 shrink-0">
                            <input type="number" step="0.01" value="${item.precoFinal || item.price || item.preco || 0}" oninput="atualizarItemPreco(${index}, this.value)" class="w-20 bg-black border border-[#333] p-1 rounded text-center text-xs text-white font-mono">
                            <input type="number" value="${item.quantidade || item.qtd || 1}" oninput="atualizarItemQtd(${index}, this.value)" class="w-14 bg-black border border-[#333] p-1 rounded text-center text-xs text-white font-mono">
                            <button onclick="removerItemEditor(${index})" class="text-red-500 font-bold px-2 hover:text-red-400">✕</button>
                        </div>
                    </div>
                `;
            });
            recalcularTotalEd();
        }

        window.atualizarItemPreco = function(index, valor) {
            const p = todosPedidosLocal[window.pedidoEditando];
            if(p && p.itens && p.itens[index]) {
                p.itens[index].precoFinal = parseFloat(valor) || 0;
                p.itens[index].preco = parseFloat(valor) || 0;
                recalcularTotalEd();
            }
        };

        window.atualizarItemQtd = function(index, valor) {
            const p = todosPedidosLocal[window.pedidoEditando];
            if(p && p.itens && p.itens[index]) {
                p.itens[index].quantidade = parseInt(valor) || 0;
                p.itens[index].qtd = parseInt(valor) || 0;
                recalcularTotalEd();
            }
        };

        window.removerItemEditor = function(index) {
            const p = todosPedidosLocal[window.pedidoEditando];
            if(p && p.itens) {
                p.itens.splice(index, 1);
                renderItensEditor(p.itens);
            }
        };

        window.addItemEditor = function() {
            const sku = prompt("Digite o SKU exato do produto:").toUpperCase().trim();
            if(!sku) return;

            db.ref('products/' + sku).once('value', snap => {
                if(!snap.exists()) {
                    alert("❌ SKU não localizado!");
                    return;
                }
                const prod = snap.val();
                const p = todosPedidosLocal[window.pedidoEditando];
                if(!p.itens) p.itens = [];
                
                p.itens.push({
                    sku: sku,
                    nome: prod.name || prod.nome,
                    precoFinal: parseFloat(prod.price || prod.precoFinal || 0),
                    preco: parseFloat(prod.price || prod.precoFinal || 0),
                    quantidade: 1
                });
                renderItensEditor(p.itens);
            });
        };

        window.recalcularTotalEd = function() {
            const p = todosPedidosLocal[window.pedidoEditando];
            if(!p) return;

            let subtotal = 0, totalPecas = 0;
            if(Array.isArray(p.itens)) {
                p.itens.forEach(i => {
                    const precoProd = parseFloat(i.precoFinal || i.price || i.preco || 0);
                    const qtdProd = parseInt(i.quantidade || i.qtd || 0);
                    subtotal += precoProd * qtdProd;
                    totalPecas += qtdProd;
                });
            }
            const descPromo = parseFloat(document.getElementById('edDescPromo').value) || 0;
            const descPix = parseFloat(document.getElementById('edDescPix').value) || 0;
            const frete = parseFloat(document.getElementById('edFrete').value) || 0;

            const totalLiquido = subtotal - descPromo - descPix + frete;
            document.getElementById('totalPreview').innerText = fMoedaLocal(totalLiquido);
            document.getElementById('edQtdTotal').value = totalPecas;
        };

        window.salvarPedidoEditado = function() {
            const idTarget = window.pedidoEditando;
            const p = todosPedidosLocal[idTarget];
            p.nome = document.getElementById('edClienteNome').value.trim();
            p.whats = document.getElementById('edClienteTel').value.trim();
            p.rua = document.getElementById('edRua').value.trim();
            p.cidade = document.getElementById('edCidade').value.trim();
            p.descontoPromo = parseFloat(document.getElementById('edDescPromo').value) || 0;
            p.descontoPix = parseFloat(document.getElementById('edDescPix').value) || 0;
            p.frete = parseFloat(document.getElementById('edFrete').value) || 0;

            let subtotal = 0;
            if(p.itens) p.itens.forEach(i => subtotal += ((i.precoFinal || i.price || i.preco || 0) * (i.quantidade || i.qtd || 0)));
            p.total = subtotal - p.descontoPromo - p.descontoPix + p.frete;

            db.ref('orders/' + idTarget).set(p).then(() => {
                alert("✅ Pedido updated com sucesso!");
                fecharEditorPedido();
                carregarPedidos();
            });
        };

        window.excluirPedido = function(id) {
            if(confirm("🚨 Deseja deletar definitivamente este pedido?")) {
                db.ref('orders/' + id).remove().then(() => {
                    alert("Pedido excluído!");
                    carregarPedidos();
                });
            }
        };

        window.fecharEditorPedido = function() {
            document.getElementById('editorPedido').classList.add('hidden');
            window.pedidoEditando = null;
        };

        window.imprimirRomaneio = function(tipo) {
            const p = todosPedidosLocal[window.pedidoEditando];
            if(!p) return;
            const printArea = document.getElementById('print-area');
            const numPedidoFriendly = window.pedidoEditando.substring(1, 10).toUpperCase();
            let trs = '';
            if (Array.isArray(p.itens)) {
                p.itens.forEach(i => {
                    trs += `
                        <tr style="border-bottom: 1px solid #eee;">
                            <td style="padding:6px;">${i.sku}</td>
                            <td style="padding:6px;">${i.nome}</td>
                            <td style="padding:6px; text-align:center;">${i.quantidade || i.qtd} pçs</td>
                            <td style="padding:6px; text-align:right;">${tipo !== 1 ? fMoedaLocal(i.precoFinal || i.price || i.preco) : ''}</td>
                        </tr>
                    `;
                });
            }

            printArea.innerHTML = `
                <div style="font-family:monospace; color:#000; padding:20px; font-size:12px;">
                    <h2 style="text-align:center;">ABELLA JOIAS — MÓDULO ROMANEIO [${tipo}]</h2>
                    <p><b>Pedido:</b> #${numPedidoFriendly} | <b>Cliente:</b> ${p.nome || p.cliente}</p>
                    <table style="width:100%; border-collapse:collapse; margin-top:15px;">
                        <thead style="background:#f4f4f4;">
                            <tr><th>SKU</th><th>Descrição</th><th>Qtd</th><th>${tipo !== 1 ? 'Preço' : ''}</th></tr>
                        </thead>
                        <tbody>${trs}</tbody>
                    </table>
                    ${tipo !== 1 ? `<p style="text-align:right; font-weight:bold; margin-top:15px;">Total Faturado: ${fMoedaLocal(p.total)}</p>` : ''}
                </div>
            `;
            window.print();
        };

        carregarPedidos();
    })();
</script>
