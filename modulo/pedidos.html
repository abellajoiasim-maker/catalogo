<div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4 mb-6">

    <div>
        <h2 class="text-xl font-black text-white uppercase tracking-tight">
            Módulo de Pedidos Recebidos
        </h2>

        <p class="text-xs text-gray-500">
            Fluxo operacional assíncrono isolado com persistência estável
        </p>
    </div>

    <div
        id="qtd-pedidos"
        class="bg-[#caa85c]/10 border border-[#caa85c]/20 text-[#caa85c] px-3 py-1 rounded-full text-xs font-bold font-mono w-fit"
    >
        Carregando contador...
    </div>

</div>

<div class="mb-5">

    <input
        id="buscaPedido"
        type="text"
        placeholder="🔍 Buscar cliente por nome..."
        class="w-full md:w-96 bg-[#111] border border-[#222] p-3 rounded-xl text-xs text-white focus:border-[#caa85c] outline-none font-medium transition-all"
    >

</div>

<div
    id="listaPedidos"
    class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4"
>
    <div class="col-span-full text-center py-14 text-zinc-600 italic text-xs animate-pulse font-mono">
        Buscando dados ativos na árvore "orders" do Firebase...
    </div>
</div>

<script>
(function () {

    // =========================================================================
    // ESTADO INTERNO CONTROLADO
    // =========================================================================

    const STATE = {

        pedidos: {},

        buscaAtual: '',

        renderTimeout: null,

        listenerAtivo: false

    };

    // =========================================================================
    // HELPERS
    // =========================================================================

    const escapeHTML = (str = '') => {

        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    };

    const formatarMoeda = (valor = 0) => {

        const numero = parseFloat(valor || 0);

        return new Intl.NumberFormat(
            'pt-BR',
            {
                style: 'currency',
                currency: 'BRL'
            }
        ).format(
            isNaN(numero) ? 0 : numero
        );
    };

    const formatarData = (data) => {

        try {

            if (!data) return '';

            const d = new Date(data);

            if (isNaN(d.getTime())) return '';

            return d.toLocaleString('pt-BR');

        } catch {

            return '';
        }
    };

    const obterNumeroPedido = (id = '') => {

        try {

            return String(id)
                .slice(-6)
                .toUpperCase();

        } catch {

            return '------';
        }
    };

    const obterPrecoItem = (item = {}) => {

        const valor = parseFloat(
            item.precoFinal ||
            item.price ||
            item.preco ||
            0
        );

        return isNaN(valor)
            ? 0
            : valor;
    };

    const obterQuantidadeItem = (item = {}) => {

        const qtd = parseInt(
            item.quantidade ||
            item.qtd ||
            1
        );

        return isNaN(qtd)
            ? 1
            : qtd;
    };

    const sanitizarImagem = (url = '') => {

        try {

            if (!url) return '';

            const limpa = String(url).trim();

            if (
                limpa.startsWith('http://') ||
                limpa.startsWith('https://') ||
                limpa.startsWith('data:image/')
            ) {

                return limpa;
            }

            return '';

        } catch {

            return '';
        }
    };

    // =========================================================================
    // RENDERIZAÇÃO PRINCIPAL
    // =========================================================================

    function renderizarPedidos() {

        const container = document.getElementById('listaPedidos');

        const contador = document.getElementById('qtd-pedidos');

        if (!container) return;

        const pedidos = STATE.pedidos || {};

        const ids = Object.keys(pedidos);

        if (!ids.length) {

            container.innerHTML = `
                <div class="col-span-full text-center py-14 text-zinc-600 italic text-xs">
                    Nenhum pedido localizado na base de dados.
                </div>
            `;

            if (contador) {
                contador.innerText = '0 pedidos';
            }

            return;
        }

        const busca = STATE.buscaAtual;

        const html = [];

        let totalVisivel = 0;

        ids
            .sort((a, b) => {

                const pa = pedidos[a] || {};
                const pb = pedidos[b] || {};

                return (
                    new Date(pb.data || 0).getTime() -
                    new Date(pa.data || 0).getTime()
                );
            })
            .forEach(id => {

                const pedido = pedidos[id];

                if (!pedido) return;

                const cliente = escapeHTML(
                    pedido.nome ||
                    pedido.cliente ||
                    'Cliente Oculto'
                );

                if (
                    busca &&
                    !cliente.toLowerCase().includes(busca)
                ) {
                    return;
                }

                totalVisivel++;

                let totalPecas = 0;

                if (Array.isArray(pedido.itens)) {

                    pedido.itens.forEach(item => {

                        totalPecas += obterQuantidadeItem(item);
                    });
                }

                const totalExibivel = formatarMoeda(
                    pedido.total || 0
                );

                html.push(`
                    <div class="bg-[#111] border border-zinc-800 rounded-2xl p-4 flex flex-col justify-between gap-4 hover:border-zinc-700 transition-all">

                        <div class="space-y-2">

                            <div class="flex justify-between items-center text-[11px] text-zinc-500 font-mono">

                                <span class="font-bold text-white">
                                    Pedido #${obterNumeroPedido(id)}
                                </span>

                                <span>
                                    ${formatarData(pedido.data)}
                                </span>

                            </div>

                            <div>

                                <h3 class="text-sm font-black uppercase text-white truncate">
                                    ${cliente}
                                </h3>

                            </div>

                            <div class="space-y-1 text-[11px] text-zinc-400 font-mono">

                                <div>
                                    📱 ${escapeHTML(
                                        pedido.whats ||
                                        pedido.telefone ||
                                        'Não informado'
                                    )}
                                </div>

                                <div>
                                    📦 ${totalPecas} peça(s)
                                </div>

                                <div class="truncate">
                                    📍 ${escapeHTML(
                                        pedido.rua ||
                                        'Retirada / Não informado'
                                    )}
                                </div>

                            </div>

                            <div class="flex justify-between items-center border-t border-zinc-800 pt-3">

                                <span class="text-[10px] uppercase tracking-wider text-zinc-500 font-bold">
                                    Total Líquido
                                </span>

                                <span class="text-[#caa85c] text-sm font-black font-mono">
                                    ${totalExibivel}
                                </span>

                            </div>

                        </div>

                        <div class="space-y-2">

                            <div class="flex gap-2">

                                <select
                                    id="select-romaneio-${id}"
                                    class="flex-1 bg-black border border-zinc-800 rounded-lg px-2 py-2 text-[11px] text-white outline-none"
                                >
                                    <option value="1">1. Conferência</option>
                                    <option value="2">2. Financeiro</option>
                                    <option value="3">3. Vitrine</option>
                                    <option value="4">4. Grade Conf.</option>
                                    <option value="5">5. Financeiro Exp.</option>
                                    <option value="6">6. Consolidado</option>
                                </select>

                                <button
                                    class="bg-[#caa85c] text-black px-3 rounded-lg text-[10px] font-black uppercase tracking-wide hover:brightness-110 transition-all"
                                    onclick="window.abrirImpressaoPedido('${id}')"
                                >
                                    Imprimir
                                </button>

                            </div>

                            <div class="flex gap-2">

                                <button
                                    onclick="window.abrirEditorPedido('${id}')"
                                    class="flex-1 bg-zinc-800 hover:bg-zinc-700 text-white text-xs font-semibold py-2 rounded-lg transition-all"
                                >
                                    ⚙️ Gerenciar
                                </button>

                                <button
                                    onclick="window.confirmarExclusaoPedido('${id}')"
                                    class="bg-red-950/30 border border-red-900/40 hover:bg-red-900/40 text-red-400 px-3 rounded-lg transition-all"
                                >
                                    🗑️
                                </button>

                            </div>

                        </div>

                    </div>
                `);
            });

        container.innerHTML = html.length
            ? html.join('')
            : `
                <div class="col-span-full text-center py-14 text-zinc-600 italic text-xs">
                    Nenhum cliente correspondente.
                </div>
            `;

        if (contador) {

            contador.innerText =
                `${totalVisivel} ${totalVisivel === 1 ? 'pedido' : 'pedidos'}`;
        }
    }

    // =========================================================================
    // BUSCA COM DEBOUNCE
    // =========================================================================

    function configurarBusca() {

        const input = document.getElementById('buscaPedido');

        if (!input) return;

        input.addEventListener('input', function () {

            clearTimeout(STATE.renderTimeout);

            STATE.renderTimeout = setTimeout(() => {

                STATE.buscaAtual =
                    String(input.value || '')
                        .toLowerCase()
                        .trim();

                renderizarPedidos();

            }, 180);
        });
    }

    // =========================================================================
    // FIREBASE LISTENER ÚNICO
    // =========================================================================

    function iniciarListenerPedidos() {

        if (STATE.listenerAtivo) {
            return;
        }

        STATE.listenerAtivo = true;

        const ref = firebase.database().ref('orders');

        const callback = snapshot => {

            try {

                const dados = snapshot.val() || {};

                STATE.pedidos = dados;

                window.todosPedidosLocal = dados;

                renderizarPedidos();

            } catch (erro) {

                console.error(
                    '❌ Falha ao renderizar pedidos:',
                    erro
                );
            }
        };

        ref.on('value', callback);

        if (
            window.APP_STATE &&
            typeof window.APP_STATE === 'object'
        ) {

            window.APP_STATE.listeners =
                window.APP_STATE.listeners || {};

            window.APP_STATE.listeners.pedidos = {
                ref,
                callback
            };
        }
    }

    // =========================================================================
    // IMPRESSÃO SEGURA
    // =========================================================================

    window.abrirImpressaoPedido = function (id) {

        try {

            if (!id) return;

            const pedido =
                window.todosPedidosLocal?.[id];

            if (!pedido) {

                alert('Pedido não encontrado.');

                return;
            }

            window.pedidoEditando = id;

            const select =
                document.getElementById(
                    `select-romaneio-${id}`
                );

            const tipo = parseInt(
                select?.value || 1
            );

            if (
                typeof window.imprimirRomaneio ===
                'function'
            ) {

                window.imprimirRomaneio(tipo);
            }

        } catch (e) {

            console.error(e);

            alert(
                'Falha ao abrir impressão.'
            );
        }
    };

    // =========================================================================
    // EXCLUSÃO SEGURA
    // =========================================================================

    window.confirmarExclusaoPedido = async function (id) {

        try {

            if (!id) return;

            const confirmar = confirm(
                'Deseja realmente excluir este pedido?'
            );

            if (!confirmar) return;

            await firebase
                .database()
                .ref(`orders/${id}`)
                .remove();

        } catch (e) {

            console.error(e);

            alert(
                'Falha ao excluir pedido.'
            );
        }
    };

    // =========================================================================
    // ADD ITEM SEGURO
    // =========================================================================

    window.addItemEditor = async function () {

        try {

            const entrada = prompt(
                'Digite o SKU exato do produto:'
            );

            if (!entrada) return;

            const sku = entrada
                .toUpperCase()
                .trim();

            if (!sku) return;

            const snap = await firebase
                .database()
                .ref(`products/${sku}`)
                .once('value');

            if (!snap.exists()) {

                alert('SKU não localizado.');

                return;
            }

            const produto = snap.val();

            const pedido =
                window.todosPedidosLocal?.[
                    window.pedidoEditando
                ];

            if (!pedido) {

                alert('Pedido inválido.');

                return;
            }

            if (!Array.isArray(pedido.itens)) {
                pedido.itens = [];
            }

            const preco = obterPrecoItem(produto);

            pedido.itens.push({

                sku,

                nome:
                    produto.name ||
                    produto.nome ||
                    'Produto sem nome',

                precoFinal: preco,

                preco: preco,

                quantidade: 1
            });

            if (
                typeof window.renderItensEditor ===
                'function'
            ) {

                window.renderItensEditor(
                    pedido.itens
                );
            }

        } catch (e) {

            console.error(e);

            alert(
                'Erro ao adicionar item.'
            );
        }
    };

    // =========================================================================
    // BOOTSTRAP
    // =========================================================================

    configurarBusca();

    iniciarListenerPedidos();

    if (
        window.todosPedidosLocal &&
        Object.keys(window.todosPedidosLocal).length
    ) {

        STATE.pedidos =
            window.todosPedidosLocal;

        renderizarPedidos();
    }

})();
</script>
