<div class="p-6 max-w-5xl mx-auto space-y-6 animate-fade-in">
    <div class="flex items-center justify-between border-b border-gray-100 pb-4">
        <div>
            <h1 class="text-2xl font-bold text-gray-800 flex items-center gap-2">
                <span>⚙️</span> Configurações do Sistema
            </h1>
            <p class="text-sm text-gray-500 mt-1">Controle operacional, regras de negócio e identidade visual do catálogo em tempo real.</p>
        </div>
        <div class="flex flex-col items-end gap-1">
            <button id="btnSalvarConfig" onclick="window.salvarConfiguracoes()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-6 py-2.5 rounded-xl shadow-sm transition-all flex items-center gap-2">
                <span>💾</span> Salvar Alterações
            </button>
            <span id="cfgUltimaAtualizacao" class="text-[10px] text-gray-400 font-mono"></span>
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        
        <div class="bg-white rounded-2xl border border-gray-200 p-6 shadow-xs space-y-4">
            <h2 class="text-lg font-semibold text-gray-700 flex items-center gap-2 border-b border-gray-50 pb-2">
                🏢 Dados da Empresa
            </h2>
            
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Nome da Loja</label>
                <input type="text" id="cfgNome" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-gray-800 font-medium focus:ring-2 focus:ring-emerald-500 focus:bg-white outline-none transition-all">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Slogan / Descrição Curta</label>
                <input type="text" id="cfgSlogan" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-gray-800 focus:ring-2 focus:ring-emerald-500 focus:bg-white outline-none transition-all">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">WhatsApp de Recebimento</label>
                <input type="number" id="cfgWhatsapp" placeholder="Ex: 19999999999" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-gray-800 font-mono focus:ring-2 focus:ring-emerald-500 focus:bg-white outline-none transition-all">
            </div>
        </div>

        <div class="bg-white rounded-2xl border border-gray-200 p-6 shadow-xs space-y-4">
            <h2 class="text-lg font-semibold text-gray-700 flex items-center gap-2 border-b border-gray-50 pb-2">
                💳 Condições de Pagamento
            </h2>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Desconto Pix (%)</label>
                    <div class="relative">
                        <input type="number" id="cfgDescPix" min="0" max="100" class="w-full bg-gray-50 border border-gray-200 rounded-xl pl-4 pr-8 py-2.5 text-gray-800 font-mono focus:ring-2 focus:ring-emerald-500 focus:bg-white outline-none transition-all">
                        <span class="absolute right-3 top-3 text-gray-400 font-medium">%</span>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Parcelas no Cartão</label>
                    <input type="number" id="cfgParcelas" min="1" max="24" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-gray-800 font-mono focus:ring-2 focus:ring-emerald-500 focus:bg-white outline-none transition-all">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Pedido Mínimo (R$ Atacado)</label>
                <div class="relative">
                    <span class="absolute left-3 top-3 text-gray-400 text-sm font-medium">R$</span>
                    <input type="number" id="cfgValorMinimo" step="0.01" class="w-full bg-gray-50 border border-gray-200 rounded-xl pl-9 pr-4 py-2.5 text-gray-800 font-mono focus:ring-2 focus:ring-emerald-500 focus:bg-white outline-none transition-all">
                </div>
            </div>
        </div>

        <div class="bg-white rounded-2xl border border-gray-200 p-6 shadow-xs space-y-4">
            <h2 class="text-lg font-semibold text-gray-700 flex items-center gap-2 border-b border-gray-50 pb-2">
                🚚 Logística e Envios
            </h2>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Frete Fixo Padrão</label>
                    <div class="relative">
                        <span class="absolute left-3 top-3 text-gray-400 text-sm font-medium">R$</span>
                        <input type="number" id="cfgFreteFixo" step="0.01" class="w-full bg-gray-50 border border-gray-200 rounded-xl pl-9 pr-4 py-2.5 text-gray-800 font-mono focus:ring-2 focus:ring-emerald-500 focus:bg-white outline-none transition-all">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Meta Frete Grátis</label>
                    <div class="relative">
                        <span class="absolute left-3 top-3 text-gray-400 text-sm font-medium">R$</span>
                        <input type="number" id="cfgFreteGratisAlvo" step="0.01" class="w-full bg-gray-50 border border-gray-200 rounded-xl pl-9 pr-4 py-2.5 text-gray-800 font-mono focus:ring-2 focus:ring-emerald-500 focus:bg-white outline-none transition-all">
                    </div>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-2xl border border-gray-200 p-6 shadow-xs space-y-4">
            <h2 class="text-lg font-semibold text-gray-700 flex items-center gap-2 border-b border-gray-50 pb-2">
                🏪 Status do Catálogo
            </h2>
            
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Disponibilidade do Sistema</label>
                <select id="cfgStatusLoja" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-gray-800 font-medium focus:ring-2 focus:ring-emerald-500 focus:bg-white outline-none transition-all">
                    <option value="aberto">🟢 Catálogo Ativo (Recebendo Pedidos)</option>
                    <option value="manutencao">🟡 Modo Manutenção (Apenas Catálogo Visual)</option>
                    <option value="fechado">🔴 Loja Fechada / Férias (Bloqueia Carrinho)</option>
                </select>
            </div>
        </div>

    </div>

    <div class="bg-white rounded-2xl border border-gray-200 p-6 shadow-xs space-y-4">
        <div class="flex items-center justify-between border-b border-gray-50 pb-2">
            <h2 class="text-lg font-semibold text-gray-700 flex items-center gap-2">
                📢 Tarja de Avisos (Topo do Catálogo)
            </h2>
            <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" id="cfgAtivarAviso" class="sr-only peer">
                <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emerald-500"></div>
                <span class="ml-2 text-xs font-bold text-gray-500 uppercase">Exibir Barra</span>
            </label>
        </div>

        <div>
            <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Texto do Alerta Geral</label>
            <input type="text" id="cfgTextoAviso" placeholder="Ex: ✨ Frete grátis para galvânicas de Limeira nas compras acima de R$100! ✨" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-gray-800 focus:ring-2 focus:ring-emerald-500 focus:bg-white outline-none transition-all">
        </div>
    </div>
</div>

<script>
    // Vincula explicitamente as funções principais ao objeto global window para não sumirem no escopo da aplicação
    window.buscarConfiguracoesFirebase = function() {
        var database = window.db || (typeof db !== "undefined" ? db : null);
        if (!database) {
            console.error("Erro: Banco de dados (db) não localizado no escopo.");
            return;
        }

        database.ref('abella/settings').once('value').then((snapshot) => {
            const config = snapshot.val() || {};

            // Verificação de segurança preventiva para garantir que os inputs existam na tela antes de preencher
            if (document.getElementById('cfgNome')) document.getElementById('cfgNome').value = config.name || '';
            if (document.getElementById('cfgSlogan')) document.getElementById('cfgSlogan').value = config.slogan || '';
            if (document.getElementById('cfgWhatsapp')) document.getElementById('cfgWhatsapp').value = config.whatsapp || '';
            if (document.getElementById('cfgDescPix')) document.getElementById('cfgDescPix').value = config.pix !== undefined ? config.pix : 5;
            if (document.getElementById('cfgParcelas')) document.getElementById('cfgParcelas').value = config.parcelas || 6;
            if (document.getElementById('cfgValorMinimo')) document.getElementById('cfgValorMinimo').value = config.pedidoMinimo || 0;
            if (document.getElementById('cfgFreteFixo')) document.getElementById('cfgFreteFixo').value = config.freteFixo || 0;
            if (document.getElementById('cfgFreteGratisAlvo')) document.getElementById('cfgFreteGratisAlvo').value = config.freteGratisAlvo || 0;
            if (document.getElementById('cfgStatusLoja')) document.getElementById('cfgStatusLoja').value = config.statusLoja || 'aberto';
            if (document.getElementById('cfgTextoAviso')) document.getElementById('cfgTextoAviso').value = config.bannerTexto || '';
            if (document.getElementById('cfgAtivarAviso')) document.getElementById('cfgAtivarAviso').checked = !!config.bannerAtivo;

            if (config.ultimaAtualizacao && document.getElementById('cfgUltimaAtualizacao')) {
                document.getElementById('cfgUltimaAtualizacao').innerText = `Última alteração: ${config.ultimaAtualizacao}`;
            }
        }).catch(erro => console.error("Erro ao carregar configurações:", erro));
    };

    window.salvarConfiguracoes = function() {
        const btn = document.getElementById('btnSalvarConfig');
        if (btn) {
            btn.disabled = true;
            btn.innerText = "⏳ Salvando...";
        }

        const dataHoraAtual = new Date().toLocaleString('pt-BR');

        // Captura e higieniza com segurança todos os valores preenchidos na tela
        const dadosNovos = {
            name: document.getElementById('cfgNome') ? document.getElementById('cfgNome').value.trim() : "",
            slogan: document.getElementById('cfgSlogan') ? document.getElementById('cfgSlogan').value.trim() : "",
            whatsapp: document.getElementById('cfgWhatsapp') ? document.getElementById('cfgWhatsapp').value.trim() : "",
            pix: document.getElementById('cfgDescPix') ? (parseFloat(document.getElementById('cfgDescPix').value) || 0) : 5,
            parcelas: document.getElementById('cfgParcelas') ? (parseInt(document.getElementById('cfgParcelas').value) || 1) : 6,
            pedidoMinimo: document.getElementById('cfgValorMinimo') ? (parseFloat(document.getElementById('cfgValorMinimo').value) || 0) : 0,
            freteFixo: document.getElementById('cfgFreteFixo') ? (parseFloat(document.getElementById('cfgFreteFixo').value) || 0) : 0,
            freteGratisAlvo: document.getElementById('cfgFreteGratisAlvo') ? (parseFloat(document.getElementById('cfgFreteGratisAlvo').value) || 0) : 0,
            statusLoja: document.getElementById('cfgStatusLoja') ? document.getElementById('cfgStatusLoja').value : "aberto",
            bannerTexto: document.getElementById('cfgTextoAviso') ? document.getElementById('cfgTextoAviso').value.trim() : "",
            bannerAtivo: document.getElementById('cfgAtivarAviso') ? document.getElementById('cfgAtivarAviso').checked : false,
            ultimaAtualizacao: dataHoraAtual
        };

        var database = window.db || (typeof db !== "undefined" ? db : null);
        if (!database) {
            alert("❌ Erro: Conexão com o Firebase não encontrada.");
            if (btn) {
                btn.disabled = false;
                btn.innerHTML = "<span>💾</span> Salvar Alterações";
            }
            return;
        }

        // Salva diretamente na rota correta consumida pelo catálogo público
        database.ref('abella/settings').update(dadosNovos)
            .then(() => {
                if (document.getElementById('cfgUltimaAtualizacao')) {
                    document.getElementById('cfgUltimaAtualizacao').innerText = `Última alteração: ${dataHoraAtual}`;
                }
                alert("✅ Configurações salvas e aplicadas ao catálogo público com sucesso!");
            })
            .catch(erro => {
                alert("❌ Erro ao salvar configurações.");
                console.error(erro);
            })
            .finally(() => {
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = "<span>💾</span> Salvar Alterações";
                }
            });
    };

    // Inicialização protegida por temporizador para aguardar a montagem dos inputs na árvore do HTML
    setTimeout(function() {
        if (typeof db !== "undefined" || typeof window.db !== "undefined") {
            window.buscarConfiguracoesFirebase();
        } else {
            console.warn("Aguardando carregamento da instância global do banco de dados...");
            // Segunda tentativa de contingência em 1 segundo
            setTimeout(function() {
                if (typeof db !== "undefined" || typeof window.db !== "undefined") {
                    window.buscarConfiguracoesFirebase();
                } else {
                    console.error("Erro crítico: Variável de banco de dados indetectável.");
                }
            }, 1000);
        }
    }, 100);
</script>
