<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Migração de Banco | Abella Joias</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            background: #050505;
            color: #fff;
            font-family: 'Inter', sans-serif;
        }
        .font-title {
            font-family: 'Cinzel', serif;
        }
    </style>
</head>

<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto">

        <div class="bg-[#111111] border border-[#222222] rounded-2xl p-6 md:p-8 shadow-2xl">

            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8 pb-6 border-b border-[#222222]">
                <div>
                    <h1 class="text-2xl md:text-3xl font-bold font-title tracking-wide text-[#caa85c]">
                        Migração de Banco de Dados
                    </h1>
                    <p class="text-gray-400 text-sm mt-1">
                        Painel de manutenção, normalização e backup da estrutura Firebase.
                    </p>
                </div>
                <a href="config.html" class="inline-flex items-center justify-center px-5 py-2 bg-[#1f1f1f] hover:bg-[#2a2a2a] text-sm font-medium text-gray-200 rounded-xl transition">
                    Voltar para Configurações
                </a>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
                <button onclick="executarBackup()" class="bg-amber-600/20 border border-amber-600/40 hover:bg-amber-600/30 text-amber-300 font-medium rounded-xl p-4 transition text-center flex flex-col items-center justify-center gap-2">
                    <span class="text-xl">📦</span> Gerar Backup JSON
                </button>

                <button onclick="migrarProdutos()" class="bg-blue-600/20 border border-blue-600/40 hover:bg-blue-600/30 text-blue-300 font-medium rounded-xl p-4 transition text-center flex flex-col items-center justify-center gap-2">
                    <span class="text-xl">💎</span> Migrar Produtos
                </button>

                <button onclick="migrarPedidos()" class="bg-green-600/20 border border-green-600/40 hover:bg-green-600/30 text-green-300 font-medium rounded-xl p-4 transition text-center flex flex-col items-center justify-center gap-2">
                    <span class="text-xl">📋</span> Migrar Pedidos
                </button>

                <button onclick="validarBanco()" class="bg-purple-600/20 border border-purple-600/40 hover:bg-purple-700/30 text-purple-300 font-medium rounded-xl p-4 transition text-center flex flex-col items-center justify-center gap-2">
                    <span class="text-xl">🔍</span> Validar Estrutura
                </button>
            </div>

            <button onclick="executarTudo()" class="w-full bg-gradient-to-r from-red-700 to-red-600 hover:from-red-600 hover:to-red-500 text-white font-bold tracking-wider rounded-xl p-5 mb-8 transition shadow-lg shadow-red-900/20 uppercase text-sm">
                🚀 EXECUTAR ROTINA DE MIGRAÇÃO COMPLETA
            </button>

            <div class="mb-6 bg-[#161616] border border-[#222222] rounded-xl p-4">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs font-semibold uppercase tracking-wider text-gray-400">Status do Processo</span>
                    <span id="percentual-texto" class="text-xs font-bold text-[#caa85c]">0%</span>
                </div>
                <div class="bg-[#222222] h-3 rounded-full overflow-hidden">
                    <div id="barra" class="bg-gradient-to-r from-[#caa85c] to-[#e5c47b] h-3 w-0 transition-all duration-500 rounded-full"></div>
                </div>
                <p id="status" class="text-sm text-gray-300 mt-2 flex items-center gap-2">
                    <span class="inline-block w-2 h-2 rounded-full bg-gray-500 animate-pulse"></span> Aguardando comando...
                </p>
            </div>

            <div class="flex items-center justify-between mb-2 px-1">
                <span class="text-xs font-semibold uppercase tracking-wider text-gray-400">Console de Saída (Log)</span>
                <button onclick="document.getElementById('log').innerHTML=''" class="text-xs text-gray-500 hover:text-gray-300 transition">Limpar Log</button>
            </div>
            <div id="log" class="bg-[#090909] border border-[#222222] text-green-400 rounded-xl p-4 h-[400px] overflow-y-auto font-mono text-xs leading-relaxed shadow-inner"></div>

        </div>
    </div>

    <script>
        // Configuração Firebase Abella Joias
        const firebaseConfig = {
            apiKey: "AIzaSyDPBZSxW8XjtQmDMUknzAyIlFda51MvMJY",
            authDomain: "catalogo-abella-joias.firebaseapp.com",
            databaseURL: "https://catalogo-abella-joias-default-rtdb.firebaseio.com",
            projectId: "catalogo-abella-joias",
            storageBucket: "catalogo-abella-joias.firebasestorage.app",
            messagingSenderId: "727568435294",
            appId: "1:727568435294:web:442c0179ecf0686dff4ccf"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const db = firebase.database();
        let executando = false;

        function log(msg) {
            const el = document.getElementById("log");
            const dataHora = new Date().toLocaleTimeString('pt-BR');
            el.innerHTML += `<span class="text-gray-600">[${dataHora}]</span> ${msg}<br>`;
            el.scrollTop = el.scrollHeight;
        }

        function progresso(percentual, texto) {
            document.getElementById("barra").style.width = percentual + "%";
            document.getElementById("percentual-texto").innerText = percentual + "%";
            document.getElementById("status").innerHTML = `<span class="inline-block w-2 h-2 rounded-full bg-[#caa85c] animate-pulse"></span> ${texto}`;
        }

        async function executarBackup() {
            log("📦 Buscando dados para backup...");
            try {
                const snap = await db.ref("abella").once("value");
                if (!snap.exists()) {
                    log("⚠ Nenhum dado encontrado sob o nó 'abella' para fazer backup.");
                    return false;
                }
                
                log("📦 Gerando arquivo JSON...");
                const dataStr = JSON.stringify(snap.val(), null, 2);
                const blob = new Blob([dataStr], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                
                const a = document.createElement("a");
                a.href = url;
                a.download = `backup-abella-${Date.now()}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                log("✅ Backup baixado com sucesso!");
                return true;
            } catch (error) {
                log(`❌ Erro no Backup: ${error.message}`);
                throw error;
            }
        }

        async function migrarProdutos() {
            log("💎 Iniciando mapeamento de produtos...");
            const snap = await db.ref("abella/products").once("value");
            
            if (!snap.exists()) {
                log("⚠ Nenhum produto localizado para migração.");
                return;
            }

            const updates = {};
            let total = 0;

            snap.forEach(item => {
                const p = item.val();

                // Usamos caminhos profundos (ex: "ID_PRODUTO/propriedade") para não apagar outros campos ocultos/extras
                updates[`${item.key}/sku`] = p.sku || "";
                updates[`${item.key}/name`] = p.name || p.nome || "";
                updates[`${item.key}/category`] = p.category || p.categoria || "";
                updates[`${item.key}/subcategory`] = p.subcategory || p.subcategoria || "";
                updates[`${item.key}/image`] = p.image || p.imagem || "";
                updates[`${item.key}/price`] = Number(p.price ?? p.preco ?? p.precoFinal ?? 0);
                updates[`${item.key}/weight`] = Number(p.weight ?? p.peso ?? 0);
                updates[`${item.key}/active`] = p.active !== false;
                updates[`${item.key}/migratedAt`] = firebase.database.ServerValue.TIMESTAMP;

                total++;
            });

            if (total > 0) {
                log(`🔄 Gravando alterações de ${total} produtos de forma segura...`);
                await db.ref("abella/products").update(updates);
                log(`✅ ${total} produtos normalizados e atualizados com sucesso.`);
            }
        }

        async function migrarPedidos() {
            log("📋 Iniciando mapeamento de pedidos...");
            const snap = await db.ref("abella/orders").once("value");

            if (!snap.exists()) {
                log("⚠ Nenhum pedido localizado para migração.");
                return;
            }

            const updates = {};
            let total = 0;

            snap.forEach(item => {
                const p = item.val();

                // Proteção de caminhos específicos para os pedidos
                updates[`${item.key}/cliente`] = p.cliente || p.nome || "";
                updates[`${item.key}/whats`] = p.whats || p.contato || "";
                updates[`${item.key}/cidade`] = p.cidade || "";
                updates[`${item.key}/formaPagamento`] = p.formaPagamento || p.metodo || "";
                updates[`${item.key}/total`] = Number(p.total || 0);
                updates[`${item.key}/pesoTotal`] = Number(p.pesoTotal || 0);
                updates[`${item.key}/totalPecas`] = Number(p.totalPecas || 0);
                updates[`${item.key}/status`] = p.status || "Novo";
                updates[`${item.key}/criadoEm`] = p.criadoEm || Date.now();
                updates[`${item.key}/itens`] = p.itens || p.produtos || [];
                updates[`${item.key}/migratedAt`] = firebase.database.ServerValue.TIMESTAMP;

                total++;
            });

            if (total > 0) {
                log(`🔄 Gravando alterações de ${total} pedidos de forma segura...`);
                await db.ref("abella/orders").update(updates);
                log(`✅ ${total} pedidos normalizados e atualizados com sucesso.`);
            }
        }

        async function validarBanco() {
            log("🔍 Executando varredura de consistência...");
            const problemas = [];

            const produtos = await db.ref("abella/products").once("value");
            produtos.forEach(item => {
                const p = item.val();
                if (p.nome) problemas.push(`Produto [${item.key}]: ainda possui chave legado 'nome'`);
                if (p.imagem) problemas.push(`Produto [${item.key}]: ainda possui chave legado 'imagem'`);
                if (p.precoFinal) problemas.push(`Produto [${item.key}]: ainda possui chave legado 'precoFinal'`);
                if (p.peso) problemas.push(`Produto [${item.key}]: ainda possui chave legado 'peso'`);
            });

            const pedidos = await db.ref("abella/orders").once("value");
            pedidos.forEach(item => {
                const p = item.val();
                if (p.nome) problemas.push(`Pedido [${item.key}]: ainda possui chave legado 'nome'`);
                if (p.contato) problemas.push(`Pedido [${item.key}]: ainda possui chave legado 'contato'`);
                if (p.produtos) problemas.push(`Pedido [${item.key}]: ainda possui chave legado 'produtos'`);
            });

            if (problemas.length === 0) {
                log("💚 Sucesso: Banco de dados 100% limpo e padronizado!");
            } else {
                log(`⚠ Encontrados ${problemas.length} alertas estruturais estruturais (pistas de chaves antigas duplicadas):`);
                // Limita exibição no log para não travar a tela caso existam milhares
                problemas.slice(0, 50).forEach(p => log(`   👉 ${p}`));
                if (problemas.length > 50) log(`...e mais ${problemas.length - 50} itens.`);
            }
        }

        async function executarTudo() {
            if (executando) return;

            const confirmar = confirm("🚨 ATENÇÃO: Deseja iniciar a rotina completa de migração? Um backup será gerado automaticamente antes do procedimento.");
            if (!confirmar) return;

            executando = true;
            document.querySelectorAll("button").forEach(b => b.disabled = true);

            try {
                progresso(10, "Criando backup de segurança...");
                await executarBackup();
                
                // Pequeno delay para garantir que a janela de download do navegador não congele a UI
                await new Promise(r => setTimeout(r, 1200));

                progresso(40, "Executando migração estrutural dos produtos...");
                await migrarProdutos();

                progresso(70, "Executando migração estrutural dos pedidos...");
                await migrarPedidos();

                progresso(90, "Auditando integridade das tabelas...");
                await validarBanco();

                progresso(100, "Concluído!");
                log("🎉 CRONOGRAMA DE MIGRAÇÃO FINALIZADO COM SUCESSO!");
            }
            catch (err) {
                console.error(err);
                progresso(document.getElementById("barra").style.width || 0, "Erro crítico encontrado!");
                log(`❌ ERRO NO PROCESSO: ${err.message}`);
            }
            finally {
                executando = false;
                document.querySelectorAll("button").forEach(b => b.disabled = false);
            }
        }
    </script>
</body>
</html>
