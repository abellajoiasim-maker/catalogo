<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Super Editor V7 • Gestão Avançada</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>

  <!-- Dependências do Catálogo (Garantem que o ImageHelper oficial funcione aqui também) -->
  <script src="../js/firebase/firebase-config.js"></script>
  <script src="../js/utils/image-helper.js"></script>

  <style>
    .input-dark {
      background-color: rgb(24 24 27);
      border: 1px solid rgb(39 39 42);
      color: white;
      border-radius: 0.5rem;
      padding: 0.75rem;
      width: 100%;
      margin-bottom: 0.5rem;
      font-size: 0.875rem;
    }
    .input-dark:focus { outline: none; border-color: #caa85c; }
    .tab-btn.active {
      background: #caa85c;
      color: black;
      font-weight: 700;
      border-radius: 0.75rem;
      padding: 0.5rem 1rem;
      font-size: 0.75rem;
    }
    .tab-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      color: white;
      border-radius: 0.75rem;
      padding: 0.5rem 1rem;
      font-size: 0.75rem;
      cursor: pointer;
    }
    .tab-btn:hover { background: rgba(255,255,255,0.10); }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
  </style>
</head>

<body class="bg-black text-white">
  <div class="max-w-7xl mx-auto p-4">

    <!-- HEADER -->
    <header class="bg-zinc-950 border border-zinc-900 rounded-2xl p-5 mb-4">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
        <div>
          <h1 class="text-2xl font-bold text-[#caa85c]">Super Editor V7</h1>
          <p class="text-xs text-zinc-500">Controle Total • Criação, Edição e Imagens Sincronizadas em Espelho</p>
        </div>
        <div class="flex flex-wrap gap-2 w-full sm:w-auto">
          <button id="btnCriarNovo" onclick="abrirCriacaoPorAba()"
                  class="px-4 py-2 bg-[#caa85c] text-black rounded-xl text-xs font-bold hover:bg-opacity-90 transition-all">
            ➕ Criar Item
          </button>
          <button id="btnRefresh"
                  class="px-4 py-2 bg-zinc-900 border border-zinc-800 text-zinc-300 rounded-xl text-xs font-bold hover:bg-zinc-800 transition-all">
            🔄 Sincronizar Vitrine
          </button>
        </div>
      </div>
    </header>

    <!-- ESTATÍSTICAS -->
    <section class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5">
      <div class="bg-zinc-950 border border-zinc-900 rounded-xl p-4">
        <div class="text-zinc-500 text-[10px] uppercase tracking-wider mb-1">Produtos</div>
        <div id="statProdutos" class="text-2xl font-bold">0</div>
      </div>
      <div class="bg-zinc-950 border border-zinc-900 rounded-xl p-4">
        <div class="text-zinc-500 text-[10px] uppercase tracking-wider mb-1">Categorias</div>
        <div id="statCategorias" class="text-2xl font-bold">0</div>
      </div>
      <div class="bg-zinc-950 border border-zinc-900 rounded-xl p-4">
        <div class="text-zinc-500 text-[10px] uppercase tracking-wider mb-1">Subcategorias</div>
        <div id="statSubs" class="text-2xl font-bold">0</div>
      </div>
      <div class="bg-zinc-950 border border-zinc-900 rounded-xl p-4">
        <div class="text-zinc-500 text-[10px] uppercase tracking-wider mb-1">Pausados</div>
        <div id="statPausados" class="text-2xl font-bold">0</div>
      </div>
    </section>

    <!-- FILTROS -->
    <section class="bg-zinc-950 border border-zinc-900 rounded-xl p-4 mb-4">
      <div class="grid md:grid-cols-5 gap-3">
        <input id="buscaGlobal" type="text"
               class="w-full md:col-span-2 bg-zinc-900 border border-zinc-800 rounded-lg p-3 text-sm focus:outline-none focus:border-zinc-600"
               placeholder="Buscar SKU, Nome, Categoria..." />
        <select id="filtroTipo" class="bg-zinc-900 border border-zinc-800 rounded-lg p-3 text-sm focus:outline-none">
          <option value="todos">Todos</option>
          <option value="produto">Produtos</option>
          <option value="categoria">Categorias</option>
          <option value="subcategoria">Subcategorias</option>
        </select>
        <select id="filtroCategoria" class="bg-zinc-900 border border-zinc-800 rounded-lg p-3 text-sm focus:outline-none">
          <option value="">Todas Categorias</option>
        </select>
        <select id="filtroSubcategoria" class="bg-zinc-900 border border-zinc-800 rounded-lg p-3 text-sm focus:outline-none">
          <option value="">Todas Subcategorias</option>
        </select>
      </div>
    </section>

    <!-- ABAS -->
    <section class="flex gap-2 mb-4">
      <button class="tab-btn active" data-tab="produtos" type="button">📦 Produtos</button>
      <button class="tab-btn" data-tab="categorias" type="button">📁 Categorias</button>
      <button class="tab-btn" data-tab="subcategorias" type="button">🌿 Subcategorias</button>
    </section>
    
    <!-- CONTEÚDO DAS ABAS -->
    <section>
      <div id="tab-produtos" class="grid grid-cols-1 gap-3"></div>
      <div id="tab-categorias" class="hidden grid grid-cols-1 gap-3"></div>
      <div id="tab-subcategorias" class="hidden grid grid-cols-1 gap-3"></div>
    </section>

    <div id="status" class="text-xs text-zinc-500 mt-6"></div>
  </div>

  <!-- DRAWER LATERAL -->
  <div id="drawer"
       class="fixed top-0 right-0 h-full w-full sm:w-[540px] bg-zinc-950 border-l border-zinc-800 hidden z-50 overflow-y-auto shadow-2xl">
    <div class="p-5">
      <div class="flex justify-between items-center mb-5 sticky top-0 bg-zinc-950 pb-3 border-b border-zinc-900 z-10">
        <h2 id="drawerTitle" class="text-lg font-bold text-[#caa85c]">Editor</h2>
        <button type="button" onclick="fecharDrawer()"
                class="text-zinc-400 hover:text-white bg-zinc-900 border border-zinc-800 px-3 py-1.5 rounded-lg text-xs font-bold transition-colors">
          ✕ Fechar
        </button>
      </div>
      <div id="drawerContent"></div>
    </div>
  </div>

  <script>
  // ============================================================
  // UTILITÁRIOS GLOBAIS E CONFIGURAÇÃO
  // ============================================================
  function resolverDB() {
    if (window.db) return window.db;
    if (window.firebase && window.firebase.apps && window.firebase.apps.length > 0)
      return window.firebase.database();
    return null;
  }

  const statusEl = document.getElementById('status');

  const STATE = {
    db: null,
    produtos: [],
    categorias: {},
    buscaDebounceTimer: null
  };

  const CONFIG = {
    debounceBusca: 200,
    firebaseRetries: 30,
    firebaseRetryDelay: 100
  };

  // Camada de compatibilidade de campos do banco
  const DataService = {
    getSubcategory(obj) { return obj?.subcategory ?? obj?.subCategory ?? ''; },
    getImage(obj)       { return obj?.imagem ?? obj?.image ?? obj?.img ?? ''; },
    getPrice(obj)       { return Number(obj?.preco ?? obj?.price ?? 0); },
    getWeight(obj)      { return Number(obj?.peso ?? obj?.weight ?? 0); },
    getDesc(obj)        { return obj?.description ?? obj?.descricao ?? ''; },
    getDizeres(obj)     { return Array.isArray(obj?.dizeres) ? obj.dizeres : (Array.isArray(obj?.sayings) ? obj.sayings : []); },
    getIniciais(obj)    { return Array.isArray(obj?.iniciais) ? obj.iniciais : (Array.isArray(obj?.initials) ? obj.initials : []); }
  };

  function setStatus(msg, type = 'info') {
    const color = type === 'error' ? 'text-red-400' : type === 'ok' ? 'text-green-400' : 'text-zinc-500';
    statusEl.className = `text-xs mt-6 ${color}`;
    statusEl.textContent = msg;
  }

  function escapeHtml(str) {
    return String(str ?? '')
      .replaceAll('&', '&amp;').replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;');
  }

  function escapeAttr(str) {
    return String(str ?? '').replaceAll("'", "\\'").replaceAll('"', '&quot;');
  }

  function gerarSlug(texto) {
    return texto.toString().toLowerCase().trim()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9 -]/g, '')
      .replace(/\s+/g, '-')
      .replace(/-+/g, '-');
  }

  // Fallback seguro caso o ImageHelper externo falhe em carregar por um triz
  function tratarConversaoImagem(url) {
    if (window.ImageHelper && typeof window.ImageHelper.converterGsUrl === 'function') {
      return window.ImageHelper.converterGsUrl(url);
    }
    return url; 
  }

  function tratarInputImagem(inputElement, previewId) {
    if (!inputElement) return;
    let valor = inputElement.value.trim();
    const preview = document.getElementById(previewId);
    if (preview) { 
      preview.src = tratarConversaoImagem(valor); 
      preview.style.opacity = '1'; 
    }
  }

  function handleImageError(img) {
    img.style.opacity = '0';
    const fallback = img.parentNode?.querySelector('.fallback-container');
    if (fallback) fallback.style.display = 'flex';
  }

  // ============================================================
  // RENDERIZAÇÃO DE ABAS (Unificada sem Duplicações)
  // ============================================================
  function getActiveTab() {
    return document.querySelector('.tab-btn.active')?.dataset?.tab || 'produtos';
  }

 function renderCurrentTab() {
    const t = getActiveTab();
    const btn = document.getElementById('btnCriarNovo');
    if (btn) {
        btn.style.display = 'block';
        if (t === 'produtos')           btn.innerText = '➕ Novo Produto';
        else if (t === 'categorias')    btn.innerText = '➕ Nova Categoria';
        else if (t === 'subcategorias') btn.innerText = '➕ Nova Subcategoria';
    }

    if (t === 'produtos')           renderProdutos();
    else if (t === 'categorias')    renderCategorias();
    else if (t === 'subcategorias') renderSubcategorias();
}
  function renderAll() {
    atualizarEstatisticas();
    renderCurrentTab();
  }


  // ============================================================
  // DRAWER
  // ============================================================
  function abrirDrawer(titulo, html) {
    document.getElementById('drawerTitle').textContent = titulo;
    document.getElementById('drawerContent').innerHTML = html;
    document.getElementById('drawer').classList.remove('hidden');
  }

  function fecharDrawer() {
    document.getElementById('drawer').classList.add('hidden');
    document.getElementById('drawerContent').innerHTML = '';
  }

  // ============================================================
  // TAGS DE VARIAÇÕES (Dizeres / Iniciais)
  // ============================================================
  function adicionarTagInput(containerId, valor = '') {
    const container = document.getElementById(containerId);
    if (!container) return;

    const valores = String(valor).includes(',')
      ? valor.split(',').map(v => v.trim()).filter(Boolean)
      : [String(valor).trim()].filter(Boolean);

    if (valores.length === 0) {
      const wrapper = document.createElement('div');
      wrapper.className = 'flex gap-2 mb-1 items-center tag-item-row';
      wrapper.innerHTML = `
        <input type="text" class="input-dark !mb-0 flex-1 tag-value-input" value="" placeholder="Ex: DEUS, AMOR ou A, B...">
        <button type="button" onclick="this.parentNode.remove()"
                class="shrink-0 bg-zinc-900 border border-zinc-800 text-red-400 px-3 py-2 rounded-lg hover:bg-zinc-800 text-xs font-bold">✕</button>
      `;
      container.appendChild(wrapper);
      return;
    }

    valores.forEach(v => {
      const wrapper = document.createElement('div');
      wrapper.className = 'flex gap-2 mb-1 items-center tag-item-row';
      wrapper.innerHTML = `
        <input type="text" class="input-dark !mb-0 flex-1 tag-value-input" value="${escapeHtml(v)}" placeholder="Ex: DEUS ou A">
        <button type="button" onclick="this.parentNode.remove()"
                class="shrink-0 bg-zinc-900 border border-zinc-800 text-red-400 px-3 py-2 rounded-lg hover:bg-zinc-800 text-xs font-bold">✕</button>
      `;
      container.appendChild(wrapper);
    });
  }

  function importarVariacoes(containerId) {
    const raw = prompt('Cole os valores separados por vírgula:\nEx: A, B, C, D   ou   DEUS, JESUS, AMOR, FÉ');
    if (!raw) return;
    raw.split(',').map(v => v.trim()).filter(Boolean).forEach(v => adicionarTagInput(containerId, v));
  }

  function extrairValoresTags(containerId) {
    const container = document.getElementById(containerId);
    if (!container) return [];
    return Array.from(container.querySelectorAll('.tag-value-input'))
      .map(inp => inp.value.trim()).filter(Boolean);
  }

  function htmlVariacoes(prefixo) {
    const idDiz = `${prefixo}DizeresContainer`;
    const idIni = `${prefixo}IniciaisContainer`;
    return `
      <div class="mb-3 border border-zinc-800 bg-zinc-900/20 p-3 rounded-xl">
        <div class="flex justify-between items-center mb-2">
          <label class="text-xs text-[#caa85c] font-bold uppercase tracking-wider">✍️ Variações de Dizeres (Frases)</label>
          <div class="flex gap-1">
            <button type="button" onclick="importarVariacoes('${idDiz}')"
                    class="bg-zinc-800 border border-zinc-700 text-zinc-300 px-2 py-1 rounded text-[10px] hover:bg-zinc-700 font-bold">📋 Importar</button>
            <button type="button" onclick="adicionarTagInput('${idDiz}')"
                    class="bg-zinc-900 border border-zinc-800 text-zinc-300 px-2 py-1 rounded text-[10px] hover:bg-zinc-800 font-bold">➕ Add</button>
          </div>
        </div>
        <div id="${idDiz}" class="flex flex-col gap-1 min-h-[4px]"></div>
      </div>
      <div class="mb-3 border border-zinc-800 bg-zinc-900/20 p-3 rounded-xl">
        <div class="flex justify-between items-center mb-2">
          <label class="text-xs text-[#caa85c] font-bold uppercase tracking-wider">🔤 Variações de Iniciais (Letras)</label>
          <div class="flex gap-1">
            <button type="button" onclick="importarVariacoes('${idIni}')"
                    class="bg-zinc-800 border border-zinc-700 text-zinc-300 px-2 py-1 rounded text-[10px] hover:bg-zinc-700 font-bold">📋 Importar</button>
            <button type="button" onclick="adicionarTagInput('${idIni}')"
                    class="bg-zinc-900 border border-zinc-800 text-zinc-300 px-2 py-1 rounded text-[10px] hover:bg-zinc-800 font-bold">➕ Add</button>
          </div>
        </div>
        <div id="${idIni}" class="flex flex-col gap-1 min-h-[4px]"></div>
      </div>
    `;
  }

  // ============================================================
  // CARREGAR DADOS DO BANCO
  // ============================================================
  async function carregarTudo() {
    try {
      const snapCat = await STATE.db.ref(window.getAbellaPath('categories')).once('value');
      STATE.categorias = snapCat.val() || {};

      const snapProd = await STATE.db.ref(window.getAbellaPath('products')).once('value');
      const dados = snapProd.val() || {};
      STATE.produtos = Object.entries(dados).map(([id, p]) => ({ id, ...p }));

      popularFiltros();
      renderAll();
      setStatus('✅ Catálogo sincronizado com as páginas de venda', 'ok');
    } catch(err) {
      setStatus('❌ Erro de conexão com o Firebase', 'error');
    }
  }

  function atualizarEstatisticas() {
    document.getElementById('statProdutos').innerText = STATE.produtos.length;
    document.getElementById('statCategorias').innerText = Object.keys(STATE.categorias).length;
    let totalSubs = 0;
    Object.values(STATE.categorias).forEach(cat => totalSubs += Object.keys(cat?.subcategories || {}).length);
    document.getElementById('statSubs').innerText = totalSubs;
    document.getElementById('statPausados').innerText = STATE.produtos.filter(p => p.paused).length;
  }

  function popularFiltros() {
    const selCat = document.getElementById('filtroCategoria');
    const selSub = document.getElementById('filtroSubcategoria');
    if (!selCat || !selSub) return;

    let catOpts = `<option value="">Todas Categorias</option>`;
    Object.keys(STATE.categorias).forEach(c => catOpts += `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`);
    selCat.innerHTML = catOpts;

    const allSubs = new Set();
    Object.values(STATE.categorias).forEach(cat => Object.keys(cat?.subcategories || {}).forEach(s => allSubs.add(s)));
    let subOpts = `<option value="">Todas Subcategorias</option>`;
    [...allSubs].forEach(s => subOpts += `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`);
    selSub.innerHTML = subOpts;
  }

  // ── Renderizar Produtos ─────────────────────────────────────
  function renderProdutos() {
    const container = document.getElementById('tab-produtos');
    if (!container) return;

    const termos    = (document.getElementById('buscaGlobal').value || '').toLowerCase();
    const filtroCat = document.getElementById('filtroCategoria').value;
    const filtroSub = document.getElementById('filtroSubcategoria').value;

    const filtrados = STATE.produtos.filter(p => {
      const texto = [(p.name || ''), (p.sku || ''), (p.category || ''), DataService.getSubcategory(p)].join(' ').toLowerCase();
      return (!termos || texto.includes(termos))
          && (!filtroCat || p.category === filtroCat)
          && (!filtroSub || DataService.getSubcategory(p) === filtroSub);
    });

    if (!filtrados.length) {
      container.innerHTML = `<div class="text-sm text-zinc-500 p-4 text-center">Nenhum produto correspondente.</div>`;
      return;
    }

    container.innerHTML = filtrados.map(p => {
      const isPaused = p.paused;
      const cardBg   = isPaused ? 'bg-zinc-950 opacity-60 border-red-900/40' : 'bg-zinc-950 border-zinc-900';
      const statusTag = isPaused
        ? `<span class="bg-red-950 text-red-400 border border-red-800 text-[10px] px-2 py-0.5 rounded-full font-bold">PAUSADO</span>`
        : `<span class="bg-green-950 text-green-400 border border-green-800 text-[10px] px-2 py-0.5 rounded-full font-bold">ATIVO</span>`;
      const imgUrl     = tratarConversaoImagem(DataService.getImage(p));
      const qtdDizeres = DataService.getDizeres(p).length;
      const qtdIniciais = DataService.getIniciais(p).length;

      return `
        <div class="border rounded-2xl p-5 mb-1 transition-all hover:border-zinc-800 ${cardBg}">
          <div class="flex flex-col lg:flex-row gap-5 items-start lg:items-center justify-between">
            <div class="flex items-center gap-4 w-full lg:w-auto">
              <div class="w-20 h-20 bg-zinc-900 border border-zinc-800 rounded-xl overflow-hidden flex-shrink-0 flex items-center justify-center relative">
                <div class="fallback-container absolute inset-0 flex items-center justify-center bg-zinc-900 text-[10px] text-zinc-600">Sem Foto</div>
                ${DataService.getImage(p) ? `<img src="${escapeHtml(imgUrl)}" class="w-full h-full object-cover relative z-10" onerror="handleImageError(this)"/>` : ''}
              </div>
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2 mb-1 flex-wrap">
                  ${statusTag}
                  <span class="text-xs font-mono text-zinc-400 bg-zinc-900 px-2 py-0.5 rounded border border-zinc-800">${escapeHtml(p.sku || 'SEM SKU')}</span>
                </div>
                <h3 class="font-bold text-base text-white truncate">${escapeHtml(p.name || 'Sem nome')}</h3>
                <p class="text-xs text-zinc-500 line-clamp-1 mt-0.5">${escapeHtml(DataService.getDesc(p) || 'Sem descrição cadastrada.')}</p>
                <div class="flex gap-2 mt-2 flex-wrap">
                  <span class="text-[10px] bg-zinc-900 text-zinc-400 px-2 py-0.5 rounded border border-zinc-800">✍️ Dizeres: ${qtdDizeres}</span>
                  <span class="text-[10px] bg-zinc-900 text-zinc-400 px-2 py-0.5 rounded border border-zinc-800">🔤 Iniciais: ${qtdIniciais}</span>
                </div>
              </div>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 w-full lg:flex-1 max-w-3xl bg-zinc-900/40 p-3 rounded-xl border border-zinc-900">
              <div>
                <span class="text-[10px] text-zinc-500 block uppercase font-bold tracking-wider">Preço</span>
                <span class="text-sm font-semibold text-[#caa85c]">R$ ${DataService.getPrice(p).toFixed(2)}</span>
              </div>
              <div>
                <span class="text-[10px] text-zinc-500 block uppercase font-bold tracking-wider">Peso</span>
                <span class="text-sm font-semibold text-zinc-300">${DataService.getWeight(p)}g</span>
              </div>
              <div>
                <span class="text-[10px] text-zinc-500 block uppercase font-bold tracking-wider">Categoria</span>
                <span class="text-xs font-semibold text-zinc-400 truncate block">${escapeHtml(p.category || '—')}</span>
              </div>
              <div>
                <span class="text-[10px] text-zinc-500 block uppercase font-bold tracking-wider">Subcategoria</span>
                <span class="text-xs font-semibold text-zinc-400 truncate block">${escapeHtml(DataService.getSubcategory(p) || '—')}</span>
              </div>
            </div>

            <div class="flex gap-2 w-full lg:w-auto justify-end border-t border-zinc-900 lg:border-none pt-3 lg:pt-0">
              <button onclick="editarProduto('${escapeAttr(p.id)}')"   class="bg-zinc-900 border border-zinc-800 p-2.5 rounded-xl hover:bg-zinc-800 text-zinc-300 transition-colors text-sm">✏️ Editar</button>
              <button onclick="duplicarProduto('${escapeAttr(p.id)}')" class="bg-zinc-900 border border-zinc-800 p-2.5 rounded-xl hover:bg-zinc-800 text-zinc-300 transition-colors text-sm">📄</button>
              <button onclick="pausarProduto('${escapeAttr(p.id)}')"   class="bg-zinc-900 border border-zinc-800 p-2.5 rounded-xl hover:bg-zinc-800 text-zinc-300 transition-colors text-sm">${isPaused ? '▶️' : '⏸️'}</button>
              <button onclick="deletarProduto('${escapeAttr(p.id)}')"  class="bg-zinc-900 border border-zinc-800 p-2.5 rounded-xl hover:border-red-950 text-red-400 transition-colors text-sm">🗑️</button>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  // ── Renderizar Categorias ────────────────────────────────────
  function renderCategorias() {
    const el = document.getElementById('tab-categorias');
    if (!el) return;
    const entries = Object.entries(STATE.categorias);
    if (!entries.length) {

  async function salvarNovoProduto() {
    try {
      const nome = document.getElementById('newNome').value.trim();
      const sku  = document.getElementById('newSku').value.trim();
      const cat  = document.getElementById('newCategoria').value;
      if (!nome || !sku || !cat) { alert('Preencha Nome, SKU e selecione a Categoria!'); return; }

      const img    = document.getElementById('newImagem').value.trim();
      const preco  = parseFloat(document.getElementById('newPreco').value) || 0;
      const peso   = parseFloat(document.getElementById('newPeso').value)  || 0;
      const subcat = document.getElementById('newSubcategoria').value;
      const listaDizeres  = extrairValoresTags('newDizeresContainer');
      const listaIniciais = extrairValoresTags('newIniciaisContainer');

      await STATE.db.ref(window.getAbellaPath('products')).push({
        name: nome, sku, category: cat,
        subcategory: subcat, subCategory: subcat,
        price: preco, preco,
        weight: peso, peso,
        image: img, imagem: img,
        description: document.getElementById('newDescricao').value,
        descricao:   document.getElementById('newDescricao').value,
        dizeres:  listaDizeres,  sayings:  listaDizeres,
        iniciais: listaIniciais, initials: listaIniciais,
        paused: false, createdAt: Date.now(), updatedAt: Date.now()
      });
      fecharDrawer();
      await carregarTudo();
    } catch(e) { setStatus('❌ Erro ao criar novo produto', 'error'); }
  }

      </div>

      <div class="mb-3 p-3 bg-zinc-900 border border-zinc-800 rounded-xl">
        <label class="text-xs text-zinc-400 block mb-1 font-bold text-[#caa85c]">Imagem Hero (Capa Superior)</label>
        <div class="w-full h-24 bg-black border border-zinc-800 rounded mb-2 overflow-hidden flex items-center justify-center relative">
          <div class="absolute text-[10px] text-zinc-600">Sem Imagem</div>
          <img id="previewHero" src="${escapeHtml(tratarConversaoImagem(imgHero))}" class="w-full h-full object-cover relative z-10" onerror="this.style.opacity='0'">
        </div>
        <input id="subHero" class="input-dark" value="${escapeHtml(imgHero)}" oninput="tratarInputImagem(this, 'previewHero')">
      </div>

      <button onclick="salvarSubcategoria('${escapeAttr(catSlug)}', '${escapeAttr(subSlug)}')"
              class="bg-[#caa85c] text-black px-4 py-2 rounded-xl w-full font-bold mt-2 hover:bg-opacity-90">
        💾 Salvar Subcategoria
      </button>
    `);
  }

  async function salvarSubcategoria(catSlug, subSlug) {
    try {
      const gridVal = document.getElementById('subGrid').value.trim();
      const heroVal = document.getElementById('subHero').value.trim();
      await STATE.db.ref(window.getAbellaPath(`categories/${catSlug}/subcategories/${subSlug}`)).update({
        name:        document.getElementById('subName').value,
        description: document.getElementById('subDesc').value,
        imagem: gridVal, grid: gridVal, gridImage: gridVal,
        hero: heroVal, heroImage: heroVal,
        updatedAt: Date.now()
      });
      fecharDrawer();
      await carregarTudo();
    } catch(e) { setStatus('❌ Erro ao salvar subcategoria', 'error'); }
  }

  // ============================================================
  // DELETAR E DUPLICAR
  // ============================================================
  async function duplicarProduto(id) {
    const p = STATE.produtos.find(prod => prod.id === id);
    if (!p) return;
    const copia = { ...p, sku: (p.sku || '') + '-COPY', createdAt: Date.now(), updatedAt: Date.now() };
    delete copia.id;
    await STATE.db.ref(window.getAbellaPath('products')).push(copia);
    await carregarTudo();
  }

  async function pausarProduto(id) {
    const p = STATE.produtos.find(prod => prod.id === id);
    if (!p) return;
    await STATE.db.ref(window.getAbellaPath(`products/${id}`)).update({ paused: !p.paused, updatedAt: Date.now() });
    await carregarTudo();
  }

  async function deletarProduto(id) {
    if (confirm('Deseja realmente excluir permanentemente este produto?')) {
      await STATE.db.ref(window.getAbellaPath('products')).child(id).remove();
      await carregarTudo();
    }
  }

  async function deletarCategoria(slug) {
    if (confirm(`Excluir a categoria [${slug}]? Os produtos perderão o vínculo de menu.`)) {
      await STATE.db.ref(window.getAbellaPath(`categories/${slug}`)).remove();
      await carregarTudo();
    }
  }

  async function deletarSubcategoria(catSlug, subSlug) {
    if (confirm(`Excluir a subcategoria [${subSlug}] da categoria [${catSlug}]?`)) {
      await STATE.db.ref(window.getAbellaPath(`categories/${catSlug}/subcategories/${subSlug}`)).remove();
      await carregarTudo();
    }
  }

  // ============================================================
  // EVENTOS E ATIVAÇÃO DE COMPONENTES
  // ============================================================
  function wireSearch() {
    document.getElementById('buscaGlobal').addEventListener('input', () => {
      clearTimeout(STATE.buscaDebounceTimer);
      STATE.buscaDebounceTimer = setTimeout(renderCurrentTab, CONFIG.debounceBusca);
    });
    ['filtroTipo', 'filtroCategoria', 'filtroSubcategoria'].forEach(id => {
      document.getElementById(id)?.addEventListener('change', () => renderCurrentTab());
    });
  }

  function wireTabs() {
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        ['produtos', 'categorias', 'subcategorias', 'configuracoes'].forEach(t => {
          document.getElementById('tab-' + t)?.classList.add('hidden');
        });
        document.getElementById('tab-' + btn.dataset.tab)?.classList.remove('hidden');
        renderCurrentTab();
      });
    });
  }

  // ============================================================
  // INICIALIZAÇÃO ASSÍNCRONA (INIT)
  // ============================================================
  (async function init() {
    let t = 0;
    while (!STATE.db && t < CONFIG.firebaseRetries) {
      STATE.db = resolverDB();
      if (!STATE.db) { await new Promise(r => setTimeout(r, CONFIG.firebaseRetryDelay)); t++; }
    }
    if (!STATE.db) return setStatus('❌ Falha ao carregar o Firebase SDK', 'error');

    let tPath = 0;
    while (typeof window.getAbellaPath !== 'function' && tPath < CONFIG.firebaseRetries) {
      await new Promise(r => setTimeout(r, CONFIG.firebaseRetryDelay));
      tPath++;
    }
    if (typeof window.getAbellaPath !== 'function') {
      console.warn('getAbellaPath não encontrada. Usando caminhos padrão.');
      window.getAbellaPath = function(p) { return 'abella/' + p; };
    }

    wireTabs();
    wireSearch();
    document.getElementById('btnRefresh').addEventListener('click', () => carregarTudo());
    await carregarTudo();
  })();

  // MAPEAMENTO GLOBAL COMPLETO PARA ESCOPO DE EXECUÇÃO DO INNERHTML
  window.editarProduto    = editarProduto;
  window.salvarProduto    = salvarProduto;
  window.duplicarProduto  = duplicarProduto;
  window.pausarProduto    = pausarProduto;
  window.deletarProduto   = deletarProduto;
  window.editarCategoria  = editarCategoria;
  window.salvarCategoria  = salvarCategoria;
  window.editarSubcategoria  = editarSubcategoria;
  window.salvarSubcategoria  = salvarSubcategoria;
  window.fecharDrawer        = fecharDrawer;
  window.tratarInputImagem   = tratarInputImagem;
  window.handleImageError    = handleImageError;
  window.carregarSubcategoriasProduto         = carregarSubcategoriasProduto;
  window.carregarSubcategoriasProdutoCriacao  = carregarSubcategoriasProdutoCriacao;
  window.abrirCriacaoPorAba   = abrirCriacaoPorAba;
  window.salvarNovoProduto     = salvarNovoProduto;
  window.salvarNovaCategoria   = salvarNovaCategoria;
  window.salvarNovaSubcategoria = salvarNovaSubcategoria;
  window.deletarCategoria      = deletarCategoria;
  window.deletarSubcategoria   = deletarSubcategoria;
  window.adicionarTagInput     = adicionarTagInput;
  window.importarVariacoes     = importarVariacoes;
  window.renderPainelConfiguracoes = renderPainelConfiguracoes;
  window.salvarConfiguracoesGlobais = salvarConfiguracoesGlobais;
  </script>
</body>
</html>
