<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel Administrativo • Abella Joias</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght=600&family=Inter:wght=300;400;500;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #09090b; color: #f4f4f5; }
        .serif { font-family: 'Cinzel', serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #09090b; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #caa85c; }
    </style>
</head>
<body class="min-screen bg-[#09090b] flex overflow-hidden h-screen select-none">

    <aside class="w-72 bg-black border-r border-zinc-900 flex flex-col justify-between shrink-0">
        <div class="p-6 space-y-8">
            <div class="space-y-1">
                <h1 class="serif text-sm tracking-widest text-[#caa85c] uppercase font-black">Abella Joias</h1>
                <p class="text-[9px] text-zinc-500 font-mono tracking-wider uppercase">Ambiente Isolado • Raiz /abella</p>
            </div>
            
            <nav id="menu-navegacao" class="space-y-1.5">
                <button id="btn-pedidos" onclick="if(window.mudarAbaDinamica) { window.mudarAbaDinamica('pedidos') } else { alert('Carregando infraestrutura, aguarde...') }" class="w-full flex items-center gap-3 px-4 py-3 text-xs font-bold uppercase tracking-wider rounded-xl transition-all bg-[#caa85c] text-black">
                    <span class="text-base shrink-0">📦</span> Pedidos Recebidos
                </button>
                
                <button id="btn-ofertas" onclick="if(window.mudarAbaDinamica) { window.mudarAbaDinamica('ofertas') } else { alert('Carregando infraestrutura, aguarde...') }" class="w-full flex items-center gap-3 px-4 py-3 text-xs font-bold uppercase tracking-wider rounded-xl transition-all bg-zinc-900 text-gray-400 hover:text-white">
                    <span class="text-base shrink-0">🏷️</span> Painel de Ofertas
                </button>
                
                <button id="btn-galvanicas" onclick="if(window.mudarAbaDinamica) { window.mudarAbaDinamica('galvanicas') } else { alert('Carregando infraestrutura, aguarde...') }" class="w-full flex items-center gap-3 px-4 py-3 text-xs font-bold uppercase tracking-wider rounded-xl transition-all bg-zinc-900 text-gray-400 hover:text-white">
                    <span class="text-base shrink-0">🚚</span> Galvânicas Parceiras
                </button>
                
                <button id="btn-produtos" onclick="if(window.mudarAbaDinamica) { window.mudarAbaDinamica('produtos') } else { alert('Carregando infraestrutura, aguarde...') }" class="w-full flex items-center gap-3 px-4 py-3 text-xs font-bold uppercase tracking-wider rounded-xl transition-all bg-zinc-900 text-gray-400 hover:text-white">
                    <span class="text-base shrink-0">💍</span> Gestão de Produtos
                </button>
                
                <button id="btn-categories" onclick="if(window.mudarAbaDinamica) { window.mudarAbaDinamica('categories') } else { alert('Carregando infraestrutura, aguarde...') }" class="w-full flex items-center gap-3 px-4 py-3 text-xs font-bold uppercase tracking-wider rounded-xl transition-all bg-zinc-900 text-gray-400 hover:text-white">
                    <span class="text-base shrink-0">📁</span> Coleções / Categorias
                </button>
                <button id="btn-migracao">
                    🛠️ Migração do Banco
               </button>
                
                <button id="btn-config" onclick="if(window.mudarAbaDinamica) { window.mudarAbaDinamica('config') } else { alert('Carregando infraestrutura, aguarde...') }" class="w-full flex items-center gap-3 px-4 py-3 text-xs font-bold uppercase tracking-wider rounded-xl transition-all bg-zinc-900 text-gray-400 hover:text-white">
                    <span class="text-base shrink-0">⚙️</span> Configurações
                </button>
            </nav>
        </div>
        
        <div class="p-6 border-t border-zinc-950 bg-zinc-950/40 text-center">
            <a href="../index.html" class="inline-flex items-center gap-2 text-[10px] font-mono uppercase font-bold text-zinc-500 hover:text-[#caa85c] transition-all">
                ← Voltar para a Vitrine
            </a>
        </div>
    </aside>

    <main class="flex-1 flex flex-col min-w-0 overflow-hidden">
        <div id="conteudo-dinamico" class="flex-1 overflow-y-auto p-8 custom-scrollbar">
            <div class="flex items-center justify-center h-full text-zinc-600 italic text-xs font-mono animate-pulse">
                Sincronizando barramento central Abella Joias...
            </div>
        </div>
    </main>

   <script src="admin-logic.js"></script>
</body>
</html>
