<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Modelos da Coleção • Abella Joias</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght=600&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { background:#0b0b0b; color:#eee; font-family:'Inter', sans-serif; min-height: 100vh; }
        .serif { font-family:'Cinzel', serif; }
        .gold { color:#caa85c; }
        .card { background:#141414; border:1px solid #2a2a2a; border-radius:20px; overflow:hidden; transition:.3s; }
        .card:hover { transform:translateY(-5px); border-color:#caa85c; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }
    </style>
</head>
<body>

    <header class="sticky top-0 bg-black/90 backdrop-blur border-b border-[#222] z-50">
        <div class="max-w-7xl mx-auto p-5 flex justify-between items-center">
            <a href="index.html" class="text-xs text-gray-400 hover:text-white transition-all flex items-center gap-1">
                ← Voltar para as Coleções
            </a>
            <a href="carrinho.html" class="border border-[#caa85c]/30 px-4 py-2 rounded-xl text-sm flex items-center gap-2 hover:bg-zinc-900 transition-all">
                🛒 <span id="cartTotal" class="font-bold text-white font-mono">R$ 0,00</span>
            </a>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-6">
        <div class="mb-6 border-b border-zinc-900 pb-4">
            <span class="text-[10px] text-zinc-500 uppercase font-bold tracking-widest block mb-1">Catálogo Corporativo de Atacado</span>
            <h2 id="titulo-colecao" class="serif text-2xl tracking-wider uppercase gold">Carregando Coleção...</h2>
        </div>

        <div id="grid-produtos" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <div class="text-center py-12 text-gray-600 italic col-span-full">Buscando modelos no banco de dados...</div>
        </div>
    </main>

    <div id="modalCompraAbella" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-[99999] p-4 animate-fade-in">
        <div class="bg-[#111] border border-[#2a2a2a] w-full max-w-md rounded-2xl p-5 text-center space-y-4 max-h-[90vh] overflow-y-auto">
            <h3 class="text-[#caa85c] font-bold uppercase tracking-wider text-xs">Personalização & Quantidade</h3>
            
            <div class="bg-black p-2 rounded-xl border border-zinc-900 flex justify-center items-center aspect-square w-48 mx-auto overflow-hidden">
                <img id="mdCompraImg" src="" class="w-full h-full object-cover rounded-lg">
            </div>

            <div id="mdFotosSeletores" class="flex justify-center gap-2"></div>
            
            <div class="space-y-1">
                <h4 id="mdCompraNome" class="text-base font-bold text-white truncate">Nome da Peça</h4>
                <div class="flex justify-center gap-4 text-[10px] font-mono text-gray-500">
                    <span id="mdCompraSku">SKU: N/A</span>
                    <span id="mdCompraPeso">Peso: 0g</span>
                </div>
            </div>

            <div id="bloco-variacoes-painel" class="space-y-2 text-left hidden bg-zinc-950 p-3.5 rounded-xl border border-zinc-900">
                <label id="label-variacao-dinamica" class="text-[10px] text-[#caa85c] font-bold uppercase tracking-wider block mb-1">Escolha a Variação:</label>
                <div id="wrapper-input-dinamico">
                    </div>
            </div>

            <div class="bg-zinc-950 p-4 rounded-xl border border-zinc-900 text-left space-y-2">
                <div class="flex justify-between text-xs text-gray-500 font-mono">
                    <span>Subtotal Original:</span>
                    <span id="mdSubtotalCartao" class="line-through">R$ 0,00</span>
                </div>
                <div class="flex justify-between text-sm border-t border-zinc-900 pt-2">
                    <span class="text-gray-300 font-medium">À Vista no PIX:</span>
                    <span id="mdTotalPix" class="gold font-black font-mono text-base">R$ 0,00</span>
                </div>
                <div class="flex justify-between text-xs text-gray-400 font-mono">
                    <span>Ou no Cartão:</span>
                    <span id="mdTotalParcelado">Até 6x de R$ 0,00</span>
                </div>
            </div>

            <div class="space-y-2">
                <label class="text-[10px] text-gray-400 font-bold uppercase block">Quantidade de peças para o bruto:</label>
                <div class="flex items-center justify-center gap-3">
                    <button onclick="ajustarQtdModal(-1)" class="w-10 h-10 bg-zinc-900 rounded-lg text-lg font-bold border border-zinc-800 text-gray-400 hover:bg-zinc-700 transition-all">-</button>
                    <input type="number" id="mdCompraQtd" value="1" min="1" oninput="recalcularPrecosModal()" class="w-20 h-10 bg-black border border-[#333] rounded-lg text-center font-mono text-white font-bold text-base outline-none focus:border-[#caa85c]">
                    <button onclick="ajustarQtdModal(1)" class="w-10 h-10 bg-zinc-900 rounded-lg text-lg font-bold border border-zinc-800 text-gray-400 hover:bg-zinc-700 transition-all">+</button>
                </div>
            </div>

            <div class="flex gap-2 pt-2">
                <button onclick="confirmarInjecaoCarrinho()" class="bg-[#caa85c] text-black font-bold flex-1 py-3 rounded-xl text-xs uppercase tracking-wider hover:brightness-110 transition-all">Confirmar e Incluir</button>
                <button onclick="fecharModalCompra()" class="border border-zinc-800 text-zinc-400 px-4 rounded-xl text-xs uppercase font-bold hover:bg-zinc-900 transition-all">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDPBZSxW8XjtQmDMUknzAyIlFda51MvMJY",
            databaseURL: "https://catalogo-abella-joias-default-rtdb.firebaseio.com"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        const fM = v => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v || 0);
        
        const urlParams = new URLSearchParams(window.location.search);
        const categoriaId = urlParams.get('id');
        
        let produtoSelecionadoModal = null;
        let listaProdutosCache = [];
        let configGlobal = { pixDesc: 5, parcelasMax: 6 };

        function init() {
            if (!categoriaId) {
                document.getElementById('grid-produtos').innerHTML = '<p class="text-xs text-gray-500 col-span-full py-10 italic text-center">Coleção inválida.</p>';
                return;
            }

            db.ref('settings').once('value', snap => {
                if(snap.exists()) {
                    const settings = snap.val() || {};
                    const emp = settings.empresa || {};
                    configGlobal.pixDesc = parseFloat(settings.pix || emp.pix || 5);
                    configGlobal.parcelasMax = parseInt(settings.parcelas || emp.parcelas || 6);
                }
                carregarProdutosDaColecao();
            });

            atualizarCarrinho();
        }

        function carregarProdutosDaColecao() {
            db.ref(`categories/${categoriaId}`).once('value', snap => {
                if(snap.exists()) {
                    const cat = snap.val();
                    document.getElementById('titulo-colecao').innerText = cat.name || cat.nome || categoriaId.replace(/-/g, ' ');
                }
            });

            db.ref('products').on('value', snap => {
                const grid = document.getElementById('grid-produtos');
                grid.innerHTML = '';
                listaProdutosCache = [];

                if (!snap.exists()) {
                    grid.innerHTML = '<p class="text-xs text-gray-500 col-span-full py-10 italic text-center">Nenhum produto cadastrado.</p>';
                    return;
                }

                let totalProdutos = 0;

                snap.forEach(child => {
                    const prodId = child.key;
                    const prod = child.val() || {};

                    if (prod.category !== categoriaId && prod.categoria !== categoriaId) return;
                    if (prod.paused === true || prod.paused === "true") return;

                    totalProdutos++;
                    listaProdutosCache.push({ id: prodId, ...prod });

                    const foto1 = prod.imagem || prod.image || 'https://via.placeholder.com/400?text=Sem+Foto';
                    const foto2 = prod.imagem2 || prod.image2 || '';
                    
                    const precoCheio = parseFloat(prod.price || prod.precoFinal || 0);
                    const precoPix = precoCheio - (precoCheio * (configGlobal.pixDesc / 100));
                    const valorParcela = precoCheio / configGlobal.parcelasMax;

                    let htmlSeletoresFoto = '';
                    if(foto2) {
                        htmlSeletoresFoto = `
                            <div class="flex justify-center gap-1.5 mt-1.5">
                                <button onclick="event.stopPropagation(); mudeFotoVitrine('${prodId}', '${foto1}')" class="w-3 h-3 rounded-full bg-[#caa85c] border border-zinc-700"></button>
                                <button onclick="event.stopPropagation(); mudeFotoVitrine('${prodId}', '${foto2}')" class="w-3 h-3 rounded-full bg-zinc-600 border border-zinc-700"></button>
                            </div>
                        `;
                    }

                    const badgePromo = (prod.promocaoAtiva || prod.emOferta) ? `
                        <span class="absolute top-2 right-2 bg-red-600 text-white font-black text-[8px] px-2 py-0.5 rounded-full uppercase tracking-wider z-10">${prod.tagPromocional || 'OFERTA'}</span>
                    ` : '';

                    grid.innerHTML += `
                        <div class="card flex flex-col justify-between p-3.5 space-y-2.5 animate-fade-in relative border border-zinc-900">
                            ${badgePromo}
                            
                            <div>
                                <div class="overflow-hidden aspect-square w-full bg-zinc-950 flex items-center justify-center rounded-xl relative border border-zinc-900/80">
                                    <img id="img-vitrine-${prodId}" src="${foto1}" class="w-full h-full object-cover" loading="lazy">
                                    <span class="absolute bottom-2 left-2 bg-black/80 backdrop-blur text-[8px] font-mono px-1.5 py-0.5 rounded text-gray-400">SKU: ${prod.sku || 'N/A'}</span>
                                </div>
                                ${htmlSeletoresFoto}
                            </div>
                            
                            <div class="space-y-1.5 flex-1 flex flex-col justify-between">
                                <div>
                                    <h3 class="font-bold text-xs text-white uppercase tracking-wider truncate">${prod.name || prod.nome || 'Peça no Bruto'}</h3>
                                    <p class="text-[9px] text-gray-500 font-mono">⚖️ Peso Ref: ${prod.peso || prod.weight || '0'}g</p>
                                </div>
                                
                                <div class="bg-zinc-950/60 p-2.5 rounded-xl border border-zinc-900/50 space-y-1">
                                    <p class="text-[10px] text-gray-500 font-mono">Cartão: <span class="text-gray-300 font-bold">${fM(precoCheio)}</span></p>
                                    <p class="gold font-black text-sm font-mono">${fM(precoPix)} <span class="text-[9px] font-medium text-emerald-500 uppercase">no PIX</span></p>
                                    <p class="text-[9px] text-zinc-400 font-mono">Ou ${configGlobal.parcelasMax}x de <span class="text-white">${fM(valorParcela)}</span></p>
                                </div>
                            </div>
                            
                            <button onclick="abrirModalCompra('${prodId}')" class="w-full bg-[#caa85c] hover:bg-[#bda152] text-black font-black py-2.5 rounded-xl text-xs uppercase tracking-wider transition-all">
                                Comprar
                            </button>
                        </div>
                    `;
                });

                if (totalProdutos === 0) {
                    grid.innerHTML = '<p class="text-xs text-gray-500 col-span-full py-10 italic text-center">Nenhum modelo disponível.</p>';
                }
            });
        }

        function mudeFotoVitrine(prodId, urlAlvo) {
            const img = document.getElementById(`img-vitrine-${prodId}`);
            if(img) img.src = urlAlvo;
        }

        function mudeFotoModal(urlAlvo) {
            document.getElementById('mdCompraImg').src = urlAlvo;
        }

        // =======================================================
        // INTERFACE DO MODAL ADAPTADO ÀS CONFIGURAÇÕES DO PAINEL
        // =======================================================
        function abrirModalCompra(idNoCache) {
            const produto = listaProdutosCache.find(p => p.id === idNoCache);
            if (!produto) return;

            produtoSelecionadoModal = produto;
            
            const foto1 = produto.imagem || produto.image || 'https://via.placeholder.com/300?text=Joia';
            const foto2 = produto.imagem2 || produto.image2 || '';

            document.getElementById('mdCompraImg').src = foto1;
            document.getElementById('mdCompraNome').innerText = produto.name || produto.nome || 'Peça Sem Nome';
            document.getElementById('mdCompraSku').innerText = "SKU: " + (produto.sku || 'N/A');
            document.getElementById('mdCompraPeso').innerText = "Peso: " + (produto.peso || produto.weight || '0') + "g";
            
            // Captura os elementos de variação dinâmicos
            const blocoVariacoes = document.getElementById('bloco-variacoes-painel');
            const wrapperInput = document.getElementById('wrapper-input-dinamico');
            const labelVariacao = document.getElementById('label-variacao-dinamica');
            
            wrapperInput.innerHTML = ''; // Limpa seletores antigos
            
            // Lê o tipo de variação definido pelo Painel Administrativo
            const tipo = produto.tipoVariacao || produto.tipo_variacao || '';
            const opcoesTexto = produto.opcoesPersonalizadas || produto.opcoes || '';

            if (tipo === 'Lista' && opcoesTexto.trim() !== '') {
                // Divide a string de opções pelas vírgulas salvas no painel
                const listaOpcoes = opcoesTexto.split(',').map(o => o.trim()).filter(o => o !== '');
                
                labelVariacao.innerText = "Selecione a Letra / Inicial:";
                
                let htmlSelect = `<select id="input-variacao-final" class="w-full bg-black border border-zinc-800 rounded-xl px-3 py-2.5 text-sm text-white focus:border-[#caa85c] outline-none font-bold font-mono">`;
                htmlSelect += `<option value="">-- Escolha uma opção --</option>`;
                listaOpcoes.forEach(opcao => {
                    htmlSelect += `<option value="${opcao}">${opcao}</option>`;
                });
                htmlSelect += `</select>`;
                
                wrapperInput.innerHTML = htmlSelect;
                blocoVariacoes.classList.remove('hidden');
                
            } else if (tipo === 'Texto' || produto.hasDizeres === true || produto.dizeres === true) {
                // Caso use digitação livre (frases/dizeres)
                labelVariacao.innerText = "Dizeres / Nome Personalizado:";
                wrapperInput.innerHTML = `
                    <input type="text" id="input-variacao-final" placeholder="Digite o nome ou frase a ser gravada" class="w-full bg-black border border-zinc-800 rounded-xl px-3 py-2.5 text-sm text-white focus:border-[#caa85c] outline-none">
                `;
                blocoVariacoes.classList.remove('hidden');
            } else {
                // Produto padrão sem variações ativas
                blocoVariacoes.classList.add('hidden');
            }

            // Configuração dos thumbnails internos
            const boxSeletores = document.getElementById('mdFotosSeletores');
            boxSeletores.innerHTML = '';
            if(foto2) {
                boxSeletores.innerHTML = `
                    <button onclick="mudeFotoModal('${foto1}')" class="px-3 py-1 bg-zinc-900 border border-zinc-800 rounded text-[9px] uppercase font-bold text-gray-400 hover:text-white">Foto Real</button>
                    <button onclick="mudeFotoModal('${foto2}')" class="px-3 py-1 bg-zinc-900 border border-zinc-800 rounded text-[9px] uppercase font-bold text-gray-400 hover:text-white">📏 Dimensões</button>
                `;
            }

            document.getElementById('mdCompraQtd').value = 1;
            recalcularPrecosModal();
            document.getElementById('modalCompraAbella').classList.remove('hidden');
        }

        function recalcularPrecosModal() {
            if (!produtoSelecionadoModal) return;

            let inputQtd = document.getElementById('mdCompraQtd');
            let qtd = parseInt(inputQtd.value) || 1;
            if(qtd < 1) { qtd = 1; inputQtd.value = 1; }

            const precoBaseUnitario = parseFloat(produtoSelecionadoModal.price || produtoSelecionadoModal.precoFinal || 0);
            
            const subtotalCartao = precoBaseUnitario * qtd;
            const totalPix = subtotalCartao - (subtotalCartao * (configGlobal.pixDesc / 100));
            const valorParcela = subtotalCartao / configGlobal.parcelasMax;

            document.getElementById('mdSubtotalCartao').innerText = fM(subtotalCartao);
            document.getElementById('mdTotalPix').innerText = fM(totalPix);
            document.getElementById('mdTotalParcelado').innerText = `Até ${configGlobal.parcelasMax}x sem juros de ${fM(valorParcela)}`;
        }

        function ajustarQtdModal(fator) {
            let input = document.getElementById('mdCompraQtd');
            let atual = parseInt(input.value) || 1;
            let novo = atual + fator;
            if (novo < 1) novo = 1;
            input.value = novo;
            recalcularPrecosModal();
        }

        function fecharModalCompra() {
            document.getElementById('modalCompraAbella').classList.add('hidden');
            produtoSelecionadoModal = null;
        }

        function confirmarInjecaoCarrinho() {
            if (!produtoSelecionadoModal) return;
            
            let qtdDigitada = parseInt(document.getElementById('mdCompraQtd').value) || 1;
            
            // Captura o valor da variação selecionada/digitada (se o campo existir na tela)
            const inputVariacao = document.getElementById('input-variacao-final');
            let valorVariacao = inputVariacao ? inputVariacao.value.trim() : '';

            // Se o campo de variação está visível e for do tipo select (Lista), obriga a escolher uma letra
            if (inputVariacao && inputVariacao.tagName === 'SELECT' && !valorVariacao) {
                alert("Por favor, selecione uma Inicial para continuar.");
                return;
            }

            let localCarrinho = JSON.parse(localStorage.getItem('carrinho') || '[]');
            
            // Cria uma chave única combinando o SKU + variação para evitar misturar letras diferentes no carrinho
            let chaveUnicaItem = produtoSelecionadoModal.sku + (valorVariacao ? `-${valorVariacao}` : '');
            let indexExistente = localCarrinho.findIndex(i => i.itemChave === chaveUnicaItem);
            
            if (indexExistente > -1) {
                localCarrinho[indexExistente].quantidade = (parseInt(localCarrinho[indexExistente].quantidade) || 0) + qtdDigitada;
            } else {
                localCarrinho.push({
                    itemChave: chaveUnicaItem,
                    sku: produtoSelecionadoModal.sku || 'N/A',
                    nome: produtoSelecionadoModal.name || produtoSelecionadoModal.nome || 'Peça no Bruto',
                    image: produtoSelecionadoModal.imagem || produtoSelecionadoModal.image || '',
                    precoFinal: parseFloat(produtoSelecionadoModal.price || produtoSelecionadoModal.precoFinal || 0),
                    peso: parseFloat(produtoSelecionadoModal.peso || produtoSelecionadoModal.weight || 0),
                    quantidade: qtdDigitada,
                    // Passa a variação escolhida estruturada para o romaneio/pedido
                    variacao: valorVariacao || null
                });
            }
            
            localStorage.setItem('carrinho', JSON.stringify(localCarrinho));
            atualizarCarrinho();
            fecharModalCompra();
        }

        function atualizarCarrinho(){
            const cart = JSON.parse(localStorage.getItem('carrinho') || '[]');
            let total = 0;
            cart.forEach(item => {
                let preco = parseFloat(item.precoFinal || item.price || 0);
                let qtd = parseInt(item.quantidade) || 1;
                total += (preco * qtd);
            });
            document.getElementById('cartTotal').innerText = fM(total);
        }

        window.onload = init;
    </script>
</body>
</html>
