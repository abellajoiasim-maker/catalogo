<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Abella Joias • Produtos Premium</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv=\"Cache-Control\" content=\"no-cache, no-store, must-revalidate\">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        body {
            background: #070707;
            color: #fff;
            font-family: 'Inter', sans-serif;
        }
        .font-cinzel { font-family: 'Cinzel', serif; }
        .back-button {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #caa85c;
            font-weight: 600;
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        .prod-card {
            background: #0e0e0e;
            border: 1px solid #161616;
            transition: all 0.3s ease;
        }
        .prod-card:hover {
            border-color: #caa85c;
            transform: translateY(-2px);
        }
        .fallback-prod {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #121212;
            font-size: 1.5rem;
            z-index: 1;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="w-full bg-black/60 border-b border-zinc-900 sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <button onclick="voltarPagina()" class="back-button">
                <span>← Voltar</span>
            </button>
            <span class="font-cinzel text-base tracking-[0.2em] font-bold text-[#caa85c] cursor-pointer" onclick="window.location.href='index.html'">
                ABELLA JOIAS
            </h1>
            <div class="w-12"></div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">
        <div class="mb-6">
            <h2 id="page-title" class="font-cinzel text-xl md:text-2xl font-bold tracking-wider text-zinc-100 uppercase">Coleção de Peças</h2>
            <p id="page-subtitle" class="text-xs text-zinc-500 mt-1 uppercase tracking-widest font-mono">Carregando estoque...</p>
        </div>

        <div id="loading" class="text-center py-12">
            <div class="inline-block w-6 h-6 border-2 border-zinc-800 border-t-[#caa85c] rounded-full animate-spin"></div>
        </div>

        <div id="grid-produtos" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
    </main>

    <script src="../js/firebase/firebase-config.js"></script>
    <script>
        let curCat = '';
        let curSub = '';

        function converterGsUrl(url) {
            let stringUrl = String(url ?? '').trim();
            if (!stringUrl) return '';

            if (stringUrl.includes('drive.google.com')) {
                try {
                    let idArquivo = '';
                    if (stringUrl.includes('/d/')) {
                        idArquivo = stringUrl.split('/d/')[1].split('/')[0];
                    } else if (stringUrl.includes('id=')) {
                        idArquivo = stringUrl.split('id=')[1].split('&')[0];
                    }
                    if (idArquivo) return `https://drive.google.com/uc?export=view&id=${idArquivo}`;
                } catch (err) { console.error(err); }
            }

            if (stringUrl.startsWith('gs://')) {
                try {
                    const semProtocolo = stringUrl.replace('gs://', '');
                    const primeiraBarra = semProtocolo.indexOf('/');
                    if (primeiraBarra === -1) return stringUrl;
                    const bucket = semProtocolo.substring(0, primeiraBarra);
                    const caminhoArquivo = semProtocolo.substring(primeiraBarra + 1);
                    return `https://firebasestorage.googleapis.com/v1/b/${bucket}/o/${encodeURIComponent(caminhoArquivo)}?alt=media`;
                } catch (e) { console.error(e); }
            }
            return stringUrl;
        }

        function handleImageError(img) {
            img.style.display = 'none';
            const fallback = img.parentNode.querySelector('.fallback-prod');
            if (fallback) fallback.style.setProperty('display', 'flex', 'important');
        }

        function sincronizarProdutos() {
            const grid = document.getElementById('grid-produtos');
            const subtitle = document.getElementById('page-subtitle');
            const loading = document.getElementById('loading');

            const db = window.firebase.database();
            const path = window.getAbellaPath ? window.getAbellaPath('products') : 'products';

            // Escuta ativa .on('value') para capturar alterações em tempo de execução feitas pelo Editor
            db.ref(path).on('value', (snapshot) => {
                if(loading) loading.classList.add('hidden');
                grid.innerHTML = '';

                const data = snapshot.val();
                if(!data) {
                    grid.innerHTML = `<p class="col-span-full text-center text-xs text-zinc-500 py-10">NENHUM PRODUTO ENCONTRADO.</p>`;
                    return;
                }

                const lista = Object.entries(data)
                    .map(([id, val]) => ({ id, ...val }))
                    .filter(p => !p.paused && p.category === curCat && (p.subcategory === curSub || p.subCategory === curSub));

                subtitle.innerText = `${lista.length} modelos disponíveis`;

                if(lista.length === 0) {
                    grid.innerHTML = `<p class="col-span-full text-center text-xs text-zinc-500 py-10">NENHUM PRODUTO ATIVO NESTA CATEGORIA.</p>`;
                    return;
                }

                lista.forEach(p => {
                    const imgFinal = converterGsUrl(p.image || p.imagem || '');

                    const card = document.createElement('div');
                    card.className = 'prod-card rounded-xl overflow-hidden flex flex-col group';

                    card.innerHTML = `
                        <div class="w-full aspect-square relative bg-zinc-950 flex items-center justify-center overflow-hidden">
                            <div class="fallback-prod absolute inset-0 flex items-center justify-center">💎</div>
                            <img 
                                src="${imgFinal}" 
                                alt="${p.name || 'Produto Abella'}" 
                                class="w-full h-full object-cover relative z-10"
                                onerror="handleImageError(this)"
                            >
                        </div>
                        <div class="p-3 flex-1 flex flex-col justify-between">
                            <div>
                                <h4 class="text-xs font-bold text-zinc-200 line-clamp-2 uppercase">${p.name || 'Sem Nome'}</h4>
                                <p class="text-[10px] text-zinc-500 font-mono mt-1">SKU: ${p.sku || 'N/A'}</p>
                            </div>
                            <div class="mt-3 pt-2 border-t border-zinc-900 flex justify-between items-center">
                                <span class="text-xs font-bold text-[#caa85c]">R$ ${(p.price || p.preco || 0).toFixed(2)}</span>
                                <span class="text-[9px] text-zinc-500 font-mono">${p.weight || p.peso || 0}g</span>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            });
        }

        function voltarPagina() {
            if (document.referrer && document.referrer.includes(window.location.hostname)) {
                window.history.back();
            } else {
                window.location.href = 'index.html';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            curCat = params.get('categoria') || '';
            curSub = params.get('subcategoria') || '';

            if(!curCat) {
                window.location.href = 'index.html';
                return;
            }
            sincronizarProdutos();
        });
    </script>
</body>
</html>
