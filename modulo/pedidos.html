<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-zinc-900 text-zinc-100 p-6 font-sans min-h-screen">

    <div class="max-w-7xl mx-auto space-y-4">
        <div class="text-left bg-zinc-950 p-6 rounded-2xl border border-zinc-800">
            <h2 class="text-xl font-bold text-white">📦 Dashboard de Pedidos & Romaneios</h2>
            <p class="text-xs text-zinc-500 mt-1">Monitore faturamento, altere o status logístico e imprima guias de expedição no bruto.</p>
        </div>

        <div id="loading" class="text-center py-12 text-zinc-500 text-xs uppercase tracking-widest">⏳ Mapeando registros de ordens de compra...</div>
        
        <div id="container-pedidos" class="grid grid-cols-1 gap-4 text-left"></div>
    </div>

    <script src="../js/firebase/firebase-config.js"></script>
    <script src="../js/utils/money.js"></script>
    <script src="../js/services/pedidoService.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => { carregarPainelPedidos(); });

        async function carregarPainelPedidos() {
            const container = document.getElementById('container-pedidos');
            const loading = document.getElementById('loading');
            container.innerHTML = '';
            loading.classList.remove('hidden');

            try {
                const pedidos = await pedidoService.listarTodos();
                loading.classList.add('hidden');

                const keys = Object.keys(pedidos).reverse(); // Mais recentes primeiro

                if(keys.length === 0) {
                    container.innerHTML = '<p class="text-zinc-500 text-xs italic py-8 text-center bg-zinc-950 rounded-2xl border border-zinc-800">Nenhum romaneio de compra registrado no banco.</p>';
                    return;
                }

                keys.forEach(id => {
                    const p = pedidos[id];
                    const div = document.createElement('div');
                    div.className = "bg-zinc-950 border border-zinc-800 rounded-2xl p-5 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 transition-all hover:border-zinc-700";
                    
                    let statusColor = "text-amber-400 bg-amber-500/10 border-amber-500/20";
                    if(p.status === "Aprovado") statusColor = "text-green-400 bg-green-500/10 border-green-500/20";
                    if(p.status === "Cancelado") statusColor = "text-red-400 bg-red-500/10 border-red-500/20";

                    div.innerHTML = `
                        <div class="space-y-1 flex-1 min-w-0 w-full">
                            <div class="flex flex-wrap items-center gap-2">
                                <span class="text-xs text-white font-black uppercase truncate max-w-[200px] md:max-w-xs block">${p.cliente}</span>
                                <span class="text-[9px] px-2.5 py-0.5 rounded-full font-bold border uppercase tracking-wider ${statusColor}">${p.status}</span>
                                <span class="text-[9px] font-mono text-zinc-500 font-medium">Ref ID: ${id}</span>
                            </div>
                            <p class="text-[11px] text-zinc-400 font-mono">⚡ Contato: ${p.whats} | Destino: ${p.cidade || 'Limeira/SP'} | Pagamento: ${p.formaPagamento}</p>
                            <p class="text-[11px] text-[#caa85c] font-bold font-mono">📦 Total Peças: ${p.totalPecas || 0} u | Massa Bruta: ${(p.pesoTotal || 0).toFixed(2)}g | Faturamento: ${window.MoneyUtils.format(p.total)}</p>
                        </div>
                        <div class="flex flex-wrap md:flex-nowrap gap-2 w-full md:w-auto shrink-0 pt-3 md:pt-0 border-t md:border-t-0 border-zinc-900">
                            <select onchange="alterarStatusPedidoUI('${id}', this.value)" class="bg-zinc-900 border border-zinc-800 text-zinc-300 text-[11px] px-3 py-1.5 rounded-xl font-bold outline-none focus:border-[#caa85c]">
                                <option value="Novo" ${p.status === 'Novo' ? 'selected' : ''}>Novo</option>
                                <option value="Aprovado" ${p.status === 'Aprovado' ? 'selected' : ''}>Aprovado</option>
                                <option value="Cancelado" ${p.status === 'Cancelado' ? 'selected' : ''}>Cancelado</option>
                            </select>
                            <button onclick="gerarRomaneioPDF('${id}')" class="bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-white font-bold text-[11px] px-4 py-1.5 rounded-xl transition-all">🖨️ Romaneio</button>
                            <button onclick="deletarPedidoUI('${id}')" class="bg-red-950/20 hover:bg-red-950/60 border border-red-900/40 text-red-400 font-bold text-[11px] px-3 py-1.5 rounded-xl transition-all">Deletar</button>
                        </div>
                    `;
                    container.appendChild(div);
                });
            } catch(e) { console.error(e); loading.innerText = "❌ Falha operacional ao processar painel de compras."; }
        }

        async function alterarStatusPedidoUI(id, valor) {
            await pedidoService.atualizarStatus(id, valor);
            await carregarPainelPedidos();
        }

        async function deletarPedidoUI(id) {
            if(confirm("Deseja expurgar permanentemente esta ordem de compra do histórico?")) {
                await pedidoService.deletar(id);
                await carregarPainelPedidos();
            }
        }

        async function gerarRomaneioPDF(id) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ unit: 'mm', format: [80, 150] }); // Formato Cupom Térmico 80mm
            
            const peds = await pedidoService.listarTodos();
            const p = peds[id];
            if(!p) return;

            doc.setFont("courier", "bold");
            doc.setFontSize(10);
            doc.text("ABELLA JOIAS - BRUTO", 40, 10, { align: "center" });
            doc.setFontSize(8);
            doc.text("GUIA DE EXPEDICAO / ROMANEIO", 40, 14, { align: "center" });
            doc.text("----------------------------------------", 40, 18, { align: "center" });
            
            doc.setFont("courier", "normal");
            doc.text(`CLIENTE: ${p.cliente.toUpperCase().substring(0, 22)}`, 5, 24);
            doc.text(`WHATSAPP: ${p.whats}`, 5, 28);
            doc.text(`DESTINO: ${(p.cidade || 'LIMEIRA').toUpperCase()}`, 5, 32);
            doc.text(`PAGAMENTO: ${p.formaPagamento.toUpperCase()}`, 5, 36);
            doc.text("----------------------------------------", 40, 42, { align: "center" });
            
            doc.setFont("courier", "bold");
            doc.text("ITENS DO PEDIDO:", 5, 48);
            
            let y = 54;
            doc.setFont("courier", "normal");
            
            const itensLista = p.itens ? Object.values(p.itens) : [];
            itensLista.forEach(item => {
                if(y > 130) { doc.addPage(); y = 10; }
                const nomeItem = String(item.nome || item.name || '').toUpperCase().substring(0, 18);
                const qtd = item.quantidade || 1;
                const totalLinha = window.MoneyUtils.format((item.price || item.precoFinal || 0) * qtd);
                doc.text(`${qtd}x ${nomeItem} ${totalLinha}`, 5, y);
                y += 5;
            });
            
            doc.text("----------------------------------------", 40, y+2, { align: "center" });
            doc.setFont("courier", "bold");
            doc.text(`TOTAL PECAS : ${p.totalPecas || 0} pçs`, 5, y + 8);
            doc.text(`MASSA BRUTA : ${(p.pesoTotal || 0).toFixed(2)}g`, 5, y + 12);
            doc.text(`VALOR FINAL : ${window.MoneyUtils.format(p.total)}`, 5, y + 16);
            
            doc.autoPrint();
            window.open(doc.output('bloburl'), '_blank');
        }
    </script>
</body>
</html>
