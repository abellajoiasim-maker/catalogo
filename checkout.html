<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Finalizar Pedido • Abella Joias</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }
        :root{
            --gold:#caa85c;
            --bg:#050505;
            --card:#111111;
            --line:#222222;
        }
        body{
            background: radial-gradient(circle at top,#171717 0%,#050505 45%);
            color:#fff;
            font-family:'Inter',sans-serif;
            min-height:100vh;
            overflow-x:hidden;
        }

        .back-button{
            display:flex;
            align-items:center;
            gap:12px;
            height:52px;
            padding:0 22px;
            border-radius:18px;
            background: linear-gradient(135deg, rgba(202,168,92,.18), rgba(202,168,92,.08));
            border:1px solid rgba(202,168,92,.35);
            color:#f5e7c2;
            font-size:12px;
            font-weight:900;
            letter-spacing:.18em;
            text-transform:uppercase;
            cursor:pointer;
            transition:.28s ease;
            backdrop-filter:blur(12px);
            box-shadow: 0 10px 30px rgba(0,0,0,.35);
        }
        .back-button:hover{
            transform:translateY(-2px);
            border-color:#caa85c;
            background: linear-gradient(135deg, rgba(202,168,92,.28), rgba(202,168,92,.12));
            box-shadow: 0 0 24px rgba(202,168,92,.18), 0 12px 34px rgba(0,0,0,.45);
        }
        .back-button:active{
            transform:scale(.98);
        }
        .back-button-icon{
            width:32px;
            height:32px;
            border-radius:12px;
            display:flex;
            align-items:center;
            justify-content:center;
            background:rgba(255,255,255,.08);
            font-size:16px;
            flex-shrink:0;
        }

        .serif{
            font-family:'Cinzel',serif;
        }
        .gold{
            color:var(--gold);
        }
        .glass{
            background:rgba(18,18,18,.92);
            backdrop-filter:blur(18px);
            border:1px solid rgba(255,255,255,.06);
        }
        .hero-glow{
            position:absolute;
            width:600px;
            height:600px;
            background: radial-gradient(circle, var(--gold) 0%, transparent 70%);
            opacity:.05;
            filter:blur(80px);
            pointer-events:none;
        }
        input, textarea, select{
            background:#181818 !important;
            border:1px solid #2b2b2b !important;
            color:#fff !important;
            transition:.25s ease;
        }
        input:focus, textarea:focus, select:focus{
            border-color:var(--gold) !important;
            box-shadow: 0 0 0 3px rgba(202,168,92,.15);
            outline:none;
        }
        .scrollbar::-webkit-scrollbar{
            width:6px;
        }
        .scrollbar::-webkit-scrollbar-thumb{
            background:#333;
            border-radius:20px;
        }
        .fade-in{
            animation:fade .35s ease forwards;
        }
        @keyframes fade{
            from{
                opacity:0;
                transform:translateY(10px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        @media(max-width:768px) {
            header .h-20 {
                height: auto;
                min-height: 76px;
                padding: 14px 0;
            }
            .back-button {
                height: 44px;
                padding: 0 16px;
                border-radius: 14px;
                gap: 8px;
            }
            .back-button span:last-child {
                display: none;
            }
            .back-button-icon {
                width: 28px;
                height: 28px;
                font-size: 14px;
            }
        }

        @media(max-width:640px){
            .back-button{
                width:100%;
                justify-content:center;
                height:54px;
                font-size:11px;
            }
            .back-button span:last-child {
                display: inline;
            }
        }
    </style>
</head>
<body class="pb-36 md:pb-24">[cite: 5]

    <div class="hero-glow top-[-200px] left-[-200px]"></div>
    <div class="hero-glow bottom-[-200px] right-[-200px]"></div>

    <header class="sticky top-0 z-50 border-b border-zinc-900 glass">
        <div class="max-w-7xl mx-auto px-4 md:px-6">
            <div class="h-20 flex items-center justify-between gap-4">
                <div class="flex items-center gap-3 md:gap-4 flex-1 min-w-0">
                    <button onclick="window.history.back()" class="back-button shrink-0">
                        <span class="back-button-icon">←</span>
                        <span>Voltar</span>
                    </button>

                    <div id="abellaLogoContainer" class="w-11 h-11 md:w-12 md:h-12 rounded-full overflow-hidden bg-gradient-to-br from-[#caa85c] to-[#8b6a2b] flex items-center justify-center border border-[#caa85c]/20 shadow-lg shadow-[#caa85c]/10 shrink-0">
                        <span id="abellaLogoFallback" class="text-black font-black text-xl serif">A</span>
                        <img id="abellaLogoImg" src="" alt="Abella Joias" class="w-full h-full object-cover hidden">
                    </div>

                    <div class="flex flex-col min-w-0">
                        <h1 class="serif gold text-sm md:text-xl font-bold uppercase tracking-[0.15em] leading-none truncate">
                            Abella Joias
                        </h1>
                        <p class="text-[9px] md:text-xs text-zinc-500 tracking-widest uppercase mt-1 truncate">
                            Atacado de Joias no Bruto
                        </p>
                    </div>
                </div>

                <a href="carrinho.html" class="h-12 px-5 rounded-2xl glass flex items-center justify-center text-[10px] font-black uppercase tracking-[0.15em] hover:border-[#caa85c] transition-all shrink-0 whitespace-nowrap">
                    &larr; Carrinho
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 md:px-8 py-10 fade-in">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- FORMULÁRIOS -->
            <div class="lg:col-span-7 space-y-6">
                <section class="glass rounded-[2rem] p-6">
                    <div class="flex items-center gap-3 border-b border-white/5 pb-4 mb-6">
                        <span class="w-2 h-6 bg-[#caa85c] rounded-full"></span>
                        <h2 class="serif text-xl">Dados do Cliente</h2>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="md:col-span-2">
                            <label class="block text-[11px] uppercase tracking-[0.2em] text-zinc-500 mb-2">Nome Completo *</label>
                            <input type="text" id="cli-nome" required class="w-full rounded-2xl px-5 py-4 text-sm" placeholder="Ex: João Silva">
                        </div>
                        <div>
                            <label class="block text-[11px] uppercase tracking-[0.2em] text-zinc-500 mb-2">WhatsApp *</label>
                            <input type="text" id="cli-whats" required class="w-full rounded-2xl px-5 py-4 text-sm" placeholder="(19) 99999-9999">
                        </div>
                        <div>
                            <label class="block text-[11px] uppercase tracking-[0.2em] text-zinc-500 mb-2">Cidade do Cliente *</label>
                            <input type="text" id="cli-cidade" required class="w-full rounded-2xl px-5 py-4 text-sm" placeholder="Ex: Limeira - SP">
                        </div>
                    </div>
                </section>

                <section class="glass rounded-[2rem] p-6">
                    <div class="flex items-center gap-3 border-b border-white/5 pb-4 mb-6">
                        <span class="w-2 h-6 bg-[#caa85c] rounded-full"></span>
                        <h2 class="serif text-xl">Entrega</h2>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
                        <div class="md:col-span-12">
                            <label class="block text-[11px] uppercase tracking-[0.2em] text-zinc-500 mb-2">Nome do Local de Entrega *</label>
                            <input type="text" id="ent-local" required class="w-full rounded-2xl px-5 py-4 text-sm" placeholder="Ex: Loja Centro Limeira">
                        </div>
                        <div class="md:col-span-8">
                            <label class="block text-[11px] uppercase tracking-[0.2em] text-zinc-500 mb-2">Rua *</label>
                            <input type="text" id="ent-rua" required class="w-full rounded-2xl px-5 py-4 text-sm" placeholder="Ex: Rua Boa Morte">
                        </div>
                        <div class="md:col-span-4">
                            <label class="block text-[11px] uppercase tracking-[0.2em] text-zinc-500 mb-2">Nº *</label>
                            <input type="text" id="ent-numero" required class="w-full rounded-2xl px-5 py-4 text-sm" placeholder="150">
                        </div>
                        <div class="md:col-span-6">
                            <label class="block text-[11px] uppercase tracking-[0.2em] text-zinc-500 mb-2">Bairro *</label>
                            <input type="text" id="ent-bairro" required class="w-full rounded-2xl px-5 py-4 text-sm" placeholder="Centro">
                        </div>
                        <div class="md:col-span-6">
                            <label class="block text-[11px] uppercase tracking-[0.2em] text-zinc-500 mb-2">Cidade *</label>
                            <input type="text" id="ent-cidade" required class="w-full rounded-2xl px-5 py-4 text-sm" placeholder="Limeira">
                        </div>
                    </div>
                </section>

                <section class="glass rounded-[2rem] p-6">
                    <div class="flex items-center gap-3 border-b border-white/5 pb-4 mb-6">
                        <span class="w-2 h-6 bg-[#caa85c] rounded-full"></span>
                        <h2 class="serif text-xl">Pagamento</h2>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <label class="border border-white/5 rounded-2xl p-5 cursor-pointer hover:border-[#caa85c] transition-all block">
                            <div class="flex items-center justify-between">
                                <div>
                                    <h3 class="font-black">PIX</h3>
                                    <p class="text-zinc-500 text-xs mt-1">Desconto automático</p>
                                </div>
                                <input type="radio" name="formaPagamento" value="PIX" checked onchange="atualizarResumo()">
                            </div>
                        </label>

                        <label class="border border-white/5 rounded-2xl p-5 cursor-pointer hover:border-[#caa85c] transition-all block">
                            <div class="flex items-center justify-between">
                                <div>
                                    <h3 class="font-black">Cartão</h3>
                                    <p class="text-zinc-500 text-xs mt-1">Parcelamento</p>
                                </div>
                                <input type="radio" name="formaPagamento" value="Cartão" onchange="atualizarResumo()">
                            </div>
                        </label>
                    </div>

                    <div class="mt-5">
                        <label class="block text-[11px] uppercase tracking-[0.2em] text-zinc-500 mb-2">Observações</label>
                        <textarea id="obs-pedido" rows="4" class="w-full rounded-2xl px-5 py-4 text-sm" placeholder="Informações adicionais..."></textarea>
                    </div>
                </section>
            </div>

            <!-- RESUMO FIXO COM BOTÕES CORRIGIDOS -->
            <div class="lg:col-span-5">
                <div class="glass rounded-[2rem] p-5 md:p-6 lg:sticky lg:top-24 shadow-2xl border border-white/10">
                    <div class="flex items-center gap-3 border-b border-white/5 pb-4 mb-6">
                        <span class="w-2 h-6 bg-[#caa85c] rounded-full"></span>
                        <h2 class="serif text-xl">Resumo</h2>
                    </div>

                    <div id="lista-itens-checkout" class="space-y-3 max-h-[320px] overflow-y-auto scrollbar pr-2"></div>

                    <div class="mt-6 border-t border-white/5 pt-5 space-y-3">
                        <div class="flex items-center justify-between text-sm">
                            <span class="text-zinc-500">Quantidade</span>
                            <span id="res-qtd" class="font-bold">0 pçs</span>
                        </div>
                        <div class="flex items-center justify-between text-sm">
                            <span class="text-zinc-500">Peso Total</span>
                            <span id="res-peso" class="font-bold">0,00 grs.</span>
                        </div>
                        <div class="flex items-center justify-between text-sm">
                            <span class="text-zinc-500">Subtotal</span>
                            <span id="res-subtotal" class="font-bold">R$ 0,00</span>
                        </div>
                        <div id="box-desconto" class="hidden flex items-center justify-between text-sm text-emerald-400">
                            <span>Desconto PIX</span>
                            <span id="res-desconto">- R$ 0,00</span>
                        </div>
                        <div class="flex items-center justify-between text-sm">
                            <span class="text-zinc-500">Frete</span>
                            <span id="res-frete" class="font-bold">R$ 0,00</span>
                        </div>
                        <div class="border-t border-white/5 pt-4 flex items-center justify-between mb-6">
                            <span class="uppercase tracking-[0.2em] text-sm font-black">Total</span>
                            <span id="res-total" class="text-3xl gold font-black">R$ 0,00</span>
                        </div>
                    </div>

                    <!-- BOTÕES SECUNDÁRIOS DE SUPORTE -->
                    <div class="grid grid-cols-3 gap-2 mb-4">
                        <button onclick="visualizarRomaneio()" class="whitespace-nowrap px-2 py-3.5 bg-zinc-900 border border-zinc-800 hover:bg-zinc-800 text-zinc-200 font-bold text-[10px] rounded-xl transition-all flex items-center justify-center gap-1 tracking-wide uppercase">
                            👁️ Romaneio
                        </button>
                        <button onclick="gerarPDF(false)" class="whitespace-nowrap px-2 py-3.5 bg-zinc-900 border border-zinc-800 hover:bg-zinc-800 text-zinc-200 font-bold text-[10px] rounded-xl transition-all flex items-center justify-center gap-1 tracking-wide uppercase">
                            📥 Baixar PDF
                        </button>
                        <button onclick="gerarPDF(true)" class="whitespace-nowrap px-2 py-3.5 bg-zinc-900 border border-zinc-800 hover:bg-zinc-800 text-zinc-200 font-bold text-[10px] rounded-xl transition-all flex items-center justify-center gap-1 tracking-wide uppercase">
                            🖨️ Imprimir
                        </button>
                    </div>

                    <!-- BOTÃO PRINCIPAL: FINALIZAR PEDIDO (TOTALMENTE VISÍVEL) -->
                    <button onclick="finalizarPedido()" class="w-full py-4 bg-[#caa85c] hover:bg-[#bfa054] text-black font-black text-xs md:text-sm rounded-xl transition-all flex items-center justify-center gap-2 tracking-widest uppercase shadow-lg shadow-[#caa85c]/20">[cite: 5]
                        🚀 Finalizar Pedido via WhatsApp
                    </button>
                </div>
            </div>

        </div>
    </main>

    <!-- MODAL ROMANEIO -->
    <div id="modal-romaneio" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden z-50 p-4 flex items-center justify-center">
        <div class="w-full max-w-3xl glass rounded-[2rem] overflow-hidden">
            <div class="h-16 px-6 border-b border-white/5 flex items-center justify-between">
                <h3 class="serif gold">Romaneio</h3>
                <button onclick="fecharModal()" class="text-zinc-500 hover:text-white text-2xl">&times;</button>
            </div>
            <div id="conteudo-romaneio" class="p-6 max-h-[70vh] overflow-y-auto scrollbar bg-zinc-950 text-zinc-100 font-mono text-sm leading-relaxed rounded-b-[2rem]"></div>
        </div>
    </div>

 <!-- SCRIPTS -->
    <script src="js/firebase/firebase-config.js"></script>
    <script src="js/utils/money.js"></script>
    <script src="js/utils/peso.js"></script>
    <script src="js/utils/storage.js"></script>
    <script src="js/utils/image-helper.js"></script>
    <script src="js/utils/imagens.js"></script>
    <script src="js/services/carrinhoService.js"></script>

    <!-- SEU ARQUIVO EXTERNO REFATORADO (checkout_2.js) -->
    <script src="js/services/checkout.js"></script>
</body>
</html>
