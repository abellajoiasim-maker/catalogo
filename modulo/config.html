<div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-6 text-left space-y-4">
    <div class="border-b border-zinc-800 pb-2">
        <h2 class="text-sm font-bold text-white uppercase tracking-wider font-mono">Configurações Gerais Operacionais</h2>
        <p class="text-[10px] text-zinc-500">Parâmetros globais de precificação, desconto e recebimento compartilhados em tempo real com a vitrine pública.</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="space-y-1">
            <label class="text-[10px] text-zinc-400 uppercase font-bold">Desconto Concedido à Vista PIX (%):</label>
            <input type="number" id="configPixDesc" class="w-full bg-black border border-zinc-800 rounded-xl px-3 py-2 text-white outline-none focus:border-[#caa85c]">
        </div>
        <div class="space-y-1">
            <label class="text-[10px] text-zinc-400 uppercase font-bold">Parcelamento Limite Sem Juros (Cartão):</label>
            <input type="number" id="configParcelas" class="w-full bg-black border border-zinc-800 rounded-xl px-3 py-2 text-white outline-none focus:border-[#caa85c]">
        </div>
        <div class="space-y-1 md:col-span-2">
            <label class="text-[10px] text-zinc-400 uppercase font-bold">WhatsApp de Destino dos Pedidos (DDI + DDD + Número):</label>
            <input type="text" id="configWhats" placeholder="Ex: 5519988207658" class="w-full bg-black border border-zinc-800 rounded-xl px-3 py-2 text-white outline-none focus:border-[#caa85c]">
        </div>
    </div>

    <div class="pt-2 flex justify-end">
        <button type="button" onclick="salvarConfiguracoesSistema()" class="bg-[#caa85c] hover:bg-[#bda152] text-black px-6 py-3 rounded-xl font-black uppercase text-[10px] tracking-widest transition-all">
            Gravar Configurações
        </button>
    </div>
</div>

<script>
    // CORRIGIDO: Migração estrutural completa do nó isolado para abella/settings para harmonizar com todo o ecossistema
    window.renderizarCamposConfiguracao = function() {
        window.db.ref('abella/settings').once('value', function(snapshot) {
            var settings = snapshot.val() || {};
            var emp = settings.empresa || {};
            
            document.getElementById('configPixDesc').value = settings.pix || emp.pix || 5;
            document.getElementById('configParcelas').value = settings.parcelas || emp.parcelas || 6;
            document.getElementById('configWhats').value = settings.whatsEmpresa || settings.whats || emp.whatsapp || "5519988207658";
        });
    };

    window.salvarConfiguracoesSistema = function() {
        var vPix = parseFloat(document.getElementById('configPixDesc').value) || 0;
        var vParc = parseInt(document.getElementById('configParcelas').value) || 1;
        var vWhats = document.getElementById('configWhats').value.trim();

        if(!vWhats) {
            alert("O preenchimento do número de WhatsApp da loja é obrigatório.");
            return;
        }

        // CORRIGIDO: Persistência direcionada ao nó corporativo central correto
        window.db.ref('abella/settings').set({
            pix: vPix,
            parcelas: vParc,
            whatsEmpresa: vWhats,
            ultimaModificacao: new Date().toISOString()
        }).then(function() {
            alert("Parâmetros globais aplicados com sucesso e sincronizados no nó público 'abella/settings'!");
        }).catch(function(err) {
            console.error("Falha na gravação dos parâmetros:", err);
            alert("Erro de permissão ou conexão ao gravar parâmetros.");
        });
    };
</script>
