<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Abella Joias • Catálogo Oficial</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { background:#0b0b0b; color:#eee; font-family:'Inter', sans-serif; min-height: 100vh; }
        .serif { font-family:'Cinzel', serif; }
        .gold { color:#caa85c; }
        .card { background:#141414; border:1px solid #2a2a2a; border-radius:20px; overflow:hidden; transition:.3s; }
        .card:hover { transform:translateY(-5px); border-color:#caa85c; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }
    </style>
</head>
<body>
    <header class="sticky top-0 bg-black/90 backdrop-blur border-b border-[#222] z-50">
        <div class="max-w-7xl mx-auto p-5 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="text-center md:text-left">
                <h1 id="nome" class="serif gold text-xl uppercase tracking-wide">Abella Joias</h1>
                <p id="slogan" class="text-[9px] text-gray-400 uppercase tracking-widest">Carregando catálogo corporativo...</p>
            </div>
            <a href="galvanicas.html" class="flex items-center gap-2 bg-gradient-to-r from-zinc-900 to-black border border-zinc-800 hover:border-[#caa85c] px-4 py-2.5 rounded-xl transition-all group">
                <span class="text-[11px] uppercase tracking-wider text-gray-300 group-hover:text-white">✨ Galvânicas Parceiras</span>
                <span class="gold text-xs font-bold bg-zinc-950 px-2 py-0.5 rounded-md border border-zinc-800 group-hover:border-[#caa85c]">Limeira ➔</span>
            </a>
            <a href="carrinho.html" class="bg-zinc-900 border border-zinc-800 hover:border-[#caa85c] px-4 py-2 rounded-xl text-xs font-medium transition-all flex items-center gap-2">
                🛒 Carrinho (<span id="cart-count" class="gold font-bold">0</span>) <span id="cart-total" class="text-gray-400 font-normal ml-1">R$ 0,00</span>
            </a>
        </div>
    </header>

    <div id="banner" class="hidden text-center py-3 border-b border-[#caa85c] bg-gradient-to-r from-black to-[#1a1a1a]">
        <span id="bannerTexto" class="gold font-bold text-xs uppercase tracking-widest"></span>
    </div>

    <div class="max-w-7xl mx-auto p-6 grid grid-cols-3 gap-4 text-center text-xs">
        <div class="card p-4 flex flex-col justify-center">
            <p class="text-gray-400 text-[10px] uppercase font-bold tracking-wider">Faturamento</p>
            <p id="parcelamento" class="gold font-black mt-1 text-sm">Até 6x no cartão</p>
        </div>
        <div class="card p-4 flex flex-col justify-center">
            <p class="text-gray-400 text-[10px] uppercase font-bold tracking-wider">Liquidação à Vista</p>
            <p id="pix" class="gold font-black mt-1 text-sm">5% OFF no PIX</p>
        </div>
        <div class="card p-4 flex flex-col justify-center">
            <p class="text-gray-400 text-[10px] uppercase font-bold tracking-wider">Suporte Direto</p>
            <a id="whats" target="_blank" class="gold font-black mt-1 text-sm block hover:underline">WhatsApp</a>
        </div>
    </div>

    <main class="max-w-7xl mx-auto p-6">
        <div id="loading" class="text-center py-12 text-zinc-500 font-medium text-xs tracking-widest uppercase">
            ⏳ Carregando Categorias Oficiais...
        </div>
        <div id="grid-categorias" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
    </main>

   <script src="js/firebase/firebase-config.js"></script>

<script src="js/utils/money.js"></script>

<script src="js/utils/storage.js"></script>

<script src="js/services/carrinhoService.js"></script>

<script src="js/services/categoriaService.js"></script>

<script src="js/services/produtoService.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            atualizarMiniCarrinho();
            await carregarConfiguracoesVitrine();
            await carregarCategorias();
        });

       function atualizarMiniCarrinho() {

    const resumo =
        carrinhoService.obterResumo();

    document.getElementById('cart-count').innerText =
        resumo.totalItens;

    document.getElementById('cart-total').innerText =
        MoneyUtils.format(
            resumo.subtotal
        );
}
        async function carregarConfiguracoesVitrine() {
            try {
                const snap = await firebase.database().ref('abella/settings').once('value');
                if(snap.exists()) {
                    const cfg = snap.val() || {};
                    const emp = cfg.empresa || {};
                    document.getElementById('nome').innerText = emp.nome || "Abella Joias";
                    document.getElementById('slogan').innerText = emp.slogan || "Catálogo de Joias no Bruto";
                    document.getElementById('parcelamento').innerText = `Até ${cfg.parcelas || emp.parcelas || 6}x no cartão`;
                    document.getElementById('pix').innerText = `${cfg.pix || emp.pix || 5}% OFF no PIX`;
                    const fone = (cfg.whatsapp || emp.whatsapp || "5519988207658").replace(/\D/g, '');
                    document.getElementById('whats').href = `https://wa.me/${fone}`;
                    
                    if (cfg.bannerAtivo === true || cfg.bannerAtivo === "true") {
                        document.getElementById('bannerTexto').innerText = cfg.bannerTexto || "";
                        document.getElementById('banner').classList.remove('hidden');
                    }
                }
            } catch(e) {
                console.error("Erro ao ler configurações da vitrine", e);
            }
        }

        async function carregarCategorias() {
            const grid = document.getElementById('grid-categorias');
            const loading = document.getElementById('loading');
            try {
                const categorias = await categoriaService.listarTodas();
                grid.innerHTML = '';
                loading.classList.add('hidden');

                if(!categorias || categorias.length === 0) {
                    grid.innerHTML = `<p class="col-span-full text-zinc-500 text-xs italic py-6">Nenhuma categoria ativa cadastrada.</p>`;
                    return;
                }

                categorias.forEach(cat => {
                    if(cat.paused) return;
                    const card = document.createElement('div');
                    card.className = "card cursor-pointer flex flex-col justify-between animate-fade-in";
                   card.onclick = () => {
    window.location.href =
        `subcategorias.html?id=${cat.slug}`;
};
                    
                    const img = cat.image || cat.imagem || 'https://via.placeholder.com/400/141414/818cf8?text=Abella+Joias';
                    
                    card.innerHTML = `
                        <div class="aspect-square bg-zinc-950 overflow-hidden flex items-center justify-center">
                            <img src="${img}" class="w-full h-full object-cover hover:scale-105 transition-all duration-300" onerror="this.src='https://via.placeholder.com/400/141414/818cf8?text=Sem+Imagem'">
                        </div>
                        <div class="p-4 bg-zinc-900/20 border-t border-zinc-900/60 flex items-center justify-between">
                            <span class="text-xs font-bold uppercase text-white truncate tracking-wide">${cat.name}</span>
                            <span class="gold text-xs">➔</span>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (error) {
                console.error("Erro ao listar categorias na UI:", error);
                loading.innerText = "❌ Falha ao carregar as categorias da vitrine.";
            }
        }
    </script>
</body>
</html>
