<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Abella Joias • Produtos da Coleção</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght=600&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body { background:#0b0b0b; color:#eee; font-family:'Inter', sans-serif; min-height: 100vh; }
        .serif { font-family:'Cinzel', serif; }
        .gold { color:#caa85c; }
        .card { background:#141414; border:1px solid #2a2a2a; border-radius:20px; overflow:hidden; transition:.3s; }
        .card:hover { transform:translateY(-5px); border-color:#caa85c; }
        .badge { position:absolute; top:12px; right:12px; font-size:9px; padding:4px 10px; border-radius:20px; font-weight:800; color:#000; z-index: 10; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }

        /* Impede adição ao carrinho ou cliques nos produtos caso o catálogo esteja suspenso */
        .catalogo-suspenso .btn-adicionar { opacity: 0.4; pointer-events: none; cursor: not-allowed; filter: grayscale(1); }
        .catalogo-suspenso .card-produto-link { pointer-events: none; }
    </style>
</head>
<body>

    <header class="sticky top-0 bg-black/90 backdrop-blur border-b border-[#222] z-50">
        <div class="max-w-7xl mx-auto p-5 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="text-center md:text-left">
                <h1 id="nome" class="serif gold text-xl uppercase tracking-wide" style="cursor:pointer;" onclick="location.href='index.html'">Abella Joias</h1>
                <p id="slogan" class="text-[9px] text-gray-400 uppercase tracking-widest">Carregando catálogo corporativo...</p>
            </div>

            <a href="galvanicas.html" class="flex items-center gap-2 bg-gradient-to-r from-zinc-900 to-black border border-zinc-800 hover:border-[#caa85c] px-4 py-2.5 rounded-xl transition-all group">
                <span class="text-[11px] uppercase tracking-wider text-gray-300 group-hover:text-white">✨ Galvânicas Parceiras</span>
                <span class="gold text-xs font-bold bg-zinc-950 px-2 py-0.5 rounded-md border border-zinc-800 group-hover:border-[#caa85c]">Limeira ➔</span>
            </a>

            <div class="flex items-center gap-3">
                <a href="index.html" class="text-zinc-400 hover:text-white text-xs font-medium transition-all">🔀 Voltar</a>
                <a href="carrinho.html" class="bg-zinc-900 border border-zinc-800 hover:border-[#caa85c] px-4 py-2 rounded-xl text-xs font-medium transition-all flex items-center gap-2">
                    🛒 Carrinho (<span id="cart-count" class="gold font-bold">0</span>) <span id="cart-total" class="text-gray-400 font-normal ml-1">R$ 0,00</span>
                </a>
            </div>
        </div>
    </header>

    <div id="banner" class="hidden text-center py-3 border-b border-[#caa85c] bg-gradient-to-r from-black to-[#1a1a1a]">
        <span id="bannerTexto" class="gold font-bold text-xs uppercase tracking-widest"></span>
    </div>

    <div class="max-w-7xl mx-auto p-6 grid grid-cols-3 gap-4 text-center text-xs">
        <div class="card p-4 flex flex-col justify-center">
            <p class="text-gray-400 text-[10px] uppercase font-bold tracking-wider">Faturamento</p>
            <p id="parcelamento" class="gold font-black mt-1 text-sm">Até 6x no cartão</p>
        </div>
        <div class="card p-4 flex flex-col justify-center">
            <p class="text-gray-400 text-[10px] uppercase font-bold tracking-wider">Liquidação à Vista</p>
            <p id="pix" class="gold font-black mt-1 text-sm">5% OFF no PIX</p>
        </div>
        <div class="card p-4 flex flex-col justify-center">
            <p class="text-gray-400 text-[10px] uppercase font-bold tracking-wider">Suporte Direto</p>
            <a id="whats" target="_blank" class="gold font-black mt-1 text-sm block hover:underline">WhatsApp</a>
        </div>
    </div>

    <main class="max-w-7xl mx-auto p-6">
        <div class="flex flex-col md:flex-row md:items-center justify-between border-b border-zinc-900 pb-3 mb-6 gap-2">
            <h2 id="titulo-colecao" class="serif text-xl tracking-wider uppercase">Carregando Coleção...</h2>
            <span id="contador-produtos" class="text-[10px] bg-zinc-900 border border-zinc-800 font-mono px-3 py-1 rounded-md text-zinc-400 uppercase tracking-wider">Procurando itens...</span>
        </div>
        
        <div id="grid-produtos" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <div class="text-center py-10 text-gray-600 italic col-span-full">Buscando joias disponíveis no Firebase...</div>
        </div>
    </main>

    <script>
        // ====== CONFIGURAÇÃO BANCO MESTRE ISOLADO ======
        const firebaseConfig = {
            apiKey: "AIzaSyDPBZSxW8XjtQmDMUknzAyIlFda51MvMJY",
            databaseURL: "https://catalogo-abella-joias-default-rtdb.firebaseio.com"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        const fM = v => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v || 0);

        // Objeto global de regras ativo na memória para outros scripts e cálculos de desconto
        window.configuracoesAtivas = {};

        // Captura o ID da categoria enviado pela URL (ex: produtos.html?id=aneis)
        const urlParams = new URLSearchParams(window.location.search);
        const categoriaId = urlParams.get('id');

        async function init(){
            if(!categoriaId) {
                document.getElementById('titulo-colecao').innerText = "Coleção não informada";
                document.getElementById('grid-produtos').innerHTML = '<p class="text-xs text-gray-500 col-span-full py-10 text-center">Por favor, retorne à vitrine e selecione uma coleção válida.</p>';
                return;
            }

            // 1. Sincronização dinâmica com as Configurações Globais (Alinhamento em Tempo Real)
            db.ref('abella/settings').on('value', snap => {
                if(!snap.exists()) {
                    document.getElementById("slogan").innerText = "Atacado de Joias no Bruto";
                    return;
                }
                
                const settingsGerais = snap.val() || {};
                window.configuracoesAtivas = settingsGerais; // Alinha globalmente o barramento
                
                // Aplica textos de identidade do cabeçalho
                document.getElementById("nome").innerText = settingsGerais.name || "Abella Joias";
                document.getElementById("slogan").innerText = settingsGerais.slogan || "Atacado de Joias no Bruto";
                
                // Exibição condicional da barra de avisos
                if(settingsGerais.bannerAtivo && settingsGerais.bannerTexto) {
                    document.getElementById("bannerTexto").innerText = settingsGerais.bannerTexto;
                    document.getElementById("banner").classList.remove("hidden");
                } else {
                    document.getElementById("banner").classList.add("hidden");
                }

                // Injeta as regras financeiras vigentes do painel nos cards
                const parc = settingsGerais.parcelas || 6;
                document.getElementById("parcelamento").innerText = `Até ${parc}x no cartão`;
                
                const pixDesc = settingsGerais.pix !== undefined ? settingsGerais.pix : 5;
                document.getElementById("pix").innerText = `${pixDesc}% OFF no PIX`;
                
                // WhatsApp dinâmico
                const wppNum = settingsGerais.whatsapp;
                if(wppNum) {
                    document.getElementById("whats").href = `https://wa.me/${wppNum.replace(/\D/g, '')}`;
                } else {
                    document.getElementById("whats").removeAttribute('href');
                }

                // Aplica restrições operacionais imediatas no layout de produtos
                if (settingsGerais.statusLoja && settingsGerais.statusLoja !== 'aberto') {
                    document.body.classList.add('catalogo-suspenso');
                    if (settingsGerais.statusLoja === 'manutencao') {
                        document.getElementById("slogan").innerText = "🔧 PRODUTOS APENAS PARA VISUALIZAÇÃO";
                    } else if (settingsGerais.statusLoja === 'fechado') {
                        document.getElementById("slogan").innerText = "🚪 PEDIDOS SUSPENSOS TEMPORARIAMENTE";
                    }
                } else {
                    document.body.classList.remove('catalogo-suspenso');
                }
            });

            // 2. Busca o Nome Real da Categoria Selecionada
            db.ref(`abella/categories/${categoriaId}`).once('value').then(snap => {
                if(snap.exists()) {
                    const catData = snap.val() || {};
                    document.getElementById('titulo-colecao').innerText = catData.name || catData.nome || categoriaId.replace(/-/g, ' ');
                } else {
                    document.getElementById('titulo-colecao').innerText = categoriaId.replace(/-/g, ' ');
                }
            });

            // 3. Renderização Dinâmica e Sincronizada dos Produtos da Categoria
            db.ref('abella/products').orderByChild('category').equalTo(categoriaId).on('value', snap => {
                const grid = document.getElementById('grid-produtos');
                grid.innerHTML = '';
                
                if(!snap.exists()) {
                    document.getElementById('contador-produtos').innerText = "0 Itens";
                    grid.innerHTML = '<p class="text-xs text-gray-500 col-span-full py-14 text-center italic">Nenhum produto cadastrado nesta coleção até o momento.</p>';
                    return;
                }

                let totalProdutos = 0;

                snap.forEach(child => {
                    const prodId = child.key;
                    const prod = child.val() || {};

                    // Ignora produtos pausados
                    if(prod.paused === true || prod.paused === "true") return;

                    totalProdutos++;

                    const precoBase = parseFloat(prod.price || prod.preco || 0);
                    const urlImagem = prod.image || prod.imagem || 'https://via.placeholder.com/400?text=Sem+Foto';
                    const codigoProd = prod.code || prod.codigo || prodId;
                    const pesoProd = prod.weight || prod.peso ? `${prod.weight || prod.peso}g` : 'N/A';

                    // Tag de Oferta Individual se o produto tiver desconto aplicado nele
                    const emOferta = prod.promo === true || prod.promo === "true" || (prod.oldPrice && parseFloat(prod.oldPrice) > precoBase);
                    const badgePromo = emOferta ? `<span class="badge bg-amber-500">PROMO</span>` : '';

                    grid.innerHTML += `
                        <div class="card relative flex flex-col justify-between animate-fade-in">
                            ${badgePromo}
                            <div class="card-produto-link w-full">
                                <div class="overflow-hidden aspect-square w-full bg-zinc-950 flex items-center justify-center">
                                    <img src="${urlImagem}" class="w-full h-full object-cover hover:scale-105 transition-all duration-500" loading="lazy">
                                </div>
                                <div class="p-4 space-y-1">
                                    <span class="text-[9px] font-mono text-zinc-500 tracking-wider uppercase">Ref: ${codigoProd} • Peso: ${pesoProd}</span>
                                    <h3 class="font-bold text-xs text-white truncate uppercase tracking-wide">${prod.name || prod.nome || 'Joia Sem Nome'}</h3>
                                    <p class="text-sm font-black gold mt-1">${fM(precoBase)} <span class="text-[10px] text-zinc-500 font-normal">no bruto</span></p>
                                </div>
                            </div>
                            <div class="px-4 pb-4 border-t border-zinc-900/60 pt-3">
                                <button onclick="window.adicionarAoCarrinhoMestre('${prodId}', '${prod.name || 'Joia'}', ${precoBase}, '${urlImagem}')" class="btn-adicionar w-full bg-zinc-900 border border-zinc-800 hover:border-[#caa85c] hover:bg-black text-white text-[11px] font-bold py-2.5 rounded-xl uppercase tracking-wider transition-all">
                                    ➕ Adicionar
                                </button>
                            </div>
                        </div>
                    `;
                });

                document.getElementById('contador-produtos').innerText = `${totalProdutos} ${totalProdutos === 1 ? 'Item' : 'Itens'}`;

                if(totalProdutos === 0) {
                    grid.innerHTML = '<p class="text-xs text-gray-500 col-span-full py-14 text-center italic">Nenhum produto ativo nesta coleção no momento.</p>';
                }
            });

            atualizarCarrinho();
        }

        // Função de Inserção Integrada no Carrinho LocalStorage (Resiliente)
        window.adicionarAoCarrinhoMestre = function(id, nome, preco, imagem) {
            let carrinho = JSON.parse(localStorage.getItem('carrinho') || '[]');
            
            const indexItem = carrinho.findIndex(item => item.id === id);

            if(indexItem > -1) {
                carrinho[indexItem].quantidade = (parseInt(carrinho[indexItem].quantidade) || 1) + 1;
            } else {
                carrinho.push({
                    id: id,
                    name: nome,
                    preco: preco,
                    precoFinal: preco,
                    quantidade: 1,
                    image: imagem
                });
            }

            localStorage.setItem('carrinho', JSON.stringify(carrinho));
            atualizarCarrinho();
        };

        // LÓGICA DE EXIBIÇÃO DO CARRINHO
        function atualizarCarrinho(){
            const cart = JSON.parse(localStorage.getItem('carrinho') || '[]');
            let totalPecas = 0;
            let valorTotal = 0;
            
            cart.forEach(item => {
                let qtd = parseInt(item.quantidade) || 1;
                let preco = parseFloat(item.precoFinal || item.preco || 0);
                
                totalPecas += qtd;
                valorTotal += (preco * qtd);
            });
            
            const elCount = document.getElementById('cart-count');
            const elTotal = document.getElementById('cart-total');
            
            if(elCount) elCount.innerText = totalPecas;
            if(elTotal) elTotal.innerText = fM(valorTotal);
        }

        window.addEventListener('pageshow', atualizarCarrinho);
        window.onload = init;
    </script>
</body>
</html>
