<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Módulo Administrativo • Gestão de Subcategorias</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold: #caa85c;
            --gold-hover: #b5944a;
            --bg-dark: #070707;
            --card-dark: #121212;
            --border-dark: #222222;
        }
        body { 
            background: var(--bg-dark); 
            color: #eee; 
            font-family: 'Inter', sans-serif; 
        }
        .serif { 
            font-family: 'Cinzel', serif; 
        }
        .gold-text { 
            color: var(--gold); 
        }
        .glass-panel {
            background: rgba(18, 18, 18, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-dark);
        }
        .input-dark {
            background: #181818 !important; 
            border: 1px solid #282828 !important; 
            color: white !important;
            padding: 12px 14px; 
            border-radius: 12px; 
            width: 100%;
            font-size: 12px; 
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .input-dark:focus { 
            border-color: var(--gold) !important; 
            outline: none; 
            background: #222 !important; 
            box-shadow: 0 0 0 3px rgba(202, 168, 92, 0.15);
        }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--gold); }
    </style>
</head>
<body class="p-4 md:p-8 antialiased">

    <div id="toast-container" class="fixed bottom-6 right-6 z-50 pointer-events-none space-y-3"></div>

    <div class="max-w-7xl mx-auto space-y-6">
        
        <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-zinc-950/60 p-6 rounded-2xl border border-zinc-900 gap-4">
            <div class="flex items-center gap-4">
                <a href="index.html" class="h-10 px-4 rounded-xl border border-zinc-800 flex items-center justify-center text-xs uppercase font-bold tracking-wider text-zinc-400 hover:text-white hover:border-zinc-700 transition-colors">
                    ← Menu
                </a>
                <div>
                    <h1 class="serif gold-text text-xl uppercase tracking-[0.15em]">Subcategorias Relacionais</h1>
                    <p class="text-[10px] text-zinc-500 uppercase tracking-widest mt-0.5">Gerenciamento de Subnós da Árvore de Categorias</p>
                </div>
            </div>
            <div class="flex items-center gap-2 bg-zinc-900/60 px-4 py-2 rounded-xl border border-zinc-800/50">
                <span class="w-2 h-2 rounded-full bg-[#caa85c] animate-pulse"></span>
                <span class="text-[11px] font-mono text-zinc-400 tracking-wider">ECOSYSTEM OVER getAbellaPath()</span>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <div class="lg:col-span-4 glass-panel p-6 rounded-3xl h-fit space-y-5 shadow-2xl">
                <div class="flex items-center gap-2 border-b border-zinc-900 pb-3">
                    <span class="w-1.5 h-4 bg-[#caa85c] rounded-full"></span>
                    <h3 id="formTitulo" class="serif text-xs font-bold text-white uppercase tracking-wider">Nova Subcategoria</h3>
                </div>
                
                <form id="formSubcat" class="space-y-4 text-left" onsubmit="executingSalvamentoSubUI(event)">
                    <input type="hidden" id="subOldSlug">
                    <input type="hidden" id="subOldCatMaeSlug">
                    
                    <div class="space-y-1.5">
                        <label class="text-[10px] uppercase text-zinc-400 font-bold tracking-wider">Selecione a Categoria Mãe *</label>
                        <select id="selectCatMae" required class="input-dark">
                            <option value="">Sincronizando categorias...</option>
                        </select>
                    </div>

                    <div class="space-y-1.5">
                        <label class="text-[10px] uppercase text-zinc-400 font-bold tracking-wider">Título da Subcategoria *</label>
                        <input type="text" id="subName" required placeholder="Ex: Chokers, Argolas, Aneis" class="input-dark">
                    </div>
                    
                    <div class="space-y-1.5">
                        <label class="text-[10px] uppercase text-zinc-400 font-bold tracking-wider">Caminho da Imagem (Opcional)</label>
                        <input type="text" id="subImage" placeholder="Ex: images/produtos/chokers.jpg ou gs://" class="input-dark">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div class="space-y-1.5">
                            <label class="text-[10px] uppercase text-zinc-400 font-bold tracking-wider">Ordem (Index)</label>
                            <input type="number" id="subOrder" value="0" min="0" class="input-dark text-center font-mono">
                        </div>
                        <div class="space-y-1.5">
                            <label class="text-[10px] uppercase text-zinc-400 font-bold tracking-wider">Estado Visual</label>
                            <select id="subStatus" class="input-dark">
                                <option value="ativo">Ativo (Visível)</option>
                                <option value="pausado">Pausado (Oculto)</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="flex gap-2 pt-2">
                        <button type="button" id="btnCancelarEdicao" onclick="resetarFormularioEstado()" class="hidden w-1/3 bg-zinc-900 hover:bg-zinc-800 text-zinc-400 font-bold py-3 rounded-xl text-[10px] uppercase tracking-wider transition-all border border-zinc-800">
                            Cancelar
                        </button>
                        <button type="submit" class="flex-1 bg-[#caa85c] hover:bg-[#b5944a] text-black font-black py-3 rounded-xl text-[10px] uppercase tracking-wider transition-all shadow-lg active:scale-[0.98]">
                            Gravar Subnó Mestre
                        </button>
                    </div>
                </form>
            </div>

            <div class="lg:col-span-8 glass-panel p-6 rounded-3xl flex flex-col shadow-2xl">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-zinc-900 pb-4 mb-4 gap-3">
                    <div class="flex items-center gap-2">
                        <span class="w-1.5 h-4 bg-[#caa85c] rounded-full"></span>
                        <h3 class="serif text-xs font-bold text-white uppercase tracking-wider">Estruturas Ativas na Árvore</h3>
                    </div>
                    <div class="flex items-center gap-2 w-full sm:w-auto bg-zinc-950 px-3 py-1.5 rounded-xl border border-zinc-900">
                        <span class="text-[9px] uppercase font-mono text-zinc-500 whitespace-nowrap">Filtrar Categoria:</span>
                        <select id="filtroCatMae" onchange="renderizarSubcategoriasFiltradas()" class="bg-transparent text-[11px] text-[#caa85c] font-bold uppercase tracking-wider outline-none cursor-pointer">
                            <option value="">Todas</option>
                        </select>
                    </div>
                </div>
                
                <div id="loading" class="text-center py-16 text-[#caa85c] text-xs font-mono uppercase tracking-widest animate-pulse">
                    ⏳ Estabelecendo conexão segura com Firebase Realtime Database...
                </div>
                
                <div id="lista-subcategorias" class="space-y-3 overflow-y-auto max-h-[65vh] pr-1"></div>
            </div>
        </div>
    </div>

    <script>
        // Singleton Database Handler em total conformidade com o barramento do contexto global
        const db = window.db || firebase.database();

        // Injetor Dinâmico de Segurança para Resolução Multiloja
        if (typeof window.getAbellaPath !== 'function') {
            window.getAbellaPath = function(node) {
                const root = window.ABELLA_DB_ROOT || 'abella';
                return node ? `${root}/${node}` : root;
            };
        }

        const DOM = {
            form: document.getElementById('formSubcat'),
            titulo: document.getElementById('formTitulo'),
            oldSlug: document.getElementById('subOldSlug'),
            oldCatSlug: document.getElementById('subOldCatMaeSlug'),
            selectCatMae: document.getElementById('selectCatMae'),
            filtroCatMae: document.getElementById('filtroCatMae'),
            name: document.getElementById('subName'),
            image: document.getElementById('subImage'),
            order: document.getElementById('subOrder'),
            status: document.getElementById('subStatus'),
            btnCancelar: document.getElementById('btnCancelarEdicao'),
            loading: document.getElementById('loading'),
            lista: document.getElementById('lista-subcategorias')
        };

        // Cache local estrutural otimizado contra vazamento de memória e chamadas cíclicas
        let categoriasCache = {};

        document.addEventListener('DOMContentLoaded', carregarCategoriasEAtivar);

        /**
         * Emite Toasts Customizados Premium na Área Administrativa
         */
        function spawnAdminToast(msg, isError = false) {
            const container = document.getElementById('toast-container');
            if (!container) return;

            const toast = document.createElement('div');
            toast.className = `px-5 py-4 rounded-xl text-xs font-bold uppercase tracking-wider transition-all duration-300 transform translate-y-4 opacity-0 flex items-center gap-3 border shadow-xl ${
                isError 
                ? 'bg-rose-950/90 text-rose-300 border-rose-800' 
                : 'bg-zinc-900/95 text-emerald-400 border-zinc-800'
            }`;
            toast.innerHTML = `<span>${isError ? '⚠️' : '✅'}</span> <span>${msg}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-4', 'opacity-0'), 50);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        /**
         * Executa a carga atômica do nó pai e monta os seletores relacionais
         */
        async function carregarCategoriasEAtivar() {
            try {
                const path = window.getAbellaPath('categories');
                const snap = await db.ref(path).once('value');
                categoriasCache = snap.val() || {};
                
                DOM.selectCatMae.innerHTML = '<option value="">— SELECONE A CATEGORIA MÃE —</option>';
                DOM.filtroCatMae.innerHTML = '<option value="">MOSTRAR TODAS</option>';

                Object.entries(categoriasCache).forEach(([catSlug, cat]) => {
                    const nomeStr = cat.name || catSlug;

                    const optForm = document.createElement('option');
                    optForm.value = catSlug;
                    optForm.innerText = nomeStr.toUpperCase();
                    DOM.selectCatMae.appendChild(optForm);

                    const optFiltro = document.createElement('option');
                    optFiltro.value = catSlug;
                    optFiltro.innerText = nomeStr.toUpperCase();
                    DOM.filtroCatMae.appendChild(optFiltro);
                });

                renderizarSubcategoriasFiltradas();

            } catch (err) {
                console.error("Erro Forense Crítico ao processar mapeamento de nós mães:", err);
                DOM.loading.innerText = "❌ Falha crítica de permissão ou rede ao ler chaves do Firebase.";
                spawnAdminToast("Não foi possível carregar as categorias mães.", true);
            }
        }

        /**
         * Renderiza as subcategorias ordenadas a partir do Cache de Memória
         */
        function renderizarSubcategoriasFiltradas() {
            DOM.lista.innerHTML = '';
            DOM.loading.classList.remove('hidden');

            const filtroAtivo = DOM.filtroCatMae.value;
            let listaAgrupada = [];

            // Extrai as subcategorias normalizando o schema legado para o padrão global (paused)
            Object.entries(categoriasCache).forEach(([catSlug, cat]) => {
                if (filtroAtivo && catSlug !== filtroAtivo) return;
                
                const subs = cat.subcategories || {};
                Object.entries(subs).forEach(([subSlug, subData]) => {
                    // Normalização do estado lógico para compatibilidade estrita com o catálogo
                    let isPaused = false;
                    if (subData.paused !== undefined) {
                        isPaused = !!subData.paused;
                    } else if (subData.status === 'pausado') {
                        isPaused = true;
                    }

                    listaAgrupada.push({
                        catSlug,
                        subSlug,
                        name: subData.name || subSlug,
                        image: subData.image || '',
                        order: parseInt(subData.order) || 0,
                        paused: isPaused
                    });
                });
            });

            DOM.loading.classList.add('hidden');

            if (listaAgrupada.length === 0) {
                DOM.lista.innerHTML = `<p class="text-zinc-600 text-xs italic py-12 text-center font-mono">[Nenhuma estrutura de subnó vinculada para exibição]</p>`;
                return;
            }

            // Ordenação pelo índice numérico estipulado
            listaAgrupada.sort((a, b) => a.order - b.order);

            listaAgrupada.forEach(item => {
                const nomeMae = categoriasCache[item.catSlug]?.name || item.catSlug;
                const card = document.createElement('div');
                
                card.className = `flex flex-col sm:flex-row sm:items-center justify-between p-4 bg-zinc-900/40 border rounded-2xl gap-4 transition-all hover:bg-zinc-900/80 ${
                    item.paused 
                    ? 'border-rose-950/40 bg-rose-950/5 opacity-60' 
                    : 'border-zinc-800/80'
                }`;

                card.innerHTML = `
                    <div class="min-w-0 flex-1">
                        <div class="flex flex-wrap items-center gap-2 mb-1.5">
                            <span class="text-sm font-bold ${item.paused ? 'text-rose-400/80 line-through' : 'text-white'} uppercase tracking-wide">${item.name}</span>
                            <span class="text-[9px] px-2.5 py-0.5 bg-zinc-950 text-[#caa85c] rounded-md border border-zinc-800 uppercase font-mono font-bold tracking-wider">↳ MÃE: ${nomeMae}</span>
                            ${item.paused ? '<span class="text-[8px] px-2 py-0.5 bg-rose-950 text-rose-300 rounded border border-rose-800 uppercase font-bold tracking-widest">PAUSADO (OCULTO)</span>' : ''}
                        </div>
                        <p class="text-[10px] text-zinc-500 font-mono truncate">PATH: abella/categories/${item.catSlug}/subcategories/${item.subSlug} | Ordem: ${item.order}</p>
                    </div>
                    <div class="flex items-center gap-2 justify-end">

    <button
        type="button"
        onclick="window.location.href='produtos.html?subcategoria=${item.subSlug}'"
        class="bg-blue-950 hover:bg-blue-900 text-blue-300 border border-blue-800 px-3 py-2 text-[10px] font-bold rounded-xl transition-all uppercase tracking-wider">
        📦 Produtos
    </button>

    <button
        type="button"
        onclick="ativarModoEdicao('${item.catSlug}', '${item.subSlug}', \`${item.name}\`, '${item.image}', ${item.order}, ${item.paused})"
        class="bg-zinc-950 hover:bg-zinc-800 text-zinc-300 border border-zinc-800 px-3 py-2 text-[10px] font-bold rounded-xl transition-all uppercase tracking-wider">
        Editar
    </button>

    <button
        type="button"
        onclick="alternarEstadoPausa('${item.catSlug}', '${item.subSlug}', ${item.paused})"
        class="bg-zinc-950 border border-zinc-800 px-3 py-2 text-[10px] font-bold rounded-xl transition-all uppercase tracking-wider ${item.paused ? 'text-emerald-400 hover:bg-emerald-950/20' : 'text-amber-500 hover:bg-amber-950/20'}">
        ${item.paused ? 'Reativar' : 'Pausar'}
    </button>

    <button
        type="button"
        onclick="executarRemocaoSub('${item.catSlug}', '${item.subSlug}')"
        class="bg-rose-950/20 hover:bg-rose-900 text-rose-400 hover:text-white border border-rose-900/30 px-3 py-2 text-[10px] font-bold rounded-xl transition-all uppercase">
        🗑️
    </button>

</div>
                `;
                DOM.lista.appendChild(card);
            });
        }

        /**
         * Migra e distribui chaves e valores estruturais para o formulário de mutação
         */
       function ativarModoEdicao(catSlug, subSlug, name, img, order, isPaused) {
            DOM.oldSlug.value = subSlug;
            DOM.oldCatSlug.value = catSlug;
            DOM.selectCatMae.value = catSlug;
            DOM.name.value = name;
            DOM.image.value = img;
            DOM.order.value = order;
            DOM.status.value = isPaused ? 'pausado' : 'ativo';
            
            DOM.titulo.innerText = "Modificar Subcategoria";
            DOM.btnCancelar.classList.remove('hidden');
            DOM.name.focus();
        }

        /**
         * Reseta e desliga flagstates do formulário
         */
        function resetarFormularioEstado() {
            DOM.form.reset();
            DOM.oldSlug.value = '';
            DOM.oldCatSlug.value = '';
            DOM.titulo.innerText = "Nova Subcategoria";
            DOM.btnCancelar.classList.add('hidden');
        }

        /**
         * Sanitiza o payload e realiza mutação de escrita controlada via getAbellaPath
         */
        async function executingSalvamentoSubUI(e) {
            e.preventDefault();
            
            const catSlug = DOM.selectCatMae.value;
            if(!catSlug) { spawnAdminToast("Selecione uma categoria mãe.", true); return; }

            const name = DOM.name.value.trim();
            // Gerador Estrito de Slugs Higienizados em conformidade com URLs amigáveis
            const slug = name.toLowerCase()
                             .normalize("NFD")
                             .replace(/[\u0300-\u036f]/g, "")
                             .replace(/[^a-z0-9]+/g, "-")
                             .replace(/(^-|-$)/g, "");

            const oldSlug = DOM.oldSlug.value;
            const oldCatSlug = DOM.oldCatSlug.value;

            // XSS Prevention Shield
            const sanitizarStr = (str) => String(str).replace(/</g, "&lt;").replace(/>/g, "&gt;").trim();

            const payload = {
                name: sanitizarStr(name),
                image: sanitizarStr(DOM.image.value),
                order: Math.abs(parseInt(DOM.order.value, 10) || 0),
                paused: DOM.status.value === 'pausado',
                timestamp: Date.now()
            };

            try {
                // Operação de limpeza anti-duplicação se houver transmutação de chaves/slugs ou de categoria mãe
                if (oldSlug) {
                    if (oldSlug !== slug || oldCatSlug !== catSlug) {
                        const pathRemocao = window.getAbellaPath(`categories/${oldCatSlug || catSlug}/subcategories/${oldSlug}`);
                        await db.ref(pathRemocao).remove();
                    }
                }

                const pathGravacao = window.getAbellaPath(`categories/${catSlug}/subcategories/${slug}`);
                await db.ref(pathGravacao).set(payload);
                
                spawnAdminToast("Estrutura de subcategoria persistida com sucesso.");
                resetarFormularioEstado();
                await carregarCategoriasEAtivar(); 

            } catch(err) {
                console.error("Falha Crítica na Escrita de Subnó:", err);
                spawnAdminToast("Falha operacional ao gravar no Firebase RTDB.", true);
            }
        }

        /**
         * Intercepta a flag de pausa e executa atualização síncrona otimizando tráfego de rede
         */
        async function alternarEstadoPausa(catSlug, subSlug, estadoPausaAtual) {
            const novoEstadoPausa = !estadoPausaAtual;
            try {
                const path = window.getAbellaPath(`categories/${catSlug}/subcategories/${subSlug}`);
                // Mutação local rápida (Update) atendendo aos requisitos de performance forense
                await db.ref(path).update({ paused: novoEstadoPausa });
                
                // Otimização de Performance: atualiza memória local sem bater uma nova requisição pesada de leitura
                if(categoriasCache[catSlug] && categoriasCache[catSlug].subcategories && categoriasCache[catSlug].subcategories[subSlug]) {
                    categoriasCache[catSlug].subcategories[subSlug].paused = novoEstadoPausa;
                    categoriasCache[catSlug].subcategories[subSlug].status = novoEstadoPausa ? 'pausado' : 'ativo';
                }
                
                renderizarSubcategoriasFiltradas();
                spawnAdminToast(`Subcategoria configurada como ${novoEstadoPausa ? 'Oculta' : 'Visível'}.`);
            } catch (err) {
                console.error("Erro ao alterar chave logical state no Realtime Database:", err);
                spawnAdminToast("Não foi possível alterar o estado de visibilidade.", true);
            }
        }

        /**
         * Remove definitivamente o registro lógico da árvore
         */
        async function executarRemocaoSub(catSlug, subSlug) {
            if(!confirm("⚠️ ATENÇÃO: Confirmar a exclusão permanente e irrevogável deste subnó no Firebase?")) return;
            
            try {
                const path = window.getAbellaPath(`categories/${catSlug}/subcategories/${subSlug}`);
                await db.ref(path).remove();
                
                spawnAdminToast("Registro removido com sucesso da árvore relacional.");
                await carregarCategoriasEAtivar();
            } catch(err) {
                console.error("Falha ao expurgar registro físico do banco:", err);
                spawnAdminToast("Erro ao tentar deletar subcategoria.", true);
            }
        }
    </script>
</body>
</html>
