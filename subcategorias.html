<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Subcategorias • Abella Joias</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { background:#0b0b0b; color:#eee; font-family:'Inter', sans-serif; min-height: 100vh; }
        .serif { font-family:'Cinzel', serif; }
        .gold { color:#caa85c; }
        .card { background:#141414; border:1px solid #2a2a2a; border-radius:20px; overflow:hidden; transition:.3s; }
        .card:hover { transform:translateY(-5px); border-color:#caa85c; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }
    </style>
</head>
<body>
    <header class="sticky top-0 bg-black/90 backdrop-blur border-b border-[#222] z-50">
        <div class="max-w-7xl mx-auto p-5 flex justify-between items-center">
            <a href="index.html" class="text-xs text-gray-400 hover:text-white transition-all flex items-center gap-1">
                ← Voltar para Categorias
            </a>
            <h1 id="titulo-categoria" class="serif gold text-sm uppercase tracking-widest">Subcategorias</h1>
            <a href="carrinho.html" class="bg-zinc-900 border border-zinc-800 hover:border-[#caa85c] px-4 py-2 rounded-xl text-xs font-medium transition-all flex items-center gap-2">
                🛒 Carrinho (<span id="cart-count" class="gold font-bold">0</span>)
            </a>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-6">
        <div id="loading" class="text-center py-12 text-zinc-500 font-medium text-xs tracking-widest uppercase">
            ⏳ Carregando Subcategorias Disponíveis...
        </div>
        <div id="grid-subcategorias" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
    </main>

    <script src="js/firebase/firebase-config.js"></script>
    <script src="js/utils/money.js"></script>
    <script src="js/utils/storage.js"></script>
    <script src="js/services/carrinhoService.js"></script>
    <script src="js/services/categoriaService.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const resumo = carrinhoService.obterResumo();
            document.getElementById('cart-count').innerText = resumo.totalItens;

            const urlParams = new URLSearchParams(window.location.search);
            const catId = urlParams.get('id');

            if (!catId) {
                window.location.href = 'index.html';
                return;
            }

            await carregarSubcategorias(catId);
        });

        async function carregarSubcategorias(catId) {
            const grid = document.getElementById('grid-subcategorias');
            const loading = document.getElementById('loading');
            const titulo = document.getElementById('titulo-categoria');

            try {
                const categoria = await categoriaService.obterPorId(catId);
                loading.classList.add('hidden');

                if (!categoria) {
                    grid.innerHTML = `<p class="col-span-full text-zinc-500 text-xs italic py-6">Categoria inválida ou não encontrada.</p>`;
                    return;
                }

                titulo.innerText = categoria.name || categoria.nome;

                const subcategorias = categoria.subcategories;
                if (!subcategorias || Object.keys(subcategorias).length === 0) {
                    window.location.href = `produtos.html?id=${catId}`;
                    return;
                }

               Object.keys(subcategorias).forEach(subKey => {

    const sub = subcategorias[subKey];

    if (
        sub.paused === true ||
        sub.paused === "true"
    ) return;

    const card =
        document.createElement('div');

    card.className =
        "card cursor-pointer flex flex-col justify-between animate-fade-in";

    card.onclick = () => {

        window.location.href =
            `produtos.html?id=${catId}&sub=${subKey}`;
    };

    const img =
        sub.image ||
        sub.imagem ||
        'https://via.placeholder.com/400/141414/818cf8?text=Abella+Joias';

    card.innerHTML = `
        <div class="aspect-square bg-zinc-950 overflow-hidden flex items-center justify-center">
            <img
                src="${img}"
                class="w-full h-full object-cover hover:scale-105 transition-all duration-300"
                onerror="this.src='https://via.placeholder.com/400/141414/818cf8?text=Sem+Imagem'">
        </div>

        <div class="p-4 bg-zinc-900/20 border-t border-zinc-900/60 flex items-center justify-between">
            <span class="text-xs font-bold uppercase text-white truncate tracking-wide">
                ${sub.name || sub.nome || subKey}
            </span>

            <span class="gold text-xs">➔</span>
        </div>
    `;

    grid.appendChild(card);
});
            } catch (error) {
                console.error("Erro ao ler subcategorias da UI:", error);
                loading.innerText = "❌ Erro ao processar subcategorias da loja.";
            }
        }
    </script>
</body>
</html>
