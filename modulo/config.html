<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
</head>
<body class="bg-zinc-900 text-zinc-100 p-6 font-sans min-h-screen">

    <div class="max-w-2xl mx-auto space-y-6 text-left">
        <div class="bg-zinc-950 p-6 rounded-2xl border border-zinc-800">
            <h2 class="text-xl font-bold text-white">⚙️ Configurações Gerais do Sistema</h2>
            <p class="text-xs text-zinc-500 mt-1">Controle taxas de liquidação, parcelamento máximo e WhatsApp corporativo.</p>
        </div>

        <form id="formConfig" onsubmit="salvarConfiguracoesGerais(event)" class="bg-zinc-950 border border-zinc-800 p-6 rounded-2xl space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div class="space-y-1">
                    <label class="text-[10px] uppercase text-zinc-400 font-bold">Desconto à Vista no PIX (%) *</label>
                    <input type="number" id="cfgPix" required min="0" max="50" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-2 text-xs outline-none focus:border-[#caa85c]">
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] uppercase text-zinc-400 font-bold">Parcelamento Máximo Cartão *</label>
                    <input type="number" id="cfgParcelas" required min="1" max="12" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-2 text-xs outline-none focus:border-[#caa85c]">
                </div>
            </div>

            <div class="space-y-1">
                <label class="text-[10px] uppercase text-zinc-400 font-bold">WhatsApp Corporativo de Recebimento de Pedidos *</label>
                <input type="text" id="cfgWhatsapp" required placeholder="Ex: 5519988207658" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-2 text-xs outline-none focus:border-[#caa85c]">
                <p class="text-[9px] text-zinc-600 font-mono">Insira o número completo contendo DDI (55), DDD e número, sem espaços ou parênteses.</p>
            </div>

            <div class="pt-4 border-t border-zinc-900 flex justify-end">
                <button type="submit" class="bg-[#caa85c] text-black font-black px-6 py-2.5 rounded-xl text-xs uppercase tracking-wider transition-all">
                    💾 Gravar Parâmetros
                </button>
            </div>
        </form>
    </div>

    <script src="../js/firebase/firebase-config.js"></script>
    <script src="../js/services/configService.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => { await carregarCamposConfig(); });

        async function carregarCamposConfig() {
            try {
                const s = await configService.obterConfiguracoes();
                if(s) {
                    document.getElementById('cfgPix').value = s.pixDesc || 5;
                    document.getElementById('cfgParcelas').value = s.parcelasMax || 6;
                    document.getElementById('cfgWhatsapp').value = s.whatsEmpresa || "5519988207658";
                }
            } catch(e) { console.error("Erro ao ler parametrização inicial", e); }
        }

        async function salvarConfiguracoesGerais(e) {
            e.preventDefault();
            const payload = {
                pixDesc: parseFloat(document.getElementById('cfgPix').value),
                parcelasMax: parseInt(document.getElementById('cfgParcelas').value),
                whatsEmpresa: document.getElementById('cfgWhatsapp').value.replace(/\D/g, '')
            };

            try {
                await configService.salvarConfiguracoes(payload);
                alert("✨ Parâmetros operacionais atualizados com sucesso!");
                await carregarCamposConfig();
            } catch(e) {
                alert("Falha ao persistir novos dados de configuração corporativa.");
            }
        }
    </script>
</body>
</html>
