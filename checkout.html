        /* BOTÃO VOLTAR PREMIUM ABELLA */
        .back-button{
            display:flex;

        .fade-in{

        @keyframes fade{

            }

            }
        }

        @media(max-width:768px) {
            header .h-20 {

        @media(max-width:640px){

                justify-content:center;
                height:54px;
                font-size:11px;
            }
            .back-button span:last-child {
                display: inline;
            }
        }
    </style>

    <script>
        const db = finaliza();

        const CONFIG = {
    descontoPix: 5,
    parcelasMax: 6,
    freteFixo: 15,
    freteGratisAlvo: 100,
    pedidoMinimo: 300,
    whatsEmpresa: '5519999999999'
};
        let itensCarrinho = [];

        const money = {
    formatar(v){
        return new Intl.NumberFormat(
            'pt-BR',
            {
                style:'currency',
                currency:'BRL'
            }
        ).format(v || 0);
    }
};

// COLOQUE AQUI
function formatarPeso(valor) {

    valor = Number(valor || 0);

    const formatter = new Intl.NumberFormat(
        'pt-BR',
        {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }
    );

    if (valor >= 1000) {

        return formatter.format(
            valor / 1000
        ) + ' kg';

    }

    return formatter.format(
        valor
    ) + ' g';
}

const carrinhoService = {

    obterItens(){

        try{

            return JSON.parse(
                localStorage.getItem('abella_carrinho')
                ||
                localStorage.getItem('carrinho')
                ||
                '[]'
            );

        }catch(e){

            return [];

        }
    },

    limpar(){

        localStorage.removeItem('abella_carrinho');
        localStorage.removeItem('carrinho');

    }
};

    limpar() {

        localStorage.removeItem(
            'abella_carrinho'
        );

        localStorage.removeItem(
            'carrinho'
        );

    }

};

        function resolverImagemFirebase(url) {
            try {
                if (!url) return 'https://via.placeholder.com/100/111111/caa85c?text=Joia';
                url = String(url).trim();
                if (url.startsWith('http://') || url.startsWith('https://')) return url;
                if (url.startsWith('gs://')) {
                    const semGs = url.replace('gs://', '');
                    const primeiraBarra = semGs.indexOf('/');
                    if (primeiraBarra === -1) return url;
                    const bucket = semGs.substring(0, primeiraBarra);
                    const caminho = semGs.substring(primeiraBarra + 1);
                    return `https://firebasestorage.googleapis.com/v0/b/${bucket}/o/${encodeURIComponent(caminho)}?alt=media`;
                }
                return url;
            } catch (err) {
                return 'https://via.placeholder.com/100/111111/caa85c?text=Joia';
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await carregarConfiguracoes();
            
            itensCarrinho = carrinhoService.obterItens();
            if (!Array.isArray(itensCarrinho)) {
                itensCarrinho = [];
            }

            if (itensCarrinho.length === 0) {
                alert('Seu carrinho está vazio.');
                window.location.href = 'index.html';
                return;
            }

            renderizarItens();
            atualizarResumo();
        });

        async function carregarConfiguracoes(){
            try{
                if (typeof window.getAbellaPath !== 'function') return;

                const snap = await db.ref(window.getAbellaPath('settings')).once('value');
                if (snap.exists()) {
                    const s = snap.val() || {};
                    CONFIG.descontoPix = parseFloat(
    s.pix ??
    s.pixDesc ??
    s.descontoPix ??
    5
);

CONFIG.parcelasMax = parseInt(
    s.parcelas ??
    s.parcelasMax ??
    6
);

CONFIG.freteFixo = parseFloat(
    s.freteFixo ?? 15
);

CONFIG.freteGratisAlvo = parseFloat(
    s.freteGratisAlvo ?? 100
);

CONFIG.pedidoMinimo = parseFloat(
    s.pedidoMinimo ?? 300
);
                    CONFIG.whatsEmpresa = (s.whatsEmpresa || '5519999999999').replace(/\D/g,'');

                    // Carregamento da Logo Dinâmica no cabeçalho
                    let logoPath = s.logo || s.logoUrl || '';
                    if (logoPath) {
                        const img = document.getElementById('abellaLogoImg');
                        const fallback = document.getElementById('abellaLogoFallback');
                        if (img) {
                            img.src = resolverImagemFirebase(logoPath);
                            img.onload = () => {
                                img.classList.remove('hidden');
                                fallback?.classList.add('hidden');
                            };
                        }
                    }
                }
            }catch(e){
                console.warn('Erro ao carregar configurações globais:', e);
            }
        }

        function renderizarItens(){
            const container = document.getElementById('lista-itens-checkout');
            if(!container) return;
            container.innerHTML = '';

            itensCarrinho.forEach(item => {
                const qtd = parseInt(item.quantidade || item.qtd || 1);
                const preco = parseFloat(
    item.precoFinal ??
    item.price ??
    item.preco ??
    item.precoUnitario ??
    0
)
                const total = preco * qtd;
                const imagem = resolverImagemFirebase(item.image || item.imagem);

                // Sanitização estrita anti-XSS
                const nomeLimpo = String(item.name || item.nome || item.titulo || 'Produto').replace(/</g, "&lt;").replace(/>/g, "&gt;");

                container.innerHTML += `
                    <div class="flex items-center gap-4 border border-white/5 rounded-2xl p-3 bg-zinc-900/40">
                        <img src="${imagem}" class="w-16 h-16 rounded-xl object-cover bg-black border border-zinc-800" alt="${nomeLimpo}" onerror="this.src='https://via.placeholder.com/100/111111/caa85c?text=Joia'">
                        <div class="flex-1 min-w-0">
                            <h3 class="font-bold text-sm truncate text-white">${nomeLimpo}</h3>
                            <p class="text-zinc-500 text-xs mt-1">${qtd}x • ${money.formatar(preco)}</p>
                        </div>
                        <span class="font-black text-sm text-[#caa85c]">${money.formatar(total)}</span>
                    </div>
                `;
            });
        }

        function calcularTotais() {

    let qtd = 0;
    let peso = 0;
    let subtotal = 0;

    itensCarrinho.forEach(item => {

        const quantidade = parseInt(
            item.quantidade ??
            item.qtd ??
            1,
            10
        );

        const preco = Number(
            item.precoFinal ??
            item.price ??
            item.preco ??
            item.precoUnitario ??
            0
        ) || 0;

        const pesoItem = Number(
            item.peso ??
            item.pesoUnitario ??
            item.weight ??
            0
        ) || 0;

        qtd += quantidade;
        peso += pesoItem * quantidade;
        subtotal += preco * quantidade;

    });

    const pagamento =
        document.querySelector(
            'input[name="formaPagamento"]:checked'
        )?.value || 'PIX';

    let desconto = 0;

    if (pagamento === 'PIX') {
        desconto =
            subtotal *
            ((CONFIG.descontoPix || 0) / 100);
    }

    let frete = 0;

    if (
        subtotal > 0 &&
        subtotal < (CONFIG.freteGratisAlvo || 0)
    ) {
        frete = Number(CONFIG.freteFixo || 0);
    }

    const total =
        subtotal -
        desconto +
        frete;

    return {
        qtd,
        peso,
        subtotal,
        desconto,
        frete,
        total,
        pagamento
    };
}

        function atualizarResumo(){
            const t = calcularTotais();

            document.getElementById('res-qtd').innerText = `${t.qtd} pçs`;
            document.getElementById('res-peso').innerText = formatarPeso(t.peso);
            document.getElementById('res-subtotal').innerText = money.formatar(t.subtotal);
            document.getElementById('res-total').innerText = money.formatar(t.total);

            const box = document.getElementById('box-desconto');
            if (t.desconto > 0) {
                box.classList.remove('hidden');
                document.getElementById('res-desconto').innerText = `- ${money.formatar(t.desconto)}`;
            } else {
                box.classList.add('hidden');
            }
        }

function construirTextoRomaneio(){

    const t =
        calcularTotais();

    const nome =
        document.getElementById('cli-nome').value ||
        'Não informado';

    const whats =
        document.getElementById('cli-whats').value ||
        'Não informado';

    const cidadeCliente =
        document.getElementById('cli-cidade').value ||
        'Não informado';

    const localEntrega =
        document.getElementById('ent-local').value ||
        '';

    const rua =
        document.getElementById('ent-rua').value ||
        '';

    const numero =
        document.getElementById('ent-numero').value ||
        '';

    const bairro =
        document.getElementById('ent-bairro').value ||
        '';

    const cidadeEntrega =
        document.getElementById('ent-cidade').value ||
        '';

    const obs =
        document.getElementById('obs-pedido').value ||
        'Sem observações';

    let texto = '';

    texto += 'ABELLA JOIAS\n';
    texto += 'ROMANEIO DE PEDIDO\n';
    texto += '====================================\n\n';

    texto += `CLIENTE: ${nome}\n`;
    texto += `WHATSAPP: ${whats}\n`;
    texto += `CIDADE DO CLIENTE: ${cidadeCliente}\n\n`;

    texto += 'LOCAL DE ENTREGA\n';
    texto += '------------------------------------\n';
    texto += `LOCAL: ${localEntrega}\n`;
    texto += `ENDEREÇO: ${rua}, ${numero}\n`;
    texto += `BAIRRO: ${bairro}\n`;
    texto += `CIDADE: ${cidadeEntrega}\n\n`;

    texto += 'ITENS DO PEDIDO\n';
    texto += '------------------------------------\n';

    itensCarrinho.forEach(item => {

        const qtd =
            parseInt(
                item.quantidade ||
                item.qtd ||
                1
            );

        const preco =
            parseFloat(
                item.precoFinal ??
                item.price ??
                item.preco ??
                item.precoUnitario ??
                0
            );

        const nomeItem =
            item.name ||
            item.nome ||
            'Produto';

        texto +=
            `${qtd}x ${nomeItem} - ${money.formatar(preco * qtd)}\n`;
    });

    texto += '------------------------------------\n';

    texto += `TOTAL PEÇAS: ${t.qtd}\n`;
    texto += `PESO TOTAL: ${formatarPeso(t.peso)}\n`;
    texto += `SUBTOTAL: ${money.formatar(t.subtotal)}\n`;

    if (t.desconto > 0) {

        texto +=
            `DESCONTO PIX (${CONFIG.descontoPix}%): ${money.formatar(t.desconto)}\n`;
    }

    texto += `TOTAL GERAL: ${money.formatar(t.total)}\n`;
    texto += `FORMA DE PAGAMENTO: ${t.pagamento}\n\n`;

    texto += 'OBSERVAÇÕES\n';
    texto += '------------------------------------\n';
    texto += `${obs}\n`;

    return texto;
}

async function finalizarPedido() {
    const btn = document.getElementById('btnFinalizar');
    const campos = ['cli-nome', 'cli-whats', 'cli-cidade', 'ent-local', 'ent-rua', 'ent-numero', 'ent-bairro', 'ent-cidade'];

    // 1. Validação de campos
    for (const id of campos) {
        const el = document.getElementById(id);
        if (!el || !el.value.trim()) {
            el?.focus();
            alert('Por favor, preencha todos os campos obrigatórios.');
            return;
        }
    }

    try {
        if (typeof window.getAbellaPath !== 'function') return;

        btn.disabled = true;
        btn.innerText = 'FINALIZANDO...';

        const t = calcularTotais();
        if (t.subtotal < CONFIG.pedidoMinimo) {
            alert(`Pedido mínimo de ${money.formatar(CONFIG.pedidoMinimo)} não atingido.`);
            btn.disabled = false;
            btn.innerText = 'Finalizar Pedido';
            return;
        }

        // 2. Geração do ID Sequencial (PED-XXXXXX)
        const timestamp = Date.now();
        const sufixo = String(timestamp).slice(-6);
        const idPedidoNovo = `PED-${sufixo}`;

        // 3. Montagem do Objeto (Payload)
        const novoPedido = {
            idPedido: idPedidoNovo, // ID Sequencial
            cliente: document.getElementById('cli-nome').value.trim(),
            whats: document.getElementById('cli-whats').value.trim(),
            cidade: document.getElementById('cli-cidade').value.trim(),
            entrega: {
                local: document.getElementById('ent-local').value.trim(),
                rua: document.getElementById('ent-rua').value.trim(),
                numero: document.getElementById('ent-numero').value.trim(),
                bairro: document.getElementById('ent-bairro').value.trim(),
                cidade: document.getElementById('ent-cidade').value.trim()
            },
            itens: carrinhoService.obterItens(),
            produtos: carrinhoService.obterItens(),
            total: t.total,
            valorTotal: t.total,
            totalPecas: t.quantidade,
            pesoTotal: t.peso,
            data: new Date().toISOString(),
            status: 'pendente'
        };

        // 4. Salvar no Firebase
        // Usamos o 'idPedidoNovo' como chave para facilitar a busca no admin
        await firebase.database().ref(window.getAbellaPath('orders') + '/' + idPedidoNovo).set(novoPedido);

        // 5. Sucesso
        carrinhoService.limpar();
        alert(`✅ Pedido realizado com sucesso!\nID: ${idPedidoNovo}`);
        window.location.href = 'index.html'; // Ou página de confirmação

    } catch (error) {
        console.error('Erro ao finalizar:', error);
        alert('Erro ao processar pedido. Tente novamente.');
        btn.disabled = false;
        btn.innerText = 'Finalizar Pedido';
    }
}
