<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrar • Painel Administrativo Abella Joias</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="../js/firebase/firebase-config.js"></script>

    <style>
        body {
            background-color: rgb(24 24 27);
            color: white;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .input-dark {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            color: white;
        }
        .input-dark:focus { outline: none; border-color: #caa85c; }
        .btn-gold {
            background: #caa85c;
            color: black;
        }
        .btn-gold:hover { background: #b8965088; }
        .btn-gold:disabled { opacity: .5; cursor: not-allowed; }
    </style>

<style id="admin-responsive-all">
  *, *::before, *::after { box-sizing: border-box; }
  html, body { max-width: 100%; min-width: 0; overflow-x: hidden; }
  img, video, canvas, iframe { max-width: 100%; }
  input, select, textarea, button { max-width: 100%; }
  table { max-width: 100%; }
  .overflow-x-auto, .overflow-x-scroll { max-width: 100%; -webkit-overflow-scrolling: touch; }
  @media (max-width: 1023px) {
    .max-w-7xl, .max-w-6xl, .max-w-5xl { max-width: 100%; width: 100%; }
    .fixed.inset-0 > div { max-height: calc(100dvh - 1rem); overflow-y: auto; }
    .grid.grid-cols-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid.grid-cols-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 640px) {
    body { width: 100%; padding-left: .75rem !important; padding-right: .75rem !important; }
    .grid.grid-cols-2, .grid.grid-cols-3, .grid.grid-cols-4,
    .grid.md\:grid-cols-2, .grid.md\:grid-cols-3, .grid.md\:grid-cols-4 { grid-template-columns: minmax(0, 1fr); }
    .flex:not(.flex-col) { flex-wrap: wrap; }
    .flex > button, .flex > a { min-width: 0; white-space: normal; overflow-wrap: anywhere; }
    h1, h2, h3, h4, p, label, span { overflow-wrap: anywhere; }
    table { display: block; overflow-x: auto; white-space: nowrap; }
    .fixed.inset-0 { align-items: flex-start; padding: .5rem !important; }
    .fixed.inset-0 > div { width: 100% !important; max-width: 100% !important; margin-top: .25rem; margin-bottom: .25rem; padding: 1rem !important; }
    .sticky { position: static; }
  }
</style>

</head>
<body>

    <div class="w-full max-w-sm mx-4">
        <div class="text-center mb-8">
            <div class="w-14 h-14 rounded-full bg-white mx-auto flex items-center justify-center mb-4">
                <span class="text-black font-black text-xl" style="font-family:serif;">A</span>
            </div>
            <h1 class="text-lg font-bold tracking-wide uppercase" style="color:#caa85c;">Abella Joias</h1>
            <p class="text-xs text-zinc-500 uppercase tracking-widest mt-1">Painel Administrativo</p>
        </div>

        <form id="formLogin" class="bg-zinc-900 border border-zinc-800 rounded-2xl p-6 space-y-4">
            <div>
                <label class="block text-xs font-bold uppercase text-zinc-400 mb-1">E-mail</label>
                <input type="email" id="email" required autocomplete="username"
                       class="input-dark w-full p-3 rounded-xl text-sm" placeholder="seu@email.com">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase text-zinc-400 mb-1">Senha</label>
                <input type="password" id="senha" required autocomplete="current-password"
                       class="input-dark w-full p-3 rounded-xl text-sm" placeholder="••••••••">
            </div>

            <p id="msgErro" class="hidden text-xs text-rose-400 bg-rose-950/30 border border-rose-900/40 rounded-lg p-3"></p>

            <button type="submit" id="btnEntrar" class="btn-gold w-full p-3 rounded-xl font-bold uppercase text-sm tracking-wider transition">
                Entrar
            </button>
        </form>

        <p class="text-center text-[11px] text-zinc-600 mt-6">Acesso restrito à equipe Abella Joias.</p>
    </div>

    <script>
        const form = document.getElementById('formLogin');
        const btn = document.getElementById('btnEntrar');
        const msgErro = document.getElementById('msgErro');

        function mostrarErro(texto) {
            msgErro.innerText = texto;
            msgErro.classList.remove('hidden');
        }

        function traduzirErro(codigo) {
            const mapa = {
                'auth/invalid-email': 'E-mail inválido.',
                'auth/user-not-found': 'Usuário não encontrado.',
                'auth/wrong-password': 'Senha incorreta.',
                'auth/invalid-credential': 'E-mail ou senha incorretos.',
                'auth/too-many-requests': 'Muitas tentativas. Aguarde alguns minutos e tente novamente.',
                'auth/user-disabled': 'Este usuário foi desativado.'
            };
            return mapa[codigo] || 'Não foi possível entrar. Tente novamente.';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            msgErro.classList.add('hidden');

            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value;

            if (!window.auth) {
                mostrarErro('Firebase Auth não inicializado. Verifique a configuração.');
                return;
            }

            btn.disabled = true;
            btn.innerText = 'Entrando...';

            try {
                await window.auth.signInWithEmailAndPassword(email, senha);

                const params = new URLSearchParams(window.location.search);
                const destino = params.get('redirect') || 'editor.html';
                window.location.href = destino;

            } catch (error) {
                console.error('[Login] Falha de autenticação:', error);
                mostrarErro(traduzirErro(error.code));
                btn.disabled = false;
                btn.innerText = 'Entrar';
            }
        });

        // Se já estiver logado, pula direto pro destino
        document.addEventListener('DOMContentLoaded', () => {
            if (!window.auth) return;
            window.auth.onAuthStateChanged((user) => {
                if (user) {
                    const params = new URLSearchParams(window.location.search);
                    window.location.href = params.get('redirect') || 'editor.html';
                }
            });
        });
    </script>
</body>
</html>
