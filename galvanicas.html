<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Galvânicas de Destino Homologadas • Abella Joias</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
</head>
<body class="bg-black text-white p-6">
    <div class="max-w-4xl mx-auto space-y-4 text-center">
        <h1 class="text-xl font-bold uppercase tracking-wider text-[#caa85c]">Relação de Galvânicas Homologadas</h1>
        <p class="text-xs text-zinc-400">Entrega gratuita assegurada acima de R$ 100,00 para parceiros sediados no polo de Limeira - SP.</p>
        <div id="grid-galvanicas" class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-4"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDPBZSxW8XjtQmDMUknzAyIlFda51MvMJY",
            databaseURL: "https://catalogo-abella-joias-default-rtdb.firebaseio.com"
        };
        
        // CORRIGIDO: Implementação do Shield Guard para bloquear o erro fatal de reinstanciação '[DEFAULT] already exists'
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        } else {
            firebase.app(); 
        }
        
        const db = firebase.database();
        
        db.ref('abella/galvanicas').once('value', snap => {
            const grid = document.getElementById('grid-galvanicas');
            if(!snap.exists()){
                grid.innerHTML = `<p class="text-zinc-600 text-xs italic col-span-full">Nenhuma galvânica credenciada ativa para seleção no momento.</p>`;
                return;
            }
            let htmlAcumulado = "";
            snap.forEach(child => {
                const g = child.val();
                htmlAcumulado += `
                    <div class="bg-zinc-900 border border-zinc-800 p-4 rounded-xl text-left">
                        <h3 class="text-sm font-bold text-white">${g.nome || child.key}</h3>
                        <p class="text-xs text-zinc-500 mt-1">📍 Localidade: ${g.endereco || 'Limeira - SP'}</p>
                    </div>
                `;
            });
            grid.innerHTML = htmlAcumulado;
        });
    </script>
</body>
</html>
