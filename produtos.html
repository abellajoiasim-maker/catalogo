<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Produtos • Abella Joias</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { background:#0b0b0b; color:#eee; font-family:'Inter', sans-serif; min-height: 100vh; }
        .serif { font-family:'Cinzel', serif; }
        .gold { color:#caa85c; }
        .card { background:#141414; border:1px solid #2a2a2a; border-radius:20px; overflow:hidden; transition:.3s; position: relative; }
        .card:hover { border-color:#caa85c; }
        .badge { position:absolute; top:12px; right:12px; font-size:9px; padding:4px 10px; border-radius:20px; font-weight:800; color:#000; z-index: 10; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }
    </style>
</head>
<body>
    <header class="sticky top-0 bg-black/90 backdrop-blur border-b border-[#222] z-50">
        <div class="max-w-7xl mx-auto p-5 flex flex-col sm:flex-row justify-between items-center gap-4">
            <a href="index.html" class="text-xs text-gray-400 hover:text-white transition-all flex items-center gap-1">
                ← Voltar para a Vitrine
            </a>
            <div class="w-full sm:w-72 relative">
                <input type="text" id="campoBusca" oninput="executarFiltroBusca()" placeholder="Buscar por nome ou SKU..." class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2 text-xs text-white focus:border-[#caa85c] outline-none">
            </div>
            <a href="carrinho.html" class="bg-zinc-900 border border-zinc-800 hover:border-[#caa85c] px-4 py-2 rounded-xl text-xs font-medium transition-all flex items-center gap-2">
                🛒 Carrinho (<span id="cart-count" class="gold font-bold">0</span>)
            </a>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-6">
        <h2 id="titulo-vitrine" class="serif gold text-lg tracking-widest uppercase mb-6 text-center">Nossos Produtos</h2>
        <div id="loading" class="text-center py-12 text-zinc-500 font-medium text-xs tracking-widest uppercase">
            ⏳ Carregando produtos cadastrados...
        </div>
        <div id="grid-produtos" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
    </main>

    <script src="js/firebase/firebase-config.js"></script>
    <script src="js/utils/money.js"></script>
    <script src="js/utils/storage.js"></script>
    <script src="js/services/carrinhoService.js"></script>
    <script src="js/services/produtoService.js"></script>
    <script src="js/services/descontoService.js"></script>
    <script>
        let LISTA_PRODUTOS_LOCAL = [];
        let categoriaAtualUrl = "";
        let subcategoriaAtualUrl = "";

        document.addEventListener('DOMContentLoaded', async () => {
            const resumo = carrinhoService.obterResumo();
            document.getElementById('cart-count').innerText = resumo.totalItens;

            const urlParams = new URLSearchParams(window.location.search);
            categoriaAtualUrl = urlParams.get('id') || "";
            subcategoriaAtualUrl = urlParams.get('sub') || "";

            await carregarProdutosCatalogo();
        });

        async function carregarProdutosCatalogo() {
            const grid = document.getElementById('grid-produtos');
            const loading = document.getElementById('loading');
            try {
                const todos = await produtoService.listarTodos();
                LISTA_PRODUTOS_LOCAL = todos.filter(p => !p.paused);

                if(categoriaAtualUrl) {
                    LISTA_PRODUTOS_LOCAL = LISTA_PRODUTOS_LOCAL.filter(p => p.category === categoriaAtualUrl);
                    document.getElementById('titulo-vitrine').innerText = `Categoria: ${categoriaAtualUrl.toUpperCase()}`;
                }
                if(subcategoriaAtualUrl) {
                    LISTA_PRODUTOS_LOCAL = LISTA_PRODUTOS_LOCAL.filter(p => p.subcategory === subcategoriaAtualUrl);
                    document.getElementById('titulo-vitrine').innerText = `Subcategoria: ${subcategoriaAtualUrl.toUpperCase()}`;
                }

                loading.classList.add('hidden');
                renderizarCardsProdutos(LISTA_PRODUTOS_LOCAL);
            } catch (error) {
                console.error("Erro crítico ao carregar vitrine de produtos:", error);
                loading.innerText = "❌ Erro ao baixar catálogo de produtos.";
            }
        }

        function renderizarCardsProdutos(produtos) {
            const grid = document.getElementById('grid-produtos');
            grid.innerHTML = '';

            if(produtos.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-zinc-500 text-xs italic py-12 text-center">Nenhum produto disponível nesta seção.</p>`;
                return;
            }

            produtos.forEach(p => {
                const card = document.createElement('div');
                card.className = "card flex flex-col justify-between p-3 animate-fade-in";
                
                const img = p.image || p.imagem || 'https://via.placeholder.com/300/141414/818cf8?text=Joia';
                const temPromo = p.promo && parseFloat(p.promo) > 0;
                const precoBase = parseFloat(p.price || p.preco || 0);
                const precoExibicao = temPromo ? precoBase - (precoBase * (parseFloat(p.promo) / 100)) : precoBase;
                
                card.innerHTML = `
                    ${temPromo ? `<span class="badge bg-amber-500">-${p.promo}%</span>` : ''}
                    <div class="aspect-square bg-black rounded-xl overflow-hidden flex items-center justify-center mb-3">
                        <img src="${img}" class="w-full h-full object-cover transition-all duration-300 hover:scale-105" onerror="this.src='https://via.placeholder.com/300/141414/818cf8?text=Joia'">
                    </div>
                    <div class="space-y-1 text-left flex-1 flex flex-col justify-between">
                        <div>
                            <h3 class="text-white text-xs font-bold truncate tracking-wide">${p.name || p.nome}</h3>
                            <p class="text-[9px] text-zinc-500 font-mono">SKU: ${p.sku || 'N/A'} | ⚖️ ${(p.weight || p.peso || 0).toFixed(2)}g</p>
                        </div>
                        <div class="pt-2">
                            <div class="flex items-baseline gap-1">
                                <span class="text-white font-black text-xs font-mono">${money.formatar(precoExibicao)}</span>
                                ${temPromo ? `<span class="text-[9px] text-zinc-600 line-through font-mono">${money.formatar(precoBase)}</span>` : ''}
                            </div>
                            <button onclick="adicionarAoCarrinhoVitrine('${p.sku}')" class="w-full mt-2 bg-gradient-to-r from-zinc-900 to-black hover:from-[#caa85c] hover:to-[#bda152] hover:text-black border border-zinc-800 text-gray-300 font-bold py-2 rounded-xl text-[10px] uppercase tracking-wider transition-all">
                                🛒 Adicionar
                            </button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function executarFiltroBusca() {
            const termo = document.getElementById('campoBusca').value.toLowerCase().trim();
            if(!termo) {
                renderizarCardsProdutos(LISTA_PRODUTOS_LOCAL);
                return;
            }
            const filtrados = LISTA_PRODUTOS_LOCAL.filter(p => 
                (p.name || p.nome || "").toLowerCase().includes(termo) || 
                (p.sku || "").toLowerCase().includes(termo)
            );
            renderizarCardsProdutos(filtrados);
        }

        function adicionarAoCarrinhoVitrine(sku) {
            const prod = LISTA_PRODUTOS_LOCAL.find(p => p.sku === sku);
            if(!prod) return;
            
            carrinhoService.adicionarItem({
                sku: prod.sku,
                nome: prod.name || prod.nome,
                image: prod.image || prod.imagem || '',
                price: prod.price || prod.preco || 0,
                precoFinal: prod.precoFinal || prod.price || 0,
                peso: prod.weight || prod.peso || 0,
                variacao: prod.variacaoTipo !== "Padrão" ? prod.opcoesPersonalizadas?.split(',')[0] : ''
            });

            const resumo = carrinhoService.obterResumo();
            document.getElementById('cart-count').innerText = resumo.totalItens;
            alert("✨ Item adicionado com sucesso ao seu carrinho!");
        }
    </script>
</body>
</html>
