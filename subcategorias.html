<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <script src="./js/analytics.js"></script>
    <title>Subcategorias • Abella Joias</title>

    <script>window.AURORA_FALLBACK_IMAGE = 'https://firebasestorage.googleapis.com/v0/b/catalogo-abella-joias.firebasestorage.app/o/images%2Flogo%2FInCollage_20250630_100544920-01.jpeg?alt=media';</script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

    <link rel="stylesheet" href="components/index.css">
    <style>
        .cat-hero-copy{
            position: relative; text-align:center; overflow:hidden;
            padding: var(--space-7) var(--space-5) var(--space-5); max-width:640px; margin:0 auto;
        }
        .cat-hero-copy::before{
            content:''; position:absolute; top:50%; left:50%; width:420px; height:420px;
            background: radial-gradient(circle, rgba(var(--color-primary-rgb),.12) 0%, rgba(var(--color-primary-rgb),0) 70%);
            transform: translate(-50%,-50%); z-index:-1; pointer-events:none;
        }
    </style>
</head>
<body>

    <div class="aurora-header">
        <div class="bar aurora-container">
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="./galvanicas.html">Galvânicas</a>
            </nav>
            <div class="brand">
                <div class="brand-logo"><span style="font-family:var(--font-heading);font-weight:600;">A</span></div>
                <div><p class="brand-name">Abella</p></div>
            </div>
            <div class="actions">
                <a href="carrinho.html" class="cart-btn"><span id="cart-count">0</span></a>
            </div>
        </div>
    </div>

    <main class="aurora-container">

        <div id="breadcrumb-slot"></div>

        <section class="cat-hero-copy" data-aurora-reveal>
            <p style="font-size:11px; letter-spacing:.25em; text-transform:uppercase; color:var(--color-primary-hover); margin-bottom:var(--space-2);">Coleção</p>
            <h1 id="categoriaNome" style="font-size:clamp(28px,5vw,48px);"></h1>
            <p id="categoriaDescricao" style="font-size:13px; color:var(--color-secondary); margin-top:var(--space-3);"></p>
        </section>

        <section class="aurora-section">
            <div id="loading" style="text-align:center; padding: var(--space-6) 0;">
                <p style="color:var(--color-primary-hover); font-weight:600;">⏳ Carregando subcategorias...</p>
            </div>

            <div style="text-align:center; margin-bottom: var(--space-7);">
                <h2 style="font-size: clamp(22px,3.5vw,36px);">Selecione uma Subcategoria</h2>
            </div>

            <div id="grid-subcategorias" class="aurora-grid"></div>

            <div id="no-result" class="hidden" style="grid-column:1/-1; text-align:center; padding: var(--space-8) 0;">
                <p style="font-size:14px; color:var(--color-secondary);">Nenhuma subcategoria disponível.</p>
            </div>
        </section>
    </main>

    <footer class="aurora-footer">
        <div class="aurora-container">
            <div class="bottom">
                <span>© Abella Joias — atacado de joias no bruto</span>
                <a href="index.html" style="color:var(--color-secondary);">← Voltar para a Home</a>
            </div>
        </div>
    </footer>

    <script src="./js/firebase/firebase-config.js"></script>
    <script src="./js/utils/money.js"></script>
    <script src="./js/utils/peso.js"></script>
    <script src="./js/utils/storage.js"></script>
    <script src="./js/services/carrinhoService.js"></script>
    <script src="./js/utils/image-helper.js"></script>
    <script src="./js/utils/imagens.js"></script>

    <script src="engine/render.js"></script>
    <script src="engine/animations.js"></script>
    <script src="engine/mobile-nav.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const grid = document.getElementById('grid-subcategorias');
            const loading = document.getElementById('loading');
            const noResult = document.getElementById('no-result');

            const cartEl = document.getElementById('cart-count');
            if (cartEl && window.carrinhoService) cartEl.innerText = carrinhoService.obterContagem();

            const params = new URLSearchParams(window.location.search);
            const categoriaSlug = (params.get('categoria') || params.get('id') || '').toString().trim();

            if (!categoriaSlug) {
                if (loading) loading.innerHTML = `<p style="color:var(--color-danger);font-size:13px;">⚠️ Categoria não informada na URL.</p>`;
                return;
            }

            if (typeof db === 'undefined') {
                if (loading) loading.innerHTML = `<p style="color:var(--color-danger);font-size:13px;">⚠️ Conexão com o banco de dados não configurada.</p>`;
                return;
            }

            try {
                const snapCategories = await db.ref('abella/categories').once('value');
                let categoriaAtual = null;

                if (snapCategories.exists()) {
                    const dados = snapCategories.val();
                    const encontrada = Object.entries(dados).find(([itemSlug, val]) => {
                        const chaveComparar = val && val.slug ? val.slug : itemSlug;
                        return String(chaveComparar).toLowerCase() === String(categoriaSlug).toLowerCase();
                    });
                    if (encontrada) categoriaAtual = encontrada[1];
                }

                if (!categoriaAtual || categoriaAtual.paused === true) {
                    if (loading) loading.classList.add('hidden');
                    document.getElementById('categoriaNome').innerText = 'Coleção Especial';
                    if (noResult) noResult.classList.remove('hidden');
                    return;
                }

                const nomeCategoria = categoriaAtual.nome || categoriaAtual.name
                    || categoriaSlug.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
                document.title = `${nomeCategoria} • Subcategorias • Abella Joias`;
                document.getElementById('categoriaNome').innerText = nomeCategoria;
                const descricaoCategoria = categoriaAtual.descricao || categoriaAtual.description || `Explore a coleção completa de ${nomeCategoria}.`;
                document.getElementById('categoriaDescricao').innerText = descricaoCategoria;

                // SEO IQ200 — meta description, canonical, OG e BreadcrumbList dinâmicos por categoria
                (function seoDinamicoCategoria() {
                    const setMeta = (attr, val, content) => {
                        let el = document.querySelector(`meta[${attr}="${val}"]`);
                        if (!el) { el = document.createElement('meta'); el.setAttribute(attr, val); document.head.appendChild(el); }
                        el.setAttribute('content', content);
                    };
                    const setLink = (rel, href) => {
                        let el = document.querySelector(`link[rel="${rel}"]`);
                        if (!el) { el = document.createElement('link'); el.setAttribute('rel', rel); document.head.appendChild(el); }
                        el.setAttribute('href', href);
                    };

                    const descSeo = `${descricaoCategoria} Modelos de ${nomeCategoria} no atacado, direto de fábrica em Limeira-SP. Abella Joias.`;
                    const canonicalUrl = `${window.location.origin}${window.location.pathname}?categoria=${encodeURIComponent(categoriaSlug)}`;
                    const imagemSeo = (categoriaAtual.imagem || categoriaAtual.image) || window.AURORA_FALLBACK_IMAGE;

                    setMeta('name', 'description', descSeo);
                    setMeta('name', 'robots', 'index, follow');
                    setLink('canonical', canonicalUrl);

                    setMeta('property', 'og:title', document.title);
                    setMeta('property', 'og:description', descSeo);
                    setMeta('property', 'og:image', imagemSeo);
                    setMeta('property', 'og:url', canonicalUrl);
                    setMeta('property', 'og:type', 'website');
                    setMeta('name', 'twitter:card', 'summary_large_image');
                    setMeta('name', 'twitter:title', document.title);
                    setMeta('name', 'twitter:description', descSeo);
                    setMeta('name', 'twitter:image', imagemSeo);

                    const breadcrumbSchema = {
                        "@context": "https://schema.org",
                        "@type": "BreadcrumbList",
                        "itemListElement": [
                            { "@type": "ListItem", "position": 1, "name": "Home", "item": window.location.origin + '/' + 'index.html' },
                            { "@type": "ListItem", "position": 2, "name": nomeCategoria }
                        ]
                    };
                    let scriptTag = document.getElementById('iq200-categoria-schema');
                    if (!scriptTag) {
                        scriptTag = document.createElement('script');
                        scriptTag.id = 'iq200-categoria-schema';
                        scriptTag.type = 'application/ld+json';
                        document.head.appendChild(scriptTag);
                    }
                    scriptTag.textContent = JSON.stringify(breadcrumbSchema);
                })();

                document.getElementById('breadcrumb-slot').innerHTML = AuroraRender.breadcrumb([
                    { label: 'Home', href: 'index.html' },
                    { label: nomeCategoria }
                ]);

                const subcategoriasObj = categoriaAtual.subcategories || categoriaAtual.subcategorias || {};
                const listaSubcategorias = Object.entries(subcategoriasObj).filter(([_, sub]) => sub && sub.paused !== true);

                if (loading) loading.classList.add('hidden');

                if (listaSubcategorias.length === 0) {
                    // Mesmo comportamento do subcategorias.html real: pula direto pra produtos
                    window.location.href = `produtos.html?categoria=${encodeURIComponent(categoriaSlug)}`;
                    return;
                }

                grid.innerHTML = listaSubcategorias.map(([subSlug, subData]) => {
                    const html = AuroraRender.subcategoryCard(subSlug, subData, categoriaSlug, categoriaAtual.imagem || categoriaAtual.image);
                    return `<div class="col-3" data-aurora-reveal>${html}</div>`;
                }).join('');

                if (window.AuroraAnimations) AuroraAnimations.initReveal();

            } catch (error) {
                console.error('Erro ao processar subcategorias:', error);
                if (loading) {
                    loading.classList.remove('hidden');
                    loading.innerHTML = `<p style="color:var(--color-danger);font-size:13px;">⚠️ Erro técnico ao carregar subcategorias.</p>`;
                }
            }
        });
    </script>
</body>
</html>
