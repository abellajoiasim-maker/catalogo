<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Super Importador Abella Joias</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-storage-compat.js"></script>
    <style>
        body { font-family: sans-serif; background: #0a0a0a; padding: 40px; color: #adadad; }
        .box { max-width: 700px; margin: auto; background: #111; padding: 30px; border: 1px solid #zinc-900; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h2 { color: #caa85c; text-align: center; font-family: sans-serif; font-weight: 900; letter-spacing: -0.05em; text-transform: uppercase; }
        button { background: #caa85c; color: #000; padding: 14px; width: 100%; margin-top: 15px; font-weight: bold; border: none; cursor: pointer; border-radius: 8px; text-transform: uppercase; letter-spacing: 0.05em; transition: all 0.2s; }
        button:hover { brightness: 110%; }
        button:disabled { background: #222; color: #555; cursor: not-allowed; }
        #log { margin-top: 20px; background: #000; color: #adadad; padding: 15px; font-size: 11px; height: 350px; overflow: auto; border-radius: 8px; font-family: monospace; border: 1px solid #222; }
        .success { color: #4caf50; font-weight: bold; } .warn { color: #ff9800; } .error { color: #f44336; font-weight: bold; }
        input[type="file"] { background: #1a1a1a; padding: 10px; width: 100%; border-radius: 8px; border: 1px solid #222; box-sizing: border-box; color: #fff; margin-top: 5px;}
    </style>
</head>
<body>

<div class="box">
    <h2>📦 Super Importador Abella Joias</h2>
    <p style="font-size: 12px; text-align: center; font-family: monospace; color: #555;">Destino Realtime: <span style="color: #caa85c;">/abella/products</span></p>
    
    <div style="margin-top: 15px;">
        <label style="font-size: 11px; font-weight: bold; text-transform: uppercase; font-family: monospace;">Selecione o Arquivo CSV:</label>
        <input type="file" id="csv" accept=".csv">
    </div>
    
    <button id="btn" onclick="importarTudo()">Limpar e Importar para o Catálogo</button>
    <div id="log">Pronto para processamento...</div>
</div>

<script>
// ATENÇÃO: Confirme se estas credenciais batem com o seu Firebase ativo
const firebaseConfig = {
    apiKey: "AIzaSyDPBZSxW8XjtQmDMUknzAyIlFda51MvMJY",
    databaseURL: "https://catalogo-abella-joias-default-rtdb.firebaseio.com",
    storageBucket: "catalogo-abella-joias.firebasestorage.app"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const storage = firebase.storage();

function gerarSlug(txt) {
    if(!txt) return "geral";
    return txt.toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");
}

async function buscarFoto(sku) {
    // Alinhado com as extensões que você costuma gerar nos apps de fotos
    const extensoes = ['.png', '.jpg', '.jpeg', '.PNG', '.JPG'];
    for (const ext of extensoes) {
        try {
            // Varre o Storage na pasta /produtos/
            const ref = storage.ref().child('produtos/' + sku + ext);
            return await ref.getDownloadURL();
        } catch (e) { continue; }
    }
    return "";
}

async function importarTudo() {
    const file = document.getElementById('csv').files[0];
    if(!file) return alert("Selecione o arquivo CSV do WooCommerce primeiro.");
    if(!confirm("⚠️ ATENÇÃO: Isto irá ler o padrão WooCommerce e sobrescrever os produtos atuais da Abella Joias. Continuar?")) return;

    const log = document.getElementById('log');
    const btn = document.getElementById('btn');
    btn.disabled = true;
    log.innerHTML = "🚀 Iniciando leitura de estrutura WooCommerce...<br>";

    try {
        const text = await file.text();
        // Divide o arquivo por linhas, respeitando quebras normais
        const linhas = text.split(/\r?\n/);
        
        let totalProd = 0;
        let categorias = new Set();

        // Função interna inteligente para separar colunas por vírgula ignorando as que estão dentro de aspas
        function dividirLinhaCSV(linha) {
            const resultado = [];
            let dentroDeAspas = false;
            let colunaAtual = '';
            
            for (let i = 0; i < linha.length; i++) {
                let caractere = linha[i];
                if (caractere === '"') {
                    dentroDeAspas = !dentroDeAspas; // Inverte o estado
                } else if (caractere === ',' && !dentroDeAspas) {
                    resultado.push(colunaAtual.trim());
                    colunaAtual = '';
                } else {
                    colunaAtual += caractere;
                }
            }
            resultado.push(colunaAtual.trim());
            return resultado;
        }

        // Começa em i = 1 para pular o cabeçalho (ID, Tipo, SKU...)
        for(let i = 1; i < linhas.length; i++) {
            if(!linhas[i].trim()) continue;

            // Processa a linha usando o divisor inteligente
            let col = dividirLinhaCSV(linhas[i]);
            
            // Mapeamento exato das posições do WooCommerce do seu arquivo:
            const skuOriginal = col[2] ? col[2].replace(/"/g, '').trim() : "";
            const nome = col[4] ? col[4].replace(/"/g, '').trim() : "";
            
            // Pula linhas de teste ou variações sem SKU preenchido
            if (!skuOriginal || !nome) continue;

            const skuID = skuOriginal.replace(/[\.\$#\[\]\/]/g, "-");
            
            // Tratamento de Categoria do WooCommerce (Pega a última subcategoria se houver '>')
            let categoriaBruta = col[27] ? col[27].replace(/"/g, '').split(',')[0].trim() : "Geral";
            if (categoriaBruta.includes('>')) {
                const partes = categoriaBruta.split('>');
                categoriaBruta = partes[partes.length - 1].trim(); // Foca na categoria final (ex: "Retangular Pequena")
            }
            const catSlug = gerarSlug(categoriaBruta);

            // Tratamento do Preço (Coluna 26 do seu CSV)
            let precoCru = col[26] ? col[26].replace(/"/g, '').trim() : "0";
            precoCru = precoCru.replace('.', '').replace(',', '.');
            const price = parseFloat(precoCru) || 0;

            // Tratamento do Peso (Coluna 19 do seu CSV)
            let pesoCru = col[19] ? col[19].replace(/"/g, '').trim() : "0";
            pesoCru = pesoCru.replace('.', '').replace(',', '.');
          // CORREÇÃO: Ajusta o peso caso ele venha sem a vírgula das duas casas decimais
let pesoNum = parseFloat(pesoCru) || 0;
if (pesoNum > 0) {
    pesoNum = pesoNum / 100; // Transforma 134 em 1.34
}
const weight = pesoNum;

            // Link de Imagem Direto do WooCommerce (Coluna 30 do seu CSV)
            // Se houver mais de uma imagem separada por vírgula, pega a primeira
            let urlImagem = col[30] ? col[30].replace(/"/g, '').split(',')[0].trim() : "";

            log.innerHTML += `> Mapeando SKU: ${skuOriginal}... `;

            try {
                // 1. Atualiza/Garante a categoria na rota isolada /abella
                await db.ref('abella/categories/' + catSlug).update({
                    name: categoriaBruta,
                    slug: catSlug,
                    paused: false
                });
                categorias.add(categoriaBruta);

                // 2. Grava o produto com o preço líquido e imagem direta do site
                await db.ref('abella/products/' + skuID).set({
                    name: nome,
                    sku: skuOriginal,
                    category: catSlug,
                    price: parseFloat(price.toFixed(2)),
                    weight: parseFloat(weight.toFixed(2)),
                    image: urlImagem, // Já grava a URL de alta resolução salva no WordPress!
                    paused: false,
                    promo: 0
                });

                log.innerHTML += `<span class="success">OK 💎</span><br>`;
                totalProd++;
            } catch (e) {
                log.innerHTML += `<span class="error">FALHA: ${e.message}</span><br>`;
            }
            
            // Auto-scroll do log
            log.scrollTop = log.scrollHeight;
        }

        log.innerHTML += `<br>✅ <b>IMPORTAÇÃO DO WOOCOMMERCE CONCLUÍDA!</b><br>Produtos enviados: ${totalProd}<br>Categorias criadas: ${categorias.size}`;
        alert("Catálogo Abella Joias atualizado com sucesso direto do WooCommerce!");

    } catch (err) {
        log.innerHTML += `<span class="error">ERRO CRÍTICO NO ARQUIVO: ${err.message}</span><br>`;
        console.error(err);
    } finally {
        btn.disabled = false;
    }
}
</script>
</body>
</html>
