<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Super Editor V9 • Sincronizado</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>

  <script src="../js/firebase/firebase-config.js"></script>

  <style>
    .input-dark {
      background-color: rgb(24 24 27);
      border: 1px solid rgb(39 39 42);
      color: white;
      border-radius: 0.5rem;
      padding: 0.75rem;
      width: 100%;
      margin-bottom: 0.5rem;
    }

    .tab-btn.active {
      background: #caa85c;
      color: black;
      font-weight: 700;
      border-radius: 0.75rem;
      padding: 0.5rem 1rem;
      font-size: 0.75rem;
    }

    .tab-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      color: white;
      border-radius: 0.75rem;
      padding: 0.5rem 1rem;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .tab-btn:hover {
      background: rgba(255,255,255,0.10);
    }
  </style>
</head>

<body class="bg-black text-white">
  <div class="max-w-7xl mx-auto p-4">

    <header class="bg-zinc-950 border border-zinc-900 rounded-2xl p-5 mb-4">
      <div class="flex justify-between items-center">
        <div>
          <h1 class="text-2xl font-bold text-[#caa85c]">Super Editor V9</h1>
          <p class="text-xs text-zinc-500">Sincronização Forçada de Dados (Duplo Canal)</p>
        </div>
        <div class="flex gap-2">
          <button
            id="btnRefresh"
            class="px-4 py-2 bg-[#caa85c] text-black rounded-lg text-xs font-bold"
            type="button"
          >
            Sincronizar Vitrine
          </button>
        </div>
      </div>
    </header>

    <section class="grid grid-cols-4 gap-3 mb-5">
      <div class="bg-zinc-950 border border-zinc-900 rounded-xl p-4">
        <div class="text-zinc-500 text-[10px]">Produtos</div>
        <div id="statProdutos" class="text-2xl font-bold">0</div>
      </div>
      <div class="bg-zinc-950 border border-zinc-900 rounded-xl p-4">
        <div class="text-zinc-500 text-[10px]">Categorias</div>
        <div id="statCategorias" class="text-2xl font-bold">0</div>
      </div>
      <div class="bg-zinc-950 border border-zinc-900 rounded-xl p-4">
        <div class="text-zinc-500 text-[10px]">Subcategorias</div>
        <div id="statSubs" class="text-2xl font-bold">0</div>
      </div>
      <div class="bg-zinc-950 border border-zinc-900 rounded-xl p-4">
        <div class="text-zinc-500 text-[10px]">Pausados</div>
        <div id="statPausados" class="text-2xl font-bold">0</div>
      </div>
    </section>

    <section class="bg-zinc-950 border border-zinc-900 rounded-xl p-4 mb-4">
      <div class="grid md:grid-cols-5 gap-3">
        <input
          id="buscaGlobal"
          type="text"
          class="w-full md:col-span-2 bg-zinc-900 border border-zinc-800 rounded-lg p-3 text-sm"
          placeholder="Buscar SKU, Nome, Categoria..."
        />
        <select id="filtroTipo" class="bg-zinc-900 border border-zinc-800 rounded-lg p-3 text-sm">
          <option value="todos">Todos</option>
          <option value="produto">Produtos</option>
          <option value="categoria">Categorias</option>
          <option value="subcategoria">Subcategorias</option>
        </select>
        <select id="filtroCategoria" class="bg-zinc-900 border border-zinc-800 rounded-lg p-3 text-sm">
          <option value="">Todas Categorias</option>
        </select>
        <select id="filtroSubcategoria" class="bg-zinc-900 border border-zinc-800 rounded-lg p-3 text-sm">
          <option value="">Todas Subcategorias</option>
        </select>
      </div>
    </section>

    <section class="flex gap-2 mb-4">
      <button class="tab-btn active" data-tab="produtos" type="button">Produtos</button>
      <button class="tab-btn" data-tab="categorias" type="button">Categorias</button>
      <button class="tab-btn" data-tab="subcategorias" type="button">Subcategorias</button>
    </section>

    <section>
      <div id="tab-produtos" class="grid grid-cols-1 gap-3"></div>
      <div id="tab-categorias" class="hidden grid grid-cols-1 gap-3"></div>
      <div id="tab-subcategorias" class="hidden grid grid-cols-1 gap-3"></div>
    </section>

    <div id="status" class="text-xs text-zinc-500 mt-6"></div>
  </div>

  <div
    id="drawer"
    class="fixed top-0 right-0 h-full w-[520px] bg-zinc-950 border-l border-zinc-800 hidden z-50 overflow-y-auto shadow-2xl"
  >
    <div class="p-5">
      <div class="flex justify-between mb-5">
        <h2 id="drawerTitle" class="text-lg font-bold text-[#caa85c]">Editor Avançado</h2>
        <button type="button" onclick="fecharDrawer()" class="text-xl hover:text-red-400">✕</button>
      </div>
      <div id="drawerContent"></div>
    </div>
  </div>

  <script>
  function resolverDB() {
    if (window.db) return window.db;
    if (window.firebase && window.firebase.apps && window.firebase.apps.length > 0) {
      return window.firebase.database();
    }
    return null;
  }

  const statusEl = document.getElementById('status');
  const STATE = {
    db: null,
    produtos: [],
    categorias: {},
    buscaDebounceTimer: null
  };

  const CONFIG = {
    debounceBusca: 200,
    firebaseRetries: 30,
    firebaseRetryDelay: 100
  };

  // Mapeador Inteligente de Compatibilidade de Chaves
  const DataService = {
    getSubcategory(obj) { return obj?.subcategory ?? obj?.subCategory ?? ''; },
    getImage(obj) { return obj?.imagem ?? obj?.image ?? obj?.img ?? ''; },
    getPrice(obj) { return Number(obj?.preco ?? obj?.price ?? 0); },
    getWeight(obj) { return Number(obj?.peso ?? obj?.weight ?? 0); },
    getDesc(obj) { return obj?.description ?? obj?.descricao ?? ''; }
  };

  function setStatus(msg, type = 'info') {
    const color = type === 'error' ? 'text-red-400' : type === 'ok' ? 'text-green-400' : 'text-zinc-500';
    statusEl.className = `text-xs mt-6 ${color}`;
    statusEl.textContent = msg;
  }

  function escapeHtml(str) {
    return String(str ?? '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;');
  }

  function escapeAttr(str) {
    return String(str ?? '').replaceAll("'", "\\'").replaceAll('"', '&quot;');
  }

  function converterGsUrl(url) {
    let stringUrl = String(url ?? '').trim();
    if (!stringUrl) return '';
    if (stringUrl.includes('drive.google.com')) {
      try {
        let idArquivo = '';
        if (stringUrl.includes('/d/')) idArquivo = stringUrl.split('/d/')[1].split('/')[0];
        else if (stringUrl.includes('id=')) idArquivo = stringUrl.split('id=')[1].split('&')[0];
        if (idArquivo) return `https://drive.google.com/uc?export=view&id=${idArquivo}`;
      } catch (e) {}
    }
    if (stringUrl.startsWith('gs://')) {
      try {
        const semProtocolo = stringUrl.replace('gs://', '');
        const idx = semProtocolo.indexOf('/');
        if (idx === -1) return stringUrl;
        return `https://firebasestorage.googleapis.com/v1/b/${semProtocolo.substring(0, idx)}/o/${encodeURIComponent(semProtocolo.substring(idx + 1))}?alt=media`;
      } catch (e) {}
    }
    return stringUrl;
  }

  function tratarInputImagem(inputElement, previewId) {
    if (!inputElement) return;
    let valor = inputElement.value.trim();
    if (valor.startsWith('gs://') || valor.includes('drive.google.com')) {
      valor = converterGsUrl(valor);
      inputElement.value = valor;
    }
    const preview = document.getElementById(previewId);
    if (preview) {
      preview.src = valor;
      preview.style.opacity = '1';
    }
  }

  function handleImageError(img) {
    img.style.opacity = '0';
    const container = img.parentNode;
    if (container) {
      const fallback = container.querySelector('.fallback-container');
      if (fallback) fallback.style.display = 'flex';
    }
  }

  function abrirDrawer(titulo, html) {
    document.getElementById('drawerTitle').textContent = titulo;
    document.getElementById('drawerContent').innerHTML = html;
    document.getElementById('drawer').classList.remove('hidden');
  }

  function fecharDrawer() {
    document.getElementById('drawer').classList.add('hidden');
    document.getElementById('drawerContent').innerHTML = '';
  }

  async function carregarTudo(){
    try {
      const snapCat = await STATE.db.ref(window.getAbellaPath('categories')).once('value');
      STATE.categorias = snapCat.val() || {};

      const snapProd = await STATE.db.ref(window.getAbellaPath('products')).once('value');
      const dados = snapProd.val() || {};
      STATE.produtos = Object.entries(dados).map(([id, p]) => ({ id, ...p }));

      popularFiltros();
      renderAll();
      setStatus('✅ Catálogo perfeitamente sincronizado com as páginas de venda', 'ok');
    } catch(err) {
      setStatus('❌ Erro de conexão com o banco de dados Firebase', 'error');
    }
  }

  function atualizarEstatisticas() {
    document.getElementById('statProdutos').innerText = STATE.produtos.length;
    document.getElementById('statCategorias').innerText = Object.keys(STATE.categorias).length;
    let totalSubs = 0;
    Object.values(STATE.categorias).forEach(cat => totalSubs += Object.keys(cat?.subcategories || {}).length);
    document.getElementById('statSubs').innerText = totalSubs;
    document.getElementById('statPausados').innerText = STATE.produtos.filter(p => p.paused).length;
  }

  function popularFiltros() {
    const selCat = document.getElementById('filtroCategoria');
    const selSub = document.getElementById('filtroSubcategoria');
    if (!selCat || !selSub) return;

    let catOptions = `<option value="">Todas Categorias</option>`;
    Object.keys(STATE.categorias).forEach(c => catOptions += `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`);
    selCat.innerHTML = catOptions;

    const allSubs = new Set();
    Object.values(STATE.categorias).forEach(cat => Object.keys(cat?.subcategories || {}).forEach(s => allSubs.add(s)));
    let subOptions = `<option value="">Todas Subcategorias</option>`;
    [...allSubs].forEach(s => subOptions += `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`);
    selSub.innerHTML = subOptions;
  }

  function getActiveTab() {
    return document.querySelector('.tab-btn.active')?.dataset?.tab || 'produtos';
  }

  function renderCurrentTab() {
    const t = getActiveTab();
    if (t === 'produtos') renderProdutos();
    else if (t === 'categorias') renderCategorias();
    else if (t === 'subcategorias') renderSubcategorias();
  }

  function renderAll() {
    atualizarEstatisticas();
    renderCurrentTab();
  }

  // ==========================================================
  // GRID DE PRODUTOS COMPLETO COM TODAS AS INFORMAÇÕES VISÍVEIS
  // ==========================================================
  function renderProdutos() {
    const container = document.getElementById('tab-produtos');
    if (!container) return;

    const termos = (document.getElementById('buscaGlobal').value || '').toLowerCase();
    const filtroCat = document.getElementById('filtroCategoria').value;
    const filtroSub = document.getElementById('filtroSubcategoria').value;

    const filtrados = STATE.produtos.filter(p => {
      const texto = (p.name || '').toLowerCase() + ' ' + (p.sku || '').toLowerCase() + ' ' + (p.category || '').toLowerCase() + ' ' + (DataService.getSubcategory(p)).toLowerCase();
      return (termos === '' || texto.includes(termos)) && (!filtroCat || p.category === filtroCat) && (!filtroSub || DataService.getSubcategory(p) === filtroSub);
    });

    if (filtrados.length === 0) {
      container.innerHTML = `<div class="text-sm text-zinc-500 p-4">Nenhum produto correspondente.</div>`;
      return;
    }

    let html = '';
    filtrados.forEach(p => {
      const isPaused = p.paused;
      const cardBg = isPaused ? 'bg-zinc-950 opacity-60 border-red-900/40' : 'bg-zinc-950 border-zinc-900';
      const statusTag = isPaused ? `<span class="bg-red-950 text-red-400 border border-red-800 text-[10px] px-2 py-0.5 rounded-full font-bold">PAUSADO</span>` : `<span class="bg-green-950 text-green-400 border border-green-800 text-[10px] px-2 py-0.5 rounded-full font-bold">ATIVO</span>`;
      const imgUrl = converterGsUrl(DataService.getImage(p));

      html += `
        <div class="border rounded-2xl p-5 mb-1 transition-all hover:border-zinc-800 ${cardBg}">
          <div class="flex flex-col lg:flex-row gap-5 items-start lg:items-center justify-between">
            
            <div class="flex items-center gap-4 w-full lg:w-auto">
              <div class="w-20 h-20 bg-zinc-900 border border-zinc-800 rounded-xl overflow-hidden flex-shrink-0 flex items-center justify-center relative">
                <div class="fallback-container absolute inset-0 flex items-center justify-center bg-zinc-900 text-[10px] text-zinc-600">Sem Foto</div>
                ${DataService.getImage(p) ? `<img src="${escapeHtml(imgUrl)}" class="w-full h-full object-cover relative z-10" onerror="handleImageError(this)"/>` : ''}
              </div>
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2 mb-1">
                  ${statusTag}
                  <span class="text-xs font-mono text-zinc-400 bg-zinc-900 px-2 py-0.5 rounded border border-zinc-800">${escapeHtml(p.sku || 'SEM SKU')}</span>
                </div>
                <h3 class="font-bold text-base text-white truncate">${escapeHtml(p.name || 'Sem nome definido')}</h3>
                <p class="text-xs text-zinc-500 line-clamp-1 mt-0.5">${escapeHtml(DataService.getDesc(p) || 'Sem descrição cadastrada.')}</p>
              </div>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 w-full lg:flex-1 max-w-3xl bg-zinc-900/40 p-3 rounded-xl border border-zinc-900">
              <div>
                <span class="text-[10px] text-zinc-500 block uppercase font-bold tracking-wider">Preço</span>
                <span class="text-sm font-semibold text-[#caa85c]">R$ ${DataService.getPrice(p).toFixed(2)}</span>
              </div>
              <div>
                <span class="text-[10px] text-zinc-500 block uppercase font-bold tracking-wider">Peso</span>
                <span class="text-sm font-semibold text-zinc-300">${DataService.getWeight(p)}g</span>
              </div>
              <div>
                <span class="text-[10px] text-zinc-500 block uppercase font-bold tracking-wider">Categoria</span>
                <span class="text-xs font-semibold text-zinc-400 truncate block">${escapeHtml(p.category || '—')}</span>
              </div>
              <div>
                <span class="text-[10px] text-zinc-500 block uppercase font-bold tracking-wider">Subcategoria</span>
                <span class="text-xs font-semibold text-zinc-400 truncate block">${escapeHtml(DataService.getSubcategory(p) || '—')}</span>
              </div>
            </div>

            <div class="flex gap-2 w-full lg:w-auto justify-end border-t border-zinc-900 lg:border-none pt-3 lg:pt-0">
              <button onclick="editarProduto('${escapeAttr(p.id)}')" title="Editar Completo" class="bg-zinc-900 border border-zinc-800 p-2.5 rounded-xl hover:bg-zinc-800 text-zinc-300 transition-colors">✏️ Editar</button>
              <button onclick="duplicarProduto('${escapeAttr(p.id)}')" title="Duplicar Item" class="bg-zinc-900 border border-zinc-800 p-2.5 rounded-xl hover:bg-zinc-800 text-zinc-300 transition-colors">📄</button>
              <button onclick="pausarProduto('${escapeAttr(p.id)}')" title="Alternar Pausa" class="bg-zinc-900 border border-zinc-800 p-2.5 rounded-xl hover:bg-zinc-800 text-zinc-300 transition-colors">⏸️</button>
              <button onclick="deletarProduto('${escapeAttr(p.id)}')" title="Excluir Item" class="bg-zinc-900 border border-zinc-800 p-2.5 rounded-xl hover:border-red-950 text-red-400 transition-colors">🗑️</button>
            </div>

          </div>
        </div>`;
    });
    container.innerHTML = html;
  }

  function renderCategorias() {
    const el = document.getElementById('tab-categorias');
    if (!el) return;
    let html = '';
    Object.entries(STATE.categorias).forEach(([slug, cat]) => {
      html += `
        <div class="bg-zinc-950 border border-zinc-900 rounded-xl p-4">
          <div class="flex items-center justify-between gap-4">
            <div>
              <div class="font-bold text-white">${escapeHtml(cat?.name || slug)}</div>
              <div class="text-xs text-zinc-500">Slug: ${escapeHtml(slug)}</div>
            </div>
            <button onclick="editarCategoria('${escapeAttr(slug)}')" class="bg-zinc-900 border border-zinc-800 p-2 rounded-lg hover:bg-zinc-800">✏️</button>
          </div>
        </div>`;
    });
    el.innerHTML = html;
  }

  function renderSubcategorias() {
    const el = document.getElementById('tab-subcategorias');
    if (!el) return;
    let html = '';
    Object.entries(STATE.categorias).forEach(([catSlug, cat]) => {
      Object.entries(cat?.subcategories || {}).forEach(([subSlug, subObj]) => {
        const imgGrid = subObj.grid || subObj.gridImage || subObj.imagem || '';
        html += `
          <div class="bg-zinc-950 border border-zinc-900 rounded-xl p-4">
            <div class="flex items-center justify-between gap-4">
              <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-zinc-900 border border-zinc-800 rounded overflow-hidden relative flex items-center justify-center">
                   <div class="fallback-container absolute inset-0 flex items-center justify-center bg-zinc-900 text-[10px] text-zinc-600">📁</div>
                   ${imgGrid ? `<img src="${escapeHtml(converterGsUrl(imgGrid))}" class="w-full h-full object-cover relative z-10" onerror="handleImageError(this)"/>` : ''}
                </div>
                <div>
                  <div class="font-bold text-white">${escapeHtml(subObj?.name || subObj?.title || subSlug)}</div>
                  <div class="text-xs text-zinc-500">Pai: ${escapeHtml(catSlug)} | Slug Interno: ${escapeHtml(subSlug)}</div>
                </div>
              </div>
              <button onclick="editarSubcategoria('${escapeAttr(catSlug)}', '${escapeAttr(subSlug)}')" class="bg-zinc-900 border border-zinc-800 p-2 rounded-lg hover:bg-zinc-800">✏️</button>
            </div>
          </div>`;
      });
    });
    el.innerHTML = html;
  }

  // ==========================================================
  // DRAWER DE EDIÇÃO DE PRODUTO COMPLETO E SEGURO
  // ==========================================================
  function editarProduto(id) {
    const p = STATE.produtos.find(prod => prod.id === id);
    if (!p) return;

    let catsHtml = '';
    Object.keys(STATE.categorias).forEach(cat => catsHtml += `<option value="${escapeHtml(cat)}" ${p.category === cat ? 'selected' : ''}>${escapeHtml(cat)}</option>`);

    abrirDrawer('Editar Produto', `
      <label class="text-xs text-zinc-400 block mb-1">Nome do Item</label>
      <input id="editNome" class="input-dark" value="${escapeHtml(p.name || '')}" placeholder="Ex: Brinco Argola Ouro">
      
      <label class="text-xs text-zinc-400 block mb-1">SKU do Produto</label>
      <input id="editSku" class="input-dark" value="${escapeHtml(p.sku || '')}" placeholder="Ex: BR-01">

      <label class="text-xs text-zinc-400 block mb-1">Descrição Comercial</label>
      <textarea id="editDescricao" class="input-dark h-20" placeholder="Descrição completa do produto...">${escapeHtml(DataService.getDesc(p))}</textarea>
      
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-xs text-zinc-400 block mb-1">Preço (R$)</label>
          <input id="editPreco" type="number" step="0.01" class="input-dark" value="${DataService.getPrice(p)}">
        </div>
        <div>
          <label class="text-xs text-zinc-400 block mb-1">Peso (Gramas)</label>
          <input id="editPeso" type="number" step="0.01" class="input-dark" value="${DataService.getWeight(p)}">
        </div>
      </div>

      <label class="text-xs text-zinc-400 block mb-1">Categoria Principal</label>
      <select id="editCategoria" class="input-dark" onchange="carregarSubcategoriasProduto()">${catsHtml}</select>
      
      <label class="text-xs text-zinc-400 block mb-1">Subcategoria Vinculada</label>
      <select id="editSubcategoria" class="input-dark"></select>
      
      <label class="text-xs text-zinc-400 block mb-1">Link de Imagem (Upload / gs:// / Drive)</label>
      <div class="w-full h-40 bg-zinc-900 border border-zinc-800 rounded-xl overflow-hidden relative mb-2 flex items-center justify-center">
         <div class="absolute text-xs text-zinc-600">Preview Indisponível</div>
         <img id="previewProduto" src="${escapeHtml(converterGsUrl(DataService.getImage(p)))}" class="w-full h-full object-cover relative z-10" onerror="this.style.opacity='0'">
      </div>
      <input id="editImagem" class="input-dark" placeholder="URL da foto" value="${escapeHtml(DataService.getImage(p))}" oninput="tratarInputImagem(this, 'previewProduto')">
      
      <button onclick="salvarProduto('${escapeAttr(id)}')" class="bg-[#caa85c] text-black px-4 py-3 rounded-xl w-full font-bold mt-4 hover:bg-opacity-90 transition-all">Salvar Alterações em Espelho</button>
    `);
    carregarSubcategoriasProduto(p.category, DataService.getSubcategory(p));
  }

  function carregarSubcategoriasProduto(catSel, subSel = '') {
    const cat = catSel || document.getElementById('editCategoria')?.value;
    const select = document.getElementById('editSubcategoria');
    if (!select) return;
    select.innerHTML = '<option value="">Nenhuma</option>';
    Object.entries(STATE.categorias[cat]?.subcategories || {}).forEach(([slug, sub]) => {
      select.innerHTML += `<option value="${escapeHtml(slug)}" ${slug === subSel ? 'selected' : ''}>${escapeHtml(sub.name || slug)}</option>`;
    });
  }

  // ==========================================================
  // SALVAMENTO EM DUPLO CANAL (CORREÇÃO CRÍTICA V7)
  // Grava propriedades em Inglês E Português para refletir na vitrine
  // ==========================================================
  async function salvarProduto(id) {
    try {
      const img = document.getElementById('editImagem').value.trim();
      const preco = parseFloat(document.getElementById('editPreco').value) || 0;
      const peso = parseFloat(document.getElementById('editPeso').value) || 0;
      const subcat = document.getElementById('editSubcategoria').value;

      await STATE.db.ref(window.getAbellaPath(`products/${id}`)).update({
        name: document.getElementById('editNome').value,
        sku: document.getElementById('editSku').value,
        category: document.getElementById('editCategoria').value,
        
        // Espelhamento Absoluto para não quebrar nenhuma página de vendas
        subcategory: subcat,
        subCategory: subcat,
        price: preco,
        preco: preco,
        weight: peso,
        peso: peso,
        image: img,
        imagem: img,
        description: document.getElementById('editDescricao').value,
        descricao: document.getElementById('editDescricao').value,
        updatedAt: Date.now()
      });
      fecharDrawer();
      await carregarTudo();
    } catch (e) { setStatus('❌ Erro gravíssimo ao salvar dados no Firebase', 'error'); }
  }

  function editarSubcategoria(catSlug, subSlug) {
    const sub = STATE.categorias[catSlug]?.subcategories?.[subSlug];
    if (!sub) return;

    const imgGrid = sub.grid || sub.gridImage || sub.imagem || '';
    const imgHero = sub.hero || sub.heroImage || sub.imagem || '';

    abrirDrawer('Editar Subcategoria', `
      <label class="text-xs text-zinc-400 block mb-1">Nome da Subcategoria</label>
      <input id="subName" class="input-dark" value="${escapeHtml(sub.name || sub.title || '')}">
      
      <label class="text-xs text-zinc-400 block mb-1">Descrição</label>
      <textarea id="subDesc" class="input-dark h-20">${escapeHtml(sub.description || '')}</textarea>
      
      <div class="mb-4 p-3 bg-zinc-900 border border-zinc-800 rounded-xl">
        <label class="text-xs text-zinc-400 block mb-1 font-bold text-[#caa85c]">Imagem do Grid (Listagem)</label>
        <div class="w-full h-24 bg-black border border-zinc-800 rounded mb-2 overflow-hidden flex items-center justify-center relative">
           <div class="absolute text-[10px] text-zinc-600">Sem Imagem Cadastrada</div>
           <img id="previewGrid" src="${escapeHtml(converterGsUrl(imgGrid))}" class="w-full h-full object-cover relative z-10" onerror="this.style.opacity='0'">
        </div>
        <input id="subGrid" class="input-dark" value="${escapeHtml(imgGrid)}" oninput="tratarInputImagem(this, 'previewGrid')">
      </div>

      <div class="mb-4 p-3 bg-zinc-900 border border-zinc-800 rounded-xl">
        <label class="text-xs text-zinc-400 block mb-1 font-bold text-[#caa85c]">Imagem Hero (Capa Superior)</label>
        <div class="w-full h-24 bg-black border border-zinc-800 rounded mb-2 overflow-hidden flex items-center justify-center relative">
           <div class="absolute text-[10px] text-zinc-600">Sem Imagem Cadastrada</div>
           <img id="previewHero" src="${escapeHtml(converterGsUrl(imgHero))}" class="w-full h-full object-cover relative z-10" onerror="this.style.opacity='0'">
        </div>
        <input id="subHero" class="input-dark" value="${escapeHtml(imgHero)}" oninput="tratarInputImagem(this, 'previewHero')">
      </div>

      <button onclick="salvarSubcategoria('${escapeAttr(catSlug)}', '${escapeAttr(subSlug)}')" class="bg-[#caa85c] text-black px-4 py-2 rounded-xl w-full font-bold mt-2 hover:bg-opacity-90">Salvar Subcategoria</button>
    `);
  }

  async function salvarSubcategoria(catSlug, subSlug) {
    const gridVal = document.getElementById('subGrid').value.trim();
    const heroVal = document.getElementById('subHero').value.trim();

    try {
      await STATE.db.ref(window.getAbellaPath(`categories/${catSlug}/subcategories/${subSlug}`)).update({
        name: document.getElementById('subName').value,
        description: document.getElementById('subDesc').value,
        imagem: gridVal,
        grid: gridVal,
        gridImage: gridVal,
        hero: heroVal,
        heroImage: heroVal,
        updatedAt: Date.now()
      });
      fecharDrawer();
      await carregarTudo();
    } catch (e) { setStatus('❌ Erro ao salvar subcategoria', 'error'); }
  }

  function editarCategoria(slug) {
    const cat = STATE.categorias[slug];
    if (!cat) return;
    abrirDrawer('Editar Categoria', `
      <label class="text-xs text-zinc-400 block mb-1">Nome da Categoria</label>
      <input id="editCatName" class="input-dark" value="${escapeHtml(cat.name || '')}">
      <label class="text-xs text-zinc-400 block mb-1">Descrição</label>
      <textarea id="editCatDesc" class="input-dark">${escapeHtml(cat.description || '')}</textarea>
      <button onclick="salvarCategoria('${escapeAttr(slug)}')" class="bg-[#caa85c] text-black px-4 py-2 rounded-xl w-full font-bold">Salvar</button>
    `);
  }

  async function salvarCategoria(slug) {
    await STATE.db.ref(window.getAbellaPath(`categories/${slug}`)).update({
      name: document.getElementById('editCatName').value,
      description: document.getElementById('editCatDesc').value,
      updatedAt: Date.now()
    });
    fecharDrawer();
    await carregarTudo();
  }

  async function duplicarProduto(id) {
    const p = STATE.produtos.find(prod => prod.id === id);
    if (!p) return;
    const copia = { ...p, sku: (p.sku || '') + '-COPY', createdAt: Date.now(), updatedAt: Date.now() };
    delete copia.id;
    await STATE.db.ref(window.getAbellaPath('products')).push(copia);
    await carregarTudo();
  }

  async function pausarProduto(id) {
    const p = STATE.produtos.find(prod => prod.id === id);
    if (!p) return;
    await STATE.db.ref(window.getAbellaPath(`products/${id}`)).update({ paused: !p.paused, updatedAt: Date.now() });
    await carregarTudo();
  }

  async function deletarProduto(id) {
    if (confirm('Deseja realmente excluir permanentemente este item da sua base?')) {
      await STATE.db.ref(window.getAbellaPath(`products/${id}`)).remove();
      await carregarTudo();
    }
  }

  function wireSearch() {
    document.getElementById('buscaGlobal').addEventListener('input', () => {
      clearTimeout(STATE.buscaDebounceTimer);
      STATE.buscaDebounceTimer = setTimeout(renderCurrentTab, CONFIG.debounceBusca);
    });
    ['filtroTipo', 'filtroCategoria', 'filtroSubcategoria'].forEach(id => {
      document.getElementById(id)?.addEventListener('change', () => renderCurrentTab());
    });
  }

  function wireTabs() {
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        ['produtos', 'categorias', 'subcategorias'].forEach(t => document.getElementById('tab-' + t)?.classList.add('hidden'));
        document.getElementById('tab-' + btn.dataset.tab)?.classList.remove('hidden');
        renderCurrentTab();
      });
    });
  }

  (async function init() {
    let t = 0;
    while(!STATE.db && t < CONFIG.firebaseRetries){
      STATE.db = resolverDB();
      if(!STATE.db) { await new Promise(r => setTimeout(r, CONFIG.firebaseRetryDelay)); t++; }
    }
    if (!STATE.db) return setStatus('❌ Falha de carregamento do Firebase SDK', 'error');

    wireTabs();
    wireSearch();
    document.getElementById('btnRefresh').addEventListener('click', () => carregarTudo());
    await carregarTudo();
  })();

  window.editarProduto = editarProduto; window.salvarProduto = salvarProduto;
  window.duplicarProduto = duplicarProduto; window.pausarProduto = pausarProduto;
  window.deletarProduto = deletarProduto; window.editarCategoria = editarCategoria;
  window.salvarCategoria = salvarCategoria; window.editarSubcategoria = editarSubcategoria;
  window.salvarSubcategoria = salvarSubcategoria; window.fecharDrawer = fecharDrawer;
  window.tratarInputImagem = tratarInputImagem; window.handleImageError = handleImageError;
  window.carregarSubcategoriasProduto = carregarSubcategoriasProduto;
  </script>
</body>
</html>
