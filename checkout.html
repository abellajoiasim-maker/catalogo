<!-- ===================================================================== -->
<!-- carrinho.html -->
<!-- Abella Joias • Carrinho Premium v3.0 -->
<!-- ===================================================================== -->

<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <title>
        Carrinho • Abella Joias
    </title>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        http-equiv="Cache-Control"
        content="no-cache, no-store, must-revalidate">

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <style>

        *{
            box-sizing:border-box;
        }

        html{
            scroll-behavior:smooth;
        }

        body{
            background:#070707;
            color:#fff;
            font-family:'Inter',sans-serif;
            overflow-x:hidden;
        }

        .serif{
            font-family:'Cinzel',serif;
        }

        .gold{
            color:#caa85c;
        }

        .bg-card{
            background:#111;
            border:1px solid #222;
        }

        .glass{
            background:rgba(15,15,15,.85);
            backdrop-filter:blur(16px);
        }

        ::-webkit-scrollbar{
            width:8px;
        }

        ::-webkit-scrollbar-thumb{
            background:#2b2b2b;
            border-radius:999px;
        }

    </style>

</head>

<body class="min-h-screen pb-32">

    <!-- HEADER -->

    <header class="sticky top-0 z-50 glass border-b border-zinc-900">

        <div class="max-w-7xl mx-auto px-4 md:px-6 h-20 flex items-center justify-between">

            <div>

                <p class="text-[10px] uppercase tracking-[0.3em] text-zinc-500 font-bold">
                    Abella Premium
                </p>

                <h1 class="serif gold text-2xl tracking-[0.2em] uppercase mt-1">
                    Carrinho
                </h1>

            </div>

            <button
                onclick="window.history.back()"
                class="h-12 px-5 rounded-2xl bg-zinc-900 border border-zinc-800 hover:border-[#caa85c] transition-all text-xs uppercase tracking-[0.2em] font-black">

                ← Voltar

            </button>

        </div>

    </header>

    <!-- HERO -->

    <section class="border-b border-zinc-900">

        <div class="max-w-7xl mx-auto px-4 md:px-6 py-10">

            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">

                <div class="bg-card rounded-3xl p-5">

                    <p class="text-[10px] uppercase tracking-[0.2em] text-zinc-500 font-bold">
                        Produtos
                    </p>

                    <p
                        id="totalItens"
                        class="text-3xl font-black text-white mt-3">

                        0

                    </p>

                </div>

                <div class="bg-card rounded-3xl p-5">

                    <p class="text-[10px] uppercase tracking-[0.2em] text-zinc-500 font-bold">
                        Peso
                    </p>

                    <p
                        id="pesoTotal"
                        class="text-3xl font-black gold mt-3">

                        0g

                    </p>

                </div>

                <div class="bg-card rounded-3xl p-5">

                    <p class="text-[10px] uppercase tracking-[0.2em] text-zinc-500 font-bold">
                        Economia PIX
                    </p>

                    <p
                        id="descontoPix"
                        class="text-3xl font-black text-emerald-400 mt-3">

                        R$ 0

                    </p>

                </div>

                <div class="bg-card rounded-3xl p-5">

                    <p class="text-[10px] uppercase tracking-[0.2em] text-zinc-500 font-bold">
                        Total
                    </p>

                    <p
                        id="subtotal"
                        class="text-3xl font-black text-white mt-3">

                        R$ 0

                    </p>

                </div>

            </div>

        </div>

    </section>

    <!-- GRID -->

    <main class="max-w-7xl mx-auto px-4 md:px-6 py-10">

        <div class="grid grid-cols-1 xl:grid-cols-3 gap-8">

            <!-- PRODUTOS -->

            <div class="xl:col-span-2">

                <div
                    id="listaCarrinho"
                    class="space-y-5">
                </div>

            </div>

            <!-- RESUMO -->

            <div>

                <div class="bg-card rounded-[2rem] p-6 sticky top-28">

                    <h2 class="text-xl font-black uppercase tracking-[0.2em]">
                        Resumo
                    </h2>

                    <div class="space-y-5 mt-8">

                        <div class="flex justify-between text-sm">

                            <span class="text-zinc-500">
                                Subtotal
                            </span>

                            <span
                                id="resumoSubtotal"
                                class="font-bold">
                                R$ 0
                            </span>

                        </div>

                        <div class="flex justify-between text-sm">

                            <span class="text-zinc-500">
                                Desconto PIX
                            </span>

                            <span
                                id="resumoPix"
                                class="font-bold text-emerald-400">
                                R$ 0
                            </span>

                        </div>

                        <div class="flex justify-between text-sm">

                            <span class="text-zinc-500">
                                Total no PIX
                            </span>

                            <span
                                id="resumoTotalPix"
                                class="font-bold gold">
                                R$ 0
                            </span>

                        </div>

                        <div class="border-t border-zinc-800 pt-5">

                            <div class="flex justify-between items-end">

                                <div>

                                    <p class="text-[10px] uppercase tracking-[0.2em] text-zinc-500 font-bold">
                                        Total Final
                                    </p>

                                    <h3
                                        id="resumoFinal"
                                        class="text-4xl font-black mt-2">

                                        R$ 0

                                    </h3>

                                </div>

                            </div>

                        </div>

                        <button
    onclick="visualizarRomaneio()"
    class="w-full h-14 rounded-2xl border border-[#caa85c] text-[#caa85c] font-black uppercase tracking-[0.2em] hover:bg-[#caa85c] hover:text-black transition-all">

    Visualizar Romaneio

</button>

                        <button
                            onclick="finalizarPedido()"
                            class="w-full h-14 rounded-2xl bg-[#caa85c] hover:bg-[#d4b165] transition-all text-black font-black uppercase tracking-[0.2em]">

                            Finalizar Pedido

                        </button>

                        <button
                            onclick="limparCarrinho()"
                            class="w-full h-14 rounded-2xl border border-zinc-700 hover:border-red-500 transition-all text-white font-black uppercase tracking-[0.2em]">

                            Limpar Carrinho

                        </button>

                    </div>

                </div>

            </div>

        </div>

    </main>

    <!-- SCRIPTS -->

    <script src="js/firebase/firebase-config.js"></script>

    <script src="js/utils/money.js"></script>

    <script src="js/services/carrinhoService.js"></script>

    <script>

        function formatar(valor){

            if(
                window.money &&
                money.formatar
            ){

                return money.formatar(valor);

            }

            return valor.toLocaleString(

                'pt-BR',

                {
                    style:'currency',
                    currency:'BRL'
                }

            );

        }

        document.addEventListener(

            'DOMContentLoaded',

            () => {

                carregarCarrinho();

            }

        );

        window.addEventListener(

            'carrinhoAtualizado',

            () => {

                carregarCarrinho();

            }

        );

        function carregarCarrinho(){

            const lista =
                document.getElementById(
                    'listaCarrinho'
                );

            const itens =
                carrinhoService.getItens();

            lista.innerHTML = '';

            if(!itens.length){

                lista.innerHTML = `

                    <div class="bg-card rounded-[2rem] p-14 text-center">

                        <div class="text-6xl mb-6">
                            🛒
                        </div>

                        <h2 class="text-3xl font-black">

                            Seu carrinho está vazio

                        </h2>

                        <p class="text-zinc-500 mt-4">

                            Adicione produtos para continuar.

                        </p>

                    </div>

                `;

                atualizarResumo();

                return;

            }

            let html = '';

            itens.forEach((item,index) => {

                const preco =
                    parseFloat(
                        item.precoFinal ||
                        item.price ||
                        0
                    );

                const subtotal =
                    preco *
                    item.quantidade;

                html += `

                    <div class="bg-card rounded-[2rem] overflow-hidden">

                        <div class="grid grid-cols-1 md:grid-cols-[180px_1fr]">

                            <div class="aspect-square bg-black">

                                <img
                                    src="${item.image || item.imagem || 'https://via.placeholder.com/600x600/111111/caa85c?text=ABELLA'}"
                                    class="w-full h-full object-cover"
                                    loading="lazy"
                                    decoding="async">

                            </div>

                            <div class="p-6 space-y-5">

                                <div class="flex items-start justify-between gap-4">

                                    <div>

                                        <h2 class="text-2xl font-black leading-tight">

                                            ${item.nome || item.name || 'Produto'}

                                        </h2>

                                        <p class="text-zinc-500 text-sm mt-2">

                                            SKU:
                                            ${item.sku || '---'}

                                        </p>

                                        ${
                                            item.variacao
                                            ?
                                            `
                                            <p class="text-[#caa85c] text-sm mt-2 font-bold">
                                                Variação:
                                                ${item.variacao}
                                            </p>
                                            `
                                            :
                                            ''
                                        }

                                    </div>

                                    <button
                                        onclick="removerItem(${index})"
                                        class="w-11 h-11 rounded-xl bg-zinc-900 hover:bg-red-500 transition-all">

                                        ✕

                                    </button>

                                </div>

                                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">

                                    <div>

                                        <p class="text-[10px] uppercase tracking-[0.2em] text-zinc-500 font-bold">

                                            Valor

                                        </p>

                                        <p class="text-xl font-black mt-2">

                                            ${formatar(preco)}

                                        </p>

                                    </div>

                                    <div>

                                        <p class="text-[10px] uppercase tracking-[0.2em] text-zinc-500 font-bold">

                                            Peso

                                        </p>

                                        <p class="text-xl font-black gold mt-2">

                                            ${(parseFloat(item.peso || 0)).toFixed(2)}g

                                        </p>

                                    </div>

                                    <div>

                                        <p class="text-[10px] uppercase tracking-[0.2em] text-zinc-500 font-bold">

                                            Quantidade

                                        </p>

                                        <input
                                            type="number"
                                            min="1"
                                            max="999"
                                            value="${item.quantidade}"
                                            onchange="alterarQtd(${index}, this.value)"
                                            class="w-24 h-12 rounded-xl bg-black border border-zinc-800 text-center font-black mt-2">

                                    </div>

                                    <div>

                                        <p class="text-[10px] uppercase tracking-[0.2em] text-zinc-500 font-bold">

                                            Subtotal

                                        </p>

                                        <p class="text-2xl font-black gold mt-2">

                                            ${formatar(subtotal)}

                                        </p>

                                    </div>

                                </div>

                            </div>

                        </div>

                    </div>

                `;

            });

            lista.innerHTML = html;

            atualizarResumo();

        }

        function atualizarResumo(){

            const resumo =
                carrinhoService.calcularTotais();

            document.getElementById(
                'totalItens'
            ).innerText =
                resumo.totalPecas;

            document.getElementById(
                'pesoTotal'
            ).innerText =
                `${resumo.pesoTotal.toFixed(2)}g`;

            document.getElementById(
                'descontoPix'
            ).innerText =
                formatar(resumo.descontoPix);

            document.getElementById(
                'subtotal'
            ).innerText =
                formatar(resumo.subtotal);

            document.getElementById(
                'resumoSubtotal'
            ).innerText =
                formatar(resumo.subtotal);

            document.getElementById(
                'resumoPix'
            ).innerText =
                formatar(resumo.descontoPix);

            document.getElementById(
                'resumoTotalPix'
            ).innerText =
                formatar(resumo.totalPix);

            document.getElementById(
                'resumoFinal'
            ).innerText =
                formatar(resumo.subtotal);

        }

        function alterarQtd(index,qtd){

            carrinhoService.atualizarQuantidade(
                index,
                qtd
            );

        }

        function removerItem(index){

            carrinhoService.remover(index);

        }

        function limparCarrinho(){

            if(
                !confirm(
                    'Deseja limpar o carrinho?'
                )
            ){

                return;

            }

            carrinhoService.limpar();

        }

        function visualizarRomaneio(){

    const itens =
        carrinhoService.getItens();

    const resumo =
        carrinhoService.calcularTotais();

    const nome =
        document.getElementById('clienteNome')?.value || '';

    const whatsapp =
        document.getElementById('clienteWhatsapp')?.value || '';

    const cidade =
        document.getElementById('clienteCidade')?.value || '';

    const localEntrega =
        document.getElementById('entregaNome')?.value || '';

    const endereco =
        document.getElementById('endereco')?.value || '';

    const numero =
        document.getElementById('numero')?.value || '';

    const bairro =
        document.getElementById('bairro')?.value || '';

    const cidadeEntrega =
        document.getElementById('cidadeEntrega')?.value || '';

    const pagamento =
        document.getElementById('formaPagamento')?.value || '';

    const observacoes =
        document.getElementById('observacoes')?.value || '';

    let linhas = '';

    itens.forEach(item => {

        const preco =
            Number(
                item.precoFinal ||
                item.price ||
                0
            );

        const qtd =
            Number(
                item.quantidade || 0
            );

        const subtotal =
            preco * qtd;

        linhas += `

            <tr>

                <td>${item.sku || ''}</td>

                <td>${item.nome || ''}</td>

                <td style="text-align:center">
                    ${qtd}
                </td>

                <td style="text-align:right">
                    ${preco.toFixed(2)}
                </td>

                <td style="text-align:right">
                    ${subtotal.toFixed(2)}
                </td>

            </tr>

        `;

    });

    const janela =
        window.open(
            '',
            '_blank'
        );

    janela.document.write(`

<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>
Romaneio
</title>

<style>

body{
    font-family:Arial,sans-serif;
    font-size:11px;
    color:#000;
    margin:10mm;
}

h1{
    margin:0;
    font-size:18px;
}

h2{
    margin:0;
    font-size:12px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,
td{
    border:1px solid #000;
    padding:4px;
}

.compacto{
    margin-top:8px;
}

.flex{
    display:flex;
    justify-content:space-between;
}

@media print{

    body{
        margin:5mm;
    }

}

</style>

</head>

<body>

<h1>
ABELLA JOIAS
</h1>

<h2>
ROMANEIO DE PEDIDO
</h2>

<hr>

<div class="compacto">

<b>Cliente:</b>
${nome}

<br>

<b>WhatsApp:</b>
${whatsapp}

<br>

<b>Cidade:</b>
${cidade}

</div>

<div class="compacto">

<b>Entrega:</b>
${localEntrega}

<br>

${endereco},
${numero}

<br>

${bairro}

<br>

${cidadeEntrega}

</div>

<div class="compacto">

<b>Pagamento:</b>
${pagamento}

</div>

<table class="compacto">

<thead>

<tr>

<th style="width:90px">
SKU
</th>

<th>
Produto
</th>

<th style="width:50px">
Qtd
</th>

<th style="width:80px">
Unit.
</th>

<th style="width:90px">
Total
</th>

</tr>

</thead>

<tbody>

${linhas}

</tbody>

</table>

<div class="compacto">

<table>

<tr>

<td>
Peças
</td>

<td>
${resumo.totalPecas}
</td>

</tr>

<tr>

<td>
Peso
</td>

<td>
${resumo.pesoTotal.toFixed(2)} g
</td>

</tr>

<tr>

<td>
Subtotal
</td>

<td>
R$ ${resumo.subtotal.toFixed(2)}
</td>

</tr>

<tr>

<td>
Desconto PIX
</td>

<td>
R$ ${resumo.descontoPix.toFixed(2)}
</td>

</tr>

<tr>

<td>
Total PIX
</td>

<td>
R$ ${resumo.totalPix.toFixed(2)}
</td>

</tr>

</table>

</div>

<div class="compacto">

<b>Observações:</b>

<br>

${observacoes || '-'}

</div>

<script>

window.onload = function(){

    window.print();

};

<\/script>

</body>

</html>

    `);

    janela.document.close();

}

        function finalizarPedido(){

            window.location.href =
                'checkout.html';

        }

    </script>

</body>
</html>
```
