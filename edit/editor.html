<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Editor Full Master v4.0 • Abella Joias</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
body { background:#0b0b0b; color:#eee; font-family:'Poppins',sans-serif; }

.input-dark { background:#1a1a1a;border:1px solid #333;color:#fff;padding:5px 7px;border-radius:6px;width:100%;font-size:10px; }
.input-dark:focus { border-color:#caa85c; background:#222; outline:none; }

.edit-sku { color:#caa85c; font-family:monospace; font-weight:bold; text-transform:uppercase; }

tr.is-paused { opacity:.4; background:#2a1010 !important; }

.btn-status { font-size:9px;font-weight:800;text-transform:uppercase;padding:4px 6px;border-radius:4px;cursor:pointer;width:44px; }
.status-on { background:#15803d;color:#fff; }
.status-off { background:#b91c1c;color:#fff; }

.sticky-header th { position:sticky;top:0;background:#0b0b0b;z-index:10;border-bottom:2px solid #caa85c;font-size:9px; }

.img-preview { width:34px;height:34px;object-fit:cover;background:#222;border-radius:4px;border:1px solid #444; }
.img-error { border-color:#ef4444;background:#451a1a; }

.highlight-var { border:1px solid #caa85c !important; }
.highlight-sub { border:1px solid #818cf8 !important; }

::-webkit-scrollbar { width:5px;height:5px; }
::-webkit-scrollbar-thumb { background:#333; }
</style>
</head>

<body class="p-2">

<div class="max-w-[100%] mx-auto">

<header class="bg-[#141414] p-4 rounded-xl border border-[#2a2a2a] mb-4 flex justify-between">
<h1 class="text-xl font-bold text-[#caa85c]">Editor Full Master v4.0</h1>

<div class="flex gap-2">
<button onclick="criarNovoProduto()" class="bg-white text-black px-4 py-2 text-[10px]">+ NOVO</button>
<button onclick="carregarProdutos()" class="bg-[#caa85c] text-black px-4 py-2 text-[10px]">BUSCAR</button>
</div>
</header>

<table class="w-full text-[10px]">
<thead class="sticky-header">
<tr>
<th>Status</th><th>Img</th><th>SKU</th><th>Nome</th><th>Preço</th><th>Ações</th>
</tr>
</thead>
<tbody id="tabelaCorpo"></tbody>
</table>

</div>

<script>

const firebaseConfig = {
apiKey:"AIzaSyDPZBSX8W...",
databaseURL:"https://catalogo-abella-joias-default-rtdb.firebaseio.com"
};

if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let categoriasCache = {};
let subcatPorPai = {};

async function carregarCategorias(){
const snap = await db.ref('abella/categories').once('value');
categoriasCache = snap.val() || {};

subcatPorPai = {};
Object.entries(categoriasCache).forEach(([k,v])=>{
if(v.subcategories) subcatPorPai[k]=v.subcategories;
});
}

function setStatus(msg){
console.log(msg);
}

function converterUrlStorage(url){
if(!url || !url.startsWith('gs://')) return url;
const clean=url.replace('gs://','');
const i=clean.indexOf('/');
const bucket=clean.substring(0,i);
const path=clean.substring(i+1);
return `https://firebasestorage.googleapis.com/v0/b/${bucket}/o/${encodeURIComponent(path)}?alt=media`;
}

function criarLinhaHTML(id,p){

const statusBtn = p.paused ? 'status-off' : 'status-on';

return `
<tr data-id="${id}">
<td><button onclick="toggleStatus(this)" class="btn-status ${statusBtn}">${p.paused?'OFF':'ON'}</button></td>
<td><input class="edit-img" value="${p.image||''}"></td>
<td class="edit-sku">${p.sku||''}</td>
<td><input class="edit-name" value="${p.name||''}"></td>
<td><input class="edit-preco" value="${p.price||0}"></td>
<td>
<button onclick="salvarLinha(this)">💾</button>
<button onclick="deletarProduto('${id}')">🗑</button>
</td>
</tr>`;
}

async function criarNovoProduto(){

const ref = db.ref('abella/products').push();

const data = {
sku:"SKU-NEW",
name:"Novo Produto",
price:0,
paused:true,
image:""
};

await ref.set(data);

document.getElementById('tabelaCorpo')
.insertAdjacentHTML('afterbegin',criarLinhaHTML(ref.key,data));
}

async function carregarProdutos(){

await carregarCategorias();

const snap = await db.ref('abella/products').once('value');

let html="";

snap.forEach(c=>{
html+=criarLinhaHTML(c.key,c.val());
});

document.getElementById('tabelaCorpo').innerHTML=html;
}

async function toggleStatus(btn){

const tr = btn.closest('tr');
const id = tr.dataset.id;
const on = btn.classList.contains('status-on');

const newState = !on;

await db.ref(`abella/products/${id}`).update({paused:!newState});

btn.className='btn-status '+(newState?'status-on':'status-off');
btn.innerText=newState?'ON':'OFF';
}

async function salvarLinha(btn){
const tr=btn.closest('tr');
const id=tr.dataset.id;

const data={
sku:tr.querySelector('.edit-sku').innerText,
name:tr.querySelector('.edit-name').value,
price:parseFloat(tr.querySelector('.edit-preco').value)||0,
image:tr.querySelector('.edit-img').value
};

await db.ref(`abella/products/${id}`).update(data);
}

async function deletarProduto(id){
await db.ref('abella/products/'+id).remove();
carregarProdutos();
}

</script>
</body>
</html>
