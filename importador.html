<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Super Importador Abella Joias</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-storage-compat.js"></script>
    <style>
        body { font-family: sans-serif; background: #0a0a0a; padding: 40px; color: #adadad; }
        .box { max-width: 700px; margin: auto; background: #111; padding: 30px; border: 1px solid #zinc-900; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h2 { color: #caa85c; text-align: center; font-family: sans-serif; font-weight: 900; letter-spacing: -0.05em; text-transform: uppercase; }
        button { background: #caa85c; color: #000; padding: 14px; width: 100%; margin-top: 15px; font-weight: bold; border: none; cursor: pointer; border-radius: 8px; text-transform: uppercase; letter-spacing: 0.05em; transition: all 0.2s; }
        button:hover { brightness: 110%; }
        button:disabled { background: #222; color: #555; cursor: not-allowed; }
        #log { margin-top: 20px; background: #000; color: #adadad; padding: 15px; font-size: 11px; height: 350px; overflow: auto; border-radius: 8px; font-family: monospace; border: 1px solid #222; }
        .success { color: #4caf50; font-weight: bold; } .warn { color: #ff9800; } .error { color: #f44336; font-weight: bold; }
        input[type="file"] { background: #1a1a1a; padding: 10px; width: 100%; border-radius: 8px; border: 1px solid #222; box-sizing: border-box; color: #fff; margin-top: 5px;}
    </style>
</head>
<body>

<div class="box">
    <h2>📦 Super Importador Abella Joias</h2>
    <p style="font-size: 12px; text-align: center; font-family: monospace; color: #555;">Destino Realtime: <span style="color: #caa85c;">/abella/products</span></p>
    
    <div style="margin-top: 15px;">
        <label style="font-size: 11px; font-weight: bold; text-transform: uppercase; font-family: monospace;">Selecione o Arquivo CSV:</label>
        <input type="file" id="csv" accept=".csv">
    </div>
    
    <button id="btn" onclick="importarTudo()">Limpar e Importar para o Catálogo</button>
    <div id="log">Pronto para processamento...</div>
</div>

<script>
// ATENÇÃO: Confirme se estas credenciais batem com o seu Firebase ativo
const firebaseConfig = {
    apiKey: "AIzaSyDPBZSxW8XjtQmDMUknzAyIlFda51MvMJY",
    databaseURL: "https://catalogo-abella-joias-default-rtdb.firebaseio.com",
    storageBucket: "catalogo-abella-joias.firebasestorage.app"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const storage = firebase.storage();

function gerarSlug(txt) {
    if(!txt) return "geral";
    return txt.toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");
}

async function buscarFoto(sku) {
    // Alinhado com as extensões que você costuma gerar nos apps de fotos
    const extensoes = ['.png', '.jpg', '.jpeg', '.PNG', '.JPG'];
    for (const ext of extensoes) {
        try {
            // Varre o Storage na pasta /produtos/
            const ref = storage.ref().child('produtos/' + sku + ext);
            return await ref.getDownloadURL();
        } catch (e) { continue; }
    }
    return "";
}

async function importarTudo() {
    const file = document.getElementById('csv').files[0];
    if(!file) return alert("Selecione o arquivo CSV do WooCommerce primeiro.");
    if(!confirm("⚠️ Confirmar importação direta do WooCommerce na ramificação /abella/products?")) return;

    const log = document.getElementById('log');
    const btn = document.getElementById('btn');
    btn.disabled = true;
    log.innerHTML = "🚀 Lendo estrutura nativa do WooCommerce...<br>";

    try {
        const text = await file.text();
        // Divide o arquivo por linhas
        const linhas = text.split(/\r?\n/);
        
        let totalProd = 0;
        let categorias = new Set();

        // Função para dividir a linha por vírgulas, mas ignorando vírgulas dentro de aspas
        function dividirLinhaWoo(linha) {
            const arr = [];
            let dentroDeAspas = false;
            let token = '';
            for (let i = 0; i < linha.length; i++) {
                let char = linha[i];
                if (char === '"') {
                    dentroDeAspas = !dentroDeAspas;
                } else if (char === ',' && !dentroDeAspas) {
                    arr.push(token.trim());
                    token = '';
                } else {
                    token += char;
                }
            }
            arr.push(token.trim());
            return arr;
        }

        // Ler a primeira linha (cabeçalho) para achar a posição exata de cada coluna dinamicamente
        const cabecalho = dividirLinhaWoo(linhas[0]);
        const idxSKU = cabecalho.findIndex(c => c.toLowerCase() === 'sku');
        const idxNome = cabecalho.findIndex(c => c.toLowerCase() === 'nome');
        const idxPreco = cabecalho.findIndex(c => c.toLowerCase() === 'preço' || c.toLowerCase() === 'preco');
        const idxPeso = cabecalho.findIndex(c => c.toLowerCase() === 'peso (g)');
        const idxCat = cabecalho.findIndex(c => c.toLowerCase() === 'categorias');
        const idxImg = cabecalho.findIndex(c => c.toLowerCase() === 'imagens');

        log.innerHTML += `<span style="color:#caa85c">Mapeamento de colunas concluído. Processando produtos...</span><br>`;

        // Começa em 1 para pular o cabeçalho
        for(let i = 1; i < linhas.length; i++) {
            if(!linhas[i].trim()) continue;

            const col = dividirLinhaWoo(linhas[i]);
            
            // Pega os dados com base nos índices encontrados
            const skuOriginal = col[idxSKU] || "";
            const nome = col[idxNome] || "";
            
            // Pula linhas sem SKU ou sem Nome (como linhas vazias ou variações secundárias)
            if(!skuOriginal || !nome || skuOriginal.toLowerCase() === "sku") continue;

            const skuID = skuOriginal.replace(/[\.\$#\[\]\/]/g, "-");
            
            // Trata a Categoria (se houver hierarquia com '>', pega a última subcategoria)
            let catBruta = col[idxCat] || "Geral";
            if (catBruta.includes('>')) {
                const partes = catBruta.split('>');
                catBruta = partes[partes.length - 1].trim();
            }
            // Se vier múltipla categoria separada por vírgula, pega a primeira
            catBruta = catBruta.split(',')[0].trim();
            const catSlug = gerarSlug(catBruta);

            // Trata o Preço (Troca formato BR para formato americano de banco de dados)
            let precoCru = col[idxPreco] || "0";
            precoCru = precoCru.replace('R$', '').replace('.', '').replace(',', '.').trim();
            const preco = parseFloat(precoCru) || 0;

            // Trata o Peso
            let pesoCru = col[idxPeso] || "0";
            pesoCru = pesoCru.replace('g', '').replace('r', '').replace('.', '').replace(',', '.').trim();
            const peso = parseFloat(pesoCru) || 0;

            // Trata a Imagem (Pega o primeiro link do WordPress caso haja mais de um separado por vírgula)
            let urlImagem = col[idxImg] || "";
            if (urlImagem.includes(',')) {
                urlImagem = urlImagem.split(',')[0].trim();
            }

            log.innerHTML += `> Gravando SKU: ${skuOriginal}... `;

            try {
                // 1. Garante a categoria na ramificação /abella/
                await db.ref('abella/categories/' + catSlug).update({
                    name: catBruta,
                    slug: catSlug,
                    paused: false
                });
                categorias.add(catBruta);

                // 2. Grava o produto com o preço líquido e imagem direta do WordPress
                await db.ref('abella/products/' + skuID).set({
                    name: nome,
                    sku: skuOriginal,
                    category: catSlug,
                    price: parseFloat(preco.toFixed(2)),
                    weight: parseFloat(peso.toFixed(2)),
                    image: urlImagem,
                    paused: false,
                    promo: 0
                });

                log.innerHTML += `<span class="success">OK 💎</span><br>`;
                totalProd++;
            } catch (e) {
                log.innerHTML += `<span class="error">ERRO: ${e.message}</span><br>`;
            }
            log.scrollTop = log.scrollHeight;
        }

        log.innerHTML += `<br>✅ <b>IMPORTAÇÃO CONCLUÍDA!</b><br>Produtos enviados: ${totalProd}<br>Categorias: ${categorias.size}`;
        alert(`Sucesso! ${totalProd} produtos foram catalogados na ramificação Abella.`);

    } catch (err) {
        log.innerHTML += `<span class="error">ERRO CRÍTICO: ${err.message}</span><br>`;
    } finally {
        btn.disabled = false;
    }
}
</script>
</body>
</html>
