<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <script src="./js/analytics.js"></script>
    <title>Sacola • Abella Joias</title>

    <script>window.AURORA_FALLBACK_IMAGE = 'https://firebasestorage.googleapis.com/v0/b/catalogo-abella-joias.firebasestorage.app/o/images%2Flogo%2FInCollage_20250630_100544920-01.jpeg?alt=media';</script>

    <link rel="stylesheet" href="components/index.css">
    <style>
        .cart-item{
            display: grid; grid-template-columns: 88px 1fr auto; gap: var(--space-5);
            align-items: center; padding: var(--space-5) 0; border-bottom: 1px solid var(--color-border);
        }
        .cart-item .thumb{ width:88px; height:88px; border-radius: var(--radius-md); overflow:hidden; background: var(--color-bg); }
        .cart-item .thumb img{ width:100%; height:100%; object-fit:cover; }
        .qty-control{ display:flex; align-items:center; gap: var(--space-3); margin-top: var(--space-2); }
        .qty-btn{
            width:28px; height:28px; border-radius:50%; border:1px solid var(--color-border);
            background:var(--color-surface); cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center;
        }
        .qty-btn:hover{ border-color: var(--color-primary); }
        .qty-input{
            width: 56px; height: 28px; text-align: center; padding: 0 !important;
            font-size: 13px; -moz-appearance: textfield;
        }
        .qty-input::-webkit-outer-spin-button,
        .qty-input::-webkit-inner-spin-button{ -webkit-appearance: none; margin: 0; }
        .summary-row{ display:flex; justify-content:space-between; font-size:14px; padding-block: var(--space-2); color: var(--color-secondary); }
        .summary-total{ display:flex; justify-content:space-between; font-family: var(--font-heading); font-size:22px; padding-top: var(--space-4); margin-top: var(--space-3); border-top: 1px solid var(--color-border); }
        .empty-cart{ text-align:center; padding: var(--space-10) var(--space-5); }
    </style>
</head>
<body>

    <div class="aurora-header">
        <div class="bar aurora-container">
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="./galvanicas.html">Galvânicas</a>
            </nav>
            <div class="brand">
                <div class="brand-logo"><span style="font-family:var(--font-heading);font-weight:600;">A</span></div>
                <div><p class="brand-name">Abella</p></div>
            </div>
            <div class="actions">
                <a href="carrinho.html" class="cart-btn"><span id="cart-count">0</span></a>
            </div>
        </div>
    </div>

    <main class="aurora-container" style="max-width: 900px;">
        <div id="breadcrumb-slot"></div>

        <div style="display:flex; justify-content:space-between; align-items:baseline; margin: var(--space-5) 0 var(--space-6);">
            <div style="display:flex; align-items:center; gap: var(--space-4);">
                <button onclick="window.history.back()" class="aurora-btn aurora-btn--ghost aurora-btn--sm">← Voltar</button>
                <h1 style="font-size:clamp(24px,4vw,36px);">Sua Sacola</h1>
            </div>
            <button class="aurora-btn aurora-btn--ghost aurora-btn--sm" id="btnLimpar">Limpar sacola</button>
        </div>

        <div id="lista-itens"></div>

        <div id="empty-cart" class="empty-cart hidden">
            <p style="font-size:15px; color:var(--color-secondary); margin-bottom: var(--space-5);">Sua sacola está vazia.</p>
            <a href="index.html" class="aurora-btn aurora-btn--primary">Ver Coleções</a>
        </div>

        <div id="resumo" class="aurora-section" style="padding-top: var(--space-6); max-width: 380px; margin-left: auto;">
            <div id="cupomBox" style="margin-bottom: var(--space-5);">
                <div id="cupomForm" style="display:flex; gap: var(--space-2);">
                    <input type="text" id="inputCupom" placeholder="Código do cupom" class="aurora-input" style="text-transform:uppercase; flex:1;">
                    <button class="aurora-btn aurora-btn--outline aurora-btn--sm" id="btnAplicarCupom">Aplicar</button>
                </div>
                <p id="cupomMsg" style="font-size:11px; margin-top: var(--space-2);"></p>
                <div id="cupomAplicadoBox" class="hidden" style="display:flex; align-items:center; justify-content:space-between; background:rgba(var(--color-primary-rgb),.08); border:1px solid var(--color-border); border-radius:var(--radius-md); padding: var(--space-3) var(--space-4);">
                    <span style="font-size:12px; font-weight:600;">🏷️ Cupom <strong id="cupomCodigoAplicado"></strong> aplicado</span>
                    <button id="btnRemoverCupom" style="font-size:11px; color:var(--color-danger); background:none; border:none; cursor:pointer;">Remover</button>
                </div>
            </div>
            <div class="summary-row"><span>Subtotal</span><span id="subtotal">R$ 0,00</span></div>
            <div class="summary-row" id="linhaDesconto" style="display:none;"><span>Desconto</span><span id="descontoValor" style="color:var(--color-success);"></span></div>
            <div class="summary-row" id="linhaDescontoCupom" style="display:none;"><span>Cupom</span><span id="descontoCupomValor" style="color:var(--color-success);"></span></div>
            <div class="summary-total"><span>Total</span><span id="total">R$ 0,00</span></div>
            <a href="checkout.html" class="aurora-btn aurora-btn--primary aurora-btn--block" style="margin-top: var(--space-5);">Finalizar Pedido</a>
        </div>
    </main>

    <footer class="aurora-footer">
        <div class="aurora-container">
            <div class="bottom">
                <span>© Abella Joias — atacado de joias no bruto</span>
                <a href="index.html" style="color:var(--color-secondary);">← Continuar comprando</a>
            </div>
        </div>
    </footer>

    <script src="./js/firebase/firebase-config.js"></script>
    <script src="./js/utils/money.js"></script>
    <script src="./js/utils/peso.js"></script>
    <script src="./js/utils/storage.js"></script>
    <script src="./js/services/configService.js"></script>
    <script src="./js/services/descontoService.js"></script>
    <script src="./js/services/cupomService.js"></script>
    <script src="./js/services/carrinhoService.js"></script>
    <script src="./js/utils/image-helper.js"></script>
    
    <script src="engine/render.js"></script>
    <script src="engine/animations.js"></script>
    <script src="engine/mobile-nav.js"></script>

    <script>
        function formatarMoeda(valor) {
            return window.MoneyUtils?.format ? window.MoneyUtils.format(valor) : `R$ ${Number(valor).toFixed(2).replace('.', ',')}`;
        }

        function renderizarCarrinho() {
            const lista = document.getElementById('lista-itens');
            const empty = document.getElementById('empty-cart');
            const resumo = document.getElementById('resumo');
            const cartCountEl = document.getElementById('cart-count');

            if (!window.carrinhoService) {
                lista.innerHTML = `<p style="color:var(--color-danger);font-size:13px;">⚠️ Serviço de carrinho indisponível.</p>`;
                return;
            }

            const itens = carrinhoService.listar();
            cartCountEl.innerText = carrinhoService.obterContagem();

            if (itens.length === 0) {
                lista.innerHTML = '';
                empty.classList.remove('hidden');
                resumo.classList.add('hidden');
                return;
            }

            empty.classList.add('hidden');
            resumo.classList.remove('hidden');

            lista.innerHTML = itens.map(item => {
                const img = (typeof resolverImagemFirebase !== 'undefined' && item.image) ? resolverImagemFirebase(item.image) : (item.image || window.AURORA_FALLBACK_IMAGE);
                const precoUnit = formatarMoeda(item.precoVendaUnitario);
                const precoTotalItem = formatarMoeda(item.precoVendaUnitario * item.quantidade);
                const badge = item.possuiDesconto && item.badgePromocional
                    ? `<span class="aurora-badge aurora-badge--pix" style="margin-left:var(--space-2);">${item.badgePromocional}</span>` : '';

                return `
                    <div class="cart-item">
                        <div class="thumb"><img src="${img}" alt="${item.name}" onerror="this.src='${window.AURORA_FALLBACK_IMAGE}'"></div>
                        <div>
                            <p style="font-family:var(--font-heading); font-size:17px;">${item.name} ${badge}</p>
                            ${item.variacao ? `<p style="font-size:12px; color:var(--color-secondary); margin-top:var(--space-1);">Variação: ${item.variacao}</p>` : ''}
                            <div class="qty-control">
                                <button class="qty-btn" onclick="alterarQuantidade('${item.id}', '${item.variacao || ''}', ${item.quantidade - 1})">−</button>
                                <input type="number" class="aurora-input qty-input" min="1" value="${item.quantidade}"
                                       onchange="alterarQuantidade('${item.id}', '${item.variacao || ''}', parseInt(this.value) || 1)"
                                       onkeydown="if(event.key==='Enter'){this.blur();}">
                                <button class="qty-btn" onclick="alterarQuantidade('${item.id}', '${item.variacao || ''}', ${item.quantidade + 1})">+</button>
                                <button style="font-size:11px; color:var(--color-danger); background:none; border:none; cursor:pointer; margin-left:var(--space-3);" onclick="removerItem('${item.id}', '${item.variacao || ''}')">Remover</button>
                            </div>
                        </div>
                        <div style="text-align:right;">
                            <p class="aurora-price" style="font-size:16px;">${precoTotalItem}</p>
                            <p style="font-size:11px; color:var(--color-secondary);">${precoUnit} /un.</p>
                        </div>
                    </div>
                `;
            }).join('');

            const subtotal = carrinhoService.obterTotalBruto();
            const total = carrinhoService.obterTotal();
            const descontoCategoria = itens.reduce((acc, item) => {
                const bruto = (parseFloat(item.preco) || 0) * item.quantidade;
                const comDesconto = item.precoVendaUnitario * item.quantidade;
                return acc + (bruto - comDesconto);
            }, 0);
            const descontoCupom = carrinhoService.obterDescontoCupom();

            document.getElementById('subtotal').innerText = formatarMoeda(subtotal);
            document.getElementById('total').innerText = formatarMoeda(total);

            const linhaDesconto = document.getElementById('linhaDesconto');
            if (descontoCategoria > 0.001) {
                linhaDesconto.style.display = 'flex';
                document.getElementById('descontoValor').innerText = `− ${formatarMoeda(descontoCategoria)}`;
            } else {
                linhaDesconto.style.display = 'none';
            }

            const linhaDescontoCupom = document.getElementById('linhaDescontoCupom');
            const cupomAplicado = carrinhoService.obterCupomAplicado();
            if (cupomAplicado && descontoCupom > 0.001) {
                linhaDescontoCupom.style.display = 'flex';
                document.getElementById('descontoCupomValor').innerText = `− ${formatarMoeda(descontoCupom)}`;
            } else {
                linhaDescontoCupom.style.display = 'none';
            }

            if (cupomAplicado) {
                document.getElementById('cupomForm').classList.add('hidden');
                document.getElementById('cupomAplicadoBox').classList.remove('hidden');
                document.getElementById('cupomAplicadoBox').style.display = 'flex';
                document.getElementById('cupomCodigoAplicado').innerText = cupomAplicado.code;
            } else {
                document.getElementById('cupomForm').classList.remove('hidden');
                document.getElementById('cupomAplicadoBox').classList.add('hidden');
                document.getElementById('cupomAplicadoBox').style.display = 'none';
            }
        }

        function alterarQuantidade(id, variacao, novaQtd) {
            if (novaQtd < 1) {
                removerItem(id, variacao);
                return;
            }
            carrinhoService.atualizarQuantidade(id, novaQtd, variacao);
            renderizarCarrinho();
        }

        function removerItem(id, variacao) {
            carrinhoService.remover(id, variacao);
            renderizarCarrinho();
        }

        async function aplicarCupomUI() {
            const input = document.getElementById('inputCupom');
            const msg = document.getElementById('cupomMsg');
            const btn = document.getElementById('btnAplicarCupom');
            const codigo = input.value.trim();

            if (!codigo) { msg.style.color = 'var(--color-danger)'; msg.innerText = 'Digite um código.'; return; }
            if (!window.cupomService) { msg.style.color = 'var(--color-danger)'; msg.innerText = 'Serviço de cupom indisponível.'; return; }

            btn.disabled = true;
            btn.innerText = 'Validando...';
            msg.innerText = '';

            const subtotalAtual = carrinhoService.obterTotalBruto();
            const resultado = await cupomService.validar(codigo, subtotalAtual);

            btn.disabled = false;
            btn.innerText = 'Aplicar';

            if (!resultado.valido) {
                msg.style.color = 'var(--color-danger)';
                msg.innerText = resultado.motivo;
                return;
            }

            carrinhoService.aplicarCupom(resultado.cupom);
            input.value = '';
            msg.innerText = '';
            renderizarCarrinho();
        }

        document.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('breadcrumb-slot').innerHTML = AuroraRender.breadcrumb([
                { label: 'Home', href: 'index.html' },
                { label: 'Sacola' }
            ]);

            // Precisa estar carregado ANTES do primeiro render, senão descontoService não acha nada
            if (window.ConfigService) {
                try { await ConfigService.getSettings(); } catch (e) { console.warn('Falha ao pré-carregar settings:', e); }
            }

            renderizarCarrinho();

            document.getElementById('btnAplicarCupom').addEventListener('click', aplicarCupomUI);
            document.getElementById('inputCupom').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') { e.preventDefault(); aplicarCupomUI(); }
            });
            document.getElementById('btnRemoverCupom').addEventListener('click', () => {
                carrinhoService.removerCupom();
                renderizarCarrinho();
            });

            document.getElementById('btnLimpar').addEventListener('click', () => {
                if (confirm('Tem certeza que deseja esvaziar a sacola?')) {
                    carrinhoService.limpar();
                    renderizarCarrinho();
                }
            });
        });
    </script>
</body>
</html>
