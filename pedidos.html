<div class="flex justify-between items-center mb-6">
    <div>
        <h2 class="text-xl font-black text-white uppercase tracking-tight">Módulo de Pedidos Recebidos</h2>
        <p class="text-xs text-gray-500">Fluxo operacional assíncrono isolado com persistência estável</p>
    </div>
    <span id="qtd-pedidos" class="bg-[#caa85c]/10 border border-[#caa85c]/20 text-[#caa85c] px-3 py-1 rounded-full text-xs font-bold font-mono">Carregando contador...</span>
</div>

<div class="mb-4">
    <input id="buscaPedido" type="text" oninput="carregarPedidos()" placeholder="🔍 Buscar cliente por nome..." class="w-full md:w-80 bg-[#111] border border-[#222] p-2.5 rounded-xl text-xs text-white focus:border-[#caa85c] outline-none font-medium">
</div>

<div id="listaPedidos" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
    <div class="col-span-full text-center py-12 text-zinc-600 italic text-xs animate-pulse font-mono">
        Buscando dados ativos na árvore 'orders' do Firebase...
    </div>
</div>
<script>
    (function() {
        // Verifica se o Firebase já está pronto na janela global, senão aguarda
        if (typeof firebase === 'undefined' || !firebase.apps.length) {
            setTimeout(arguments.callee, 50);
            return;
        }

        const db = firebase.database();
        let todosPedidosLocal = {};
        
        // CORREÇÃO: Adicionado aspas em 'BRL' para não quebrar o script
        const fMoedaLocal = v => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v || 0);

        window.carregarPedidos = function() {
            db.ref('orders').once('value').then(snap => {
                const container = document.getElementById('listaPedidos');
                const badgeCount = document.getElementById('qtd-pedidos');
                if (!container) return;

                if (!snap.exists()) {
                    container.innerHTML = '<div class="text-center py-10 text-gray-600 italic col-span-full">Nenhum pedido localizado na base de dados.</div>';
                    if(badgeCount) badgeCount.innerText = "0 pedidos";
                    return;
                }

                todosPedidosLocal = snap.val();
                const buscaElemento = document.getElementById('buscaPedido');
                const busca = buscaElemento ? buscaElemento.value.toLowerCase().trim() : '';
                let htmlStack = [];
                let count = 0;

                Object.keys(todosPedidosLocal).forEach(id => {
                    const p = todosPedidosLocal[id];
                    const cliente = p.nome || p.cliente || 'Cliente Oculto';
                    if (busca && !cliente.toLowerCase().includes(busca)) return;
                    
                    count++;
                    let totalPecas = 0;
                    if (Array.isArray(p.itens)) {
                        p.itens.forEach(i => totalPecas += (parseInt(i.quantidade || i.qtd) || 1));
                    }

                    const rawTotal = p.total;
                    const totalExibivel = typeof rawTotal === 'number' ? fMoedaLocal(rawTotal) : (rawTotal || 'R$ 0,00');
                    const numeroPedido = id.slice(-6).toUpperCase();

                    htmlStack.push(`
                        <div class="bg-[#111] border border-[#222] p-4 rounded-xl flex flex-col justify-between border border-zinc-800 hover:border-zinc-700 transition-all text-xs space-y-3">
                            <div class="space-y-1">
                                <div class="flex justify-between items-center text-gray-400 font-mono text-[11px]">
                                    <span class="font-bold text-white">Pedido #${numeroPedido}</span>
                                    <span>${p.data ? new Date(p.data).toLocaleString('pt-BR') : ''}</span>
                                </div>
                                <h4 class="text-base font-bold text-white uppercase">${cliente}</h4>
                                <p class="text-xs text-gray-400 font-mono">📱 WhatsApp: ${p.whats || p.telefone || 'Não informado'}</p>
                                <p class="text-xs text-zinc-400 font-mono">📦 Volume Total: <span class="text-[#caa85c] font-bold">${totalPecas} pçs</span></p>
                                <p class="text-xs text-zinc-500 truncate">📍 Endereço: ${p.rua || 'Retirada / Não informado'}</p>
                                <div class="pt-1.5 flex justify-between items-center border-t border-zinc-900/50 mt-1">
                                    <span class="text-[10px] text-gray-500 uppercase font-bold tracking-wider">Total Líquido</span>
                                    <span class="text-sm font-black text-[#caa85c] font-mono">${totalExibivel}</span>
                                </div>
                            </div>
                            <div class="bg-black/40 p-2 rounded-lg border border-zinc-900 space-y-1.5">
                                <div class="flex gap-1.5">
                                    <select id="select-romaneio-${id}" class="bg-zinc-900 border border-zinc-800 text-[11px] text-white p-1 rounded flex-1 outline-none">
                                        <option value="1">1. Conferência de Separação</option>
                                        <option value="2">2. Financeiro e Faturamento</option>
                                        <option value="3">3. Vitrine (Conferência Fotográfica)</option>
                                        <option value="4">4. Grade Comparativa Conf.</option>
                                        <option value="5">5. Grade Financeira Expandida</option>
                                        <option value="6">6. Grade Consolidada Total</option>
                                    </select>
                                    <button onclick="const tipo = document.getElementById('select-romaneio-${id}').value; abrirEditorPedido('${id}'); imprimirRomaneio(parseInt(tipo));" class="bg-[#caa85c] text-black font-bold text-[10px] px-2.5 py-1 rounded hover:brightness-110 uppercase tracking-wider">Imprimir</button>
                                </div>
                            </div>
                            <div class="flex gap-2 pt-2 border-t border-zinc-900">
                                <button onclick="abrirEditorPedido('${id}')" class="flex-1 bg-zinc-800 hover:bg-zinc-700 text-white font-medium py-1 px-2 rounded transition-all text-center">⚙️ Gerenciar / Editar</button>
                                <button onclick="excluirPedido('${id}')" class="bg-red-950/30 hover:bg-red-900/50 text-red-400 border border-red-900/30 py-1 px-2 rounded transition-all">🗑️ Excluir</button>
                            </div>
                        </div>
                    `);
                });

                container.innerHTML = htmlStack.length ? htmlStack.reverse().join('') : '<div class="text-center py-10 text-gray-600 italic col-span-full">Nenhum cliente correspondente.</div>';
                if(badgeCount) badgeCount.innerText = `${count} ${count === 1 ? 'pedido' : 'pedidos'}`;
            }).catch(err => console.error("Erro ao carregar pedidos:", err));
        };

       window.abrirEditorPedido = function(id) {
    window.pedidoEditando = id;
    const p = todosPedidosLocal[id];
    if(!p) return;
    
    // LINHA ADICIONADA: Atualiza visualmente a hashtag do pedido no título do modal
    const elId = document.getElementById('idPedidoInterno');
    if(elId) elId.innerText = `#${id.toUpperCase()}`;
    
            document.getElementById('edClienteNome').value = p.nome || p.cliente || '';
            document.getElementById('edClienteTel').value = p.whats || p.telefone || '';
            document.getElementById('edRua').value = p.rua || '';
            document.getElementById('edCidade').value = p.cidade || '';
            document.getElementById('edDescPromo').value = p.descontoPromo || 0;
            document.getElementById('edDescPix').value = p.descontoPix || 0;
            document.getElementById('edFrete').value = p.frete || 0;
            
            renderItensEditor(p.itens || []);
            document.getElementById('editorPedido').classList.remove('hidden');
        };

        function renderItensEditor(itens) {
            const box = document.getElementById('edItens');
            if(!box) return;
            box.innerHTML = '';
            itens.forEach((item, index) => {
                box.innerHTML += `
                    <div class="flex items-center gap-2 bg-black/40 p-2 border border-[#222] rounded-lg">
                        <div class="flex-1 truncate">
                            <div class="text-xs font-bold text-white truncate">${item.nome}</div>
                            <div class="text-[10px] text-gray-500 font-mono">SKU: ${item.sku || 'N/A'} | Preço: ${fMoedaLocal(item.precoFinal || item.price || item.preco)}</div>
                        </div>
                        <div class="flex items-center gap-1 shrink-0">
                            <input type="number" step="0.01" value="${item.precoFinal || item.price || item.preco || 0}" oninput="atualizarItemPreco(${index}, this.value)" class="w-20 bg-black border border-[#333] p-1 rounded text-center text-xs text-white font-mono">
                            <input type="number" value="${item.quantidade || item.qtd || 1}" oninput="atualizarItemQtd(${index}, this.value)" class="w-14 bg-black border border-[#333] p-1 rounded text-center text-xs text-white font-mono">
                            <button onclick="removerItemEditor(${index})" class="text-red-500 font-bold px-2 hover:text-red-400">✕</button>
                        </div>
                    </div>
                `;
            });
            recalcularTotalEd();
        }

        window.atualizarItemPreco = function(index, valor) {
            const p = todosPedidosLocal[window.pedidoEditando];
            if(p && p.itens && p.itens[index]) {
                p.itens[index].precoFinal = parseFloat(valor) || 0;
                p.itens[index].preco = parseFloat(valor) || 0;
                recalcularTotalEd();
            }
        };

        window.atualizarItemQtd = function(index, valor) {
            const p = todosPedidosLocal[window.pedidoEditando];
            if(p && p.itens && p.itens[index]) {
                p.itens[index].quantidade = parseInt(valor) || 0;
                p.itens[index].qtd = parseInt(valor) || 0;
                recalcularTotalEd();
            }
        };

        window.removerItemEditor = function(index) {
            const p = todosPedidosLocal[window.pedidoEditando];
            if(p && p.itens) {
                p.itens.splice(index, 1);
                renderItensEditor(p.itens);
            }
        };

        window.addItemEditor = function() {
            const sku = prompt("Digite o SKU exato do produto:").toUpperCase().trim();
            if(!sku) return;

            db.ref('products/' + sku).once('value', snap => {
                if(!snap.exists()) {
                    alert("❌ SKU não localizado!");
                    return;
                }
                const prod = snap.val();
                const p = todosPedidosLocal[window.pedidoEditando];
                if(!p.itens) p.itens = [];
                
                p.itens.push({
                    sku: sku,
                    nome: prod.name || prod.nome,
                    precoFinal: parseFloat(prod.price || prod.precoFinal || 0),
                    preco: parseFloat(prod.price || prod.precoFinal || 0),
                    quantidade: 1
                });
                renderItensEditor(p.itens);
            });
        };

        window.recalcularTotalEd = function() {
            const p = todosPedidosLocal[window.pedidoEditando];
            if(!p) return;

            let subtotal = 0, totalPecas = 0;
            if(Array.isArray(p.itens)) {
                p.itens.forEach(i => {
                    const precoProd = parseFloat(i.precoFinal || i.price || i.preco || 0);
                    const qtdProd = parseInt(i.quantidade || i.qtd || 0);
                    subtotal += precoProd * qtdProd;
                    totalPecas += qtdProd;
                });
            }
            const descPromo = parseFloat(document.getElementById('edDescPromo').value) || 0;
            const descPix = parseFloat(document.getElementById('edDescPix').value) || 0;
            const frete = parseFloat(document.getElementById('edFrete').value) || 0;

            const totalLiquido = subtotal - descPromo - descPix + frete;
            document.getElementById('totalPreview').innerText = fMoedaLocal(totalLiquido);
            document.getElementById('edQtdTotal').value = totalPecas;
        };

        window.salvarPedidoEditado = function() {
            const idTarget = window.pedidoEditando;
            const p = todosPedidosLocal[idTarget];
            p.nome = document.getElementById('edClienteNome').value.trim();
            p.whats = document.getElementById('edClienteTel').value.trim();
            p.rua = document.getElementById('edRua').value.trim();
            p.cidade = document.getElementById('edCidade').value.trim();
            p.descontoPromo = parseFloat(document.getElementById('edDescPromo').value) || 0;
            p.descontoPix = parseFloat(document.getElementById('edDescPix').value) || 0;
            p.frete = parseFloat(document.getElementById('edFrete').value) || 0;

            let subtotal = 0;
            if(p.itens) p.itens.forEach(i => subtotal += ((i.precoFinal || i.price || i.preco || 0) * (i.quantidade || i.qtd || 0)));
            p.total = subtotal - p.descontoPromo - p.descontoPix + p.frete;

            db.ref('orders/' + idTarget).set(p).then(() => {
                alert("✅ Pedido updated com sucesso!");
                fecharEditorPedido();
                carregarPedidos();
            });
        };

        window.excluirPedido = function(id) {
            if(confirm("🚨 Deseja deletar definitivamente este pedido?")) {
                db.ref('orders/' + id).remove().then(() => {
                    alert("Pedido excluído!");
                    carregarPedidos();
                });
            }
        };

        window.fecharEditorPedido = function() {
            document.getElementById('editorPedido').classList.add('hidden');
            window.pedidoEditando = null;
        };

// MODIFICAÇÃO: Agora gera o layout instantaneamente na tela dentro do modal de Preview
        window.imprimirRomaneio = function(tipo) {
            const p = todosPedidosLocal[window.pedidoEditando];
            if(!p) {
                alert("🚨 Selecione ou abra um pedido antes de imprimir!");
                return;
            }

            const previewArea = document.getElementById('corpo-preview-a4');
            const modalPreview = document.getElementById('previewRomaneio');
            if(!previewArea || !modalPreview) return;

            const numPedidoFriendly = window.pedidoEditando.slice(-6).toUpperCase();
            const cliente = p.nome || p.cliente || 'Cliente Oculto';
            const dataPedido = p.data ? new Date(p.data).toLocaleDateString('pt-BR') : 'N/A';
            
            let subtotalGeral = 0;
            let totalPecasGeral = 0;
            
            if (Array.isArray(p.itens)) {
                p.itens.forEach(i => {
                    const qtd = parseInt(i.quantidade || i.qtd || 0);
                    const preco = parseFloat(i.precoFinal || i.price || i.preco || 0);
                    subtotalGeral += (preco * qtd);
                    totalPecasGeral += qtd;
                });
            }

            const descPromo = parseFloat(p.descontoPromo || p.desconto || 0);
            const descPix = parseFloat(p.descontoPix || 0);
            const frete = parseFloat(p.frete || 0);
            const totalLiquido = subtotalGeral - descPromo - descPix + frete;

            // Início do layout limpo e focado em folha branca A4
            let htmlGerado = `
                <div style="font-family: 'Inter', monospace, sans-serif; color: #000; font-size: 11px; line-height: 1.3;">
                    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #000; padding-bottom: 6px; margin-bottom: 8px;">
                        <div>
                            <h1 style="margin: 0; font-size: 14px; font-weight: 900; tracking-tight;">ABELLA JÓIAS — ATACADO NO BRUTO</h1>
                            <p style="margin: 0; font-size: 9px; color: #444;">MÓDULO LOGÍSTICO COMPACTO A4 • MODALIDADE: ${
                                tipo === 1 ? 'LISTA: CONFERÊNCIA DE SEPARAÇÃO' :
                                tipo === 2 ? 'LISTA: FINANCEIRO E FATURAMENTO' :
                                tipo === 3 ? 'LISTA: CONFERÊNCIA FOTOGRÁFICA (VITRINE)' :
                                tipo === 4 ? 'GRADE: CONFERÊNCIA DE SEPARAÇÃO' :
                                tipo === 5 ? 'GRADE: FINANCEIRO EXPANDIDO' :
                                'GRADE: CONSOLIDADO TOTAL + FOTO'
                            }</p>
                        </div>
                        <div style="text-align: right;">
                            <span style="font-size: 13px; font-weight: bold; background: #000; color: #fff; padding: 2px 6px; border-radius: 4px;">PEDIDO #${numPedidoFriendly}</span>
                            <p style="margin: 2px 0 0 0; font-size: 10px; font-weight: bold;">Data: ${dataPedido}</p>
                        </div>
                    </div>
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr; background: #f5f5f5; padding: 6px; border-radius: 4px; margin-bottom: 10px; font-size: 10px; border: 1px solid #ddd;">
                        <div>
                            <b>Cliente:</b> ${cliente.toUpperCase()}<br>
                            <b>WhatsApp:</b> ${p.whats || p.telefone || 'Não informado'}<br>
                            <b>Logradouro:</b> ${p.rua || 'Não informado'}
                        </div>
                        <div style="text-align: right;">
                            <b>Cidade/UF:</b> ${p.cidade || 'Retirada em Limeira / SP'}<br>
                            <b>Total de Peças:</b> ${totalPecasGeral} u.<br>
                            <b>Pagamento:</b> ${p.formaPagamento || 'Pix'}
                        </div>
                    </div>
            `;

            // RENDERS EM FORMATO DE LISTA (Modelos 1, 2 e 3)
            if (tipo === 1 || tipo === 2 || tipo === 3) {
                htmlGerado += `
                    <table style="width: 100%; border-collapse: collapse; margin-top: 5px;">
                        <thead>
                            <tr style="background: #000; color: #fff; font-size: 10px; text-transform: uppercase;">
                                ${tipo === 3 ? '<th style="padding: 4px; border: 1px solid #000; text-align: center; width: 40px;">Foto</th>' : ''}
                                <th style="padding: 4px; border: 1px solid #000; text-align: left; width: 80px;">SKU / Ref.</th>
                                <th style="padding: 4px; border: 1px solid #000; text-align: left;">Descrição da Peça</th>
                                <th style="padding: 4px; border: 1px solid #000; text-align: center; width: 50px;">Qtd</th>
                                ${tipo !== 1 ? '<th style="padding: 4px; border: 1px solid #000; text-align: right; width: 70px;">Unitário</th>' : ''}
                                ${tipo !== 1 ? '<th style="padding: 4px; border: 1px solid #000; text-align: right; width: 80px;">Subtotal</th>' : ''}
                                ${tipo === 1 ? '<th style="padding: 4px; border: 1px solid #000; text-align: center; width: 60px;">Conf.</th>' : ''}
                            </tr>
                        </thead>
                        <tbody>
                `;

                if (Array.isArray(p.itens)) {
                    p.itens.forEach(i => {
                        const qtd = parseInt(i.quantidade || i.qtd || 1);
                        const preco = parseFloat(i.precoFinal || i.price || i.preco || 0);
                        
                        htmlGerado += `
                            <tr style="border-bottom: 1px solid #ccc; font-size: 10px;">
                                ${tipo === 3 ? `
                                    <td style="padding: 3px; border: 1px solid #ddd; text-align: center;">
                                        <div style="width: 30px; height: 30px; background: #eee; border: 1px dashed #aaa; margin: auto; font-size: 7px; display: flex; align-items: center; justify-content: center; color: #888;">[FOTO]</div>
                                    </td>` : ''
                                }
                                <td style="padding: 4px; border: 1px solid #ddd; font-weight: bold; font-family: monospace;">${i.sku || 'N/A'}</td>
                                <td style="padding: 4px; border: 1px solid #ddd; text-transform: uppercase;">${i.nome || 'Produto não identificado'}</td>
                                <td style="padding: 4px; border: 1px solid #ddd; text-align: center; font-weight: bold; font-size: 11px;">${qtd}</td>
                                ${tipo !== 1 ? `<td style="padding: 4px; border: 1px solid #ddd; text-align: right; font-family: monospace;">${fMoedaLocal(preco)}</td>` : ''}
                                ${tipo !== 1 ? `<td style="padding: 4px; border: 1px solid #ddd; text-align: right; font-weight: bold; font-family: monospace;">${fMoedaLocal(preco * qtd)}</td>` : ''}
                                ${tipo === 1 ? '<td style="padding: 4px; border: 1px solid #ddd; text-align: center; color: #ccc;">[  ]</td>' : ''}
                            </tr>
                        `;
                    });
                }
                htmlGerado += `</tbody></table>`;
            } 
            
            // RENDERS EM FORMATO DE GRADE COMPACTA (Modelos 4, 5 e 6)
            else if (tipo === 4 || tipo === 5 || tipo === 6) {
                htmlGerado += `
                    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 5px;">
                `;

                if (Array.isArray(p.itens)) {
                    p.itens.forEach(i => {
                        const qtd = parseInt(i.quantidade || i.qtd || 1);
                        const preco = parseFloat(i.precoFinal || i.price || i.preco || 0);

                        htmlGerado += `
                            <div style="border: 1px solid #000; padding: 4px; border-radius: 4px; background: #fff; display: flex; flex-direction: column; justify-content: space-between; page-break-inside: avoid;">
                                <div style="display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid #eee; padding-bottom: 2px; margin-bottom: 2px;">
                                    <span style="font-family: monospace; font-weight: bold; font-size: 9px; background: #e0e0e0; padding: 1px 3px; border-radius: 2px;">${i.sku || 'N/A'}</span>
                                    <span style="font-size: 11px; font-weight: 900; background: #000; color: #fff; padding: 1px 5px; border-radius: 3px;">X${qtd}</span>
                                </div>
                                
                                ${tipo === 6 ? `
                                    <div style="width: 100%; height: 40px; background: #f9f9f9; border: 1px dashed #ccc; margin: 2px 0; display: flex; align-items: center; justify-content: center; font-size: 7px; color: #999;">
                                        [FOTO DO PRODUTO]
                                    </div>` : ''
                                }

                                <div style="font-size: 9px; text-transform: uppercase; color: #222; min-height: 20px; line-height: 1.1; overflow: hidden; font-weight: 500;">
                                    ${i.nome || 'Sem Descrição'}
                                </div>

                                ${tipo !== 4 ? `
                                    <div style="display: flex; justify-content: space-between; align-items: center; background: #fcfcfc; padding-top: 2px; border-top: 1px dashed #ddd; font-size: 9px; font-family: monospace; margin-top: 2px;">
                                        <span style="color:#666;">Un: ${fMoedaLocal(preco)}</span>
                                        <span style="font-weight: bold; color:#000;">Total: ${fMoedaLocal(preco * qtd)}</span>
                                    </div>` : ''
                                }
                            </div>
                        `;
                    });
                }
                htmlGerado += `</div>`;
            }

            // FECHAMENTO E RESUMO FINANCEIRO
            if (tipo !== 1 && tipo !== 4) {
                htmlGerado += `
                    <div style="margin-top: 12px; page-break-inside: avoid;">
                        <div style="width: 260px; margin-left: auto; background: #fff; border: 2px solid #000; border-radius: 6px; padding: 6px; font-size: 10px; line-height: 1.4;">
                            <div style="display: flex; justify-content: space-between;"><span>Subtotal Bruto:</span><span style="font-family: monospace;">${fMoedaLocal(subtotalGeral)}</span></div>
                            <div style="display: flex; justify-content: space-between; color: #aa0000;"><span>(-) Desconto Comercial:</span><span style="font-family: monospace;">-${fMoedaLocal(descPromo)}</span></div>
                            ${descPix > 0 ? `<div style="display: flex; justify-content: space-between; color: #aa0000;"><span>(-) Desconto Pix:</span><span style="font-family: monospace;">-${fMoedaLocal(descPix)}</span></div>` : ''}
                            <div style="display: flex; justify-content: space-between;"><span>(+) Adicional de Frete:</span><span style="font-family: monospace;">${fMoedaLocal(frete)}</span></div>
                            <div style="display: flex; justify-content: space-between; font-size: 11px; font-weight: 900; border-top: 1px dashed #000; padding-top: 3px; margin-top: 4px;">
                                <span>VALOR LÍQUIDO:</span>
                                <span style="font-family: monospace; color: #000; font-weight: bold;">${fMoedaLocal(totalLiquido)}</span>
                            </div>
                        </div>
                    </div>
                `;
            }

            htmlGerado += `
                    <div style="margin-top: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; text-align: center; font-size: 9px; page-break-inside: avoid;">
                        <div style="border-top: 1px dashed #000; padding-top: 4px; margin-top: 15px;">Conferido e Separado por (Abella Jóias)</div>
                        <div style="border-top: 1px dashed #000; padding-top: 4px; margin-top: 15px;">Recebido em conformidade por: ${cliente.toUpperCase()}</div>
                    </div>
                </div>
            `;

            // Alimenta a div do Preview visual instantaneamente
            previewArea.innerHTML = htmlGerado;
            
            // Alimenta a div oculta oficial do admin (que a @media print vai usar para bater o papel real)
            const printArea = document.getElementById('print-area');
            if(printArea) printArea.innerHTML = htmlGerado;

            // Abre a janela de visualização flutuante de forma imediata e fluida
            modalPreview.classList.remove('hidden');
        };

        // Nova Função: Fecha o modal de preview e limpa o cache
        window.fecharPreviewRomaneio = function() {
            const modalPreview = document.getElementById('previewRomaneio');
            if(modalPreview) modalPreview.classList.add('hidden');
        };

        // Nova Função: Executa a chamada física de impressão real apenas quando o usuário valida no botão do cabeçalho
        window.confirmarImpressaoFisica = function() {
            window.print();
        };

        carregarPedidos();
    })();
</script>
