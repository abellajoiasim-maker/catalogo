<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Galvânicas Parceiras | Abella Joias</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --gold: #caa85c; 
            --dark-bg: #0b0b0b; 
            --card-bg: #141414;
            --border: #2a2a2a;
        }
        
        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            background: var(--dark-bg); 
            color: #eee; 
        }

        .serif { font-family: 'Cinzel', serif; }
        .gold-text { color: var(--gold); }

        header { 
            background: rgba(0,0,0,0.95); 
            border-bottom: 1px solid var(--border); 
            backdrop-filter: blur(10px); 
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .container { max-width: 1300px; margin: 0 auto; padding: 40px 20px; }

        .titulo-galvanicas {
            text-align: center;
            font-size: 32px;
            margin-bottom: 40px;
            letter-spacing: 3px;
        }

        .galvanicas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 24px;
            border: 1px solid var(--border);
            padding: 25px;
            text-align: center;
            position: relative;
            transition: all .4s ease;
            display: flex;
            flex-direction: column;
            justify-between: space-between;
        }

        .card:hover { 
            border-color: var(--gold); 
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .selo-parceiro {
            position: absolute;
            top: -12px;
            right: 20px;
            background: var(--gold);
            color: #000;
            font-weight: 900;
            font-size: 9px;
            padding: 5px 15px;
            border-radius: 50px;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(202, 168, 92, 0.4);
            text-transform: uppercase;
        }

        .card-logo {
            height: 120px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            border-radius: 15px;
            padding: 10px;
            border: 1px solid #222;
        }

        .card-logo img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .card h2 {
            font-size: 18px;
            color: var(--gold);
            font-weight: 700;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .info-row {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 8px;
            text-align: left;
            line-height: 1.5;
        }

        .info-row b { color: var(--gold); text-transform: uppercase; font-size: 10px; margin-right: 5px; }

        .whatsapp-link {
            display: block;
            background: linear-gradient(135deg, #caa85c 0%, #947a42 100%);
            color: #000;
            padding: 14px;
            border-radius: 14px;
            font-weight: 800;
            text-decoration: none;
            margin-top: 20px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .whatsapp-link:hover { transform: scale(1.03); opacity: 0.9; }

        .slogan { 
            margin-top: 20px; 
            font-size: 11px; 
            color: #777; 
            font-style: italic;
            border-top: 1px solid #222;
            padding-top: 15px;
        }
    </style>
</head>
<body>

<header class="py-5">
    <div class="max-w-7xl mx-auto px-6 flex justify-between items-center">
        <div>
            <h1 class="serif text-xl gold-text tracking-widest uppercase leading-none">Abella Joias</h1>
            <p class="text-[8px] tracking-[3px] text-gray-500 font-bold uppercase mt-1">Galvânicas Parceiras</p>
        </div>
        <div class="flex gap-4 items-center">
            <button onclick="abrirModalGalvanica()" class="text-[10px] font-black tracking-wider bg-zinc-900 border border-[#caa85c] text-[#caa85c] px-4 py-2 rounded-lg hover:bg-[#caa85c] hover:text-black transition-all">
                ⚙️ GERENCIAR PARCEIROS
            </button>
            <a href="index.html" class="text-[10px] font-bold border border-[#333] px-4 py-2 rounded-lg hover:border-[#caa85c] transition-all">LOJA</a>
            <a href="carrinho.html" class="text-[10px] font-bold bg-[#caa85c] text-black px-4 py-2 rounded-lg">CARRINHO</a>
        </div>
    </div>
</header>

<div class="container">
    <h2 class="titulo-galvanicas serif gold-text uppercase">Galvânicas Parceiras</h2>

    <div id="gridGalvanicas" class="galvanicas-grid">
        <p class="text-center col-span-full opacity-50">Sincronizando com a rede de parceiros...</p>
    </div>

    <div class="mt-20 text-center">
        <a href="https://wa.me/5519988207658?text=Olá, tenho interesse em ser Parceiro GOLD Abella Joias." 
           target="_blank" class="inline-block transform transition hover:scale-[1.01]">
          
          <img src="https://abellajoias.com.br/wp-content/uploads/2025/10/Gemini_Generated_Image_56v05c56v05c56v0.png"
               alt="Seja Nosso Parceiro GOLD"
               class="max-w-full rounded-2xl shadow-2xl border border-[#2a2a2a]">
        </a>
    </div>
</div>

<div id="modalGalvanica" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 transition-all overflow-y-auto">
    <div class="bg-[#141414] border border-[#2a2a2a] rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4 relative my-8 text-gray-200">
        <div class="flex items-center justify-between border-b border-[#222] pb-3">
            <h3 id="modalGalvanicaTitulo" class="serif text-base font-bold text-[#caa85c] uppercase tracking-wide">Nova Galvânica Parceira</h3>
            <button onclick="fecharModalGalvanica()" class="text-gray-500 hover:text-white text-2xl font-bold transition-all">&times;</button>
        </div>
        
        <input type="hidden" id="galvanicaId">

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-left">
            <div>
                <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1 tracking-wider">Nome da Galvânica</label>
                <input type="text" id="galvanicaNome" placeholder="Ex: Franco Galvânica" class="w-full bg-[#0b0b0b] border border-[#2a2a2a] rounded-xl px-4 py-2 text-xs text-white focus:border-[#caa85c] outline-none transition-all">
            </div>

            <div>
                <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1 tracking-wider">Selo / Tarja Visual</label>
                <input type="text" id="galvanicaSelo" placeholder="Ex: PARCEIRO" class="w-full bg-[#0b0b0b] border border-[#2a2a2a] rounded-xl px-4 py-2 text-xs text-white focus:border-[#caa85c] outline-none uppercase font-bold text-[#caa85c] tracking-wider">
            </div>

            <div class="sm:col-span-2">
                <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1 tracking-wider">Descrição Comercial / Tradição</label>
                <input type="text" id="galvanicaDescricao" placeholder="Ex: Mais de 20 anos de tradição em Ouro, Prata e Ródio." class="w-full bg-[#0b0b0b] border border-[#2a2a2a] rounded-xl px-4 py-2 text-xs text-white focus:border-[#caa85c] outline-none transition-all">
            </div>

            <div class="sm:col-span-2">
                <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1 tracking-wider">Endereço de Entrega (Limeira)</label>
                <input type="text" id="galvanicaEndereco" placeholder="Rua, Número - Bairro, Limeira - SP" class="w-full bg-[#0b0b0b] border border-[#2a2a2a] rounded-xl px-4 py-2 text-xs text-white focus:border-[#caa85c] outline-none transition-all">
            </div>

            <div>
                <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1 tracking-wider">Telefone Comercial</label>
                <input type="text" id="galvanicaTelefone" placeholder="(19) 3451-6246" class="w-full bg-[#0b0b0b] border border-[#2a2a2a] rounded-xl px-4 py-2 text-xs text-white focus:border-[#caa85c] outline-none transition-all">
            </div>

            <div>
                <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1 tracking-wider">WhatsApp Link (Apenas números com DDD)</label>
                <input type="text" id="galvanicaWhatsapp" placeholder="Ex: 5519984202600" class="w-full bg-[#0b0b0b] border border-[#2a2a2a] rounded-xl px-4 py-2 text-xs text-white focus:border-[#caa85c] outline-none font-mono transition-all">
            </div>

            <div class="sm:col-span-2">
                <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1 tracking-wider">URL do Logotipo / Banner</label>
                <input type="text" id="galvanicaImagem" placeholder="https://raw.githubusercontent.com/..." class="w-full bg-[#0b0b0b] border border-[#2a2a2a] rounded-xl px-4 py-2 text-xs text-white focus:border-[#caa85c] outline-none font-mono transition-all">
            </div>
        </div>

        <div class="flex items-center justify-between border-t border-[#222] pt-3 mt-4">
            <button id="btnDeletarGalvanica" onclick="deletarGalvanicaFirebase()" class="text-xs font-bold text-rose-500 hover:bg-rose-950/30 px-3 py-2 rounded-xl transition-all hidden">
                🗑️ Excluir Parceiro
            </button>
            <div class="flex items-center gap-2 ml-auto">
                <button onclick="fecharModalGalvanica()" class="bg-[#222] hover:bg-[#333] text-gray-300 font-semibold px-4 py-2 rounded-xl text-xs transition-all">Cancelar</button>
                <button id="btnSalvarGalvanica" onclick="salvarGalvanicaFirebase()" class="bg-[#caa85c] hover:bg-[#b0904d] text-black font-black px-5 py-2 rounded-xl text-xs transition-all uppercase tracking-wider">Salvar Galvânica</button>
            </div>
        </div>
    </div>
</div>

<script>
/* CONFIGURAÇÃO DO SEU BANCO DE DADOS */
firebase.initializeApp({
  apiKey: "AIzaSyDPBZSxW8XjtQmDMUknzAyIlFda51MvMJY",
  databaseURL: "https://catalogo-abella-joias-default-rtdb.firebaseio.com",
  projectId: "catalogo-abella-joias"
});
const db = firebase.database();

var _CACHE_GALVANICAS = {};

/* BUSCAR AS EMPRESAS DO FIREBASE EM TEMPO REAL E INJETAR CRUDS INTERNOS */
db.ref('galvanicas').on('value', snap => {
    const grid = document.getElementById('gridGalvanicas');
    grid.innerHTML = ""; 

    if(!snap.exists()) {
        grid.innerHTML = "<p class='text-center col-span-full text-gray-500 font-medium'>Nenhuma empresa encontrada no banco de dados.</p>";
        return;
    }

    _CACHE_GALVANICAS = snap.val();

    snap.forEach(child => {
        const id = child.key;
        const g = child.val();
        
        grid.innerHTML += `
            <div class="card">
                <div>
                    ${g.selo ? `<div class="selo-parceiro">${g.selo}</div>` : ''}
                    
                    <button onclick="editarGalvanica('${id}')" class="absolute top-3 left-4 bg-black/70 hover:bg-black text-[9px] border border-zinc-800 text-gray-400 hover:text-[#caa85c] font-bold px-2 py-1 rounded-md transition-all">
                        ✏️ EDITAR
                    </button>

                    <div class="card-logo">
                        <img src="${g.imagem || 'https://via.placeholder.com/300x150?text=Logo+Indisponível'}" alt="${g.nome}">
                    </div>
                    <h2 class="serif">${g.nome}</h2>
                    <div class="info-row"><b>Endereço:</b> ${g.endereco || 'Consultar endereço'}</div>
                    ${g.telefone ? `<div class="info-row"><b>Fixo:</b> ${g.telefone}</div>` : ''}
                </div>
                <div>
                    <a href="https://wa.me/${g.whatsapp}?text=Olá%20${g.nome}.%20Sou%20cliente%20da%20Abella%20Joias..." 
                       target="_blank" class="whatsapp-link">
                        WhatsApp 📲
                    </a>
                    <div class="slogan">${g.descricao || 'Parceiro homologado Abella Joias.'}</div>
                </div>
            </div>
        `;
    });
});

/* INTERATIVIDADE DO MODAL COLETOR */
function abrirModalGalvanica() {
    document.getElementById('galvanicaId').value = "";
    document.getElementById('galvanicaNome').value = "";
    document.getElementById('galvanicaSelo').value = "PARCEIRO";
    document.getElementById('galvanicaDescricao').value = "";
    document.getElementById('galvanicaEndereco').value = "";
    document.getElementById('galvanicaTelefone').value = "";
    document.getElementById('galvanicaWhatsapp').value = "";
    document.getElementById('galvanicaImagem').value = "";
    
    document.getElementById('modalGalvanicaTitulo').innerText = "Nova Galvânica Parceira";
    document.getElementById('btnDeletarGalvanica').classList.add('hidden');
    document.getElementById('modalGalvanica').classList.remove('hidden');
}

function fecharModalGalvanica() {
    document.getElementById('modalGalvanica').classList.add('hidden');
}

function editarGalvanica(id) {
    const g = _CACHE_GALVANICAS[id];
    if(!g) return;

    document.getElementById('galvanicaId').value = id;
    document.getElementById('galvanicaNome').value = g.nome || "";
    document.getElementById('galvanicaSelo').value = g.selo || "";
    document.getElementById('galvanicaDescricao').value = g.descricao || "";
    document.getElementById('galvanicaEndereco').value = g.endereco || "";
    document.getElementById('galvanicaTelefone').value = g.telefone || "";
    document.getElementById('galvanicaWhatsapp').value = g.whatsapp || "";
    document.getElementById('galvanicaImagem').value = g.imagem || "";

    document.getElementById('modalGalvanicaTitulo').innerText = "Editar Cadastro de Galvânica";
    document.getElementById('btnDeletarGalvanica').classList.remove('hidden');
    document.getElementById('modalGalvanica').classList.remove('hidden');
}

/* INTEGRANDO ENTRADA DE DADOS AO BANCO EM TEMPO REAL */
function salvarGalvanicaFirebase() {
    const id = document.getElementById('galvanicaId').value;
    const nome = document.getElementById('galvanicaNome').value.trim();
    const selo = document.getElementById('galvanicaSelo').value.trim();
    const descricao = document.getElementById('galvanicaDescricao').value.trim();
    const endereco = document.getElementById('galvanicaEndereco').value.trim();
    const telefone = document.getElementById('galvanicaTelefone').value.trim();
    const whatsapp = document.getElementById('galvanicaWhatsapp').value.trim();
    const imagem = document.getElementById('galvanicaImagem').value.trim();

    if(!nome) { alert("⚠️ O nome da empresa é obrigatório!"); return; }

    const dados = {
        nome: nome,
        selo: selo,
        descricao: descricao,
        endereco: endereco,
        telefone: telefone,
        whatsapp: whatsapp,
        imagem: imagem
    };

    if(id) {
        // Atualiza parceiro existente
        db.ref(`galvanicas/${id}`).update(dados).then(() => { fecharModalGalvanica(); });
    } else {
        // Gera um novo push ID único no Firebase
        db.ref('galvanicas').push(dados).then(() => { fecharModalGalvanica(); });
    }
}

function deletarGalvanicaFirebase() {
    const id = document.getElementById('galvanicaId').value;
    if(!id) return;
    
    if(confirm("⚠️ Deseja remover permanentemente essa galvânica do banco de dados Abella Joias?")) {
        db.ref(`galvanicas/${id}`).remove().then(() => {
            fecharModalGalvanica();
        });
    }
}
</script>

</body>
</html>
