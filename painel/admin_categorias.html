<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel de Categorias • Abella Joias</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
</head>
<body class="bg-[#0b0b0b] text-white p-6">
    <div class="max-w-5xl mx-auto">
        <h1 class="text-2xl font-bold text-[#caa85c] mb-6">GERENCIADOR DE CATEGORIAS</h1>
        <div class="bg-[#141414] p-6 rounded-xl border border-[#2a2a2a] mb-8">
            <h2 class="text-sm font-bold uppercase mb-4 text-gray-400">Criar Nova Coleção</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="text" id="newCatName" placeholder="Nome da Categoria" class="p-3 bg-black rounded border border-zinc-800 text-sm text-white">
                <input type="number" id="newCatDisc" placeholder="Desconto %" class="p-3 bg-black rounded border border-zinc-800 text-sm text-white">
                <select id="newCatVar" class="p-3 bg-black rounded border border-zinc-800 text-sm text-white">
                    <option value="">Sem Variação</option>
                    <option value="Aro">Habilitar Aro (Anéis)</option>
                    <option value="Lista">Lista Personalizada (Iniciais/Dizeres)</option>
                </select>
                <input type="text" id="newCatImg" placeholder="URL da Foto de Capa" class="p-3 bg-black rounded border border-zinc-800 text-sm text-white">
            </div>
            <button onclick="salvarNovaCategoria()" class="w-full bg-[#caa85c] text-black font-bold py-3 rounded mt-4 uppercase text-xs hover:opacity-90">Salvar Categoria</button>
        </div>
        <div id="listaCategorias" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
    </div>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyDPBZSxW8XjtQmDMUknzAyIlFda51MvMJY", databaseURL: "https://catalogo-abella-joias-default-rtdb.firebaseio.com" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        db.ref('categories').on('value', snap => {
            const grid = document.getElementById('listaCategorias'); grid.innerHTML = '';
            snap.forEach(c => {
                const d = c.val();
                grid.innerHTML += `
                <div class="bg-[#141414] p-4 rounded-xl border border-zinc-800 flex flex-col justify-between">
                    <img src="${d.image || 'https://via.placeholder.com/150'}" class="w-full h-32 object-cover rounded mb-2">
                    <h4 class="font-bold text-[#caa85c]">${d.name}</h4>
                    <p class="text-[10px] text-gray-400">Tipo: ${d.variacaoTipo || 'Padrão'}</p>
                    <button onclick="db.ref('categories/${c.key}').remove()" class="bg-red-900/40 text-red-400 p-2 text-xs rounded mt-2">Remover</button>
                </div>`;
            });
        });

        function salvarNovaCategoria() {
            const name = document.getElementById('newCatName').value;
            if(!name) return alert('Digite o nome');
            const slug = name.toLowerCase().trim().replace(/\s+/g, '-');
            db.ref('categories/' + slug).set({
                name: name, slug: slug,
                discount: parseInt(document.getElementById('newCatDisc').value) || 0,
                image: document.getElementById('newCatImg').value,
                variacaoTipo: document.getElementById('newCatVar').value
            }).then(() => { alert("Criada!"); location.reload(); });
        }
    </script>
</body>
</html>
