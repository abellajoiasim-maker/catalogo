<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Módulo Administrativo • Gestão de Categorias Mãe</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght=600;700&family=Inter:wght=300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold: #caa85c;
            --bg-dark: #070707;
            --border-dark: #222222;
        }
        body { background: var(--bg-dark); color: #eee; font-family: 'Inter', sans-serif; }
        .serif { font-family: 'Cinzel', serif; }
        .gold-text { color: var(--gold); }
        .glass-panel {
            background: rgba(18, 18, 18, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-dark);
        }
        .input-dark {
            background: #181818 !important; 
            border: 1px solid #282828 !important; 
            color: white !important;
            padding: 12px 14px; 
            border-radius: 12px; 
            width: 100%;
            font-size: 12px; 
            transition: all 0.25s ease;
        }
        .input-dark:focus { 
            border-color: var(--gold) !important; 
            outline: none; 
            box-shadow: 0 0 0 3px rgba(202, 168, 92, 0.15);
        }
    </style>
</head>
<body class="p-4 md:p-8 antialiased">

    <div id="toast-container" class="fixed bottom-6 right-6 z-50 pointer-events-none space-y-3"></div>

    <div class="max-w-7xl mx-auto space-y-6">
        
        <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-zinc-950/60 p-6 rounded-2xl border border-zinc-900 gap-4">
            <div class="flex items-center gap-4">
                <a href="index.html" class="h-10 px-4 rounded-xl border border-zinc-800 flex items-center justify-center text-xs uppercase font-bold tracking-wider text-zinc-400 hover:text-white hover:border-zinc-700 transition-colors">
                    ← Menu
                </a>
                <div>
                    <h1 class="serif gold-text text-xl uppercase tracking-[0.15em]">Categorias Principais (Mãe)</h1>
                    <p class="text-[10px] text-zinc-500 uppercase tracking-widest mt-0.5">Gerenciamento do Primeiro Nível do Catálogo</p>
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <div class="lg:col-span-4 glass-panel p-6 rounded-3xl h-fit space-y-5 shadow-2xl">
                <div class="flex items-center gap-2 border-b border-zinc-900 pb-3">
                    <span class="w-1.5 h-4 bg-[#caa85c] rounded-full"></span>
                    <h3 id="formTitulo" class="serif text-xs font-bold text-white uppercase tracking-wider">Nova Categoria Mãe</h3>
                </div>
                
                <form id="formCat" class="space-y-4 text-left" onsubmit="executingSalvamentoCatUI(event)">
                    <input type="hidden" id="catOldSlug">
                    
                    <div class="space-y-1.5">
                        <label class="text-[10px] uppercase text-zinc-400 font-bold tracking-wider">Título da Categoria *</label>
                        <input type="text" id="catName" required placeholder="Ex: Anéis, Brincos, Colares" class="input-dark">
                    </div>
                    
                    <div class="space-y-1.5">
                        <label class="text-[10px] uppercase text-zinc-400 font-bold tracking-wider">Caminho da Imagem / Ícone</label>
                        <input type="text" id="catImage" placeholder="Ex: images/categorias/brincos.jpg" class="input-dark">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div class="space-y-1.5">
                            <label class="text-[10px] uppercase text-zinc-400 font-bold tracking-wider">Ordem (Index)</label>
                            <input type="number" id="catOrder" value="0" min="0" class="input-dark text-center font-mono">
                        </div>
                        <div class="space-y-1.5">
                            <label class="text-[10px] uppercase text-zinc-400 font-bold tracking-wider">Estado Visual</label>
                            <select id="catStatus" class="input-dark">
                                <option value="ativo">Ativo (Visível)</option>
                                <option value="pausado">Pausado (Oculto)</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="flex gap-2 pt-2">
                        <button type="button" id="btnCancelarEdicao" onclick="resetarFormularioEstado()" class="hidden w-1/3 bg-zinc-900 hover:bg-zinc-800 text-zinc-400 font-bold py-3 rounded-xl text-[10px] uppercase tracking-wider transition-all border border-zinc-800">
                            Cancelar
                        </button>
                        <button type="submit" class="flex-1 bg-[#caa85c] hover:bg-[#b5944a] text-black font-black py-3 rounded-xl text-[10px] uppercase tracking-wider transition-all shadow-lg">
                            Gravar Categoria Principal
                        </button>
                    </div>
                </form>
            </div>

            <div class="lg:col-span-8 glass-panel p-6 rounded-3xl flex flex-col shadow-2xl">
                <div class="flex items-center gap-2 border-b border-zinc-900 pb-4 mb-4">
                    <span class="w-1.5 h-4 bg-[#caa85c] rounded-full"></span>
                    <h3 class="serif text-xs font-bold text-white uppercase tracking-wider">Categorias Cadastradas</h3>
                </div>
                
                <div id="loading" class="text-center py-16 text-[#caa85c] text-xs font-mono uppercase tracking-widest animate-pulse">
                    ⏳ Conectando ao banco de dados...
                </div>
                
                <div id="lista-categorias" class="space-y-3 overflow-y-auto max-h-[65vh] pr-1"></div>
            </div>
        </div>
    </div>

    <script>
        const db = window.db || firebase.database();

        if (typeof window.getAbellaPath !== 'function') {
            window.getAbellaPath = function(node) {
                const root = window.ABELLA_DB_ROOT || 'abella';
                return node ? `${root}/${node}` : root;
            };
        }

        const DOM = {
            form: document.getElementById('formCat'),
            titulo: document.getElementById('formTitulo'),
            oldSlug: document.getElementById('catOldSlug'),
            name: document.getElementById('catName'),
            image: document.getElementById('catImage'),
            order: document.getElementById('catOrder'),
            status: document.getElementById('catStatus'),
            btnCancelar: document.getElementById('btnCancelarEdicao'),
            loading: document.getElementById('loading'),
            lista: document.getElementById('lista-categorias')
        };

        let categoriasCache = {};

        document.addEventListener('DOMContentLoaded', carregarCategoriasMestres);

        function spawnAdminToast(msg, isError = false) {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `px-5 py-4 rounded-xl text-xs font-bold uppercase tracking-wider transition-all duration-300 bg-zinc-900/95 border shadow-xl flex items-center gap-3 ${isError ? 'text-rose-300 border-rose-800' : 'text-emerald-400 border-zinc-800'}`;
            toast.innerHTML = `<span>${isError ? '⚠️' : '✅'}</span> <span>${msg}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        async function carregarCategoriasMestres() {
            try {
                const path = window.getAbellaPath('categories');
                const snap = await db.ref(path).once('value');
                categoriasCache = snap.val() || {};
                renderizarCategorias();
            } catch (err) {
                DOM.loading.innerText = "❌ Erro ao ler categorias.";
                spawnAdminToast("Erro ao carregar dados.", true);
            }
        }

        function renderizarCategorias() {
            DOM.lista.innerHTML = '';
            DOM.loading.classList.add('hidden');

            let listaOrdenada = Object.entries(categoriasCache).map(([slug, data]) => ({
                slug,
                name: data.name || slug,
                image: data.image || '',
                order: parseInt(data.order) || 0,
                paused: data.paused !== undefined ? !!data.paused : data.status === 'pausado',
                subcategories: data.subcategories || {}
            }));

            listaOrdenada.sort((a, b) => a.order - b.order);

            if (listaOrdenada.length === 0) {
                DOM.lista.innerHTML = `<p class="text-zinc-600 text-xs italic py-12 text-center font-mono">[Nenhuma categoria principal cadastrada]</p>`;
                return;
            }

            listaOrdenada.forEach(item => {
                const qtdSubs = Object.keys(item.subcategories).length;
                const card = document.createElement('div');
                card.className = `flex flex-col sm:flex-row sm:items-center justify-between p-4 bg-zinc-900/40 border rounded-2xl gap-4 ${item.paused ? 'border-rose-950/40 bg-rose-950/5 opacity-60' : 'border-zinc-800/80'}`;
                
                card.innerHTML = `
                    <div class="min-w-0 flex-1">
                        <div class="flex flex-wrap items-center gap-2 mb-1">
                            <span class="text-sm font-bold ${item.paused ? 'text-rose-400/80 line-through' : 'text-white'} uppercase tracking-wide">${item.name}</span>
                            <span class="text-[9px] px-2 py-0.5 bg-zinc-950 text-zinc-400 rounded-md border border-zinc-800 font-mono">${qtdSubs} Subcategorias vinculadas</span>
                        </div>
                        <p class="text-[10px] text-zinc-500 font-mono truncate">PATH: categories/${item.slug} | Ordem: ${item.order}</p>
                    </div>
                    <div class="flex items-center gap-2 justify-end">
                        <button type="button" onclick="ativarModoEdicao('${item.slug}', \`${item.name}\`, '${item.image}', ${item.order}, ${item.paused})" class="bg-zinc-950 text-zinc-300 border border-zinc-800 px-3 py-2 text-[10px] font-bold rounded-xl transition-all uppercase">Editar</button>
                        <button type="button" onclick="alternarEstadoPausa('${item.slug}', ${item.paused})" class="bg-zinc-950 border border-zinc-800 px-3 py-2 text-[10px] font-bold rounded-xl transition-all uppercase ${item.paused ? 'text-emerald-400' : 'text-amber-500'}">${item.paused ? 'Reativar' : 'Pausar'}</button>
                        <button type="button" onclick="executarRemocao('${item.slug}')" class="bg-rose-950/20 text-rose-400 border border-rose-900/30 px-3 py-2 text-[10px] font-bold rounded-xl transition-all uppercase">🗑️</button>
                    </div>
                `;
                DOM.lista.appendChild(card);
            });
        }

        function activarModoEdicao(slug, name, img, order, isPaused) {
            DOM.oldSlug.value = slug;
            DOM.name.value = name;
            DOM.image.value = img;
            DOM.order.value = order;
            DOM.status.value = isPaused ? 'pausado' : 'ativo';
            DOM.titulo.innerText = "Modificar Categoria Mãe";
            DOM.btnCancelar.classList.remove('hidden');
            DOM.name.focus();
        }

        function resetarFormularioEstado() {
            DOM.form.reset();
            DOM.oldSlug.value = '';
            DOM.titulo.innerText = "Nova Categoria Mãe";
            DOM.btnCancelar.classList.add('hidden');
        }

        async function executingSalvamentoCatUI(e) {
            e.preventDefault();
            const name = DOM.name.value.trim();
            const slug = name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
            const oldSlug = DOM.oldSlug.value;

            // Mantém subcategorias intactas caso seja uma edição de nome
            const subcategoriesSalvas = oldSlug && categoriasCache[oldSlug] ? categoriasCache[oldSlug].subcategories || {} : {};

            const payload = {
                name: name.replace(/</g, "&lt;").replace(/>/g, "&gt;"),
                image: DOM.image.value.trim(),
                order: Math.abs(parseInt(DOM.order.value, 10) || 0),
                paused: DOM.status.value === 'pausado',
                subcategories: subcategoriesSalvas,
                timestamp: Date.now()
            };

            try {
                if (oldSlug && oldSlug !== slug) {
                    await db.ref(window.getAbellaPath(`categories/${oldSlug}`)).remove();
                }
                await db.ref(window.getAbellaPath(`categories/${slug}`)).set(payload);
                spawnAdminToast("Categoria salva com sucesso.");
                resetarFormularioEstado();
                await carregarCategoriasMestres();
            } catch(err) {
                spawnAdminToast("Erro ao salvar categoria.", true);
            }
        }

        async function alternarEstadoPausa(slug, estadoPausaAtual) {
            try {
                await db.ref(window.getAbellaPath(`categories/${slug}`)).update({ paused: !estadoPausaAtual });
                categoriasCache[slug].paused = !estadoPausaAtual;
                renderizarCategorias();
                spawnAdminToast("Visibilidade alterada com sucesso.");
            } catch (err) {
                spawnAdminToast("Erro ao alterar visibilidade.", true);
            }
        }

        async function ejecutarRemocao(slug) {
            if(!confirm("⚠️ ATENÇÃO: Deletar esta categoria mãe irá remover as subcategorias vinculadas! Confirmar?")) return;
            try {
                await db.ref(window.getAbellaPath(`categories/${slug}`)).remove();
                spawnAdminToast("Categoria removida.");
                await carregarCategoriasMestres();
            } catch(err) {
                spawnAdminToast("Erro ao remover categoria.", true);
            }
        }
    </script>
</body>
</html>
