<div class="space-y-6 animate-fade-in font-sans">
    
    <div class="flex flex-col md:flex-row md:items-center md:justify-between border-b border-zinc-800 pb-4 gap-4">
        <div>
            <h1 class="text-xl font-bold text-white flex items-center gap-2">
                <span>⚡</span> Editor Full Master IA <span class="text-[10px] bg-amber-500/10 text-amber-400 border border-amber-500/20 px-2 py-0.5 rounded uppercase font-mono tracking-wider">Modo Industrial</span>
            </h1>
            <p class="text-xs text-zinc-400 mt-1">Selecione múltiplos produtos por categoria para renderização automatizada em lote.</p>
        </div>
    </div>

    <div class="bg-zinc-900/40 border border-zinc-800 p-5 rounded-xl grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
        <div>
            <label class="block text-[10px] font-bold text-zinc-400 uppercase mb-1.5 tracking-wider">1. Modelo Humano (Lote)</label>
            <select id="loteModeloIdade" class="w-full bg-[#0b0b0b] border border-zinc-800 rounded-lg px-3 py-2 text-xs text-white focus:border-[#caa85c] outline-none font-medium">
                <option value="adulto">Adulto (Padrão Catálogo)</option>
                <option value="infantil">Infantil</option>
                <option value="infanto-juvenil">Infanto-Juvenil</option>
                <option value="senior">Sênior</option>
            </select>
        </div>

        <div>
            <label class="block text-[10px] font-bold text-zinc-400 uppercase mb-1.5 tracking-wider">2. Restrição Técnica (Não Inventar)</label>
            <select id="loteAcabamento" class="w-full bg-[#0b0b0b] border border-zinc-800 rounded-lg px-3 py-2 text-xs text-white focus:border-[#caa85c] outline-none font-medium">
                <option value="original">Preservar Traços Originais do JPG/PNG</option>
                <option value="latao-fosco">Garantir Latão sem Brilho (Bruto)</option>
                <option value="argolinha-central">Forçar Argolinha Central Única</option>
            </select>
        </div>

        <button id="btnDispararLote" onclick="iniciarProcessamentoEmMassa()" class="w-full bg-emerald-600 hover:bg-emerald-700 disabled:bg-zinc-800 disabled:text-zinc-600 text-white font-bold py-2 rounded-lg transition-all text-xs flex items-center justify-center gap-2 h-9" disabled>
            <span>🚀</span> Processar Peças Selecionadas
        </button>
    </div>

    <div class="bg-[#111] rounded-xl border border-zinc-800 overflow-hidden">
        <div class="p-4 bg-zinc-900/20 border-b border-zinc-800 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-2 w-full sm:w-auto">
                <label class="text-xs font-bold text-zinc-400 uppercase tracking-wider whitespace-nowrap">Filtrar Coleção:</label>
                <select id="loteFiltroCategoria" onchange="carregarProdutosParaLote()" class="bg-[#0b0b0b] border border-zinc-800 rounded-lg px-3 py-1.5 text-xs text-white outline-none focus:border-[#caa85c] max-w-xs font-medium">
                    <option value="">Carregando coleções...</option>
                </select>
            </div>
            <div id="contadorFila" class="text-xs text-zinc-500 font-medium font-mono">
                Nenhum produto na fila de renderização.
            </div>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-zinc-900/40 border-b border-zinc-800 text-[10px] font-bold text-zinc-400 uppercase tracking-wider font-mono">
                        <th class="py-3 px-4 text-center w-12">
                            <input type="checkbox" id="checkMarcarTodos" onchange="marcarTodosProdutos(this)" class="rounded border-zinc-800 text-[#caa85c] focus:ring-0 bg-[#0b0b0b] w-4 h-4">
                        </th>
                        <th class="py-3 px-4 w-16 text-center">Foto</th>
                        <th class="py-3 px-4">Joia / SKU</th>
                        <th class="py-3 px-4">Extensão</th>
                        <th class="py-3 px-4 text-right pr-6">Status da Fila</th>
                    </tr>
                </thead>
                <tbody id="tabelaLoteProdutos" class="divide-y divide-zinc-800 text-xs text-zinc-300">
                    <tr>
                        <td colspan="5" class="text-center py-12 text-zinc-500 font-medium italic">
                            Selecione uma coleção acima para listar as joias cadastradas.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // INICIALIZAÇÃO TÉCNICA E CAPTURA DE CATEGORIAS
    window.inicializarMapeamentoLote = function() {
        var select = document.getElementById('loteFiltroCategoria');
        if(!select || !db) return;

        db.ref('categories').once('value', function(snapshot) {
            var dados = snapshot.val();
            if (dados) { renderizarOpcoesCategorias(dados); } 
            else {
                db.ref('colecoes').once('value', function(snapshotCol) {
                    var dadosCol = snapshotCol.val();
                    if (dadosCol) renderizarOpcoesCategorias(dadosCol);
                    else select.innerHTML = '<option value="">⚠️ Nenhuma coleção achada</option>';
                });
            }
        }, function(erro) {
            console.error("Erro no Firebase:", erro);
            select.innerHTML = '<option value="">❌ Erro de conexão</option>';
        });
    }

    function renderizarOpcoesCategorias(dados) {
        var select = document.getElementById('loteFiltroCategoria');
        if(!select) return;
        select.innerHTML = '<option value="">-- Escolha uma Coleção --</option>';
        Object.keys(dados).forEach(function(id) {
            var item = dados[id];
            var name = item.nome || item.name || id;
            select.insertAdjacentHTML('beforeend', `<option value="${id}">${name.toUpperCase()}</option>`);
        });
    }

    // CARREGAMENTO DOS PRODUTOS FILTRADOS
    window.carregarProdutosParaLote = function() {
        var catId = document.getElementById('loteFiltroCategoria').value;
        var tbody = document.getElementById('tabelaLoteProdutos');
        var btnDisparar = document.getElementById('btnDispararLote');
        var checkTodos = document.getElementById('checkMarcarTodos');

        if(!catId) {
            tbody.innerHTML = '<tr><td colspan="5" class="text-center py-12 text-zinc-500 italic">Selecione uma coleção acima para listar as joias cadastradas.</td></tr>';
            btnDisparar.disabled = true;
            return;
        }

        tbody.innerHTML = '<tr><td colspan="5" class="text-center py-12 text-zinc-400 font-medium animate-pulse">⏳ Sincronizando arquivos JPG/PNG do banco...</td></tr>';
        if(checkTodos) checkTodos.checked = false;

        db.ref('products').orderByChild('category').equalTo(catId).once('value', function(snapshot) {
            var dados = snapshot.val();
            if(!dados) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center py-12 text-amber-500 font-medium">📦 Nenhum produto cadastrado nesta coleção.</td></tr>';
                btnDisparar.disabled = true;
                return;
            }

            _PRODUTOS_LOTE_CACHE = dados;
            tbody.innerHTML = '';
            
            Object.keys(dados).forEach(function(id) {
                var prod = dados[id];
                var fotoUrl = prod.image || "";
                var fotoExibicao = fotoUrl.startsWith("gs://") ? converterLinkStorageParaHttp(fotoUrl) : fotoUrl;
                
                var extensao = "JPG / PNG";
                if (fotoUrl.toLowerCase().includes('.png')) extensao = "PNG (Transparente)";
                else if (fotoUrl.toLowerCase().includes('.jpg') || fotoUrl.toLowerCase().includes('.jpeg')) extensao = "JPG (Foto)";

                var fotoPadrao = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="%23444"><circle cx="12" cy="12" r="10"/></svg>';

                var tr = document.createElement('tr');
                tr.className = "hover:bg-zinc-900/30 transition-all border-b border-zinc-800/60";
                tr.innerHTML = `
                    <td class="py-3 px-4 text-center">
                        <input type="checkbox" value="${id}" onchange="atualizarContadorFila()" class="check-item-lote rounded border-zinc-800 text-[#caa85c] focus:ring-0 bg-[#0b0b0b] w-4 h-4">
                    </td>
                    <td class="py-3 px-4 text-center">
                        <div class="w-10 h-10 rounded-lg border border-zinc-800 bg-[#0b0b0b] overflow-hidden mx-auto flex items-center justify-center p-0.5">
                            <img src="${fotoExibicao || fotoPadrao}" class="w-full h-full object-cover rounded" onerror="this.src='${fotoPadrao}'">
                        </div>
                    </td>
                    <td class="py-3 px-4">
                        <div class="font-bold text-zinc-100">${prod.name || 'Sem Nome'}</div>
                        <div class="text-[10px] text-zinc-500 font-mono">SKU: ${prod.sku || 'N/A'}</div>
                    </td>
                    <td class="py-3 px-4 font-mono text-[10px] text-zinc-500">${extensao}</td>
                    <td class="py-3 px-4 text-right pr-6 font-semibold text-zinc-500 text-[11px] status-coluna">Aguardando seleção</td>
                `;
                tbody.appendChild(tr);
            });
            atualizarContadorFila();
        });
    }

    window.marcarTodosProdutos = function(master) {
        document.querySelectorAll('.check-item-lote').forEach(box => box.checked = master.checked);
        atualizarContadorFila();
    }

    window.atualizarContadorFila = function() {
        var selecionados = document.querySelectorAll('.check-item-lote:checked').length;
        var txtContador = document.getElementById('contadorFila');
        var btnDisparar = document.getElementById('btnDispararLote');

        if(selecionados > 0) {
            if(txtContador) txtContador.innerHTML = `<span class="bg-amber-500/10 text-amber-400 border border-amber-500/20 px-2 py-0.5 rounded font-bold font-mono">${selecionados}</span> joias prontas.`;
            if(btnDisparar) btnDisparar.disabled = false;
        } else {
            if(txtContador) txtContador.innerText = "Nenhum produto na fila de renderização.";
            if(btnDisparar) btnDisparar.disabled = true;
        }
    }

    window.iniciarProcessamentoEmMassa = function() {
        _FILA_PROCESSAMENTO = [];
        document.querySelectorAll('.check-item-lote:checked').forEach(box => _FILA_PROCESSAMENTO.push(box.value));
        if(_FILA_PROCESSAMENTO.length === 0) return;

        document.getElementById('btnDispararLote').disabled = true;
        document.getElementById('loteFiltroCategoria').disabled = true;
        document.getElementById('checkMarcarTodos').disabled = true;
        document.querySelectorAll('.check-item-lote').forEach(box => box.disabled = true);

        _INDICE_ATUAL_FILA = 0;
        window.executarProximoItemDaFila();
    }

    window.executarProximoItemDaFila = function() {
        if (_INDICE_ATUAL_FILA >= _FILA_PROCESSAMENTO.length) {
            alert(`🎉 Lote finalizado! Foram sincronizadas ${_FILA_PROCESSAMENTO.length} fotos com sucesso no catálogo.`);
            document.getElementById('loteFiltroCategoria').disabled = false;
            document.getElementById('checkMarcarTodos').disabled = false;
            carregarProdutosParaLote();
            return;
        }

        var idAtual = _FILA_PROCESSAMENTO[_INDICE_ATUAL_FILA];
        var itemContainerStatus = null;
        var imgElemento = null;
        var checkboxFisico = document.querySelector(`.check-item-lote[value="${idAtual}"]`);
        
        if (checkboxFisico) {
            var linhaTr = checkboxFisico.closest('tr');
            if (linhaTr) {
                itemContainerStatus = linhaTr.querySelector('.status-coluna');
                imgElemento = linhaTr.querySelector('img');
            }
        }
        
        if(itemContainerStatus) {
            itemContainerStatus.className = "py-3 px-4 text-right pr-6 font-bold text-amber-400 animate-pulse text-[11px] status-coluna";
            itemContainerStatus.innerText = "⚡ Sincronizando...";
        }

        var linkFotoOriginal = _PRODUTOS_LOTE_CACHE[idAtual].image || "";
        var linkFotoPublica = linkFotoOriginal.startsWith("gs://") ? converterLinkStorageParaHttp(linkFotoOriginal) : linkFotoOriginal;

        var modeloAlvo = document.getElementById('loteModeloIdade').value;
        var restricaoAlvo = document.getElementById('loteAcabamento').value;

        setTimeout(function() {
            db.ref(`products/${idAtual}`).update({
                image: linkFotoPublica,
                ia_modelo_idade: modeloAlvo,
                ia_restricao_tecnica: restricaoAlvo,
                ia_processado_em: new Date().toISOString()
            }).then(function() {
                if(itemContainerStatus) {
                    itemContainerStatus.className = "py-3 px-4 text-right pr-6 font-bold text-emerald-400 text-[11px] status-coluna";
                    itemContainerStatus.innerText = "✅ Sincronizado!";
                }
                if (imgElemento && linkFotoPublica) imgElemento.src = linkFotoPublica;
                
                _INDICE_ATUAL_FILA++;
                window.executarProximoItemDaFila();
            }).catch(function(error) {
                console.error("Erro no lote:", error);
                if(itemContainerStatus) {
                    itemContainerStatus.className = "py-3 px-4 text-right pr-6 font-bold text-rose-500 text-[11px] status-coluna";
                    itemContainerStatus.innerText = "❌ Erro";
                }
                _INDICE_ATUAL_FILA++;
                window.executarProximoItemDaFila();
            });
        }, 1000);
    }

    function converterLinkStorageParaHttp(gsUrl) {
        try {
            var caminhoLimpo = gsUrl.replace("gs://", "");
            var primeiraBarra = caminhoLimpo.indexOf("/");
            var bucket = caminhoLimpo.substring(0, primeiraBarra);
            var caminhoArquivo = caminhoLimpo.substring(primeiraBarra + 1);
            return `https://firebasestorage.googleapis.com/v0/b/${bucket}/o/${encodeURIComponent(caminhoArquivo)}?alt=media`;
        } catch (e) {
            return gsUrl;
        }
    }
</script>
