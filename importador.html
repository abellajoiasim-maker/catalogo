<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Super Importador • Abella Joias</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <style>
        body { background: #0b0b0b; color: #eee; font-family: monospace; }
        .gold { color: #caa85c; }
        .success { color: #4caf50; font-weight: bold; }
        .error { color: #f44336; font-weight: bold; }
    </style>
</head>
<body class="p-6">
    <div class="max-w-3xl mx-auto bg-zinc-950 border border-zinc-900 rounded-2xl p-6 space-y-6">
        <div>
            <h1 class="text-lg font-bold gold uppercase tracking-wider">📦 Super Importador Catalogo</h1>
            <p class="text-xs text-zinc-500">Mapeamento estruturado direto para os nós oficiais da Abella Joias.</p>
        </div>

        <div class="bg-zinc-900 p-4 rounded-xl space-y-2 text-xs text-left">
            <p class="font-bold gold">📋 Formato Esperado do Arquivo CSV:</p>
            <p class="text-zinc-400">Nome; SKU; Categoria; Subcategoria; Preço; Peso; URL_Imagem; Variação; Opções; Pausado</p>
        </div>

        <div class="border border-dashed border-zinc-800 rounded-xl p-8 text-center bg-black">
            <input type="file" id="csvFile" accept=".csv" class="hidden" onchange="atualizarLabelArquivo(this)">
            <label id="csvLabel" for="csvFile" class="cursor-pointer text-xs text-zinc-400 hover:text-white transition-all block">
                📂 Clique aqui para selecionar o arquivo .CSV do seu computador
            </label>
        </div>

        <div class="flex items-center gap-4 text-xs">
            <label class="flex items-center gap-2"><input type="checkbox" id="incrementalMode" checked> Modo Incremental (Não apagar catálogo atual)</label>
        </div>

        <button id="btnImportar" onclick="executarImportacaoCSV()" class="w-full bg-[#caa85c] text-black font-black py-3 rounded-xl text-xs uppercase tracking-wider hover:bg-[#bda152] transition-all">
            🚀 Executar Carga no Firebase Realtime
        </button>

        <div id="logConsole" class="bg-black border border-zinc-900 rounded-xl p-4 h-48 overflow-y-auto text-left text-[11px] text-zinc-400 space-y-1 font-mono">
            Pronto para inicialização. Selecione um arquivo de dados.
        </div>
    </div>

    <script src="js/firebase/firebase-config.js"></script>
    <script>
        function atualizarLabelArquivo(input) {
            const f = input.files[0];
            document.getElementById('csvLabel').innerText = f ? `📄 Arquivo Pronto: ${f.name}` : `📂 Selecionar arquivo .CSV`;
        }

        function log(msg, classe = '') {
            const consoleEl = document.getElementById('logConsole');
            consoleEl.innerHTML += `<p class="${classe}">${msg}</p>`;
            consoleEl.scrollTop = consoleEl.scrollHeight;
        }

        async function executarImportacaoCSV() {
            const input = document.getElementById('csvFile');
            const file = input.files[0];
            if(!file) { alert("Por favor, selecione o arquivo CSV antes."); return; }

            const incremental = document.getElementById('incrementalMode').checked;
            const btn = document.getElementById('btnImportar');
            btn.disabled = true;

            const db = firebase.database();
            const logConsole = document.getElementById('logConsole');
            logConsole.innerHTML = '';

            try {
                if(!incremental) {
                    log("🗑️ Limpando catálogo anterior do banco...", "error");
                    await db.ref('abella/products').remove();
                }

                const texto = await file.text();
                const linhas = texto.split(/\r?\n/).filter(l => l.trim());
                log(`ℹ️ Total de linhas lidas: ${linhas.length - 1}`, 'gold');

                for (let i = 1; i < linhas.length; i++) {
                    const colunas = linhas[i].split(';');
                    if(colunas.length < 3) continue;

                    const nome = colunas[0]?.trim();
                    const sku = colunas[1]?.trim();
                    const categoria = colunas[2]?.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-");
                    const subcategoria = colunas[3]?.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-") || "";
                    const preco = parseFloat(colunas[4]?.replace(',', '.') || 0);
                    const peso = parseFloat(colunas[5]?.replace(',', '.') || 0);
                    const img = colunas[6]?.trim() || "";

                    if(!sku || !nome) { continue; }

                    const skuLimpo = sku.replace(/[\.\$#\[\]\/]/g, "-");
                    
                    // Garante nó estruturado da categoria pai
                    await db.ref(`abella/categories/${categoria}`).update({ name: colunas[2]?.trim(), slug: categoria, paused: false });
                    
                    if(subcategoria) {
                        await db.ref(`abella/categories/${categoria}/subcategories/${subcategoria}`).update({ name: colunas[3]?.trim(), slug: subcategoria });
                    }

                    await db.ref(`abella/products/${skuLimpo}`).set({
                        name: nome, nome: nome,
                        sku: sku,
                        category: categoria,
                        subcategory: subcategoria,
                        price: preco, precoFinal: preco,
                        weight: peso, peso: peso,
                        image: img, imagem: img,
                        paused: false, promo: 0
                    });

                    log(`✅ SKU [${sku}] Processado com Sucesso.`, 'success');
                }

                log("🚀 PROCESSO DE CARGA CONCLUÍDO TOTALMENTE!", "success");
            } catch (e) {
                log(`❌ Erro Fatal Operacional: ${e.message}`, "error");
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
