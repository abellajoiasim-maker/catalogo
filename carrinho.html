</main>

<script src="js/firebase/firebase-config.js"></script>

<script src="js/utils/money.js"></script>

<script src="js/utils/storage.js"></script>

<script src="js/services/carrinhoService.js"></script>

<script>

    let configSistema = {
        pix: 5,
        parcelas: 6
    };

    document.addEventListener('DOMContentLoaded', async () => {

        await carregarConfiguracoes();

        renderizarItensCarrinho();

    });

    async function carregarConfiguracoes() {

        try {

            const snap = await firebase
                .database()
                .ref('abella/settings')
                .once('value');

            if (snap.exists()) {

                const dados = snap.val() || {};

                configSistema.pix = parseFloat(
                    dados.pix ||
                    dados?.empresa?.pix ||
                    5
                );

                configSistema.parcelas = parseInt(
                    dados.parcelas ||
                    dados?.empresa?.parcelas ||
                    6
                );

            }

        } catch (e) {

            console.error(
                'Erro ao carregar configurações:',
                e
            );

        }

    }

    function renderizarItensCarrinho() {

        const container =
            document.getElementById(
                'itens-carrinho'
            );

        const lista =
            carrinhoService.obterItens();

        const resumo =
            carrinhoService.obterResumo();

        container.innerHTML = '';

        if (lista.length === 0) {

            container.innerHTML = `
                <div class="text-center py-12 text-zinc-500">

                    <p class="text-xs italic">

                        Seu carrinho está vazio.

                    </p>

                    <a href="produtos.html"
                       class="inline-block mt-4 text-xs border border-[#caa85c]/30 text-[#caa85c] px-4 py-2 rounded-xl">

                        Ir para Vitrine

                    </a>

                </div>
            `;

            atualizarResumoAvancado(
                0,
                0,
                0
            );

            return;

        }

        lista.forEach((item, index) => {

            const preco =
                parseFloat(
                    item.precoFinal ||
                    item.price ||
                    0
                );

            const peso =
                parseFloat(
                    item.peso || 0
                );

            const itemDiv =
                document.createElement('div');

            itemDiv.className =
                "flex items-center gap-4 bg-zinc-950 p-3 rounded-xl border border-zinc-900";

            itemDiv.innerHTML = `

                <img
                    src="${item.image || item.imagem || 'https://via.placeholder.com/150'}"
                    class="w-12 h-12 rounded-lg object-cover shrink-0 bg-zinc-900">

                <div class="flex-1 min-w-0 text-left">

                    <h4 class="text-white text-xs font-bold truncate">

                        ${item.nome || 'Produto'}

                    </h4>

                    <p class="text-[10px] text-zinc-500 font-mono">

                        SKU: ${item.sku || '---'}

                        |

                        ⚖️ ${(peso * item.quantidade).toFixed(2)}g

                    </p>

                    <div class="flex items-center gap-2 mt-1">

                        <button
                            onclick="alterarQtd(${index}, -1)"
                            class="w-5 h-5 bg-zinc-900 text-white rounded text-xs">

                            -

                        </button>

                        <!-- AJUSTADO -->
                        <input
                            type="number"
                            min="1"
                            value="${item.quantidade}"
                            onchange="editarQtdDireta(${index}, this.value)"
                            class="w-12 bg-black border border-zinc-800 rounded text-center text-xs text-white py-1">

                        <button
                            onclick="alterarQtd(${index}, 1)"
                            class="w-5 h-5 bg-zinc-900 text-white rounded text-xs">

                            +

                        </button>

                    </div>

                </div>

                <div class="text-right font-mono pr-2">

                    <p class="text-white font-bold text-xs">

                        ${money.formatar(preco * item.quantidade)}

                    </p>

                </div>

                <button
                    onclick="removerDoCarrinho(${index})"
                    class="text-zinc-600 hover:text-red-500 text-xs">

                    ✕

                </button>

            `;

            container.appendChild(itemDiv);

        });

        atualizarResumoAvancado(
            resumo.totalItens,
            resumo.pesoTotal,
            resumo.subtotal
        );

    }

    function atualizarResumoAvancado(
        totalItens,
        pesoTotal,
        subtotal
    ) {

        const descontoPix =
            subtotal * (
                configSistema.pix / 100
            );

        const totalPix =
            subtotal - descontoPix;

        const valorParcela =
            subtotal / configSistema.parcelas;

        document.getElementById(
            'resumo-itens'
        ).innerText =
            `${totalItens} pçs`;

        document.getElementById(
            'resumo-peso'
        ).innerText =
            `${pesoTotal.toFixed(2)}g`;

        document.getElementById(
            'resumo-subtotal'
        ).innerText =
            money.formatar(subtotal);

        document.getElementById(
            'resumo-pix'
        ).innerText =
            `- ${money.formatar(descontoPix)}`;

        document.getElementById(
            'resumo-total-pix'
        ).innerText =
            money.formatar(totalPix);

        document.getElementById(
            'resumo-parcelamento'
        ).innerText =
            `${configSistema.parcelas}x de ${money.formatar(valorParcela)}`;

    }

    function alterarQtd(idx, fator) {

        const lista =
            carrinhoService.obterItens();

        const item =
            lista[idx];

        if (!item) return;

        const novaQtd =
            item.quantidade + fator;

        if (novaQtd <= 0) {

            carrinhoService.removerItem(idx);

        } else {

            carrinhoService.atualizarQuantidade(
                idx,
                novaQtd
            );

        }

        renderizarItensCarrinho();

    }

    function editarQtdDireta(idx, valor) {

        const qtd =
            Math.max(
                1,
                parseInt(valor) || 1
            );

        carrinhoService.atualizarQuantidade(
            idx,
            qtd
        );

        renderizarItensCarrinho();

    }

    function removerDoCarrinho(idx) {

        carrinhoService.removerItem(idx);

        renderizarItensCarrinho();

    }

</script>

</body>
