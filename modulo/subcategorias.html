<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Abella Joias • Subcoleções</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght=600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { background:#0b0b0b; color:#eee; font-family:'Inter', sans-serif; min-height: 100vh; }
        .serif { font-family:'Cinzel', serif; }
        .gold { color:#caa85c; }
        .card { background:#141414; border:1px solid #2a2a2a; border-radius:20px; overflow:hidden; transition:.3s; }
        .card:hover { border-color:#caa85c; transform: translateY(-3px); }
    </style>
</head>
<body>

    <header class="border-b border-zinc-900 bg-black/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto p-5 flex justify-between items-center">
            <div>
                <h1 class="serif gold text-lg uppercase tracking-wider">Abella Joias</h1>
                <p id="slogan-sub" class="text-[9px] text-zinc-500 uppercase tracking-widest">Aguardando mapeamento...</p>
            </div>
            <a href="index.html" class="text-xs bg-zinc-900 border border-zinc-800 px-4 py-2 rounded-xl text-zinc-400 hover:text-white transition-all">✖ Voltar</a>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-6 text-center">
        <div id="loader-sub" class="py-20 text-zinc-500 font-mono text-xs italic animate-pulse">
            🔍 Verificando estrutura de subcoleções no banco...
        </div>

        <div id="grid-subcategorias" class="hidden grid grid-cols-2 md:grid-cols-4 gap-6 text-left">
            </div>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDPBZSxW8XjtQmDMUknzAyIlFda51MvMJY",
            databaseURL: "https://catalogo-abella-joias-default-rtdb.firebaseio.com"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const urlParams = new URLSearchParams(window.location.search);
        const catId = urlParams.get('id');

        if(!catId) {
            window.location.href = 'index.html';
        } else {
            verificarEstruturaDeSubcategorias();
        }

        function converterGsParaHttp(url) {
            if (!url) return '';
            var s = (url || '').trim();
            if (!s.startsWith('gs://')) return s;
            var sem = s.replace('gs://', '');
            var bar = sem.indexOf('/');
            if (bar === -1) return s;
            return 'https://firebasestorage.googleapis.com/v0/b/' +
                   sem.substring(0, bar) + '/o/' +
                   encodeURIComponent(sem.substring(bar + 1)) + '?alt=media';
        }

        function verificarEstruturaDeSubcategorias() {
            // Busca o nome mestre da Categoria-Mãe primeiro
            db.ref(`abella/categories/${catId}`).once('value', snapMae => {
                const maeData = snapMae.val() || {};
                document.getElementById('slogan-sub').innerText = (maeData.name || maeData.nome || catId).toUpperCase();
                
                // Mapeia o subnó exatamente como o módulo de categorias grava
                const subcategorias = maeData.subcategories;

                // 🌟 REGRA DE PULO AUTOMÁTICO: Se não contiver subcategorias cadastradas, pula direto para a vitrine
                if (!subcategorias || Object.keys(subcategorias).length === 0) {
                    window.location.href = `produtos.html?id=${catId}`;
                    return;
                }

                // Se houver subcategorias filhas estruturadas, exibe a tela e renderiza
                document.getElementById('loader-sub').classList.add('hidden');
                const grid = document.getElementById('grid-subcategorias');
                grid.classList.remove('hidden');
                grid.innerHTML = '';

                Object.keys(subcategorias).forEach(subKey => {
                    const sub = subcategorias[subKey];
                    if(sub.paused === true || sub.paused === "true") return;

                    const imgRaw = sub.image || sub.imagem || '';
                    const img = converterGsParaHttp(imgRaw) || 'https://via.placeholder.com/400/141414/818cf8?text=Abella+Joias';
                    
                    const card = document.createElement('div');
                    card.className = "card cursor-pointer flex flex-col justify-between";
                    card.setAttribute('onclick', `window.location.href='produtos.html?id=${catId}&sub=${subKey}'`);
                    
                    card.innerHTML = `
                        <div class="aspect-square bg-zinc-950 overflow-hidden flex items-center justify-center">
                            <img src="${img}" class="w-full h-full object-cover hover:scale-105 transition-all duration-300" onerror="this.src='https://via.placeholder.com/400/141414/818cf8?text=Sem+Imagem'">
                        </div>
                        <div class="p-4 bg-zinc-900/20 border-t border-zinc-900/60 flex items-center justify-between">
                            <span class="text-xs font-bold uppercase text-white truncate tracking-wide">${sub.name || sub.nome || subKey}</span>
                            <span class="gold text-xs">➔</span>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            });
        }
    </script>
</body>
</html>
