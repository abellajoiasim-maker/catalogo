<div class="p-6 max-w-6xl mx-auto space-y-6 animate-fade-in">
    <div class="flex items-center justify-between border-b border-zinc-900 pb-4">
        <div>
            <h1 class="text-xl font-bold text-white flex items-center gap-2 serif tracking-wider">
                <span>💍</span> GESTÃO DE PRODUTOS NO BRUTO
            </h1>
            <p class="text-xs text-zinc-500 mt-1">Cadastre novos lotes, modifique referências de peso e gerencie imagens estruturadas.</p>
        </div>
        <button onclick="window.abrirModalProduto()" class="bg-[#caa85c] hover:bg-[#bda152] text-black font-bold px-5 py-2.5 rounded-xl transition-all flex items-center gap-2 text-xs uppercase tracking-wider">
            <span>➕</span> Incluir Nova Joia
        </button>
    </div>

    <div id="grid-produtos" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        <div class="col-span-full text-center py-12 text-zinc-600 font-mono text-xs animate-pulse">
            ⏳ Sincronizando catálogo com nó abella/products...
        </div>
    </div>
</div>

<div id="modalFormProduto" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-zinc-950 border border-zinc-900 rounded-2xl max-w-md w-full p-6 space-y-4 relative text-left">
        <div class="flex items-center justify-between border-b border-zinc-900 pb-3">
            <h3 id="modalFormProdutoTitulo" class="text-xs font-black uppercase text-[#caa85c] tracking-widest font-mono">Formulário de Produto</h3>
            <button onclick="window.fecharModalProduto()" class="text-zinc-500 hover:text-white transition-all text-xs font-bold">✕</button>
        </div>
        
        <form id="formProdutoReal" onsubmit="event.preventDefault();" class="space-y-4 text-xs font-mono">
            <input type="hidden" id="prodId">
            
            <div class="space-y-1">
                <label class="text-[10px] text-zinc-400 uppercase font-bold">Nome da Joia:</label>
                <input type="text" id="prodNome" class="w-full bg-black border border-zinc-800 rounded-xl px-3 py-2 text-white outline-none focus:border-[#caa85c]">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div class="space-y-1">
                    <label class="text-[10px] text-zinc-400 uppercase font-bold">Código / SKU:</label>
                    <input type="text" id="prodSku" class="w-full bg-black border border-zinc-800 rounded-xl px-3 py-2 text-white outline-none focus:border-[#caa85c]">
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] text-zinc-400 uppercase font-bold">Categoria:</label>
                    <input type="text" id="prodCategoria" placeholder="Ex: Aneis" class="w-full bg-black border border-zinc-800 rounded-xl px-3 py-2 text-white outline-none focus:border-[#caa85c]">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div class="space-y-1">
                    <label class="text-[10px] text-zinc-400 uppercase font-bold">Peso Ref. (g):</label>
                    <input type="text" id="prodPeso" placeholder="4.50" class="w-full bg-black border border-zinc-800 rounded-xl px-3 py-2 text-white outline-none focus:border-[#caa85c]">
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] text-zinc-400 uppercase font-bold">Preço Base:</label>
                    <input type="number" step="0.01" id="prodPreco" class="w-full bg-black border border-zinc-800 rounded-xl px-3 py-2 text-white outline-none focus:border-[#caa85c]">
                </div>
            </div>

            <div class="space-y-1">
                <label class="text-[10px] text-zinc-400 uppercase font-bold">URL da Imagem (HTTP ou Storage gs://):</label>
                <input type="text" id="prodUrlImagem" placeholder="gs://... ou https://..." class="w-full bg-black border border-zinc-800 rounded-xl px-3 py-2 text-xs text-white outline-none focus:border-[#caa85c]">
            </div>

            <div class="pt-4 grid grid-cols-2 gap-3">
                <button type="button" onclick="window.fecharModalProduto()" class="border border-zinc-800 hover:bg-zinc-900 text-zinc-400 py-3 rounded-xl font-bold uppercase text-[10px] tracking-wider transition-all">Cancelar</button>
                <button type="button" onclick="window.salvarDadosProdutoDoForm()" class="bg-[#caa85c] text-black hover:bg-[#bda152] py-3 rounded-xl font-bold uppercase text-[10px] tracking-wider transition-all">Salvar Alterações</button>
            </div>
        </form>
    </div>
</div>
