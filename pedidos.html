<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Pedidos • Abella Joias</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

    <style>
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #caa85c; border-radius: 10px; }
        .btn { border: 1px solid #333; padding: 10px 16px; border-radius: 8px; color: white; font-size: 13px; font-weight: 600; transition: 0.2s; }
        .btn.active { background: #caa85c; color: black; }
        .btn:hover:not(.active) { background: #222; }
        
        @media print {
            body { background: white !important; color: black !important; }
            header, nav, main, #editorPedido { display: none !important; }
            #print-area { display: block !important; position: absolute; top: 0; left: 0; width: 100%; color: black; }
            .print-card { border: 1px solid #000; padding: 15px; margin-bottom: 15px; page-break-inside: avoid; }
            .print-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
            .print-table th, .print-table td { border: 1px solid #000; padding: 6px; text-align: left; font-size: 12px; }
        }
    </style>
</head>
<body class="bg-[#0b0b0b] text-white min-h-screen">

    <header class="p-5 text-center text-xl font-bold bg-black border-b border-[#222] text-[#caa85c] uppercase tracking-wider">
        Abella Joias • Gestão de Pedidos
    </header>

    <nav class="flex flex-col md:flex-row gap-2 p-3 bg-[#111] sticky top-0 z-50 border-b border-[#222]">
        <div class="flex gap-2">
            <a href="admin.html" class="btn">❮ Voltar Admin</a>
            <button class="btn active" onclick="location.reload()">Pedidos Recebidos</button>
        </div>
        <input type="text" id="buscaPedido" placeholder="🔍 Buscar por nome do cliente..." class="md:ml-auto w-full md:max-w-xs bg-[#1a1a1a] border border-[#333] p-2 rounded-lg text-white text-sm outline-none focus:border-[#caa85c]" oninput="carregarPedidos()">
    </nav>

    <main class="p-6 max-w-5xl mx-auto">
        <div id="listaPedidos" class="grid gap-4">
            <div class="text-center py-10 text-gray-600 italic">Carregando pedidos ativos do Firebase...</div>
        </div>
    </main>

    <div id="editorPedido" class="hidden fixed inset-0 bg-black/95 flex items-center justify-center z-50 p-4">
        <div class="bg-[#111] w-full max-w-5xl rounded-2xl p-6 overflow-auto max-h-[95vh] border border-[#333] custom-scroll space-y-6">
            
            <div class="flex justify-between items-center border-b border-[#222] pb-4">
                <h2 class="text-[#caa85c] font-bold uppercase tracking-tighter text-lg">Editar Estrutura do Pedido</h2>
                <div id="totalPreview" class="text-[#caa85c] font-black text-2xl font-mono">R$ 0,00</div>
            </div>
            
            <div class="grid md:grid-cols-2 gap-4">
                <div class="bg-black/40 p-4 border border-[#222] rounded-xl space-y-2">
                    <p class="text-[10px] text-[#caa85c] uppercase font-bold tracking-widest">Dados do Comprador</p>
                    <input id="edClienteNome" placeholder="Nome do Cliente" class="w-full bg-[#0b0b0b] border border-[#333] p-2 rounded text-sm text-white focus:border-[#caa85c] outline-none">
                    <input id="edClienteTel" placeholder="WhatsApp" class="w-full bg-[#0b0b0b] border border-[#333] p-2 rounded text-sm text-white focus:border-[#caa85c] outline-none">
                </div>
                <div class="bg-black/40 p-4 border border-[#222] rounded-xl space-y-2">
                    <p class="text-[10px] text-[#caa85c] uppercase font-bold tracking-widest">Destino da Entrega</p>
                    <input id="edRua" placeholder="Rua, Número, Bairro" class="w-full bg-[#0b0b0b] border border-[#333] p-2 rounded text-sm text-white focus:border-[#caa85c] outline-none">
                    <input id="edCidade" placeholder="Cidade / Estado" class="w-full bg-[#0b0b0b] border border-[#333] p-2 rounded text-sm text-white focus:border-[#caa85c] outline-none">
                </div>
            </div>

            <div>
                <div class="flex justify-between items-center mb-2">
                    <h3 class="text-[#caa85c] font-bold text-sm uppercase italic tracking-wide">Produtos Vinculados</h3>
                    <button class="bg-green-950 text-green-400 border border-green-800 hover:bg-green-900 px-3 py-1.5 rounded-lg text-xs font-bold uppercase tracking-wider" onclick="addItemEditor()">+ Inserir Peça (SKU)</button>
                </div>
                <div id="edItens" class="space-y-2 max-h-60 overflow-y-auto custom-scroll pr-1"></div>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 bg-[#1a1a1a] p-4 border border-[#222] rounded-xl">
                <div><label class="text-[10px] text-gray-400 uppercase font-bold block mb-1">Desc. Campanha (R$)</label><input id="edDescPromo" type="number" step="0.01" oninput="recalcularTotalEd()" class="w-full bg-black border border-[#333] p-2 rounded text-sm font-mono text-white"></div>
                <div><label class="text-[10px] text-gray-400 uppercase font-bold block mb-1">Desc. Pix (R$)</label><input id="edDescPix" type="number" step="0.01" oninput="recalcularTotalEd()" class="w-full bg-black border border-[#333] p-2 rounded text-sm font-mono text-white"></div>
                <div><label class="text-[10px] text-gray-400 uppercase font-bold block mb-1">Frete Adicional (R$)</label><input id="edFrete" type="number" step="0.01" oninput="recalcularTotalEd()" class="w-full bg-black border border-[#333] p-2 rounded text-sm font-mono text-white"></div>
                <div><label class="text-[10px] text-gray-400 uppercase font-bold block mb-1">Total Unidades</label><input id="edQtdTotal" type="number" readonly class="w-full bg-black/50 border border-[#333] p-2 rounded text-sm font-mono text-gray-400 cursor-not-allowed"></div>
            </div>
            
            <div class="p-4 border border-blue-900/40 rounded-xl bg-blue-950/10">
                <p class="text-[10px] text-blue-400 mb-3 uppercase font-bold text-center tracking-widest">Impressão e Emissão de Romaneios Profissionais</p>
                <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-2">
                    <button class="bg-blue-950/60 text-blue-400 border border-blue-900/80 text-[10px] py-2.5 rounded font-bold uppercase hover:bg-blue-900 hover:text-white" onclick="imprimirRomaneio(1)">1. CONFERÊNCIA</button>
                    <button class="bg-blue-950/60 text-blue-400 border border-blue-900/80 text-[10px] py-2.5 rounded font-bold uppercase hover:bg-blue-900 hover:text-white" onclick="imprimirRomaneio(2)">2. FINANCEIRO</button>
                    <button class="bg-blue-950/60 text-blue-400 border border-blue-900/80 text-[10px] py-2.5 rounded font-bold uppercase hover:bg-blue-900 hover:text-white" onclick="imprimirRomaneio(3)">3. VITRINE (FOTO)</button>
                    <button class="bg-indigo-950/60 text-indigo-400 border border-indigo-900/80 text-[10px] py-2.5 rounded font-bold uppercase hover:bg-indigo-900 hover:text-white" onclick="imprimirRomaneio(4)">4. GRADE CONF.</button>
                    <button class="bg-indigo-950/60 text-indigo-400 border border-indigo-900/80 text-[10px] py-2.5 rounded font-bold uppercase hover:bg-indigo-900 hover:text-white" onclick="imprimirRomaneio(5)">5. GRADE FIN.</button>
                    <button class="bg-indigo-950/60 text-indigo-400 border border-indigo-900/80 text-[10px] py-2.5 rounded font-bold uppercase hover:bg-indigo-900 hover:text-white" onclick="imprimirRomaneio(6)">6. GRADE TOTAL</button>
                </div>
            </div>

            <div class="flex flex-col md:flex-row gap-2 pt-4 border-t border-[#222]">
                <button class="bg-[#caa85c] text-black font-bold flex-grow py-3 rounded-lg text-sm uppercase tracking-wider hover:brightness-110" onclick="salvarPedidoEditado()">SALVAR ALTERAÇÕES</button>
                <button class="bg-red-950/40 text-red-400 border border-red-900 hover:bg-red-600 hover:text-white px-6 py-3 rounded-lg text-sm uppercase font-bold" onclick="excluirPedido()">EXCLUIR</button>
                <button class="border border-[#333] text-gray-400 py-3 px-6 rounded-lg text-sm font-bold uppercase hover:bg-zinc-900" onclick="fecharEditorPedido()">CANCELAR</button>
            </div>
        </div>
    </div>

    <div id="print-area"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDPBZSxW8XjtQmDMUknzAyIlFda51MvMJY",
            databaseURL: "https://catalogo-abella-joias-default-rtdb.firebaseio.com"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        let todosPedidos = {};
        var pedidoEditando = null;
        const fMoeda = v => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v || 0);

        function carregarPedidos() {
            db.ref('orders').on('value', snap => {
                const container = document.getElementById('listaPedidos');
                if(!snap.exists()){
                    container.innerHTML = '<div class="text-center py-10 text-gray-600 italic">Nenhum pedido localizado na base de dados.</div>';
                    return;
                }
                
                todosPedidos = snap.val();
                const busca = document.getElementById('buscaPedido').value.toLowerCase().trim();
                let htmlStack = [];

                Object.keys(todosPedidos).forEach(id => {
                    const p = todosPedidos[id];
                    const cliente = p.nome || p.cliente || 'Cliente não identificado';
                    if (busca && !cliente.toLowerCase().includes(busca)) return;

                    let totalPecas = 0;
                    if(Array.isArray(p.itens)) p.itens.forEach(i => totalPecas += (parseInt(i.quantidade) || 1));

                    htmlStack.push(`
                        <div class="bg-[#111] border border-[#222] p-5 rounded-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4 hover:border-zinc-700 transition-all">
                            <div class="space-y-1">
                                <div class="flex items-center gap-2">
                                    <span class="text-[10px] bg-zinc-800 text-zinc-400 px-2 py-0.5 rounded font-mono font-bold">#${id.slice(-6).toUpperCase()}</span>
                                    <span class="text-[10px] text-gray-500">${p.data ? new Date(p.data).toLocaleString('pt-BR') : ''}</span>
                                </div>
                                <h4 class="text-base font-bold text-white">${cliente}</h4>
                                <p class="text-xs text-gray-400 font-mono">📱 WhatsApp: ${p.whats || 'Não informado'} | 📦 Volume: ${totalPecas} pçs</p>
                                <p class="text-xs text-zinc-500 truncate max-w-xl">📍 Local: ${p.rua || 'Não informado'}, ${p.numero || ''} - ${p.cidade || ''}</p>
                            </div>
                            <div class="flex md:flex-col items-end gap-2 w-full md:w-auto justify-between border-t md:border-t-0 border-[#222] pt-3 md:pt-0">
                                <div class="text-right">
                                    <span class="block text-[9px] text-gray-500 uppercase font-bold tracking-widest">Total Líquido</span>
                                    <span class="text-lg font-bold text-[#caa85c] font-mono">${typeof p.total === 'number' ? fMoeda(p.total) : (p.total || 'R$ 0,00')}</span>
                                </div>
                                <button onclick="abrirEditorPedido('${id}')" class="bg-zinc-900 border border-zinc-800 text-[#caa85c] text-xs font-bold px-4 py-2 rounded-lg uppercase hover:bg-[#caa85c] hover:text-black transition-all">⚙️ Gerenciar / Imprimir</button>
                            </div>
                        </div>
                    `);
                });

                container.innerHTML = htmlStack.length ? htmlStack.reverse().join('') : '<div class="text-center py-10 text-gray-600 italic">Nenhum cliente correspondente encontrado.</div>';
            });
        }

        function abrirEditorPedido(id) {
            pedidoEditando = id;
            const p = todosPedidos[id];
            
            document.getElementById('edClienteNome').value = p.nome || '';
            document.getElementById('edClienteTel').value = p.whats || '';
            document.getElementById('edRua').value = p.rua || '';
            document.getElementById('edCidade').value = p.cidade || '';
            
            document.getElementById('edDescPromo').value = p.descontoPromo || 0;
            document.getElementById('edDescPix').value = p.descontoPix || 0;
            document.getElementById('edFrete').value = p.frete || 0;

            renderItensEditor(p.itens || []);
            document.getElementById('editorPedido').classList.remove('hidden');
        }

        function renderItensEditor(itens) {
            const box = document.getElementById('edItens');
            box.innerHTML = '';
            itens.forEach((item, index) => {
                box.innerHTML += `
                    <div class="flex items-center gap-2 bg-black/40 p-2 border border-[#222] rounded-lg">
                        <img src="${item.image || 'https://via.placeholder.com/50'}" class="w-10 h-10 object-contain rounded bg-zinc-950">
                        <div class="flex-1 truncate">
                            <div class="text-xs font-bold text-white truncate">${item.nome}</div>
                            <div class="text-[10px] text-gray-500 font-mono">SKU: ${item.sku || 'N/A'} | Preço original: ${fMoeda(item.precoFinal || item.price)}</div>
                        </div>
                        <div class="flex items-center gap-1 shrink-0">
                            <label class="text-[9px] text-gray-500 font-bold uppercase">Preço: </label>
                            <input type="number" step="0.01" value="${item.precoFinal || item.price || 0}" oninput="atualizarItemPreco(${index}, this.value)" class="w-20 bg-black border border-[#333] p-1 rounded text-center text-xs text-white font-mono">
                            <label class="text-[9px] text-gray-500 font-bold uppercase ml-2">Qtd: </label>
                            <input type="number" value="${item.quantidade || 1}" oninput="atualizarItemQtd(${index}, this.value)" class="w-14 bg-black border border-[#333] p-1 rounded text-center text-xs text-white font-mono">
                            <button onclick="removerItemEditor(${index})" class="text-red-500 font-bold px-2 hover:text-red-400">✕</button>
                        </div>
                    </div>
                `;
            });
            recalcularTotalEd();
        }

        function atualizarItemPreco(index, valor) {
            const p = todosPedidos[pedidoEditando];
            if(p && p.itens && p.itens[index]) {
                p.itens[index].precoFinal = parseFloat(valor) || 0;
                recalcularTotalEd();
            }
        }

        function atualizarItemQtd(index, valor) {
            const p = todosPedidos[pedidoEditando];
            if(p && p.itens && p.itens[index]) {
                p.itens[index].quantidade = parseInt(valor) || 0;
                recalcularTotalEd();
            }
        }

        function removerItemEditor(index) {
            const p = todosPedidos[pedidoEditando];
            if(p && p.itens) {
                p.itens.splice(index, 1);
                renderItensEditor(p.itens);
            }
        }

        function addItemEditor() {
            const sku = prompt("Digite o SKU exato do produto que deseja injetar neste pedido:").toUpperCase().trim();
            if(!sku) return;

            db.ref('products/' + sku).once('value', snap => {
                if(!snap.exists()) {
                    alert("❌ SKU não localizado na base global de produtos!");
                    return;
                }
                const prod = snap.val();
                const p = todosPedidos[pedidoEditando];
                if(!p.itens) p.itens = [];
                
                p.itens.push({
                    sku: sku,
                    nome: prod.name || prod.nome,
                    image: prod.image || prod.imageUrl || '',
                    precoFinal: parseFloat(prod.price || prod.precoFinal || 0),
                    quantidade: 1,
                    peso: parseFloat(prod.peso || prod.weight || 0)
                });
                renderItensEditor(p.itens);
            });
        }

        function recalcularTotalEd() {
            const p = todosPedidos[pedidoEditando];
            if(!p) return;

            let subtotal = 0;
            let totalPecas = 0;
            if(Array.isArray(p.itens)) {
                p.itens.forEach(i => {
                    subtotal += (parseFloat(i.precoFinal) || 0) * (parseInt(i.quantidade) || 0);
                    totalPecas += (parseInt(i.quantidade) || 0);
                });
            }

            const descPromo = parseFloat(document.getElementById('edDescPromo').value) || 0;
            const descPix = parseFloat(document.getElementById('edDescPix').value) || 0;
            const frete = parseFloat(document.getElementById('edFrete').value) || 0;

            const totalLiquido = subtotal - descPromo - descPix + frete;
            
            document.getElementById('totalPreview').innerText = fMoeda(totalLiquido);
            document.getElementById('edQtdTotal').value = totalPecas;
        }

        function salvarPedidoEditado() {
            const p = todosPedidos[pedidoEditando];
            p.nome = document.getElementById('edClienteNome').value.trim();
            p.whats = document.getElementById('edClienteTel').value.trim();
            p.rua = document.getElementById('edRua').value.trim();
            p.cidade = document.getElementById('edCidade').value.trim();
            
            p.descontoPromo = parseFloat(document.getElementById('edDescPromo').value) || 0;
            p.descontoPix = parseFloat(document.getElementById('edDescPix').value) || 0;
            p.frete = parseFloat(document.getElementById('edFrete').value) || 0;
            
            let subtotal = 0;
            if(p.itens) p.itens.forEach(i => subtotal += (i.precoFinal * i.quantidade));
            p.total = subtotal - p.descontoPromo - p.descontoPix + p.frete;

            db.ref('orders/' + pedidoEditando).set(p).then(() => {
                alert("✅ Pedido atualizado com sucesso com novas regras financeiras!");
                fecharEditorPedido();
            });
        }

        function excluirPedido() {
            if(confirm("🚨 Deseja expurgar e deletar definitivamente este pedido do banco de dados?")) {
                db.ref('orders/' + pedidoEditando).remove().then(() => {
                    alert("Pedido excluído!");
                    fecharEditorPedido();
                });
            }
        }

        function fecharEditorPedido() {
            document.getElementById('editorPedido').classList.add('hidden');
            pedidoEditando = null;
        }

        // MOTOR DE EMISSÃO DE MODELOS DE ROMANEIO (PRINT ENGINE)
        function imprimirRomaneio(modelo) {
            const p = todosPedidos[pedidoEditando];
            if(!p) return;

            const printArea = document.getElementById('print-area');
            let nomeModelo = "";
            if (modelo === 1) nomeModelo = "Romaneio de Conferência de Separação";
            if (modelo === 2) nomeModelo = "Romaneio Financeiro e Faturamento";
            if (modelo === 3) nomeModelo = "Romaneio Vitrine de Conferência Fotográfica";
            if (modelo === 4) nomeModelo = "Grade Comparativa de Conferência";
            if (modelo === 5) nomeModelo = "Grade Financeira Expandida";
            if (modelo === 6) nomeModelo = "Grade Consolidada Total";

            let tabelaItens = "";
            let pesoTotal = 0;
            
            if(p.itens) {
                p.itens.forEach(i => {
                    const pItem = (parseFloat(i.peso) || 0) * (parseInt(i.quantidade) || 1);
                    pesoTotal += pItem;
                    
                    tabelaItens += `
                        <tr>
                            <td style="text-align: center;">
                                ${modelo === 3 ? `<img src="${i.image}" style="width:40px; height:40px; object-fit:contain; margin:0 auto;">` : (i.sku || 'N/A')}
                            </td>
                            <td><b>${i.nome}</b></td>
                            <td style="text-align: center; font-weight: bold; font-size:14px;">${i.quantidade} cx</td>
                            ${modelo === 2 || modelo === 5 || modelo === 6 ? `<td style="text-align: right;">${fMoeda(i.precoFinal)}</td>` : ''}
                            ${modelo === 2 || modelo === 5 || modelo === 6 ? `<td style="text-align: right; font-weight: bold;">${fMoeda(i.precoFinal * i.quantidade)}</td>` : ''}
                        </tr>
                    `;
                });
            }

            printArea.innerHTML = `
                <div class="print-card" style="font-family: Arial, sans-serif; color: black; background: white; padding: 20px;">
                    <div style="text-align: center; border-bottom: 2px solid black; padding-bottom: 10px; margin-bottom: 15px;">
                        <h1 style="margin: 0; font-size: 20px; uppercase">ABELLA JOIAS ATACADO</h1>
                        <p style="margin: 3px 0 0 0; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #555;">${nomeModelo}</p>
                    </div>
                    
                    <div style="font-size: 12px; margin-bottom: 15px; display: grid; grid-template-cols: 1fr 1fr; line-height: 1.6;">
                        <div><b>Cliente:</b> ${p.nome || p.cliente}</div>
                        <div><b>WhatsApp:</b> ${p.whats || 'Não cadastrado'}</div>
                        <div><b>Endereço:</b> ${p.rua || 'Não informado'}, ${p.numero || ''}</div>
                        <div><b>Cidade:</b> ${p.cidade || 'Não informada'}</div>
                        <div><b>Data Emissão:</b> ${new Date().toLocaleString('pt-BR')}</div>
                        <div><b>Logística:</b> ${p.metodo ? p.metodo.toUpperCase() : 'PIX'}</div>
                    </div>

                    <table class="print-table">
                        <thead>
                            <tr style="background: #f0f0f0;">
                                <th style="width: 80px; text-align: center;">${modelo === 3 ? 'Imagem' : 'SKU'}</th>
                                <th>Descrição da Peça</th>
                                <th style="width: 70px; text-align: center;">Qtd</th>
                                ${modelo === 2 || modelo === 5 || modelo === 6 ? '<th style="width: 90px; text-align: right;">Val. Unit</th>' : ''}
                                ${modelo === 2 || modelo === 5 || modelo === 6 ? '<th style="width: 100px; text-align: right;">Subtotal</th>' : ''}
                            </tr>
                        </thead>
                        <tbody>
                            ${tabelaItens}
                        </tbody>
                    </table>

                    <div style="margin-top: 20px; border-top: 1px solid black; pt-10; font-size: 12px; text-align: right; line-height: 1.6;">
                        <div>Total Peças: <b>${document.getElementById('edQtdTotal').value} unidades</b></div>
                        <div>Massa Bruta Total: <b>${pesoTotal.toFixed(2)}g</b></div>
                        ${modelo === 2 || modelo === 5 || modelo === 6 ? `
                            <div>Desconto Geral: <b>-${fMoeda(parseFloat(p.descontoPromo || 0) + parseFloat(p.descontoPix || 0))}</b></div>
                            <div>Custo Adicional Frete: <b>+${fMoeda(p.frete || 0)}</b></div>
                            <div style="font-size: 16px; margin-top: 5px;">Valor Final Pago: <b style="font-family: monospace;">${typeof p.total === 'number' ? fMoeda(p.total) : p.total}</b></div>
                        ` : ''}
                    </div>

                    <div style="margin-top: 40px; text-align: center; font-size: 10px; color: #666; border-top: 1px dashed #ccc; padding-top: 10px;">
                        Documento interno impresso para conferência operacional — Abella Joias
                    </div>
                </div>
            `;

            window.print();
        }

        window.onload = carregarPedidos;
    </script>
</body>
</html>
