<div class="p-6 max-w-7xl mx-auto space-y-6 animate-fade-in">
    <div class="flex flex-col md:flex-row md:items-center md:justify-between border-b border-gray-100 pb-4 gap-4">
        <div>
            <h1 class="text-2xl font-bold text-gray-800 flex items-center gap-2">
                <span>⚡</span> Editor Full Master IA <span class="text-xs bg-amber-100 text-amber-800 px-2 py-0.5 rounded-md uppercase font-mono">Modo Industrial</span>
            </h1>
            <p class="text-sm text-gray-500 mt-1">Selecione múltiplos produtos por categoria para renderização automatizada em lote.</p>
        </div>
    </div>

    <div class="bg-gray-900 text-white p-5 rounded-2xl border border-gray-800 shadow-md grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
        <div>
            <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1.5 tracking-wider">1. Modelo Humano (Lote)</label>
            <select id="loteModeloIdade" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2.5 text-xs text-white focus:ring-2 focus:ring-amber-500 outline-none">
                <option value="adulto">Adulto (Padrão Catálogo)</option>
                <option value="infantil">Infantil</option>
                <option value="infanto-juvenil">Infanto-Juvenil</option>
                <option value="senior">Sênior</option>
            </select>
        </div>

        <div>
            <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1.5 tracking-wider">2. Restrição Técnica (Não Inventar)</label>
            <select id="loteAcabamento" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2.5 text-xs text-white focus:ring-2 focus:ring-amber-500 outline-none">
                <option value="original">Preservar Traços Originais do JPG/PNG</option>
                <option value="latao-fosco">Garantir Latão sem Brilho (Bruto)</option>
                <option value="argolinha-central">Forçar Argolinha Central Única</option>
            </select>
        </div>

        <button id="btnDispararLote" onclick="iniciarProcessamentoEmMassa()" class="w-full bg-emerald-600 hover:bg-emerald-700 disabled:bg-gray-800 disabled:text-gray-600 text-white font-bold py-2.5 rounded-xl shadow-md transition-all text-xs flex items-center justify-center gap-2 h-10" disabled>
            <span>🚀</span> Processar Peças Selecionadas
        </button>
    </div>

    <div class="bg-white rounded-2xl border border-gray-200 shadow-xs overflow-hidden">
        <div class="p-4 bg-gray-50 border-b border-gray-100 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-2 w-full sm:w-auto">
                <label class="text-xs font-bold text-gray-500 uppercase tracking-wider whitespace-nowrap">Filtrar Coleção:</label>
                <select id="loteFiltroCategoria" onchange="carregarProdutosParaLote()" class="bg-white border border-gray-200 rounded-xl px-3 py-1.5 text-xs text-gray-700 outline-none focus:ring-2 focus:ring-amber-500 max-w-xs">
                    <option value="">Carregando coleções...</option>
                </select>
            </div>
            
            <div id="contadorFila" class="text-xs text-gray-400 font-medium">
                Nenhum produto na fila de renderização.
            </div>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-50/70 border-b border-gray-100 text-[10px] font-bold text-gray-400 uppercase tracking-wider font-mono">
                        <th class="py-3 px-4 text-center w-12">
                            <input type="checkbox" id="checkMarcarTodos" onchange="marcarTodosProdutos(this)" class="rounded text-amber-500 focus:ring-amber-500 w-4 h-4">
                        </th>
                        <th class="py-3 px-4 w-16 text-center">Foto</th>
                        <th class="py-3 px-4">Joia / SKU</th>
                        <th class="py-3 px-4">Extensão</th>
                        <th class="py-3 px-4 text-right pr-6">Status da Fila</th>
                    </tr>
                </thead>
                <tbody id="tabelaLoteProdutos" class="divide-y divide-gray-100 text-xs text-gray-700">
                    <tr>
                        <td colspan="5" class="text-center py-12 text-gray-400 font-medium">
                            Selecione uma coleção acima para listar as joias cadastradas.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    var _PRODUTOS_LOTE_CACHE = {};
    var _FILA_PROCESSAMENTO = [];
    var _INDICE_ATUAL_FILA = 0;

    // Inicializa carregando as categorias nas abas do lote
    setTimeout(function() {
        if (typeof db !== "undefined") {
            db.ref('categories').once('value', function(snapshot) {
                var dados = snapshot.val();
                var select = document.getElementById('loteFiltroCategoria');
                if(!select) return;

                select.innerHTML = '<option value="">-- Escolha uma Coleção --</option>';
                if(dados) {
                    Object.keys(dados).forEach(function(id) {
                        var name = dados[id].nome || dados[id].name || id;
                        select.insertAdjacentHTML('beforeend', `<option value="${id}">${name.toUpperCase()}</option>`);
                    });
                }
            });
        }
    }, 200);

    // Carrega os produtos da categoria selecionada para a tabela
    function carregarProdutosParaLote() {
        var catId = document.getElementById('loteFiltroCategoria').value;
        var tbody = document.getElementById('tabelaLoteProdutos');
        var btnDisparar = document.getElementById('btnDispararLote');
        var checkTodos = document.getElementById('checkMarcarTodos');

        if(!catId) {
            tbody.innerHTML = '<tr><td colspan="5" class="text-center py-12 text-gray-400 font-medium">Selecione uma coleção acima para listar as joias cadastradas.</td></tr>';
            btnDisparar.disabled = true;
            return;
        }

        tbody.innerHTML = '<tr><td colspan="5" class="text-center py-12 text-gray-400 font-medium">⏳ Mapeando arquivos no Firebase...</td></tr>';
        checkTodos.checked = false;

        db.ref('products').orderByChild('category').equalTo(catId).once('value', function(snapshot) {
            var dados = snapshot.val();
            if(!dados) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center py-12 text-gray-400 font-medium text-amber-600">📦 Nenhum produto cadastrado nesta coleção.</td></tr>';
                btnDisparar.disabled = true;
                return;
            }

            _PRODUTOS_LOTE_CACHE = dados;
            tbody.innerHTML = '';
            
            Object.keys(dados).forEach(function(id) {
                var prod = dados[id];
                var fotoUrl = prod.image || "";
                
                // Detecta automaticamente se o arquivo salvo no Storage é JPG ou PNG baseado na URL do link
                var extensao = "Desconhecido";
                if (fotoUrl.toLowerCase().includes('.png')) extensao = "PNG (Transparente)";
                else if (fotoUrl.toLowerCase().includes('.jpg') || fotoUrl.toLowerCase().includes('.jpeg')) extensao = "JPG (Foto)";

                var fotoPadrao = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="%23ccc"><circle cx="12" cy="12" r="10"/></svg>';

                var tr = document.createElement('tr');
                tr.id = `linha-lote-${id}`;
                tr.className = "hover:bg-gray-50/50 transition-all";
                tr.innerHTML = `
                    <td class="py-3 px-4 text-center">
                        <input type="checkbox" value="${id}" onchange="atualizarContadorFila()" class="check-item-lote rounded text-amber-500 focus:ring-amber-500 w-4 h-4">
                    </td>
                    <td class="py-3 px-4 text-center">
                        <div class="w-10 h-10 rounded-lg border border-gray-100 bg-gray-50 overflow-hidden mx-auto flex items-center justify-center p-0.5">
                            <img src="${fotoUrl || fotoPadrao}" class="w-full h-full object-cover rounded" onerror="this.src='${fotoPadrao}'">
                        </div>
                    </td>
                    <td class="py-3 px-4">
                        <div class="font-bold text-gray-800">${prod.name || 'Sem Nome'}</div>
                        <div class="text-[10px] text-gray-400 font-mono">SKU: ${prod.sku || 'N/A'}</div>
                    </td>
                    <td class="py-3 px-4 font-mono text-[10px] text-gray-500">
                        ${extensao}
                    </td>
                    <td id="status-lote-${id}" class="py-3 px-4 text-right pr-6 font-semibold text-gray-400 text-[11px]">
                        Aguardando seleção
                    </td>
                `;
                tbody.appendChild(tr);
            });

            atualizarContadorFila();
        });
    }

    // Marca ou desmarca todos os itens de uma vez
    function marcarTodosProdutos(master) {
        document.querySelectorAll('.check-item-lote').forEach(function(box) {
            box.checked = master.checked;
        });
        atualizarContadorFila();
    }

    // Atualiza as métricas de quantos itens vão rodar
    function atualizarContadorFila() {
        var selecionados = document.querySelectorAll('.check-item-lote:checked').length;
        var total = document.querySelectorAll('.check-item-lote').length;
        var txtContador = document.getElementById('contadorFila');
        var btnDisparar = document.getElementById('btnDispararLote');

        if(selecionados > 0) {
            txtContador.innerHTML = `<span class="bg-amber-100 text-amber-800 px-2 py-1 rounded-md font-bold">${selecionados}</span> joias prontas para processamento em lote.`;
            btnDisparar.disabled = false;
        } else {
            txtContador.innerText = "Nenhum produto na fila de renderização.";
            btnDisparar.disabled = true;
        }
    }

    // ENGINE DE LOOP DE FILA (RODA UM APÓS O OUTRO EM LOTE SEM TRAVAR O NAVEGADOR)
    function iniciarProcessamentoEmMassa() {
        _FILA_PROCESSAMENTO = [];
        document.querySelectorAll('.check-item-lote:checked').forEach(function(box) {
            _FILA_PROCESSAMENTO.push(box.value);
        });

        if(_FILA_PROCESSAMENTO.length === 0) return;

        // Trava os botões de controle para não interromper a esteira
        document.getElementById('btnDispararLote').disabled = true;
        document.getElementById('loteFiltroCategoria').disabled = true;
        document.getElementById('checkMarcarTodos').disabled = true;
        document.querySelectorAll('.check-item-lote').forEach(box => box.disabled = true);

        _INDICE_ATUAL_FILA = 0;
        executarProximoItemDaFila();
    }

    function executarProximoItemDaFila() {
        if (_INDICE_ATUAL_FILA >= _FILA_PROCESSAMENTO.length) {
            // Fim do lote completo
            alert(`🎉 Excelente, Isaías! Foram processadas ${_FILA_PROCESSAMENTO.length} fotos de joias com sucesso em lote!`);
            document.getElementById('loteFiltroCategoria').disabled = false;
            document.getElementById('checkMarcarTodos').disabled = false;
            carregarProdutosParaLote(); // Recarrega a tabela limpa
            return;
        }

        var idAtual = _FILA_PROCESSAMENTO[_INDICE_ATUAL_FILA];
        var itemContainerStatus = document.getElementById(`status-lote-${idAtual}`);
        
        if(itemContainerStatus) {
            itemContainerStatus.className = "py-3 px-4 text-right pr-6 font-bold text-amber-500 animate-pulse text-[11px]";
            itemContainerStatus.innerText = "⚡ Processando com IA...";
        }

        // Configurações Técnicas capturadas do cabeçalho unificado
        var idadeDefinida = document.getElementById('loteModeloIdade').value;
        var acabamentoFixo = document.getElementById('loteAcabamento').value;
        var linkFotoOriginal = _PRODUTOS_LOTE_CACHE[idAtual].image;

        // SIMULAÇÃO DA CHAMADA DA SUA API EM LOTE (Substitua pelo fetch real da IA)
        setTimeout(function() {
            // A IA processa o JPG/PNG e devolve a nova URL do Storage
            var linkFotoProcessadaPelaIA = linkFotoOriginal; // Simulação mantendo o link seguro

            // Atualiza o Realtime Database direto na propriedade image da joia correspondente
            db.ref(`products/${idAtual}`).update({
                image: linkFotoProcessadaPelaIA
            }).then(function() {
                if(itemContainerStatus) {
                    itemContainerStatus.className = "py-3 px-4 text-right pr-6 font-bold text-emerald-600 text-[11px]";
                    itemContainerStatus.innerText = "✅ Sincronizado!";
                }
                
                // Avança o ponteiro da esteira industrial para a próxima peça
                _INDICE_ATUAL_FILA++;
                executarProximoItemDaFila();
            }).catch(function(err) {
                if(itemContainerStatus) {
                    itemContainerStatus.className = "py-3 px-4 text-right pr-6 font-bold text-rose-500 text-[11px]";
                    itemContainerStatus.innerText = "❌ Erro ao Salvar";
                }
                _INDICE_ATUAL_FILA++;
                executarProximoItemDaFila();
            });

        }, 1500); // Velocidade de 1.5s por peça na esteira industrial simulada
    }
</script>
