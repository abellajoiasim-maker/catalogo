<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel Administrativo • Abella Joias</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #0b0b0b; color: #eee; }
        .sidebar { background: #111; border-right: 1px solid #222; }
        .tab-btn { transition: 0.2s; border-radius: 8px; text-align: left; width: 100%; padding: 12px 16px; font-size: 13px; font-weight: 600; }
        .tab-btn.active { background: #caa85c; color: #000; }
        .tab-btn:not(.active):hover { background: #1a1a1a; color: #caa85c; }
        .card { background: #141414; border: 1px solid #222; border-radius: 12px; }
        .input-adm { background: #0b0b0b; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 8px; width: 100%; outline: none; font-size: 13px; }
        .input-adm:focus { border-color: #caa85c; }
    </style>
</head>
<body class="flex min-h-screen">

    <aside class="w-64 sidebar p-6 flex flex-col justify-between shrink-0">
        <div>
            <div class="mb-8 px-2">
                <h1 class="text-[#caa85c] font-bold tracking-wider text-base uppercase">Abella Admin</h1>
                <p class="text-[10px] text-gray-500 uppercase tracking-widest mt-1">Gestor de Catálogo</p>
            </div>
            <nav class="space-y-1">
                <button onclick="mudarAba('pedidos')" id="btn-pedidos" class="tab-btn active">📦 Pedidos Recebidos</button>
                <button onclick="mudarAba('produtos')" id="btn-produtos" class="tab-btn">💍 Produtos / Modelos</button>
                <button onclick="mudarAba('categorias')" id="btn-categorias" class="tab-btn">📁 Coleções / Categorias</button>
                <button onclick="mudarAba('config')" id="btn-config" class="tab-btn">⚙️ Configurações</button>
            </nav>
        </div>
        <div class="px-2 pt-4 border-t border-zinc-900 text-center text-[10px] text-gray-600">
            Abella Joias v2.0
        </div>
    </aside>

    <main class="flex-1 p-8 overflow-y-auto max-w-5xl">
        
        <section id="aba-pedidos" class="space-y-6">
            <div class="flex justify-between items-center">
                <h2 class="text-xl font-bold tracking-wide">Pedidos Recebidos</h2>
                <span id="qtd-pedidos" class="bg-zinc-800 border border-zinc-700 px-3 py-1 rounded-full text-xs text-gray-400 font-mono">0 pedidos</span>
            </div>
            <div id="lista-pedidos" class="space-y-4">
                <p class="text-xs text-gray-500 italic">Buscando lista de compras no Firebase...</p>
            </div>
        </section>

        <section id="aba-produtos" class="hidden space-y-6">
            <div class="flex justify-between items-center">
                <h2 class="text-xl font-bold tracking-wide">Produtos / Modelos</h2>
                <button onclick="abrirModalProduto()" class="bg-[#caa85c] text-black px-4 py-2 rounded-xl text-xs font-bold">+ NOVO PRODUTO</button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="lista-produtos"></div>
        </section>

        <section id="aba-categorias" class="hidden space-y-6">
            <div class="flex justify-between items-center">
                <h2 class="text-xl font-bold tracking-wide">Coleções / Categorias</h2>
                <button onclick="abrirModalCategoria()" class="bg-[#caa85c] text-black px-4 py-2 rounded-xl text-xs font-bold">+ NOVA CATEGORIA</button>
            </div>
            <div class="grid grid-cols-2 md:grid-cols-3 gap-4" id="lista-categorias"></div>
        </section>

        <section id="aba-config" class="hidden space-y-6">
            <h2 class="text-xl font-bold tracking-wide">Configurações do Catálogo</h2>
            <div class="card p-6 max-w-xl space-y-4">
                <div>
                    <label class="text-xs text-gray-400 font-bold uppercase tracking-wider block mb-1">Nome da Empresa</label>
                    <input id="cfg-nome" class="input-adm">
                </div>
                <div>
                    <label class="text-xs text-gray-400 font-bold uppercase tracking-wider block mb-1">Slogan Comercial</label>
                    <input id="cfg-slogan" class="input-adm">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-xs text-gray-400 font-bold uppercase tracking-wider block mb-1">Máximo de Parcelas</label>
                        <input id="cfg-parcelas" type="number" class="input-adm">
                    </div>
                    <div>
                        <label class="text-xs text-gray-400 font-bold uppercase tracking-wider block mb-1">Desconto PIX (%)</label>
                        <input id="cfg-pix" type="number" class="input-adm">
                    </div>
                </div>
                <div>
                    <label class="text-xs text-gray-400 font-bold uppercase tracking-wider block mb-1">WhatsApp de Recebimento (com DDD)</label>
                    <input id="cfg-whatsapp" class="input-adm" placeholder="Ex: 19999999999">
                </div>
                <button onclick="salvarConfig()" class="w-full bg-[#caa85c] text-black font-bold py-3 rounded-xl text-xs tracking-wider mt-4">SALVAR CONFIGURAÇÕES</button>
            </div>
        </section>
    </main>

    <script src="admin-logic.js"></script>
</body>
</html>
