<script type="module">

    import {
        getDatabase,
        ref,
        get,
        update
    } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-database.js";

    // =========================
    // DATABASE
    // =========================

    function obterConexaoBanco() {

        try {

            if (window.db) {
                return window.db;
            }

            if (window.firebaseApp) {
                return getDatabase(window.firebaseApp);
            }

            return null;

        } catch (e) {

            console.error("Erro Firebase:", e);

            return null;
        }
    }

    // =========================
    // BUSCAR
    // =========================

    window.buscarConfiguracoesFirebase = async function () {

        const database = obterConexaoBanco();

        if (!database) {

            document.getElementById("cfgUltimaAtualizacao").innerText =
                "❌ Firebase offline";

            return;
        }

        try {

            const snapshot = await get(
                ref(database, "abella/settings")
            );

            const config = snapshot.val() || {};

            // =========================
            // INPUTS
            // =========================

            document.getElementById("cfgNome").value =
                config.name || "Abella Joias";

            document.getElementById("cfgSlogan").value =
                config.slogan || "Atacado de Joias";

            document.getElementById("cfgWhatsapp").value =
                config.whatsapp || "";

            document.getElementById("cfgDescPix").value =
                config.pix ?? 5;

            document.getElementById("cfgParcelas").value =
                config.parcelas ?? 6;

            document.getElementById("cfgValorMinimo").value =
                config.pedidoMinimo ?? 0;

            document.getElementById("cfgFreteFixo").value =
                config.freteFixo ?? 0;

            document.getElementById("cfgFreteGratisAlvo").value =
                config.freteGratisAlvo ?? 100;

            document.getElementById("cfgStatusLoja").value =
                config.statusLoja || "aberto";

            document.getElementById("cfgTextoAviso").value =
                config.bannerTexto || "";

            document.getElementById("cfgAtivarAviso").checked =
                !!config.bannerAtivo;

            document.getElementById("cfgUltimaAtualizacao").innerText =
                config.ultimaAtualizacao
                    ? `Atualizado: ${config.ultimaAtualizacao}`
                    : "Configuração carregada";

            console.log("✅ Config carregada:", config);

        } catch (erro) {

            console.error("Erro ao buscar:", erro);

            document.getElementById("cfgUltimaAtualizacao").innerText =
                "❌ Erro ao carregar";
        }
    };

    // =========================
    // SALVAR
    // =========================

    window.salvarConfiguracoes = async function () {

        const btn = document.getElementById("btnSalvarConfig");

        const originalHTML = btn.innerHTML;

        try {

            const database = obterConexaoBanco();

            if (!database) {

                alert("Firebase indisponível.");

                return;
            }

            const nome =
                document.getElementById("cfgNome").value.trim();

            if (!nome) {

                alert("Nome da loja obrigatório.");

                return;
            }

            btn.disabled = true;

            btn.innerHTML = "⏳ Salvando...";

            const agora =
                new Date().toLocaleString("pt-BR");

            // =========================
            // PACOTE
            // =========================

            const dados = {

                name:
                    nome,

                slogan:
                    document.getElementById("cfgSlogan").value.trim(),

                whatsapp:
                    document.getElementById("cfgWhatsapp").value.trim(),

                pix:
                    parseFloat(
                        document.getElementById("cfgDescPix").value
                    ) || 0,

                parcelas:
                    parseInt(
                        document.getElementById("cfgParcelas").value
                    ) || 1,

                pedidoMinimo:
                    parseFloat(
                        document.getElementById("cfgValorMinimo").value
                    ) || 0,

                freteFixo:
                    parseFloat(
                        document.getElementById("cfgFreteFixo").value
                    ) || 0,

                freteGratisAlvo:
                    parseFloat(
                        document.getElementById("cfgFreteGratisAlvo").value
                    ) || 0,

                statusLoja:
                    document.getElementById("cfgStatusLoja").value,

                bannerTexto:
                    document.getElementById("cfgTextoAviso").value.trim(),

                bannerAtivo:
                    document.getElementById("cfgAtivarAviso").checked,

                ultimaAtualizacao:
                    agora
            };

            // =========================
            // FIREBASE UPDATE
            // =========================

            await update(
                ref(database, "abella/settings"),
                dados
            );

            document.getElementById("cfgUltimaAtualizacao").innerText =
                `✅ Atualizado: ${agora}`;

            console.log("✅ Config salva:", dados);

            alert("💎 Configurações salvas com sucesso!");

        } catch (erro) {

            console.error("Erro ao salvar:", erro);

            alert("❌ Erro ao salvar.");

        } finally {

            btn.disabled = false;

            btn.innerHTML =
                `<span>💾</span> Salvar e Aplicar no Index`;
        }
    };

    // =========================
    // AUTO LOAD
    // =========================

    window.addEventListener("load", () => {

        setTimeout(() => {

            window.buscarConfiguracoesFirebase();

        }, 500);
    });

</script>
