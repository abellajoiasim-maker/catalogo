<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
</head>
<body class="bg-zinc-900 text-zinc-100 p-6 font-sans min-h-screen">

    <div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <div class="md:col-span-1 bg-zinc-950 border border-zinc-800 p-5 rounded-2xl h-fit space-y-4">
            <h3 id="formTitulo" class="text-sm font-bold text-white uppercase tracking-wider border-b border-zinc-900 pb-2">Nova Categoria Mãe</h3>
            <form id="formCat" onsubmit="salvarCategoriaUI(event)" class="space-y-4 text-left">
                <input type="hidden" id="catOldSlug">
                <div class="space-y-1">
                    <label class="text-[10px] uppercase text-zinc-400 font-bold">Título da Categoria *</label>
                    <input type="text" id="catName" required placeholder="Ex: Anéis" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-2 text-xs outline-none focus:border-[#caa85c]">
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] uppercase text-zinc-400 font-bold">Imagem da Coleção (URL ou gs://)</label>
                    <input type="text" id="catImage" placeholder="Caminho da imagem do banner/card" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-2 text-xs outline-none focus:border-[#caa85c]">
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] uppercase text-zinc-400 font-bold">Ordem de Exibição (Index)</label>
                    <input type="number" id="catOrder" value="0" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-2 text-xs outline-none focus:border-[#caa85c]">
                </div>
                <button type="submit" class="w-full bg-[#caa85c] text-black font-black py-2.5 rounded-xl text-xs uppercase tracking-wider transition-all">
                    Confirmar Salvamento
                </button>
            </form>
        </div>

        <div class="md:col-span-2 bg-zinc-950 border border-zinc-800 p-5 rounded-2xl flex flex-col">
            <h3 class="text-sm font-bold text-white uppercase tracking-wider border-b border-zinc-900 pb-2 mb-4 text-left">Estruturas Ativas</h3>
            <div id="loading" class="text-center py-6 text-zinc-500 text-xs uppercase tracking-widest">⏳ Lendo categorias...</div>
            <div id="lista-categorias" class="space-y-2 overflow-y-auto max-h-[70vh]"></div>
        </div>
    </div>

    <script src="../js/firebase/firebase-config.js"></script>
    <script src="../js/services/categoriaService.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => { carregarCategoriasUI(); });

        async function carregarCategoriasUI() {
            const container = document.getElementById('lista-categorias');
            const loading = document.getElementById('loading');
            container.innerHTML = '';
            loading.classList.remove('hidden');

            try {
                const cats = await categoriaService.listarTodas(true);
                loading.classList.add('hidden');

                if(!cats || Object.keys(cats).length === 0) {
                    container.innerHTML = '<p class="text-zinc-600 text-xs italic py-4">Nenhuma categoria cadastrada.</p>';
                    return;
                }

                Object.keys(cats).forEach(slug => {
                    const c = cats[slug];
                    const div = document.createElement('div');
                    div.className = "flex items-center justify-between p-3 bg-zinc-900 border border-zinc-800/60 rounded-xl text-left";
                    div.innerHTML = `
                        <div>
                            <span class="text-xs text-white font-bold uppercase">${c.name || slug}</span>
                            <p class="text-[9px] text-zinc-500 font-mono">Nó ID: /${slug} | Index Ordem: ${c.order || 0}</p>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="editarCategoriaUI('${slug}', '${c.name || ''}', '${c.image || ''}', ${c.order || 0})" class="bg-zinc-800 hover:bg-zinc-700 px-3 py-1 text-[10px] font-bold rounded-lg transition-all">Editar</button>
                            <button onclick="deletarCategoriaUI('${slug}')" class="bg-red-950/20 border border-red-900/40 text-red-400 px-3 py-1 text-[10px] font-bold rounded-lg transition-all">Excluir</button>
                        </div>
                    `;
                    container.appendChild(div);
                });
            } catch(e) { loading.innerText = "❌ Erro ao renderizar árvore de nós corporativos."; }
        }

        function editarCategoriaUI(slug, name, img, order) {
            document.getElementById('catOldSlug').value = slug;
            document.getElementById('catName').value = name;
            document.getElementById('catImage').value = img;
            document.getElementById('catOrder').value = order;
            document.getElementById('formTitulo').innerText = "Modificar Categoria Mãe";
        }

        async function salvarCategoriaUI(e) {
            e.preventDefault();
            const name = document.getElementById('catName').value.trim();
            const slug = name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-");
            const oldSlug = document.getElementById('catOldSlug').value;

            const payload = {
                name: name,
                image: document.getElementById('catImage').value.trim(),
                order: parseInt(document.getElementById('catOrder').value) || 0
            };

            if(oldSlug && oldSlug !== slug) {
                await categoriaService.deletar(oldSlug);
            }

            await categoriaService.salvar(slug, payload);
            document.getElementById('formCat').reset();
            document.getElementById('catOldSlug').value = '';
            document.getElementById('formTitulo').innerText = "Nova Categoria Mãe";
            await carregarCategoriasUI();
        }

        async function deletarCategoriaUI(slug) {
            if(confirm("Confirmar a remoção definitiva da categoria? Isto poderá ocultar produtos associados.")) {
                await categoriaService.deletar(slug);
                await carregarCategoriasUI();
            }
        }
    </script>
</body>
</html>
