<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel Administrativo • Abella Joias</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #09090b; color: #f4f4f5; }
        .serif { font-family: 'Cinzel', serif; }
        .active-menu { background-color: #1f1f23; border-left: 4px solid #caa85c; color: #fff; }
    </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row overflow-hidden">

    <aside class="w-full md:w-64 bg-zinc-950 border-b md:border-b-0 md:border-r border-zinc-900 flex flex-col shrink-0 z-20">
        <div class="p-6 border-b border-zinc-900 flex items-center justify-between">
            <div>
                <h1 class="serif text-[#caa85c] font-bold text-sm uppercase tracking-wider">Abella Joias</h1>
                <p class="text-[9px] text-zinc-500 uppercase tracking-widest mt-0.5">Painel de Controle</p>
            </div>
            <a href="../index.html" target="_blank" class="text-zinc-500 hover:text-white text-xs transition-all">🛒 Ver Loja</a>
        </div>
        
        <nav class="flex-1 p-4 space-y-1 overflow-y-auto">

    <button
        onclick="navegarPara('pedidos.html', this)"
        class="active-menu w-full text-left px-4 py-3 rounded-xl text-xs font-semibold tracking-wide text-zinc-400 hover:text-white hover:bg-zinc-900 transition-all flex items-center gap-3">
        📦 Pedidos Recebidos
    </button>

    <button
        onclick="navegarPara('editor.html', this)"
        class="w-full text-left px-4 py-3 rounded-xl text-xs font-semibold tracking-wide text-zinc-400 hover:text-white hover:bg-zinc-900 transition-all flex items-center gap-3">
        ✏️ Editor Visual
    </button>

    <button
        onclick="navegarPara('ofertas.html', this)"
        class="w-full text-left px-4 py-3 rounded-xl text-xs font-semibold tracking-wide text-zinc-400 hover:text-white hover:bg-zinc-900 transition-all flex items-center gap-3">
        🏷️ Campanhas & Ofertas
    </button>

    <button
        onclick="navegarPara('galvanicas.html', this)"
        class="w-full text-left px-4 py-3 rounded-xl text-xs font-semibold tracking-wide text-zinc-400 hover:text-white hover:bg-zinc-900 transition-all flex items-center gap-3">
        🏬 Galvânicas Parceiras
    </button>

    <button
        onclick="navegarPara('config.html', this)"
        class="w-full text-left px-4 py-3 rounded-xl text-xs font-semibold tracking-wide text-zinc-400 hover:text-white hover:bg-zinc-900 transition-all flex items-center gap-3">
        ⚙️ Configurações Gerais
    </button>

</nav>

        <div class="p-4 border-t border-zinc-900 text-center">
            <span class="text-[9px] text-zinc-600 font-mono">VERSÃO ARQUITETURAL IQ200 v2.6</span>
        </div>
    </aside>

    <main class="flex-1 bg-zinc-900 relative flex flex-col">
        <iframe id="conteudo-modulo" src="../modulo/pedidos.html" class="w-full h-full border-none flex-1"></iframe>
    </main>

    <script>
        function navegarPara(modulo, elementoBotao) {
            document.getElementById('conteudo-modulo').src = `../modulo/${modulo}`;
            
            // Atualiza estado visual do menu ativo
            document.querySelectorAll('nav button').forEach(btn => {
                btn.classList.remove('active-menu');
            });
            elementoBotao.classList.add('active-menu');
        }
    </script>
</body>
</html>
