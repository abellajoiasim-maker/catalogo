<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Super Editor V7 • Abella Joias</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>

  <script src="../js/firebase/firebase-config.js"></script>

  <style>
    .input-dark {
      background-color: rgb(24 24 27);
      border: 1px solid rgb(39 39 42);
      color: white;
      border-radius: 0.5rem;
      padding: 0.75rem;
      width: 100%;
      margin-bottom: 0.5rem;
    }

    .tab-btn.active {
      background: #caa85c;
      color: black;
      font-weight: 700;
      border-radius: 0.75rem;
      padding: 0.5rem 1rem;
      font-size: 0.75rem;
    }

    .tab-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      color: white;
      border-radius: 0.75rem;
      padding: 0.5rem 1rem;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .tab-btn:hover {
      background: rgba(255,255,255,0.10);
    }
  </style>
</head>

<body class="bg-black text-white">
  <div class="max-w-7xl mx-auto p-4">

    <header class="bg-zinc-950 border border-zinc-900 rounded-2xl p-5 mb-4">
      <div class="flex justify-between items-center">
        <div>
          <h1 class="text-2xl font-bold text-[#caa85c]">Super Editor V7</h1>
          <p class="text-xs text-zinc-500">Centro Operacional Sincronizado Abella</p>
        </div>
        <div class="flex gap-2">
          <button
            id="btnRefresh"
            class="px-4 py-2 bg-[#caa85c] text-black rounded-lg text-xs font-bold"
            type="button"
          >
            Atualizar e Sincronizar
          </button>
        </div>
      </div>
    </header>

    <section class="grid grid-cols-4 gap-3 mb-5">
      <div class="bg-zinc-950 border border-zinc-900 rounded-xl p-4">
        <div class="text-zinc-500 text-[10px]">Produtos</div>
        <div id="statProdutos" class="text-2xl font-bold">0</div>
      </div>
      <div class="bg-zinc-950 border border-zinc-900 rounded-xl p-4">
        <div class="text-zinc-500 text-[10px]">Categorias</div>
        <div id="statCategorias" class="text-2xl font-bold">0</div>
      </div>
      <div class="bg-zinc-950 border border-zinc-900 rounded-xl p-4">
        <div class="text-zinc-500 text-[10px]">Subcategorias</div>
        <div id="statSubs" class="text-2xl font-bold">0</div>
      </div>
      <div class="bg-zinc-950 border border-zinc-900 rounded-xl p-4">
        <div class="text-zinc-500 text-[10px]">Pausados</div>
        <div id="statPausados" class="text-2xl font-bold">0</div>
      </div>
    </section>

    <section class="bg-zinc-950 border border-zinc-900 rounded-xl p-4 mb-4">
      <div class="grid md:grid-cols-5 gap-3">
        <input
          id="buscaGlobal"
          type="text"
          class="w-full md:col-span-2 bg-zinc-900 border border-zinc-800 rounded-lg p-3 text-sm"
          placeholder="Buscar SKU, Nome, Categoria..."
        />
        <select id="filtroTipo" class="bg-zinc-900 border border-zinc-800 rounded-lg p-3 text-sm">
          <option value="todos">Todos</option>
          <option value="produto">Produtos</option>
          <option value="categoria">Categorias</option>
          <option value="subcategoria">Subcategorias</option>
        </select>
        <select id="filtroCategoria" class="bg-zinc-900 border border-zinc-800 rounded-lg p-3 text-sm">
          <option value="">Todas Categorias</option>
        </select>
        <select id="filtroSubcategoria" class="bg-zinc-900 border border-zinc-800 rounded-lg p-3 text-sm">
          <option value="">Todas Subcategorias</option>
        </select>
      </div>
    </section>

    <section class="flex gap-2 mb-4">
      <button class="tab-btn active" data-tab="produtos" type="button">Produtos</button>
      <button class="tab-btn" data-tab="categorias" type="button">Categorias</button>
      <button class="tab-btn" data-tab="subcategorias" type="button">Subcategorias</button>
    </section>

    <section>
      <div id="tab-produtos"></div>
      <div id="tab-categorias" class="hidden"></div>
      <div id="tab-subcategorias" class="hidden"></div>
    </section>

    <div id="status" class="text-xs text-zinc-500 mt-6"></div>
  </div>

  <div
    id="drawer"
    class="fixed top-0 right-0 h-full w-[520px] bg-zinc-950 border-l border-zinc-800 hidden z-50 overflow-y-auto"
  >
    <div class="p-5">
      <div class="flex justify-between mb-5">
        <h2 id="drawerTitle" class="text-lg font-bold">Editor</h2>
        <button type="button" onclick="fecharDrawer()" class="text-xl leading-none">✕</button>
      </div>
      <div id="drawerContent"></div>
    </div>
  </div>

  <script>
  function resolverDB() {
    if (window.db) return window.db;
    if (window.firebase && window.firebase.apps && window.firebase.apps.length > 0) {
      return window.firebase.database();
    }
    return null;
  }

  const statusEl = document.getElementById('status');
  const STATE = {
    db: null,
    produtos: [],
    categorias: {},
    buscaDebounceTimer: null,
    filtros: { busca: '', tipo: 'todos', categoria: '', subcategoria: '' }
  };

  const CONFIG = {
    accentColor: '#caa85c',
    drawerWidth: 520,
    debounceBusca: 200,
    firebaseRetries: 30,
    firebaseRetryDelay: 100
  };

  // ==========================================================
  // NORMALIZADOR DE DADOS (Lê de forma resiliente qualquer variação)
  // ==========================================================
  const DataService = {
    getSubcategory(obj) {
      return obj?.subCategory ?? obj?.subcategory ?? '';
    },
    getImage(obj) {
      return obj?.imagem ?? obj?.image ?? obj?.img ?? '';
    },
    getPrice(obj) {
      return Number(obj?.preco ?? obj?.price ?? 0);
    },
    getWeight(obj) {
      return Number(obj?.peso ?? obj?.weight ?? 0);
    }
  };

  const FirebaseService = {
    async carregarCategorias(){
      const snap = await STATE.db.ref(window.getAbellaPath('categories')).once('value');
      return snap.val() || {};
    },
    async carregarProdutos(){
      const snap = await STATE.db.ref(window.getAbellaPath('products')).once('value');
      const dados = snap.val() || {};
      return Object.entries(dados).map(([id, p]) => ({ id, ...p }));
    }
  };   

  function setStatus(msg, type = 'info') {
    const color = type === 'error' ? 'text-red-400' : type === 'ok' ? 'text-green-400' : 'text-zinc-500';
    statusEl.className = `text-xs mt-6 ${color}`;
    statusEl.textContent = msg;
  }

  function escapeHtml(str) {
    return String(str ?? '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;');
  }

  function escapeAttr(str) {
    return String(str ?? '').replaceAll("'", "\\'").replaceAll('"', '&quot;');
  }

  function getActiveTab() {
    return document.querySelector('.tab-btn.active')?.dataset?.tab || 'produtos';
  }

  function converterGsUrl(url) {
    let stringUrl = String(url ?? '').trim();
    if (!stringUrl) return '';
    if (stringUrl.includes('drive.google.com')) {
      try {
        let idArquivo = '';
        if (stringUrl.includes('/d/')) idArquivo = stringUrl.split('/d/')[1].split('/')[0];
        else if (stringUrl.includes('id=')) idArquivo = stringUrl.split('id=')[1].split('&')[0];
        if (idArquivo) return `https://drive.google.com/uc?export=view&id=${idArquivo}`;
      } catch (e) {}
    }
    if (stringUrl.startsWith('gs://')) {
      try {
        const semProtocolo = stringUrl.replace('gs://', '');
        const idx = semProtocolo.indexOf('/');
        if (idx === -1) return stringUrl;
        return `https://firebasestorage.googleapis.com/v1/b/${semProtocolo.substring(0, idx)}/o/${encodeURIComponent(semProtocolo.substring(idx + 1))}?alt=media`;
      } catch (e) {}
    }
    return stringUrl;
  }

  function tratarInputImagem(inputElement, previewId) {
    if (!inputElement) return;
    let valor = inputElement.value.trim();
    if (valor.startsWith('gs://') || valor.includes('drive.google.com')) {
      valor = converterGsUrl(valor);
      inputElement.value = valor;
    }
    const preview = document.getElementById(previewId);
    if (preview) {
      preview.src = valor;
      preview.style.display = valor ? 'block' : 'none';
    }
  }

  function handleImageError(img) {
    img.style.display = 'none';
    if (img.parentNode) {
      const fallback = img.parentNode.querySelector('.fallback-container');
      if (fallback) fallback.style.display = 'flex';
    }
  }

  function abrirDrawer(titulo, html) {
    document.getElementById('drawerTitle').textContent = titulo;
    document.getElementById('drawerContent').innerHTML = html;
    document.getElementById('drawer').classList.remove('hidden');
  }

  function fecharDrawer() {
    document.getElementById('drawer').classList.add('hidden');
    document.getElementById('drawerContent').innerHTML = '';
  }

  async function carregarTudo(){
    try {
      [STATE.categorias, STATE.produtos] = await Promise.all([
        FirebaseService.carregarCategorias(),
        FirebaseService.carregarProdutos()
      ]);
      popularFiltros();
      renderAll();
      setStatus('✅ Sincronizado com o Canal de Vendas', 'ok');
    } catch(err) {
      setStatus('❌ Falha na sincronização', 'error');
    }
  }

  function atualizarEstatisticas() {
    document.getElementById('statProdutos').innerText = STATE.produtos.length;
    document.getElementById('statCategorias').innerText = Object.keys(STATE.categorias).length;
    let totalSubs = 0;
    Object.values(STATE.categorias).forEach(cat => totalSubs += Object.keys(cat?.subcategories || {}).length);
    document.getElementById('statSubs').innerText = totalSubs;
    document.getElementById('statPausados').innerText = STATE.produtos.filter(p => p.paused).length;
  }

  function popularFiltros() {
    const selCat = document.getElementById('filtroCategoria');
    const selSub = document.getElementById('filtroSubcategoria');
    if (!selCat || !selSub) return;

    let catOptions = `<option value="">Todas Categorias</option>`;
    Object.keys(STATE.categorias).forEach(c => catOptions += `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`);
    selCat.innerHTML = catOptions;

    const allSubs = new Set();
    Object.values(STATE.categorias).forEach(cat => Object.keys(cat?.subcategories || {}).forEach(s => allSubs.add(s)));
    let subOptions = `<option value="">Todas Subcategorias</option>`;
    [...allSubs].forEach(s => subOptions += `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`);
    selSub.innerHTML = subOptions;
  }

  function renderCurrentTab() {
    const tabAtiva = getActiveTab();
    if (tabAtiva === 'produtos') renderProdutos();
    else if (tabAtiva === 'categorias') renderCategorias();
    else if (tabAtiva === 'subcategorias') renderSubcategorias();
  }

  function renderAll() {
    atualizarEstatisticas();
    renderCurrentTab();
  }

  function renderProdutos() {
    const container = document.getElementById('tab-produtos');
    if (!container) return;
    const termos = (document.getElementById('buscaGlobal').value || '').toLowerCase();
    const filtroCat = document.getElementById('filtroCategoria').value;
    const filtroSub = document.getElementById('filtroSubcategoria').value;

    const filtrados = STATE.produtos.filter(p => {
      const texto = (p.name || '').toLowerCase() + ' ' + (p.sku || '').toLowerCase() + ' ' + (p.category || '').toLowerCase();
      return (termos === '' || texto.includes(termos)) && (!filtroCat || p.category === filtroCat) && (!filtroSub || DataService.getSubcategory(p) === filtroSub);
    });

    if (filtrados.length === 0) {
      container.innerHTML = `<div class="text-sm text-zinc-500">Nenhum produto cadastrado.</div>`;
      return;
    }

    let html = '';
    filtrados.forEach(p => {
      const pausedTag = p.paused ? `<span class="text-xs text-red-400 font-bold ml-2">(Pausado)</span>` : '';
      html += `
        <div class="bg-zinc-950 border border-zinc-900 rounded-xl p-4 mb-2">
          <div class="flex items-center justify-between gap-4">
            <div class="flex items-center gap-4 flex-1">
              <div class="w-16 h-16 bg-zinc-900 border border-zinc-800 rounded-lg overflow-hidden flex-shrink-0 flex items-center justify-center relative">
                <div class="fallback-container absolute inset-0 flex items-center justify-center bg-zinc-900 text-[10px] text-zinc-600">Sem Foto</div>
                ${DataService.getImage(p) ? `<img src="${escapeHtml(converterGsUrl(DataService.getImage(p)))}" class="w-full h-full object-cover relative z-10" onerror="handleImageError(this)"/>` : ''}
              </div>
              <div>
                <div class="font-bold">${escapeHtml(p.name || '')}${pausedTag}</div>
                <div class="grid grid-cols-2 gap-x-4 gap-y-0.5 text-xs text-zinc-500 mt-1">
                  <div>SKU: <span class="text-zinc-300">${escapeHtml(p.sku || '')}</span></div>
                  <div>Preço: <span class="text-zinc-300">R$ ${escapeHtml(DataService.getPrice(p))}</span></div>
                  <div>Cat: <span class="text-zinc-400">${escapeHtml(p.category || '')}</span></div>
                  <div>Sub: <span class="text-zinc-400">${escapeHtml(DataService.getSubcategory(p))}</span></div>
                </div>
              </div>
            </div>
            <div class="flex gap-2 flex-shrink-0">
              <button onclick="editarProduto('${escapeAttr(p.id)}')" class="bg-zinc-900 border border-zinc-800 p-2 rounded-lg">✏</button>
              <button onclick="duplicarProduto('${escapeAttr(p.id)}')" class="bg-zinc-900 border border-zinc-800 p-2 rounded-lg">📄</button>
              <button onclick="pausarProduto('${escapeAttr(p.id)}')" class="bg-zinc-900 border border-zinc-800 p-2 rounded-lg">⏸</button>
              <button onclick="deletarProduto('${escapeAttr(p.id)}')" class="bg-zinc-900 border border-zinc-800 p-2 rounded-lg text-red-400">🗑</button>
            </div>
          </div>
        </div>`;
    });
    container.innerHTML = html;
  }

  function renderCategorias() {
    const el = document.getElementById('tab-categorias');
    if (!el) return;
    let html = '';
    Object.entries(STATE.categorias).forEach(([slug, cat]) => {
      html += `
        <div class="bg-zinc-950 border border-zinc-900 rounded-xl p-4 mb-2">
          <div class="flex items-center justify-between gap-4">
            <div>
              <div class="font-bold">${escapeHtml(cat?.name || slug)}</div>
              <div class="text-xs text-zinc-500">Slug: ${escapeHtml(slug)}</div>
            </div>
            <button onclick="editarCategoria('${escapeAttr(slug)}')" class="bg-zinc-900 border border-zinc-800 p-2 rounded-lg">✏</button>
          </div>
        </div>`;
    });
    el.innerHTML = html;
  }

  function renderSubcategorias() {
    const el = document.getElementById('tab-subcategorias');
    if (!el) return;
    let html = '';
    Object.entries(STATE.categorias).forEach(([catSlug, cat]) => {
      Object.entries(cat?.subcategories || {}).forEach(([subSlug, subObj]) => {
        html += `
          <div class="bg-zinc-950 border border-zinc-900 rounded-xl p-4 mb-2">
            <div class="flex items-center justify-between gap-4">
              <div>
                <div class="font-bold">${escapeHtml(subObj?.name || subSlug)}</div>
                <div class="text-xs text-zinc-500">Pai: ${escapeHtml(catSlug)} | Slug: ${escapeHtml(subSlug)}</div>
              </div>
              <button onclick="editarSubcategoria('${escapeAttr(catSlug)}', '${escapeAttr(subSlug)}')" class="bg-zinc-900 border border-zinc-800 p-2 rounded-lg">✏</button>
            </div>
          </div>`;
      });
    });
    el.innerHTML = html;
  }

  function editarProduto(id) {
    const p = STATE.produtos.find(prod => prod.id === id);
    if (!p) return;

    let catsHtml = '';
    Object.keys(STATE.categorias).forEach(cat => catsHtml += `<option value="${escapeHtml(cat)}" ${p.category === cat ? 'selected' : ''}>${escapeHtml(cat)}</option>`);

    abrirDrawer('Editar Produto', `
      <input id="editNome" class="input-dark" placeholder="Nome" value="${escapeHtml(p.name || '')}">
      <input id="editSku" class="input-dark" placeholder="SKU" value="${escapeHtml(p.sku || '')}">
      <select id="editCategoria" class="input-dark" onchange="carregarSubcategoriasProduto()">${catsHtml}</select>
      <select id="editSubcategoria" class="input-dark"></select>
      
      <img id="previewProduto" src="${escapeHtml(converterGsUrl(DataService.getImage(p)))}" class="w-full h-40 object-cover rounded-xl border border-zinc-800 mb-2" onerror="this.style.display='none'">
      <input id="editImagem" class="input-dark" placeholder="URL da imagem (imagem)" value="${escapeHtml(DataService.getImage(p))}" oninput="tratarInputImagem(this, 'previewProduto')">
      
      <input id="editPreco" class="input-dark" placeholder="Preço (preco)" value="${escapeHtml(DataService.getPrice(p))}">
      <input id="editPeso" class="input-dark" placeholder="Peso (peso)" value="${escapeHtml(DataService.getWeight(p))}">
      <button onclick="salvarProduto('${escapeAttr(id)}')" class="bg-[#caa85c] text-black px-4 py-2 rounded-lg w-full font-bold mt-2">Salvar Alterações</button>
    `);
    carregarSubcategoriasProduto(p.category, DataService.getSubcategory(p));
  }

  function carregarSubcategoriasProduto(catSel, subSel = '') {
    const cat = catSel || document.getElementById('editCategoria')?.value;
    const select = document.getElementById('editSubcategoria');
    if (!select) return;
    select.innerHTML = '<option value="">Nenhuma</option>';
    Object.entries(STATE.categorias[cat]?.subcategories || {}).forEach(([slug, sub]) => {
      select.innerHTML += `<option value="${escapeHtml(slug)}" ${slug === subSel ? 'selected' : ''}>${escapeHtml(sub.name || slug)}</option>`;
    });
  }

  // ==========================================================
  // GRAVAÇÃO ALINHADA (Garante salvar nos dois padrões simultaneamente)
  // ==========================================================
  async function salvarProduto(id) {
    try {
      const img = document.getElementById('editImagem').value;
      const preco = parseFloat(document.getElementById('editPreco').value) || 0;
      const peso = parseFloat(document.getElementById('editPeso').value) || 0;
      const subcat = document.getElementById('editSubcategoria').value;

      await STATE.db.ref(window.getAbellaPath(`products/${id}`)).update({
        name: document.getElementById('editNome').value,
        sku: document.getElementById('editSku').value,
        category: document.getElementById('editCategoria').value,
        
        // CORREÇÃO CRÍTICA DE ALINHAMENTO: Grava nos dois formatos (inglês e português) para não quebrar a vitrine
        subcategory: subcat,
        subCategory: subcat,
        price: preco,
        preco: preco,
        weight: peso,
        peso: peso,
        image: img,
        imagem: img,
        updatedAt: Date.now()
      });
      fecharDrawer();
      await carregarTudo();
    } catch (e) { setStatus('❌ Erro ao salvar', 'error'); }
  }

  async function duplicarProduto(id) {
    const p = STATE.produtos.find(prod => prod.id === id);
    if (!p) return;
    const copia = { ...p, sku: (p.sku || '') + '-COPY', createdAt: Date.now() };
    delete copia.id;
    await STATE.db.ref(window.getAbellaPath('products')).push(copia);
    await carregarTudo();
  }

  async function pausarProduto(id) {
    const p = STATE.produtos.find(prod => prod.id === id);
    if (!p) return;
    await STATE.db.ref(window.getAbellaPath(`products/${id}`)).update({ paused: !p.paused });
    await carregarTudo();
  }

  async function deletarProduto(id) {
    if (confirm('Excluir permanentemente?')) {
      await STATE.db.ref(window.getAbellaPath(`products/${id}`)).remove();
      await carregarTudo();
    }
  }

  function editarCategoria(slug) {
    const cat = STATE.categorias[slug];
    if (!cat) return;
    abrirDrawer('Editar Categoria', `
      <input id="editCatName" class="input-dark" placeholder="Nome" value="${escapeHtml(cat.name || '')}">
      <textarea id="editCatDesc" class="input-dark" placeholder="Descrição">${escapeHtml(cat.description || '')}</textarea>
      <button onclick="salvarCategoria('${escapeAttr(slug)}')" class="bg-[#caa85c] text-black px-4 py-2 rounded-xl w-full font-bold">Salvar</button>
    `);
  }

  async function salvarCategoria(slug) {
    await STATE.db.ref(window.getAbellaPath(`categories/${slug}`)).update({
      name: document.getElementById('editCatName').value,
      description: document.getElementById('editCatDesc').value,
      updatedAt: Date.now()
    });
    fecharDrawer();
    await carregarTudo();
  }

  function editarSubcategoria(catSlug, subSlug) {
    const sub = STATE.categorias[catSlug]?.subcategories?.[subSlug];
    if (!sub) return;
    const imgOrig = sub.imagem || sub.grid || sub.gridImage || '';

    abrirDrawer('Editar Subcategoria', `
      <input id="subName" class="input-dark" placeholder="Nome" value="${escapeHtml(sub.name || sub.title || '')}">
      <textarea id="subDesc" class="input-dark" placeholder="Descrição">${escapeHtml(sub.description || '')}</textarea>
      <img id="previewSub" src="${escapeHtml(converterGsUrl(imgOrig))}" class="w-full h-32 object-cover rounded-xl border border-zinc-800 mb-2" onerror="this.style.display='none'">
      <input id="subImg" class="input-dark" placeholder="URL da Imagem" value="${escapeHtml(imgOrig)}" oninput="tratarInputImagem(this, 'previewSub')">
      <button onclick="salvarSubcategoria('${escapeAttr(catSlug)}', '${escapeAttr(subSlug)}')" class="bg-[#caa85c] text-black px-4 py-2 rounded-xl w-full font-bold mt-2">Salvar</button>
    `);
  }

  async function salvarSubcategoria(catSlug, subSlug) {
    const img = document.getElementById('subImg').value;
    await STATE.db.ref(window.getAbellaPath(`categories/${catSlug}/subcategories/${subSlug}`)).update({
      name: document.getElementById('subName').value,
      description: document.getElementById('subDesc').value,
      
      // CORREÇÃO CRÍTICA DE IMAGEM: Salva em todas as chaves mapeadas no index e subcategorias
      imagem: img,
      grid: img,
      gridImage: img,
      hero: img,
      heroImage: img,
      updatedAt: Date.now()
    });
    fecharDrawer();
    await carregarTudo();
  }

  function wireSearch() {
    document.getElementById('buscaGlobal').addEventListener('input', () => {
      clearTimeout(STATE.buscaDebounceTimer);
      STATE.buscaDebounceTimer = setTimeout(renderCurrentTab, CONFIG.debounceBusca);
    });
    ['filtroTipo', 'filtroCategoria', 'filtroSubcategoria'].forEach(id => {
      document.getElementById(id)?.addEventListener('change', () => renderCurrentTab());
    });
  }

  function wireTabs() {
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        ['produtos', 'categorias', 'subcategorias'].forEach(t => document.getElementById('tab-' + t)?.classList.add('hidden'));
        document.getElementById('tab-' + btn.dataset.tab)?.classList.remove('hidden');
        renderCurrentTab();
      });
    });
  }

  (async function init() {
    let t = 0;
    while(!STATE.db && t < CONFIG.firebaseRetries){
      STATE.db = resolverDB();
      if(!STATE.db) { await new Promise(r => setTimeout(r, CONFIG.firebaseRetryDelay)); t++; }
    }
    if (!STATE.db) return setStatus('❌ Erro Firebase SDK', 'error');

    wireTabs();
    wireSearch();
    document.getElementById('btnRefresh').addEventListener('click', () => carregarTudo());
    await carregarTudo();
  })();

  window.editarProduto = editarProduto; window.salvarProduto = salvarProduto;
  window.duplicarProduto = duplicarProduto; window.pausarProduto = pausarProduto;
  window.deletarProduto = deletarProduto; window.editarCategoria = editarCategoria;
  window.salvarCategoria = salvarCategoria; window.editarSubcategoria = editarSubcategoria;
  window.salvarSubcategoria = salvarSubcategoria; window.fecharDrawer = fecharDrawer;
  window.tratarInputImagem = tratarInputImagem; window.handleImageError = handleImageError;
  window.carregarSubcategoriasProduto = carregarSubcategoriasProduto;
  </script>
</body>
</html>
