<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Subcategorias • Abella Joias</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv=\"Cache-Control\" content=\"no-cache, no-store, must-revalidate\">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --gold: #caa85c;
            --bg: #050505;
            --card: #101010;
            --line: #1f1f1f;
        }
        body {
            background: radial-gradient(circle at top, #171717 0%, #050505 100%);
            color: #fff;
            font-family: 'Inter', sans-serif;
        }
        .font-cinzel { font-family: 'Cinzel', serif; }
        .sub-card {
            background: rgba(16, 16, 16, 0.7);
            border: 1px solid var(--line);
            backdrop-filter: blur(12px);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .sub-card:hover {
            transform: translateY(-4px);
            border-color: var(--gold);
            box-shadow: 0 12px 30px rgba(202, 168, 92, 0.1);
        }
        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.03);
            color: #a1a1aa;
            padding: 0.6rem 1.2rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            font-weight: 600;
            transition: all 0.3s;
        }
        .back-button:hover {
            border-color: var(--gold);
            color: #fff;
            background: rgba(202, 168, 92, 0.05);
        }
        .fallback-sub {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #121212;
            font-size: 2.2rem;
            z-index: 1;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="w-full border-b border-zinc-900/60 bg-black/40 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <button onclick="window.location.href='index.html'" class="back-button">
                <span>← Voltar</span>
            </button>
            <h1 id="header-logo-text" class="font-cinzel text-lg tracking-[0.2em] font-bold text-[#caa85c] cursor-pointer" onclick="window.location.href='index.html'">
                ABELLA JOIAS
            </h1>
            <div class="w-20"></div>
        </div>
    </header>

    <div id="banner-container" class="w-full h-[220px] md:h-[280px] bg-zinc-950 relative overflow-hidden hidden border-b border-zinc-900">
        <img id="banner-img" src="" alt="Banner Categoria" class="w-full h-full object-cover opacity-30">
        <div class="absolute inset-0 bg-gradient-to-t from-[#050505] via-transparent to-black/50"></div>
    </div>

    <main class="max-w-7xl mx-auto px-4 py-10 flex-1 w-full">
        <div class="mb-8">
            <h2 id="categoria-titulo" class="font-cinzel text-xl md:text-3xl font-bold tracking-wider text-zinc-100 uppercase">...</h2>
            <p id="categoria-desc" class="text-xs md:text-sm text-zinc-500 mt-2 max-w-2xl font-light leading-relaxed"></p>
        </div>

        <div id="loading" class="text-center py-16">
            <div class="inline-block w-6 h-6 border-2 border-zinc-800 border-t-[#caa85c] rounded-full animate-spin"></div>
        </div>

        <div id="grid-subcategorias" class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6"></div>
    </main>

    <script src="../js/firebase/firebase-config.js"></script>
    <script>
        let categoriaSlug = '';

        function converterGsUrl(url) {
            let stringUrl = String(url ?? '').trim();
            if (!stringUrl) return '';

            if (stringUrl.includes('drive.google.com')) {
                try {
                    let idArquivo = '';
                    if (stringUrl.includes('/d/')) {
                        idArquivo = stringUrl.split('/d/')[1].split('/')[0];
                    } else if (stringUrl.includes('id=')) {
                        idArquivo = stringUrl.split('id=')[1].split('&')[0];
                    }
                    if (idArquivo) return `https://drive.google.com/uc?export=view&id=${idArquivo}`;
                } catch (err) { console.error(err); }
            }

            if (stringUrl.startsWith('gs://')) {
                try {
                    const semProtocolo = stringUrl.replace('gs://', '');
                    const primeiraBarra = semProtocolo.indexOf('/');
                    if (primeiraBarra === -1) return stringUrl;
                    const bucket = semProtocolo.substring(0, primeiraBarra);
                    const caminhoArquivo = semProtocolo.substring(primeiraBarra + 1);
                    return `https://firebasestorage.googleapis.com/v1/b/${bucket}/o/${encodeURIComponent(caminhoArquivo)}?alt=media`;
                } catch (e) { console.error(e); }
            }
            return stringUrl;
        }

        function handleImageError(img) {
            img.style.display = 'none';
            const fallback = img.parentNode.querySelector('.fallback-sub');
            if (fallback) fallback.style.setProperty('display', 'flex', 'important');
        }

        async function sincronizarRealtime() {
            const grid = document.getElementById('grid-subcategorias');
            const titulo = document.getElementById('categoria-titulo');
            const desc = document.getElementById('categoria-desc');
            const loading = document.getElementById('loading');

            const db = window.firebase.database();
            const path = window.getAbellaPath ? window.getAbellaPath(`categories/${categoriaSlug}`) : `categories/${categoriaSlug}`;

            // .on('value') garante a atualização imediata em tempo real sem precisar atualizar a página
            db.ref(path).on('value', (snapshot) => {
                if(loading) loading.classList.add('hidden');
                grid.innerHTML = '';

                const catData = snapshot.val();
                if (!catData) {
                    titulo.innerText = "CATEGORIA NÃO ENCONTRADA";
                    return;
                }

                titulo.innerText = (catData.name || categoriaSlug).toUpperCase();
                desc.innerText = catData.description || "Explore nossa coleção completa de produtos premium.";

                // Banner Hero
                const bannerUrl = converterGsUrl(catData.heroImage || catData.hero || '');
                if (bannerUrl) {
                    const bContainer = document.getElementById('banner-container');
                    const bImg = document.getElementById('banner-img');
                    bImg.src = bannerUrl;
                    bContainer.classList.remove('hidden');
                }

                const subs = catData.subcategories || {};
                const subsArray = Object.entries(subs).map(([slug, content]) => ({ slug, ...content }));

                if (subsArray.length === 0) {
                    grid.innerHTML = `<p class="col-span-full text-center text-xs text-zinc-500 py-10">NENHUMA SUBCATEGORIA CADASTRADA.</p>`;
                    return;
                }

                subsArray.forEach(sub => {
                    const imgUrl = converterGsUrl(sub.gridImage || sub.grid || sub.heroImage || sub.hero || '');
                    
                    const card = document.createElement('div');
                    card.className = 'sub-card rounded-2xl overflow-hidden cursor-pointer flex flex-col group';
                    card.onclick = () => abrirProdutos(sub.slug);

                    card.innerHTML = `
                        <div class="w-full aspect-square relative bg-zinc-950 overflow-hidden flex items-center justify-center">
                            <div class="fallback-sub absolute inset-0 flex items-center justify-center">📁</div>
                            <img 
                                src="${imgUrl}" 
                                alt="${sub.name || sub.title || sub.slug}" 
                                class="w-full h-full object-cover relative z-10 group-hover:scale-105 transition-transform duration-700"
                                onerror="handleImageError(this)"
                            >
                            <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-black/20 z-20"></div>
                        </div>
                        <div class="p-4 flex-1 flex flex-col justify-between bg-zinc-900/40 border-t border-zinc-900">
                            <h4 class="font-cinzel text-xs md:text-sm font-bold tracking-wide text-zinc-200 group-hover:text-[#caa85c] transition-colors line-clamp-1">
                                ${(sub.name || sub.title || sub.slug).toUpperCase()}
                            </h4>
                            <span class="text-[9px] uppercase font-mono tracking-widest text-zinc-500 mt-2 block">Ver Coleção →</span>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            });
        }

        function abrirProdutos(subcategoria){
            const cat = encodeURIComponent(categoriaSlug);
            const sub = encodeURIComponent(subcategoria);
            window.location.href = `produtos.html?categoria=${cat}&subcategoria=${sub}`;
        }

        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            categoriaSlug = (params.get('categoria') || params.get('id') || '').toString().trim();

            if (!categoriaSlug) {
                window.location.href = 'index.html';
                return;
            }
            sincronizarRealtime();
        });
    </script>
</body>
</html>
