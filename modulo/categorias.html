    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { background: transparent; color: #eee; font-family: 'Inter', sans-serif; }

        .gold { color: #caa85c; }
        .bg-card { background: #141414; border: 1px solid #222; }
        input, select {
            background: #1a1a1a !important;
            border: 1px solid #333 !important;
            color: #fff !important;
            transition: all 0.2s ease;
        }
        input:focus, select:focus {
            border-color: #caa85c !important;
            outline: none;
            box-shadow: 0 0 0 2px rgba(202, 168, 92, 0.1);
        }
        /* Custom Scrollbar corporativa */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: #caa85c; }

</head>
<body class="p-1 md:p-4">

    <script src="../js/firebase/firebase-config.js"></script>
    <script src="../js/services/categoriaService.js"></script>
    <script src="../js/services/subcategoriaService.js"></script>

    <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <div class="lg:col-span-4 bg-zinc-950 border border-zinc-900 p-6 rounded-2xl h-fit space-y-4 shadow-xl">
            <div class="flex items-center gap-2 border-b border-zinc-900 pb-3">
                <span class="w-1.5 h-4 bg-[#caa85c] rounded-full"></span>
                <h3 id="formTitulo" class="serif text-xs font-bold text-white uppercase tracking-wider">Nova Subcategoria</h3>
            </div>
            
            <form id="formSubcat" class="space-y-4 text-left">
                <input type="hidden" id="subOldSlug">
                
                <div class="space-y-1">
                    <label class="text-[10px] uppercase text-zinc-400 font-bold tracking-wider">Selecione a Categoria Mãe *</label>
                    <select id="selectCatMae" required class="w-full rounded-xl px-3 py-2.5 text-xs">
                        <option value="">Carregando categorias...</option>
                    </select>
                </div>

                <div class="space-y-1">
                    <label class="text-[10px] uppercase text-zinc-400 font-bold tracking-wider">Título da Subcategoria *</label>
                    <input type="text" id="subName" required placeholder="Ex: Chokers ou Argolas" class="w-full rounded-xl px-3 py-2.5 text-xs">
                </div>
                
                <div class="space-y-1">
                    <label class="text-[10px] uppercase text-zinc-400 font-bold tracking-wider">Imagem de Capa (Opcional)</label>
                    <input type="text" id="subImage" placeholder="Ex: images/sub/chokers.jpg" class="w-full rounded-xl px-3 py-2.5 text-xs">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div class="space-y-1">
                        <label class="text-[10px] uppercase text-zinc-400 font-bold tracking-wider">Ordem (Index)</label>
                        <input type="number" id="subOrder" value="0" class="w-full rounded-xl px-3 py-2.5 text-xs">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] uppercase text-zinc-400 font-bold tracking-wider">Estado Visual</label>
                        <select id="subStatus" class="w-full rounded-xl px-3 py-2.5 text-xs">
                            <option value="ativo">Ativo (Visível)</option>
                            <option value="pausado">Pausado (Oculto)</option>
                        </select>
                    </div>
                </div>
                
                <div class="flex gap-2 pt-2">
                    <button type="button" id="btnCancelarEdicao" class="hidden w-1/3 bg-zinc-900 hover:bg-zinc-800 text-zinc-400 font-bold py-2.5 rounded-xl text-xs uppercase tracking-wider transition-all border border-zinc-800">
                        Cancelar
                    </button>
                    <button type="submit" class="flex-1 bg-[#caa85c] hover:bg-[#bda152] text-black font-black py-2.5 rounded-xl text-xs uppercase tracking-wider transition-all shadow-lg shadow-amber-500/5">
                        Gravar Subnó
                    </button>
                </div>
            </form>
        </div>

        <div class="lg:col-span-8 bg-zinc-950 border border-zinc-900 p-6 rounded-2xl flex flex-col shadow-xl">
            <div class="flex justify-between items-center border-b border-zinc-900 pb-3 mb-4">
                <div class="flex items-center gap-2">
                    <span class="w-1.5 h-4 bg-[#caa85c] rounded-full"></span>
                    <h3 class="serif text-xs font-bold text-white uppercase tracking-wider">Estruturas Vinculadas</h3>
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-[10px] uppercase font-mono text-zinc-500">Filtrar Categoria:</span>
                    <select id="filtoCatMae" class="rounded-lg px-2 py-1 text-[11px] bg-zinc-900 border border-zinc-800 text-white outline-none">
                        <option value="">Todas</option>
                    </select>
                </div>
            </div>
            
            <div id="loading" class="text-center py-12 text-zinc-500 text-xs font-mono uppercase tracking-widest animate-pulse">⏳ Sincronizando tabelas com Firebase RTDB...</div>
            <div id="lista-subcategorias" class="space-y-2 overflow-y-auto max-h-[72vh] pr-1"></div>
        </div>
    </div>

    <script>
    (function() {
        'use strict';

        const DOM = {
            form: document.getElementById('formSubcat'),
            titulo: document.getElementById('formTitulo'),
            oldSlug: document.getElementById('subOldSlug'),
            selectCatMae: document.getElementById('selectCatMae'),
            filtoCatMae: document.getElementById('filtoCatMae'),
            name: document.getElementById('subName'),
            image: document.getElementById('subImage'),
            order: document.getElementById('subOrder'),
            status: document.getElementById('subStatus'),
            btnCancelar: document.getElementById('btnCancelarEdicao'),
            loading: document.getElementById('loading'),
            lista: document.getElementById('lista-subcategorias')
        };

        // Usa os services globais injetados das dependências ou aciona fallback seguro se necessário
        const CategoriaServiceBridge = window.categoriaService || {
            async listarTodas() {
                if (window.firebase && firebase.apps.length) {
                    const snap = await firebase.database().ref('abella/categories').once('value');
                    return snap.val() || {};
                }
                return {};
            }
        };

        const SubcategoriaServiceBridge = window.subcategoriaService || {
            async listarPorCategoria(catSlug) {
                if (window.firebase && firebase.apps.length) {
                    const snap = await firebase.database().ref(`abella/categories/${catSlug}/subcategories`).once('value');
                    return snap.val() || {};
                }
                return {};
            },
            async salvar(catSlug, subSlug, payload) {
                if (window.firebase && firebase.apps.length) {
                    await firebase.database().ref(`abella/categories/${catSlug}/subcategories/${subSlug}`).set(payload);
                    return true;
                }
                return false;
            },
            async deletar(catSlug, subSlug) {
                if (window.firebase && firebase.apps.length) {
                    await firebase.database().ref(`abella/categories/${catSlug}/subcategories/${subSlug}`).remove();
                    return true;
                }
                return false;
            }
        };

        let cacheCategorias = {};

        // Executado imediatamente quando o DOM estiver pronto
        document.addEventListener('DOMContentLoaded', async () => {
            configurarEventos();
            await verificarEInicializarFirebase();
        });

        async function verificarEInicializarFirebase() {
            // Pequeno intervalo de segurança para garantir a injeção do firebase-config do editor
            setTimeout(async () => {
                if (typeof firebase === 'undefined' || !firebase.apps.length) {
                    DOM.loading.innerText = "❌ Erro: Configuração do Firebase não encontrada.";
                    return;
                }
                await carregarFiltrosECategorias();
                await sincronizarSubcategoriasModulo();
            }, 300);
        }

        function configurarEventos() {
            DOM.form.addEventListener('submit', executarSalvamentoSubUI);
            DOM.btnCancelar.addEventListener('click', resetarFormularioEstado);
            DOM.filtoCatMae.addEventListener('change', sincronizarSubcategoriasModulo);
        }

        async function carregarFiltrosECategorias() {
            try {
                cacheCategorias = await CategoriaServiceBridge.listarTodas();
                
                DOM.selectCatMae.innerHTML = '<option value="">-- Selecione --</option>';
                DOM.filtoCatMae.innerHTML = '<option value="">Mostrar Todas</option>';

                Object.keys(cacheCategorias).forEach(slug => {
                    const cat = cacheCategorias[slug];
                    const nomeStr = cat.name || slug;

                    const optForm = document.createElement('option');
                    optForm.value = slug;
                    optForm.innerText = nomeStr.toUpperCase();
                    DOM.selectCatMae.appendChild(optForm);

                    const optFiltro = document.createElement('option');
                    optFiltro.value = slug;
                    optFiltro.innerText = nomeStr.toUpperCase();
                    DOM.filtoCatMae.appendChild(optFiltro);
                });
            } catch (err) {
                console.error("Falha ao mapear nós de categorias mães", err);
            }
        }

        async function sincronizarSubcategoriasModulo() {
            DOM.lista.innerHTML = '';
            DOM.loading.classList.remove('hidden');

            const filtroAtivo = DOM.filtoCatMae.value;
            let listaAgrupada = [];

            try {
                if (filtroAtivo) {
                    const subs = await SubcategoriaServiceBridge.listarPorCategoria(filtroAtivo);
                    Object.keys(subs || {}).forEach(subSlug => {
                        listaAgrupada.push({ catSlug: filtroAtivo, subSlug, ...subs[subSlug] });
                    });
                } else {
                    for (const catSlug of Object.keys(cacheCategorias)) {
                        const subs = cacheCategorias[catSlug].subcategories || {};
                        Object.keys(subs).forEach(subSlug => {
                            listaAgrupada.push({ catSlug, subSlug, ...subs[subSlug] });
                        });
                    }
                }

                DOM.loading.classList.add('hidden');

                if (listaAgrupada.length === 0) {
                    DOM.lista.innerHTML = `<p class="text-zinc-600 text-xs italic py-6 text-center font-mono">[Nenhuma subcategoria vinculada encontrada]</p>`;
                    return;
                }

                // Ordenação dinâmica baseada no campo order
                listaAgrupada.sort((a, b) => (parseInt(a.order) || 0) - (parseInt(b.order) || 0));

                listaAgrupada.forEach(item => {
                    const nomeMae = cacheCategorias[item.catSlug]?.name || item.catSlug;
                    const isPausado = item.status === 'pausado';

                    const card = document.createElement('div');
                    card.className = `flex items-center justify-between p-3.5 bg-zinc-900/60 border rounded-xl text-left transition-all hover:bg-zinc-900 ${isPausado ? 'border-amber-900/20 opacity-50 bg-zinc-950/40' : 'border-zinc-900'}`;

                    card.innerHTML = `
                        <div class="min-w-0 flex-1 pr-4">
                            <div class="flex items-center gap-2 mb-0.5">
                                <span class="text-xs font-bold ${isPausado ? 'text-amber-500/80 line-through' : 'text-white'} uppercase tracking-wide truncate">${item.name || item.subSlug}</span>
                                <span class="text-[9px] px-2 py-0.5 bg-zinc-800 text-zinc-400 rounded-md border border-zinc-700/30 uppercase font-mono tracking-wider">${nomeMae}</span>
                                ${isPausado ? '<span class="text-[8px] px-1.5 py-0.2 bg-amber-950/40 text-amber-400 border border-amber-900/40 rounded uppercase font-mono tracking-wider">Pausado</span>' : ''}
                            </div>
                            <p class="text-[9px] text-zinc-500 font-mono truncate">Path Firebase: abella/categories/${item.catSlug}/subcategories/${item.subSlug} | Ordem: ${item.order || 0}</p>
                        </div>
                        <div class="flex gap-2 flex-shrink-0">
                            <button class="btn-editar bg-zinc-900 hover:bg-zinc-800 text-zinc-300 border border-zinc-800 px-3 py-1.5 text-[10px] font-bold rounded-lg transition-all uppercase tracking-wider" 
                                    data-cat="${item.catSlug}" data-sub="${item.subSlug}" data-name="${item.name || ''}" data-image="${item.image || ''}" data-order="${item.order || 0}" data-status="${item.status || 'ativo'}">
                                Editar
                            </button>
                            <button class="btn-alternar font-mono px-2 py-1.5 text-[10px] font-bold rounded-lg transition-all uppercase border ${isPausado ? 'bg-zinc-900 border-zinc-800 text-emerald-400 hover:bg-zinc-800' : 'bg-zinc-900 border-zinc-800 text-amber-500 hover:bg-zinc-800'}" 
                                    data-cat="${item.catSlug}" data-sub="${item.subSlug}" data-status="${item.status || 'ativo'}">
                                ${isPausado ? 'Reativar' : 'Pausar'}
                            </button>
                            <button class="btn-excluir bg-red-950/20 hover:bg-red-950/40 border border-red-900/30 text-red-400 px-3 py-1.5 text-[10px] font-bold rounded-lg transition-all uppercase tracking-wider" 
                                    data-cat="${item.catSlug}" data-sub="${item.subSlug}">
                                Excluir
                            </button>
                        </div>
                    `;

                    DOM.lista.appendChild(card);
                });

                vincularEventosCards();

            } catch (err) {
                console.error("Erro ao sincronizar subcategorias:", err);
                DOM.loading.innerText = "❌ Falha crítica de sincronização com Firebase.";
            }
        }

        function vincularEventosCards() {
            DOM.lista.querySelectorAll('.btn-editar').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const d = e.target.dataset;
                    ativarModoEdicao(d.cat, d.sub, d.name, d.image, d.order, d.status);
                });
            });

            DOM.lista.querySelectorAll('.btn-alternar').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const d = e.target.dataset;
                    await alternarEstadoPausa(d.cat, d.sub, d.status);
                });
            });

            DOM.lista.querySelectorAll('.btn-excluir').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const d = e.target.dataset;
                    executarRemocaoSub(d.cat, d.sub);
                });
            });
        }

        function activarModoEdicao(catSlug, subSlug, name, img, order, status) {
            DOM.oldSlug.value = subSlug;
            DOM.selectCatMae.value = catSlug;
            DOM.name.value = name;
            DOM.image.value = img;
            DOM.order.value = order;
            DOM.status.value = status;
            DOM.titulo.innerText = "Modificar Subcategoria";
            DOM.btnCancelar.classList.remove('hidden');
            DOM.name.focus();
        }

        function resetarFormularioEstado() {
            DOM.form.reset();
            DOM.oldSlug.value = '';
            DOM.titulo.innerText = "Nova Subcategoria";
            DOM.btnCancelar.classList.add('hidden');
        }

        async function executarSalvamentoSubUI(e) {
            e.preventDefault();
            
            const catSlug = DOM.selectCatMae.value;
            if(!catSlug) { alert("Por favor, selecione uma categoria mãe válida."); return; }

            const name = DOM.name.value.trim();
            const slug = name.toLowerCase()
                             .normalize("NFD")
                             .replace(/[\u0300-\u036f]/g, "")
                             .replace(/[^a-z0-9]+/g, "-")
                             .replace(/(^-|-$)/g, "");
            
            const oldSlug = DOM.oldSlug.value;

            const payload = {
                name: name,
                image: DOM.image.value.trim(),
                order: parseInt(DOM.order.value) || 0,
                status: DOM.status.value,
                timestamp: Date.now()
            };

            try {
                if (oldSlug && oldSlug !== slug) {
                    await SubcategoriaServiceBridge.deletar(catSlug, oldSlug);
                }

                await SubcategoriaServiceBridge.salvar(catSlug, slug, payload);
                resetarFormularioEstado();
                await carregarFiltrosECategorias(); 
                await sincronizarSubcategoriasModulo();
            } catch(err) {
                alert("Erro ao salvar subcategoria no Firebase Realtime Database.");
            }
        }

        async function alternarEstadoPausa(catSlug, subSlug, statusAtual) {
            try {
                const snap = await firebase.database().ref(`abella/categories/${catSlug}/subcategories/${subSlug}`).once('value');
                if(snap.exists()) {
                    const dados = snap.val();
                    dados.status = (statusAtual === 'ativo') ? 'pausado' : 'ativo';
                    await SubcategoriaServiceBridge.salvar(catSlug, subSlug, dados);
                    await carregarFiltrosECategorias();
                    await sincronizarSubcategoriasModulo();
                }
            } catch (err) {
                console.error("Erro ao alterar estado de pausa no Firebase:", err);
            }
        }

        async function executarRemocaoSub(catSlug, subSlug) {
            if(confirm("Confirmar a remoção definitiva do nó desta subcategoria no Firebase?")) {
                try {
                    await SubcategoriaServiceBridge.deletar(catSlug, subSlug);
                    await carregarFiferencas();
                    await carregarFiltrosECategorias();
                    await sincronizarSubcategoriasModulo();
                } catch(err) {
                    alert("Erro ao excluir subcategoria.");
                }
            }
        }
    })();
    </script>
</body>

            titulo: document.getElementById('formTitulo'),
            oldSlug: document.getElementById('subOldSlug'),
            selectCatMae: document.getElementById('selectCatMae'),
            filtoCatMae: document.getElementById('filtoCatMae'),
            name: document.getElementById('subName'),
            image: document.getElementById('subImage'),
            order: document.getElementById('subOrder'),
            status: document.getElementById('subStatus'),
            btnCancelar: document.getElementById('btnCancelarEdicao'),
            loading: document.getElementById('loading'),
            lista: document.getElementById('lista-subcategorias')
        };

        // Fallback e mapeamento direto dos caminhos do Firebase RTDB via subcategoriaService
        const CategoriaServiceBridge = window.categoriaService || {
            async listarTodas() {
                if (window.firebase && firebase.apps.length) {
                    const snap = await firebase.database().ref('abella/categories').once('value');
                    return snap.val() || {};
                }
                return {};
            }
        };

        const SubcategoriaServiceBridge = window.subcategoriaService || {
            async listarPorCategoria(catSlug) {
                if (window.firebase && firebase.apps.length) {
                    const snap = await firebase.database().ref(`abella/categories/${catSlug}/subcategories`).once('value');
                    return snap.val() || {};
                }
                return {};
            },
            async salvar(catSlug, subSlug, payload) {
                if (window.firebase && firebase.apps.length) {
                    await firebase.database().ref(`abella/categories/${catSlug}/subcategories/${subSlug}`).set(payload);
                    return true;
                }
                return false;
            },
            async deletar(catSlug, subSlug) {
                if (window.firebase && firebase.apps.length) {
                    await firebase.database().ref(`abella/categories/${catSlug}/subcategories/${subSlug}`).remove();
                    return true;
                }
                return false;
            }
        };

        let cacheCategorias = {};

        document.addEventListener('DOMContentLoaded', async () => {
            configurarEventos();
            await carregarFiltrosECategorias();
            await sincronizarSubcategoriasModulo();
        });

        function configurarEventos() {
            DOM.form.addEventListener('submit', executarSalvamentoSubUI);
            DOM.btnCancelar.addEventListener('click', resetarFormularioEstado);
            DOM.filtoCatMae.addEventListener('change', sincronizarSubcategoriasModulo);
        }

        async function carregarFiltrosECategorias() {
            try {
                cacheCategorias = await CategoriaServiceBridge.listarTodas();
                
                DOM.selectCatMae.innerHTML = '<option value="">-- Selecione --</option>';
                DOM.filtoCatMae.innerHTML = '<option value="">Mostrar Todas</option>';

                Object.keys(cacheCategorias).forEach(slug => {
                    const cat = cacheCategorias[slug];
                    const nomeStr = cat.name || slug;

                    const optForm = document.createElement('option');
                    optForm.value = slug;
                    optForm.innerText = nomeStr.toUpperCase();
                    DOM.selectCatMae.appendChild(optForm);

                    const optFiltro = document.createElement('option');
                    optFiltro.value = slug;
                    optFiltro.innerText = nomeStr.toUpperCase();
                    DOM.filtoCatMae.appendChild(optFiltro);
                });
            } catch (err) {
                console.error("Falha ao mapear nós de categorias mães", err);
            }
        }

        async function sincronizarSubcategoriasModulo() {
            DOM.lista.innerHTML = '';
            DOM.loading.classList.remove('hidden');

            const filtroAtivo = DOM.filtoCatMae.value;
            let listaAgrupada = [];

            try {
                // Se houver filtro específico selecionado
                if (filtroAtivo) {
                    const subs = await SubcategoriaServiceBridge.listarPorCategoria(filtroAtivo);
                    Object.keys(subs || {}).forEach(subSlug => {
                        listaAgrupada.push({ catSlug: filtroAtivo, subSlug, ...subs[subSlug] });
                    });
                } else {
                    // Varre todas as categorias mães mapeando subnós de forma recursiva
                    for (const catSlug of Object.keys(cacheCategorias)) {
                        const subs = cacheCategorias[catSlug].subcategories || {};
                        Object.keys(subs).forEach(subSlug => {
                            listaAgrupada.push({ catSlug, subSlug, ...subs[subSlug] });
                        });
                    }
                }

                DOM.loading.classList.add('hidden');

                if (listaAgrupada.length === 0) {
                    DOM.lista.innerHTML = `<p class="text-zinc-600 text-xs italic py-6 text-center font-mono">[Nenhuma subcategoria vinculada encontrada]</p>`;
                    return;
                }

                // Ordenação dinâmica baseada no campo order
                listaAgrupada.sort((a, b) => (parseInt(a.order) || 0) - (parseInt(b.order) || 0));

                listaAgrupada.forEach(item => {
                    const nomeMae = cacheCategorias[item.catSlug]?.name || item.catSlug;
                    const isPausado = item.status === 'pausado';

                    const card = document.createElement('div');
                    card.className = `flex items-center justify-between p-3.5 bg-zinc-900/60 border rounded-xl text-left transition-all hover:bg-zinc-900 ${isPausado ? 'border-amber-900/20 opacity-50 bg-zinc-950/40' : 'border-zinc-900'}`;

                    card.innerHTML = `
                        <div class="min-w-0 flex-1 pr-4">
                            <div class="flex items-center gap-2 mb-0.5">
                                <span class="text-xs font-bold ${isPausado ? 'text-amber-500/80 line-through' : 'text-white'} uppercase tracking-wide truncate">${item.name || item.subSlug}</span>
                                <span class="text-[9px] px-2 py-0.5 bg-zinc-800 text-zinc-400 rounded-md border border-zinc-700/30 uppercase font-mono tracking-wider">${nomeMae}</span>
                                ${isPausado ? '<span class="text-[8px] px-1.5 py-0.2 bg-amber-950/40 text-amber-400 border border-amber-900/40 rounded uppercase font-mono tracking-wider">Pausado</span>' : ''}
                            </div>
                            <p class="text-[9px] text-zinc-500 font-mono truncate">Path Firebase: abella/categories/${item.catSlug}/subcategories/${item.subSlug} | Ordem: ${item.order || 0}</p>
                        </div>
                        <div class="flex gap-2 flex-shrink-0">
                            <button class="btn-editar bg-zinc-900 hover:bg-zinc-800 text-zinc-300 border border-zinc-800 px-3 py-1.5 text-[10px] font-bold rounded-lg transition-all uppercase tracking-wider" 
                                    data-cat="${item.catSlug}" data-sub="${item.subSlug}" data-name="${item.name || ''}" data-image="${item.image || ''}" data-order="${item.order || 0}" data-status="${item.status || 'ativo'}">
                                Editar
                            </button>
                            <button class="btn-alternar font-mono px-2 py-1.5 text-[10px] font-bold rounded-lg transition-all uppercase border ${isPausado ? 'bg-zinc-900 border-zinc-800 text-emerald-400 hover:bg-zinc-800' : 'bg-zinc-900 border-zinc-800 text-amber-500 hover:bg-zinc-800'}" 
                                    data-cat="${item.catSlug}" data-sub="${item.subSlug}" data-status="${item.status || 'ativo'}">
                                ${isPausado ? 'Reativar' : 'Pausar'}
                            </button>
                            <button class="btn-excluir bg-red-950/20 hover:bg-red-950/40 border border-red-900/30 text-red-400 px-3 py-1.5 text-[10px] font-bold rounded-lg transition-all uppercase tracking-wider" 
                                    data-cat="${item.catSlug}" data-sub="${item.subSlug}">
                                Excluir
                            </button>
                        </div>
                    `;

                    DOM.lista.appendChild(card);
                });

                vincularEventosCards();

            } catch (err) {
                console.error("Erro ao sincronizar subcategorias:", err);
                DOM.loading.innerText = "❌ Falha crítica de sincronização com Firebase.";
            }
        }

        function vincularEventosCards() {
            DOM.lista.querySelectorAll('.btn-editar').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const d = e.target.dataset;
                    ativarModoEdicao(d.cat, d.sub, d.name, d.image, d.order, d.status);
                });
            });

            DOM.lista.querySelectorAll('.btn-alternar').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const d = e.target.dataset;
                    await alternarEstadoPausa(d.cat, d.sub, d.status);
                });
            });

            DOM.lista.querySelectorAll('.btn-excluir').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const d = e.target.dataset;
                    executarRemocaoSub(d.cat, d.sub);
                });
            });
        }

        function ativarModoEdicao(catSlug, subSlug, name, img, order, status) {
            DOM.oldSlug.value = subSlug;
            DOM.selectCatMae.value = catSlug;
            DOM.name.value = name;
            DOM.image.value = img;
            DOM.order.value = order;
            DOM.status.value = status;
            DOM.titulo.innerText = "Modificar Subcategoria";
            DOM.btnCancelar.classList.remove('hidden');
            DOM.name.focus();
        }

        function resetarFormularioEstado() {
            DOM.form.reset();
            DOM.oldSlug.value = '';
            DOM.titulo.innerText = "Nova Subcategoria";
            DOM.btnCancelar.classList.add('hidden');
        }

        async function executarSalvamentoSubUI(e) {
            e.preventDefault();
            
            const catSlug = DOM.selectCatMae.value;
            if(!catSlug) { alert("Por favor, selecione uma categoria mãe válida."); return; }

            const name = DOM.name.value.trim();
            const slug = name.toLowerCase()
                             .normalize("NFD")
                             .replace(/[\u0300-\u036f]/g, "")
                             .replace(/[^a-z0-9]+/g, "-")
                             .replace(/(^-|-$)/g, "");
            
            const oldSlug = DOM.oldSlug.value;

            const payload = {
                name: name,
                image: DOM.image.value.trim(),
                order: parseInt(DOM.order.value) || 0,
                status: DOM.status.value,
                timestamp: Date.now()
            };

            try {
                // Se alterou o nome da subcategoria, limpa o nó antigo para não duplicar dados órfãos
                if (oldSlug && oldSlug !== slug) {
                    await SubcategoriaServiceBridge.deletar(catSlug, oldSlug);
                }

                await SubcategoriaServiceBridge.salvar(catSlug, slug, payload);
                resetarFormularioEstado();
                await carregarFiltrosECategorias(); // Atualiza cache
                await sincronizarSubcategoriasModulo();
            } catch(err) {
                alert("Erro ao salvar subcategoria no Firebase Realtime Database.");
            }
        }

        async function alternarEstadoPausa(catSlug, subSlug, statusAtual) {
            try {
                // Busca estrutura no nó específico
                const snap = await firebase.database().ref(`abella/categories/${catSlug}/subcategories/${subSlug}`).once('value');
                if(snap.exists()) {
                    const dados = snap.val();
                    dados.status = (statusAtual === 'ativo') ? 'pausado' : 'ativo';
                    await SubcategoriaServiceBridge.salvar(catSlug, subSlug, dados);
                    await carregarFiltrosECategorias();
                    await sincronizarSubcategoriasModulo();
                }
            } catch (err) {
                console.error("Erro ao alterar estado de pausa no Firebase:", err);
            }
        }

        async function ejecutarRemocaoSub(catSlug, subSlug) {
            if(confirm("Confirmar a remoção definitiva do nó desta subcategoria no Firebase?")) {
                try {
                    await SubcategoriaServiceBridge.deletar(catSlug, subSlug);
                    await carregarFiltrosECategorias();
                    await sincronizarSubcategoriasModulo();
                } catch(err) {
                    alert("Erro ao excluir subcategoria.");
                }
            }
        }
    })();
    </script>
</body>
</html>
