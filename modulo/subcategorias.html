<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
</head>
<body class="bg-zinc-900 text-zinc-100 p-6 font-sans min-h-screen">

    <div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <div class="md:col-span-1 bg-zinc-950 border border-zinc-800 p-5 rounded-2xl h-fit space-y-4 text-left">
            <h3 class="text-sm font-bold text-white uppercase tracking-wider border-b border-zinc-900 pb-2">Vincular Subcategoria</h3>
            
            <div class="space-y-1">
                <label class="text-[10px] uppercase text-zinc-400 font-bold">Selecione a Categoria Mãe *</label>
                <select id="selectCatMae" onchange="mudarCategoriaMaeFiltro()" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-2.5 text-xs text-white outline-none focus:border-[#caa85c]"></select>
            </div>

            <form id="formSubcat" onsubmit="salvarSubcategoriaUI(event)" class="space-y-4 pt-2">
                <input type="hidden" id="subOldSlug">
                <div class="space-y-1">
                    <label class="text-[10px] uppercase text-zinc-400 font-bold">Nome da Subcategoria *</label>
                    <input type="text" id="subName" required placeholder="Ex: Cravejados" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-2 text-xs outline-none focus:border-[#caa85c]">
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] uppercase text-zinc-400 font-bold">Imagem Opcional (URL)</label>
                    <input type="text" id="subImage" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-2 text-xs outline-none focus:border-[#caa85c]">
                </div>
                <button type="submit" class="w-full bg-[#caa85c] text-black font-black py-2.5 rounded-xl text-xs uppercase tracking-wider transition-all">
                    Gravar Subcategoria
                </button>
            </form>
        </div>

        <div class="md:col-span-2 bg-zinc-950 border border-zinc-800 p-5 rounded-2xl flex flex-col">
            <h3 class="text-sm font-bold text-white uppercase tracking-wider border-b border-zinc-900 pb-2 mb-4 text-left">Subcategorias da Seção</h3>
            <div id="lista-subcategorias" class="space-y-2 text-left text-xs text-zinc-500 italic py-4">Selecione uma categoria mãe para expandir a subárvore.</div>
        </div>
    </div>

    <script src="../js/firebase/firebase-config.js"></script>
    <script src="../js/services/categoriaService.js"></script>
    <script src="../js/services/subcategoriaService.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => { await popularCategoriasMae(); });

        async function popularCategoriasMae() {
            const select = document.getElementById('selectCatMae');
            select.innerHTML = '<option value="" disabled selected>Escolha uma categoria...</option>';
            try {
                const list = await categoriaService.listarTodas();
                Object.keys(list).forEach(key => {
                    select.innerHTML += `<option value="${key}">${list[key].name || key}</option>`;
                });
            } catch(e) { console.error(e); }
        }

        async function mudarCategoriaMaeFiltro() {
            const catSlug = document.getElementById('selectCatMae').value;
            const container = document.getElementById('lista-subcategorias');
            container.innerHTML = '<div class="text-zinc-500 text-xs">⏳ Mapeando subitens...</div>';

            try {
                const subs = await subcategoriaService.obterPorCategoria(catSlug);
                container.innerHTML = '';

                if(!subs || Object.keys(subs).length === 0) {
                    container.innerHTML = '<p class="text-zinc-600 text-xs italic py-2">Nenhuma subcategoria vinculada a esta raiz.</p>';
                    return;
                }

                Object.keys(subs).forEach(subSlug => {
                    const s = subs[subSlug];
                    const div = document.createElement('div');
                    div.className = "flex items-center justify-between p-3 bg-zinc-900 border border-zinc-800 rounded-xl";
                    div.innerHTML = `
                        <div>
                            <span class="text-xs text-white font-bold uppercase">${s.name || subSlug}</span>
                            <p class="text-[9px] text-zinc-500 font-mono">Caminho: /categories/${catSlug}/subcategories/${subSlug}</p>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="editarSubcatUI('${subSlug}', '${s.name || ''}', '${s.image || ''}')" class="bg-zinc-800 hover:bg-zinc-700 px-3 py-1 text-[10px] font-bold rounded-lg transition-all">Editar</button>
                            <button onclick="deletarSubcatUI('${subSlug}')" class="bg-red-950/20 border border-red-900/40 text-red-400 px-3 py-1 text-[10px] font-bold rounded-lg transition-all">Excluir</button>
                        </div>
                    `;
                    container.appendChild(div);
                });
            } catch(e) { container.innerHTML = '❌ Falha ao processar nós internos.'; }
        }

        function editarSubcatUI(slug, name, img) {
            document.getElementById('subOldSlug').value = slug;
            document.getElementById('subName').value = name;
            document.getElementById('subImage').value = img;
        }

        async function salvarSubcategoriaUI(e) {
            e.preventDefault();
            const catSlug = document.getElementById('selectCatMae').value;
            if(!catSlug) { alert("Escolha a categoria antes de salvar."); return; }

            const name = document.getElementById('subName').value.trim();
            const slug = name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-");
            const oldSlug = document.getElementById('subOldSlug').value;

            if(oldSlug && oldSlug !== slug) {
                await subcategoriaService.deletar(catSlug, oldSlug);
            }

            await subcategoriaService.salvar(catSlug, slug, { name: name, image: document.getElementById('subImage').value.trim() });
            document.getElementById('formSubcat').reset();
            document.getElementById('subOldSlug').value = '';
            await mudarCategoriaMaeFiltro();
        }

        async function deletarSubcatUI(subSlug) {
            const catSlug = document.getElementById('selectCatMae').value;
            if(confirm("Deseja deletar permanentemente o vínculo desta subcategoria?")) {
                await subcategoriaService.deletar(catSlug, subSlug);
                await mudarCategoriaMaeFiltro();
            }
        }
    </script>
</body>
</html>
