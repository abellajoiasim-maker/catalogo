<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Produtos • Abella Joias</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { background:#0b0b0b; color:#eee; font-family:'Inter', sans-serif; min-height: 100vh; }
        .serif { font-family:'Cinzel', serif; }
        .gold { color:#caa85c; }
        .bg-card { background:#141414; border:1px solid #2a2a2a; }
        .badge-promo { background: #caa85c; color: #000; font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 12px; }
    </style>
</head>
<body class="pb-12">

    <header class="sticky top-0 bg-black/90 backdrop-blur border-b border-[#222] z-40">
        <div class="max-w-7xl mx-auto p-5 flex justify-between items-center">
            <div>
                <h1 class="serif gold text-lg uppercase tracking-wide">Abella Joias</h1>
                <p id="subtitulo-topo" class="text-[10px] text-gray-400 uppercase tracking-widest">Catálogo de Joias no Bruto</p>
            </div>
            <div class="flex items-center gap-3">
                <a href="index.html" class="text-xs text-gray-400 hover:text-white transition-all">← Categorias</a>
                <a href="carrinho.html" class="bg-zinc-900 border border-zinc-800 hover:border-[#caa85c] px-4 py-2 rounded-xl text-xs font-medium transition-all flex items-center gap-2">
                    🛒 Carrinho (<span id="cart-count" class="gold font-bold">0</span>)
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-6">
        <h2 id="titulo-categoria" class="serif gold text-xl uppercase tracking-wider mb-6 text-left border-b border-zinc-900 pb-3">Carregando produtos...</h2>
        
        <div id="grid-produtos" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6">
            </div>
    </main>

    <div id="modalDetalhes" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-zinc-950 border border-zinc-800 rounded-2xl max-w-lg w-full p-6 relative text-left animate-fade-in">
            <button onclick="fecharModal('modalDetalhes')" class="absolute top-4 right-4 text-zinc-500 hover:text-white text-2xl font-bold">&times;</button>
            
            <div class="flex flex-col md:flex-row gap-5">
                <div class="w-full md:w-44 h-44 bg-black rounded-xl border border-zinc-900 overflow-hidden shrink-0 flex items-center justify-center">
                    <img id="mdFoto" src="" class="w-full h-full object-cover">
                </div>
                <div class="flex-1 space-y-2">
                    <div class="flex items-center gap-2">
                        <span id="mdSku" class="text-[10px] font-mono bg-zinc-900 text-zinc-400 px-2 py-0.5 rounded border border-zinc-800">SKU</span>
                        <div id="mdBadgePromoContainer"></div>
                    </div>
                    <h3 id="mdNome" class="text-white text-base font-bold leading-tight">Nome do Produto</h3>
                    <p id="mdPeso" class="text-xs text-zinc-400 font-mono">⚖️ Peso Médio: 0.00g</p>
                    
                    <div class="bg-black/50 border border-zinc-900 rounded-xl p-3 mt-3 space-y-1 font-mono">
                        <div class="flex justify-between text-xs text-zinc-500">
                            <span>Preço Bruto:</span>
                            <span id="mdPrecoBruto" class="line-through">R$ 0,00</span>
                        </div>
                        <div class="flex justify-between text-sm text-emerald-400 font-bold">
                            <span>À vista no PIX:</span>
                            <span id="mdPrecoPix">R$ 0,00</span>
                        </div>
                        <div class="text-[10px] text-zinc-500 text-right" id="mdParcelas">
                            ou até 6x de R$ 0,00 sem juros
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="mt-6 border-t border-zinc-900 pt-4 flex justify-end gap-2">
                <button onclick="fecharModal('modalDetalhes')" class="px-4 py-2 text-xs text-zinc-400 hover:text-white transition-all">Fechar</button>
                <button id="btnAvancarCompra" class="bg-[#caa85c] hover:bg-[#b5944f] text-black font-black px-6 py-2.5 rounded-xl text-xs uppercase tracking-wider transition-all">
                    Avançar para Compra ➔
                </button>
            </div>
        </div>
    </div>

    <div id="modalCompra" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-zinc-950 border border-zinc-800 rounded-2xl max-w-md w-full p-6 relative text-left">
            <button onclick="fecharModal('modalCompra')" class="absolute top-4 right-4 text-zinc-500 hover:text-white text-2xl font-bold">&times;</button>
            
            <h3 class="serif gold text-sm uppercase tracking-wider mb-4 border-b border-zinc-900 pb-2">Selecione as Quantidades</h3>
            
            <div class="flex gap-4 bg-zinc-900/30 p-3 rounded-xl border border-zinc-900/50 mb-4">
                <img id="mcFoto" src="" class="w-12 h-12 object-cover rounded-lg border border-zinc-800 bg-black">
                <div>
                    <h4 id="mcNome" class="text-white text-xs font-bold truncate w-64">Nome do Produto</h4>
                    <p id="mcPreco" class="gold text-xs font-mono font-bold mt-0.5">R$ 0,00</p>
                </div>
            </div>

            <div id="mcVariacoesContainer" class="space-y-3 max-h-[40vh] overflow-y-auto pr-1">
                </div>

            <div class="mt-6 pt-4 border-t border-zinc-900 flex justify-end gap-2">
                <button onclick="fecharModal('modalCompra')" class="px-4 py-2 text-xs text-zinc-400 hover:text-white transition-all">Cancelar</button>
                <button onclick="executarAdicionarAoCarrinho()" class="bg-emerald-500 hover:bg-emerald-600 text-black font-black px-6 py-2.5 rounded-xl text-xs uppercase tracking-widest transition-all">
                    🛒 Confirmar e Inserir
                </button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDPBZSxW8XjtQmDMUknzAyIlFda51MvMJY",
            databaseURL: "https://catalogo-abella-joias-default-rtdb.firebaseio.com"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Estado Global da Tela
        let configGlobal = { pixDesc: 5, parcelasMax: 6 };
        let ofertasAtivas = {};
        let produtoSelecionadoAtual = null;

        const fM = v => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v || 0);

        document.addEventListener('DOMContentLoaded', async () => {
            atualizarContadorCarrinho();
            await carregarConfiguracoes();
            await carregarOfertas();
            carregarVitrineProdutos();
        });

        async function carregarConfiguracoes() {
            try {
                const snap = await db.ref('abella/settings').once('value');
                if (snap.exists()) {
                    const s = snap.val() || {};
                    configGlobal.pixDesc = parseFloat(s.pix || (s.empresa && s.empresa.pix) || 5);
                    configGlobal.parcelasMax = parseInt(s.parcelas || (s.empresa && s.empresa.parcelas) || 6);
                }
            } catch(e) { console.error("Erro nas configurações:", e); }
        }

        async function carregarOfertas() {
            try {
                const snap = await db.ref('abella/offers').once('value');
                if (snap.exists()) ofertasAtivas = snap.val() || {};
            } catch(e) { console.error("Erro ao carregar ofertas:", e); }
        }

        function carregarVitrineProdutos() {
            const params = new URLSearchParams(window.location.search);
            const catId = params.get('id');
            const subId = params.get('sub');

            if (!catId) {
                document.getElementById('titulo-categoria').innerText = "Categoria não selecionada";
                return;
            }

            // Define o título da categoria mãe no topo
            db.ref(`abella/categories/${catId}/name`).once('value', snap => {
                if (snap.exists()) {
                    document.getElementById('titulo-categoria').innerText = snap.val().toUpperCase();
                }
            });

            db.ref('abella/products').once('value', snap => {
                const grid = document.getElementById('grid-produtos');
                grid.innerHTML = '';
                
                if (!snap.exists()) {
                    grid.innerHTML = '<p class="col-span-full text-zinc-500 italic text-xs">Nenhum produto cadastrado.</p>';
                    return;
                }

                let totalExibidos = 0;

                snap.forEach(child => {
                    const p = child.val();
                    if (p.paused === true || p.paused === "true") return;

                    // Filtros de Categoria Pai e Subcategoria aninhada
                    if (p.category !== catId) return;
                    if (subId && p.subcategory !== subId) return;

                    totalExibidos++;

                    // Verifica regra promocional (Módulo de Ofertas)
                    let possuiDescontoPromocional = false;
                    let porcentagemPromo = 0;
                    
                    if (ofertasAtivas) {
                        Object.values(ofertasAtivas).forEach(oferta => {
                            if (oferta.status === "Ativo") {
                                if (oferta.tipo === "produto" && oferta.escopo === p.sku) {
                                    possuiDescontoPromocional = true;
                                    porcentagemPromo = parseFloat(oferta.valor || 0);
                                } else if (oferta.tipo === "categoria" && oferta.escopo === catId && !possuiDescontoPromocional) {
                                    possuiDescontoPromocional = true;
                                    porcentagemPromo = parseFloat(oferta.valor || 0);
                                }
                            }
                        });
                    }

                    // Se tiver promoção ativa, reduz o preço base da joia bruto
                    let precoBase = parseFloat(p.price || p.precoFinal || 0);
                    if (possuiDescontoPromocional && porcentagemPromo > 0) {
                        precoBase = precoBase * (1 - (porcentagemPromo / 100));
                    }

                    const card = document.createElement('div');
                    card.className = "bg-card rounded-2xl overflow-hidden cursor-pointer hover:border-[#caa85c] transition-all relative flex flex-col justify-between";
                    card.setAttribute('onclick', `abrirModalDetalhes('${child.key}', ${possuiDescontoPromocional}, ${porcentagemPromo})`);

                    const badgePromoHTML = possuiDescontoPromocional 
                        ? `<div class="absolute top-2 right-2 bg-amber-500 text-black text-[9px] font-black uppercase px-2 py-0.5 rounded-full z-10">🔥 -${porcentagemPromo}%</div>` 
                        : '';

                    card.innerHTML = `
                        <div class="aspect-square bg-black overflow-hidden flex items-center justify-center relative border-b border-zinc-900/60">
                            ${badgePromoHTML}
                            <img src="${p.image || p.imagem || 'https://via.placeholder.com/300/141414/caa85c?text=Joia'}" class="w-full h-full object-cover hover:scale-105 transition-all duration-300" onerror="this.src='https://via.placeholder.com/300/141414/caa85c?text=Joia'">
                        </div>
                        <div class="p-3 md:p-4 text-left flex-1 flex flex-col justify-between space-y-2">
                            <div>
                                <p class="text-[9px] font-mono text-zinc-500 tracking-wider uppercase">SKU: ${p.sku}</p>
                                <h3 class="text-white font-medium text-xs md:text-sm line-clamp-2 leading-snug min-h-[36px] mt-0.5">${p.name}</h3>
                            </div>
                            <div class="pt-2 border-t border-zinc-900/40 font-mono">
                                <p class="text-[10px] text-zinc-500">Bruto: <span class="${possuiDescontoPromocional ? 'line-through' : ''}">${fM(parseFloat(p.price || p.precoFinal || 0))}</span></p>
                                <p class="text-white font-bold text-sm mt-0.5">${fM(precoBase)}</p>
                                <p class="text-[9px] text-emerald-500 font-sans mt-0.5">⚡ PIX: ${fM(precoBase * (1 - (configGlobal.pixDesc / 100)))}</p>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });

                if (totalExibidos === 0) {
                    grid.innerHTML = '<p class="col-span-full text-zinc-500 italic text-xs py-8 text-center w-full">Nenhum produto visível nesta categoria no momento.</p>';
                }
            });
        }

        // =========================================================
        // CONTROLE DOS MODAIS E FLUXO DE COMPRA
        // =========================================================
        function abrirModalDetalhes(idKey, possuiPromo, porcentagemPromo) {
            db.ref(`abella/products/${idKey}`).once('value', snap => {
                if (!snap.exists()) return;
                const p = snap.val();
                
                // Salva referência global do que está sendo editado
                produtoSelecionadoAtual = { ...p, idKey: idKey, possuiPromo: possuiPromo, porcentagemPromo: porcentagemPromo };

                let precoOriginal = parseFloat(p.price || p.precoFinal || 0);
                let precoComDescontoOferta = precoOriginal;
                
                if (possuiPromo && porcentagemPromo > 0) {
                    precoComDescontoOferta = precoOriginal * (1 - (porcentagemPromo / 100));
                }

                // Calcula PIX dinâmico das configurações
                let valorPix = precoComDescontoOferta * (1 - (configGlobal.pixDesc / 100));
                let valorParcela = precoComDescontoOferta / configGlobal.parcelasMax;

                // Preenche os campos do Modal 1
                document.getElementById('mdFoto').src = p.image || p.imagem || '';
                document.getElementById('mdSku').innerText = `SKU: ${p.sku}`;
                document.getElementById('mdNome').innerText = p.name;
                document.getElementById('mdPeso').innerText = `⚖️ Peso Médio: ${parseFloat(p.weight || p.peso || 0).toFixed(2)}g`;
                document.getElementById('mdPrecoBruto').innerText = fM(precoOriginal);
                document.getElementById('mdPrecoPix').innerText = `${fM(valorPix)} (-${configGlobal.pixDesc}% no PIX)`;
                document.getElementById('mdParcelas').innerText = `ou em até ${configGlobal.parcelasMax}x de ${fM(valorParcela)} sem juros no cartão`;

                const badgeContainer = document.getElementById('mdBadgePromoContainer');
                badgeContainer.innerHTML = possuiPromo 
                    ? `<span class="bg-amber-500 text-black text-[9px] font-black px-2 py-0.5 rounded-full uppercase">🔥 Oferta -${porcentagemPromo}%</span>` 
                    : '';

                // Prepara o clique do botão de avanço do Modal 1 para chamar o Modal 2
                document.getElementById('btnAvancarCompra').setAttribute('onclick', `abrirModalCompra()`);

                document.getElementById('modalDetalhes').classList.remove('hidden');
            });
        }

        function abrirModalCompra() {
            // Fecha o modal de detalhes e abre o interativo de quantidades
            fecharModal('modalDetalhes');
            
            const p = produtoSelecionadoAtual;
            if (!p) return;

            let precoOriginal = parseFloat(p.price || p.precoFinal || 0);
            let precoComDescontoOferta = p.possuiPromo ? (precoOriginal * (1 - (p.porcentagemPromo / 100))) : precoOriginal;

            document.getElementById('mcFoto').src = p.image || p.imagem || '';
            document.getElementById('mcNome').innerText = p.name;
            document.getElementById('mcPreco').innerText = `${fM(precoComDescontoOferta)} unidade`;

            const containerVariacoes = document.getElementById('mcVariacoesContainer');
            containerVariacoes.innerHTML = '';

            // Inteligência de Detecção de Variações (Aro / Lista / Tamanho)
            const tipoVar = p.variacaoTipo || 'Padrão';
            const opcoesRaw = p.opcoesPersonalizadas || '';

            if ((tipoVar === 'Lista' || tipoVar === 'Aro') && opcoesRaw.trim() !== '') {
                // Separa as variações por vírgula (Ex: 14, 16, 18, 20 ou Sem banho, Com banho)
                const listaOpcoes = opcoesRaw.split(',').map(o => o.trim()).filter(o => o.length > 0);
                
                listaOpcoes.forEach((opcao, idx) => {
                    const row = document.createElement('div');
                    row.className = "flex items-center justify-between p-2.5 bg-zinc-900/50 rounded-xl border border-zinc-900";
                    row.innerHTML = `
                        <span class="text-xs font-bold text-zinc-300 font-mono">Var/Tamanho: <strong class="text-white">${opcao}</strong></span>
                        <div class="flex items-center gap-1">
                            <button type="button" onclick="ajustarQtdInput('input-var-${idx}', -1)" class="w-7 h-7 bg-black hover:bg-zinc-800 border border-zinc-800 text-white rounded-lg flex items-center justify-center font-bold text-xs">-</button>
                            <input type="number" id="input-var-${idx}" data-opcao="${opcao}" value="0" min="0" class="w-12 bg-black text-center font-mono font-bold text-white text-xs border border-zinc-800 rounded-lg py-1 outline-none input-quantidade-item">
                            <button type="button" onclick="ajustarQtdInput('input-var-${idx}', 1)" class="w-7 h-7 bg-black hover:bg-zinc-800 border border-zinc-800 text-white rounded-lg flex items-center justify-center font-bold text-xs">+</button>
                        </div>
                    `;
                    containerVariacoes.appendChild(row);
                });
            } else {
                // Caso não possua variações estruturadas, exibe o seletor único padrão unificado
                const row = document.createElement('div');
                row.className = "flex items-center justify-between p-3 bg-zinc-900/50 rounded-xl border border-zinc-900";
                row.innerHTML = `
                    <span class="text-xs font-bold text-zinc-400">Quantidade Padrão:</span>
                    <div class="flex items-center gap-1">
                        <button type="button" onclick="ajustarQtdInput('input-padrao-unico', -1)" class="w-8 h-8 bg-black hover:bg-zinc-800 border border-zinc-800 text-white rounded-lg flex items-center justify-center font-bold text-sm">-</button>
                        <input type="number" id="input-padrao-unico" data-opcao="" value="1" min="1" class="w-14 bg-black text-center font-mono font-bold text-white text-sm border border-zinc-800 rounded-lg py-1 outline-none input-quantidade-item">
                        <button type="button" onclick="ajustarQtdInput('input-padrao-unico', 1)" class="w-8 h-8 bg-black hover:bg-zinc-800 border border-zinc-800 text-white rounded-lg flex items-center justify-center font-bold text-sm">+</button>
                    </div>
                `;
                containerVariacoes.appendChild(row);
            }

            document.getElementById('modalCompra').classList.remove('hidden');
        }

        function ajustarQtdInput(idInput, delta) {
            const el = document.getElementById(idInput);
            if (!el) return;
            let val = parseInt(el.value) || 0;
            let min = parseInt(el.getAttribute('min')) || 0;
            el.value = Math.max(min, val + delta);
        }

        function fecharModal(idModal) {
            document.getElementById(idModal).classList.add('hidden');
        }

        // =========================================================
        // PERSISTÊNCIA DE SALVAMENTO NO CARRINHO LOCAL
        // =========================================================
        function executarAdicionarAoCarrinho() {
            const p = produtoSelecionadoAtual;
            if (!p) return;

            let carrinho = JSON.parse(localStorage.getItem('carrinho') || '[]');
            let inputs = document.querySelectorAll('.input-quantidade-item');
            let itensAdicionadosCount = 0;

            let precoOriginal = parseFloat(p.price || p.precoFinal || 0);
            let precoComDescontoOferta = p.possuiPromo ? (precoOriginal * (1 - (p.porcentagemPromo / 100))) : precoOriginal;

            inputs.forEach(input => {
                const qtd = parseInt(input.value) || 0;
                if (qtd <= 0) return; // Ignora grades que o cliente deixou zeradas

                const variacaoNome = input.getAttribute('data-opcao') || '';

                // Procura se já existe exatamente essa joia com essa variação no carrinho
                const indexExistente = carrinho.findIndex(item => item.sku === p.sku && item.variacao === variacaoNome);

                if (indexExistente > -1) {
                    carrinho[indexExistente].quantidade += qtd;
                } else {
                    carrinho.push({
                        sku: p.sku,
                        nome: p.name,
                        name: p.name,
                        peso: parseFloat(p.weight || p.peso || 0),
                        weight: parseFloat(p.weight || p.peso || 0),
                        price: precoComDescontoOferta,
                        precoFinal: precoComDescontoOferta,
                        image: p.image || p.imagem || '',
                        imagem: p.image || p.imagem || '',
                        variacao: variacaoNome
                    });
                }
                itensAdicionadosCount++;
            });

            if (itensAdicionadosCount === 0) {
                alert("Por favor, defina a quantidade de pelo menos 1 item antes de inserir.");
                return;
            }

            localStorage.setItem('carrinho', JSON.stringify(carrinho));
            atualizarContadorCarrinho();
            fecharModal('modalCompra');
            
            // Feedback visual rápido de sucesso
            alert("Joia(s) adicionada(s) ao romaneio com sucesso!");
        }

        function atualizarContadorCarrinho() {
            const carrinho = JSON.parse(localStorage.getItem('carrinho') || '[]');
            let totalPecas = 0;
            carrinho.forEach(i => totalPecas += (parseInt(i.quantidade) || 1));
            
            const el = document.getElementById('cart-count');
            if (el) el.innerText = `${totalPecas} pçs`;
        }
    </script>
</body>
</html>
