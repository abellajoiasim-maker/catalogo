<div class="p-6 max-w-7xl mx-auto space-y-6 animate-fade-in">
    <div class="flex flex-col md:flex-row md:items-center md:justify-between border-b border-gray-100 pb-4 gap-4">
        <div>
            <h1 class="text-2xl font-bold text-gray-800 flex items-center gap-2">
                <span>💍</span> Gestão de Produtos Full Master
            </h1>
            <p class="text-sm text-gray-500 mt-1">Navegação otimizada por demanda. Carregamento veloz para catálogos extensos.</p>
        </div>
        <button onclick="abrirModalProduto()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-5 py-2.5 rounded-xl shadow-sm transition-all flex items-center gap-2 text-sm whitespace-nowrap md:self-center">
            <span>➕</span> Cadastrar Joia
        </button>
    </div>

    <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-xs flex flex-col md:flex-row gap-4 items-center justify-between">
        <div class="relative w-full md:max-w-md">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">🔍</span>
            <input type="text" id="buscaProduto" oninput="filtrarLocalmente()" placeholder="Filtrar por nome ou SKU na lista carregada..." class="w-full bg-gray-50 border border-gray-200 rounded-xl pl-10 pr-4 py-2 text-sm text-gray-800 focus:ring-2 focus:ring-emerald-500 focus:bg-white outline-none transition-all">
        </div>
        <div>
            <select id="filtroStatus" onchange="filtrarLocalmente()" class="w-full md:w-auto bg-gray-50 border border-gray-200 rounded-xl px-4 py-2 text-sm text-gray-700 focus:ring-2 focus:ring-emerald-500 outline-none transition-all">
                <option value="">Todos os Status (Ativos/Pausados)</option>
                <option value="ativo">Apenas Ativos</option>
                <option value="pausado">Apenas Pausados</option>
            </select>
        </div>
    </div>

    <div class="space-y-2">
        <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider">Selecione a Categoria para Carregar:</label>
        <div id="abas-categorias" class="flex flex-wrap gap-2 pb-2 border-b border-gray-100">
            <button onclick="mudarCategoriaAtiva('')" id="btn-cat-todas" class="px-4 py-2 text-xs font-bold rounded-xl transition-all shadow-xs bg-emerald-600 text-white">
                📦 TODOS OS PRODUTOS
            </button>
            </div>
    </div>

    <div id="grid-produtos" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        <div class="col-span-full text-center py-12 text-gray-400 font-medium">
            Escolha uma categoria acima para carregar as joias...
        </div>
    </div>

    <div class="flex flex-col items-center justify-center py-4 border-t border-gray-100 gap-2">
        <button id="btnCarregarMais" onclick="carregarProximaPagina()" class="hidden bg-gray-800 hover:bg-gray-900 text-white font-semibold px-6 py-3 rounded-xl shadow-md transition-all text-sm gap-2 items-center">
            <span>🔄</span> Carregar Mais Produtos
        </button>
        <p id="infoPaginacao" class="text-xs text-gray-400 font-medium"></p>
    </div>
</div>

<script>
    // Configurações de paginação
    const CONTROLE_PAGINA = {
        limitePorBloco: 8,       // Quantos produtos puxa por vez
        categoriaAtual: '',      // String vazia = todas
        ultimoIdCarregado: null, // Cursor para saber de onde continuar a próxima query
        fimDosRegistros: false   // Trava para quando o banco esvaziar
    };

    let _PRODUTOS_EXIBIDOS = {}; // Cache local apenas do bloco atual em tela

    (function inicializarModuloProdutosOtimizado() {
        if (typeof db !== "undefined") {
            renderizarAbasCategorias();
            carregarBlocoProdutos(true); // Carga inicial
        } else {
            console.error("Instância do Firebase (db) não encontrada.");
        }
    })();

    // 1. GERA OS BOTÕES DE CATEGORIAS DIRETAMENTE DO SEU BANCO
    function renderizarAbasCategorias() {
        db.ref('categories').once('value', (snapshot) => {
            const dados = snapshot.val();
            const container = document.getElementById('abas-categorias');
            const selectForm = document.getElementById('prodCategoria'); // Para o modal
            if(!container) return;

            if (dados) {
                Object.keys(dados).forEach(id => {
                    const cat = dados[id];
                    const nomeReal = cat.nome || cat.name || id;

                    // Injeta o botão de categoria na barra superior
                    const btnHtml = `
                        <button onclick="mudarCategoriaAtiva('${id}')" id="btn-cat-${id}" class="btn-aba-cat px-4 py-2 text-xs font-bold rounded-xl bg-white border border-gray-200 text-gray-600 hover:bg-gray-50 transition-all shadow-xs">
                            ${nomeReal.toUpperCase()}
                        </button>
                    `;
                    container.insertAdjacentHTML('beforeend', btnHtml);

                    // Alimenta o formulário do modal se ele existir na página
                    if(selectForm) {
                        selectForm.insertAdjacentHTML('beforeend', `<option value="${id}">${nomeReal.toUpperCase()}</option>`);
                    }
                });
            }
        });
    }

    // 2. CONTROLA A TROCA DE ABAS
    function mudarCategoriaAtiva(idCategoria) {
        // Reseta os estilos de todos os botões
        document.querySelectorAll('.btn-aba-cat, #btn-cat-todas').forEach(btn => {
            btn.classList.remove('bg-emerald-600', 'text-white');
            btn.classList.add('bg-white', 'text-gray-600', 'border', 'border-gray-200');
        });

        // Destaca o botão selecionado
        const btnAtivo = idCategoria === '' ? document.getElementById('btn-cat-todas') : document.getElementById(`btn-cat-${idCategoria}`);
        if(btnAtivo) {
            btnAtivo.classList.remove('bg-white', 'text-gray-600', 'border');
            btnAtivo.classList.add('bg-emerald-600', 'text-white');
        }

        // Reseta o cursor de paginação para a nova categoria
        CONTROLE_PAGINA.categoriaAtual = idCategoria;
        carregarBlocoProdutos(true);
    }

    // 3. FAZ A REQUISIÇÃO OTIMIZADA AO FIREBASE (PAGINADA)
    function carregarBlocoProdutos(resetarLista = false) {
        if (resetarLista) {
            _PRODUTOS_EXIBIDOS = {};
            CONTROLE_PAGINA.ultimoIdCarregado = null;
            CONTROLE_PAGINA.fimDosRegistros = false;
            document.getElementById('grid-produtos').innerHTML = '<div class="col-span-full text-center py-12 text-gray-400 font-medium">⏳ Carregando joias por demanda...</div>';
        }

        if (CONTROLE_PAGINA.fimDosRegistros) return;

        // Cria a referência base baseada na escolha da aba
        let consulta = db.ref('products');

        if (CONTROLE_PAGINA.categoriaAtual !== '') {
            // Se tem categoria, filtra na origem por 'category'
            consulta = consulta.orderByChild('category').equalTo(CONTROLE_PAGINA.categoriaAtual);
        } else {
            // Se for geral, ordena pela chave padrão
            consulta = consulta.orderByKey();
        }

        // Se já tiver carregado um bloco, começa a partir do último ID (Cursor)
        if (CONTROLE_PAGINA.ultimoIdCarregado) {
            consulta = consulta.startAt(CONTROLE_PAGINA.ultimoIdCarregado);
        }

        // Pega sempre 1 a mais do que o limite para usar como o ponteiro da próxima página
        consulta.limitToFirst(CONTROLE_PAGINA.limitePorBloco + 1).once('value', (snapshot) => {
            const dados = snapshot.val();
            const btnMais = document.getElementById('btnCarregarMais');
            const infoPag = document.getElementById('infoPaginacao');

            if (!dados) {
                if (resetarLista) {
                    document.getElementById('grid-produtos').innerHTML = '<div class="col-span-full text-center py-12 text-gray-400 font-medium border border-dashed border-gray-200 rounded-2xl bg-white">📦 Nenhuma joia nesta categoria.</div>';
                }
                btnMais.classList.add('hidden');
                infoPag.innerText = "Fim do catálogo.";
                CONTROLE_PAGINA.fimDosRegistros = true;
                return;
            }

            const chaves = Object.keys(dados);
            
            // Se vier menos ou igual ao limite real, significa que o banco acabou
            if (chaves.length <= CONTROLE_PAGINA.limitePorBloco) {
                CONTROLE_PAGINA.fimDosRegistros = true;
                btnMais.classList.add('hidden');
                infoPag.innerText = "Todos os produtos desta categoria foram carregados.";
            } else {
                // Guarda a última chave (o "+1") para ser o início do próximo bloco e remove do render atual
                CONTROLE_PAGINA.ultimoIdCarregado = chaves[chaves.length - 1];
                chaves.pop(); 
                btnMais.classList.remove('hidden');
                btnMais.style.display = 'flex';
                infoPag.innerText = "Clique para exibir mais peças.";
            }

            // Alimenta a nossa lista local acumulativa
            chaves.forEach(id => {
                _PRODUTOS_EXIBIDOS[id] = dados[id];
            });

            renderizarGridOtimizado(_PRODUTOS_EXIBIDOS);
        });
    }

    // 4. CHAMA A PRÓXIMA PÁGINA AO CLICAR NO BOTÃO
    function carregarProximaPagina() {
        carregarBlocoProdutos(false);
    }

    // 5. RENDERIZA EXCLUSIVAMENTE O QUE FOI CARREGADO NA MEMÓRIA
    function renderizarGridOtimizado(produtos) {
        const grid = document.getElementById('grid-produtos');
        if (!grid) return;
        
        grid.innerHTML = '';
        const chaves = Object.keys(produtos);

        chaves.forEach((id) => {
            const prod = produtos[id];
            const estaPausado = prod.paused === true; 
            const fotoPadrao = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="%23ccc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="22" y1="12" x2="18" y2="12"/><line x1="6" y1="12" x2="2" y2="12"/><line x1="12" y1="6" x2="12" y2="2"/><line x1="12" y1="22" x2="12" y2="18"/></svg>';

            const nomeJoia = prod.name || "Joia Sem Nome";
            const imgUrl = prod.image || "";
            const sku = prod.sku || "Sem SKU";
            const peso = prod.weight || prod.peso || "0.00";
            const precoExibicao = parseFloat(prod.price || prod.precoFinal || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

            const card = document.createElement('div');
            card.className = `bg-white rounded-2xl border border-gray-200 overflow-hidden shadow-xs flex flex-col justify-between transition-all ${estaPausado ? 'opacity-60 grayscale' : ''}`;
            
            card.innerHTML = `
                <div>
                    <div class="w-full aspect-square bg-gray-50 relative border-b border-gray-100 overflow-hidden block">
                        <img src="${imgUrl || fotoPadrao}" alt="${nomeJoia}" class="absolute inset-0 w-full h-full object-cover object-center m-0 p-0" onerror="this.src='${fotoPadrao}'">
                        <div class="absolute top-3 left-3 z-10 flex flex-col gap-1 items-start">
                            ${estaPausado ? 
                                '<span class="bg-amber-500 text-white font-bold text-[9px] uppercase px-2 py-0.5 rounded shadow-sm">⏸️ Pausado</span>' : 
                                '<span class="bg-emerald-500 text-white font-bold text-[9px] uppercase px-2 py-0.5 rounded shadow-sm">🟢 Ativo</span>'}
                            <span class="bg-gray-900/80 backdrop-blur-xs text-white font-mono text-[9px] px-2 py-0.5 rounded">Peso: ${peso}g</span>
                        </div>
                    </div>
                    <div class="p-4 space-y-2">
                        <h3 class="font-bold text-gray-800 text-base truncate capitalize" title="${nomeJoia}">${nomeJoia}</h3>
                        <p class="text-[10px] text-gray-400 font-mono -mt-1">SKU: ${sku}</p>
                        <div class="grid grid-cols-2 gap-1 bg-gray-50 p-2 rounded-xl border border-gray-100 text-xs">
                            <div>
                                <span class="block text-[9px] text-gray-400 font-bold uppercase">Categoria</span>
                                <span class="font-semibold text-gray-600 truncate block capitalize">${prod.category || 'Geral'}</span>
                            </div>
                            <div class="border-l border-gray-200 pl-2">
                                <span class="block text-[9px] text-gray-400 font-bold uppercase">Preço</span>
                                <span class="font-bold text-emerald-600">${precoExibicao}</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="grid grid-cols-3 border-t border-gray-100 bg-gray-50 divide-x divide-gray-100 mt-auto">
                    <button onclick="editarProduto('${id}')" class="py-2.5 text-xs font-semibold text-blue-600 hover:bg-blue-50/50 transition-all flex items-center justify-center gap-1">✏️ Editar</button>
                    <button onclick="alternarStatusProduto('${id}', ${estaPausado})" class="py-2.5 text-xs font-semibold ${estaPausado ? 'text-emerald-600 hover:bg-emerald-50/50' : 'text-amber-600 hover:bg-amber-50/50'} transition-all flex items-center justify-center gap-1">${estaPausado ? '▶️ Ativar' : '⏸️ Pausar'}</button>
                    <button onclick="deletarProduto('${id}')" class="py-2.5 text-xs font-semibold text-rose-600 hover:bg-rose-50/50 transition-all flex items-center justify-center gap-1">🗑️ Excluir</button>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    // 6. FILTRAGEM DENTRO DO BLOCO QUE JÁ FOI BAIXADO
    function filtrarLocalmente() {
        const termo = document.getElementById('buscaProduto').value.toLowerCase().trim();
        const status = document.getElementById('filtroStatus').value;

        let filtrados = {};

        Object.keys(_PRODUTOS_EXIBIDOS).forEach(id => {
            const prod = _PRODUTOS_EXIBIDOS[id];
            const nomeMatches = (prod.name || "").toLowerCase().includes(termo);
            const skuMatches = (prod.sku || "").toLowerCase().includes(termo);
            const statusMatches = !status || (status === 'pausado' && prod.paused === true) || (status === 'ativo' && !prod.paused);

            if ((nomeMatches || skuMatches) && statusMatches) {
                filtrados[id] = prod;
            }
        });

        renderizarGridOtimizado(filtrados);
    }

    // AS DEMAIS FUNÇÕES DE SALVAR, EDITAR E EXCLUIR CONTINUAM EXATAMENTE IGUAIS...
</script>
