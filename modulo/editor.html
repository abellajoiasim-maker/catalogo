<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Super Editor V7 • Gestão Avançada</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>

  <script src="../js/firebase/firebase-config.js"></script>

  <style>
    .input-dark {
      background-color: rgb(24 24 27);
      border: 1px solid rgb(39 39 42);
      color: white;
      border-radius: 0.5rem;
      padding: 0.75rem;
      width: 100%;
      margin-bottom: 0.5rem;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #09090b;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #27272a;
      border-radius: 3px;
    }
  </style>
</head>
<body class="bg-black text-zinc-100 min-h-screen font-sans antialiased">

  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    
    <header class="flex flex-col md:flex-row md:items-center md:justify-between pb-6 border-b border-zinc-900 gap-4 mb-8">
      <div>
        <h1 class="text-2xl font-black tracking-wider text-white">PAINEL ADMINISTRATIVO</h1>
        <p class="text-xs text-zinc-500 mt-1 uppercase tracking-widest">Controlo de Inventário e Catálogo Geral</p>
      </div>

      <div class="flex items-center gap-3 w-full sm:w-auto md:min-w-[320px] justify-end">
        <button id="btnCriarNovo" class="flex-1 sm:flex-none whitespace-nowrap min-w-[130px] px-4 py-2.5 bg-[#caa85c] text-black rounded-xl text-xs font-bold hover:bg-opacity-90 transition-all shadow-lg shadow-[#caa85c]/10">
          ➕ Criar Item
        </button>
        <button id="btnRefresh" class="flex-1 sm:flex-none whitespace-nowrap min-w-[140px] px-4 py-2.5 bg-zinc-900 border border-zinc-800 text-zinc-300 rounded-xl text-xs font-bold hover:bg-zinc-800 transition-all">
          🔄 Sincronizar Vitrine
        </button>
      </div>
    </header>

    <div class="mb-6 bg-zinc-950 border border-zinc-900 p-4 rounded-2xl flex flex-col sm:flex-row gap-3">
      <div class="relative flex-1">
        <input type="text" id="inputBusca" placeholder="Pesquise por nome, referência (REF), código..." class="w-full bg-zinc-900 border border-zinc-800 text-white rounded-xl py-2.5 pl-4 pr-10 text-sm outline-none focus:border-[#caa85c] transition-colors">
      </div>
    </div>

    <nav class="flex gap-2 p-1.5 bg-zinc-950 border border-zinc-900 rounded-2xl mb-6 max-w-md">
      <button data-tab="produtos" class="tab-btn active flex-1 py-2.5 text-center text-xs font-bold rounded-xl bg-[#caa85c] text-black transition-all">
        📦 Produtos
      </button>
      <button data-tab="categorias" class="tab-btn flex-1 py-2.5 text-center text-xs font-bold rounded-xl text-zinc-400 hover:text-zinc-200 transition-all">
        📁 Categorias
      </button>
      <button data-tab="subcategorias" class="tab-btn flex-1 py-2.5 text-center text-xs font-bold rounded-xl text-zinc-400 hover:text-zinc-200 transition-all">
        🌿 Subcategorias
      </button>
    </nav>

    <main>
      <section id="tab-produtos" class="tab-content">
        <div id="lista-produtos-container" class="space-y-2">
          <div class="p-8 text-center text-zinc-600 text-sm">A carregar catálogo de joias...</div>
        </div>
      </section>

      <section id="tab-categorias" class="tab-content hidden">
        <div id="lista-categorias-container" class="space-y-2">
          <div class="p-8 text-center text-zinc-600 text-sm">A carregar categorias...</div>
        </div>
      </section>

      <section id="tab-subcategorias" class="tab-content hidden">
        <div id="lista-subcategorias-container" class="space-y-2">
          <div class="p-8 text-center text-zinc-600 text-sm">A carregar subcategorias...</div>
        </div>
      </section>
    </main>

  </div>

  <script type="module" src="./js/editorApp.js"></script>

</body>
</html>
