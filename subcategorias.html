<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta charset="UTF-8">

    <title>Subcategorias • Abella Joias</title>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        http-equiv="Cache-Control"
        content="no-cache, no-store, must-revalidate">

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FIREBASE -->

    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

    <!-- FONTES -->

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        :root{

            --gold:#caa85c;
            --bg:#050505;
            --card:#101010;
            --line:#1f1f1f;

        }

        html{
            scroll-behavior:smooth;
        }

        body{

            background:
                radial-gradient(circle at top,#171717 0%,#050505 45%);

            color:white;

            font-family:'Inter',sans-serif;

            min-height:100vh;

            overflow-x:hidden;

        }

        .serif{
            font-family:'Cinzel',serif;
        }

        .gold{
            color:var(--gold);
        }

        .glass{

            background:rgba(18,18,18,.92);

            backdrop-filter:blur(18px);

            border:1px solid rgba(255,255,255,.06);

        }

        .hover-lift{
            transition:.35s ease;
        }

        .hover-lift:hover{

            transform:translateY(-6px);

            border-color:rgba(202,168,92,.4);

        }

        .hero-glow{

            position:absolute;

            width:600px;
            height:600px;

            background:
                radial-gradient(
                    circle,
                    var(--gold) 0%,
                    transparent 70%
                );

            opacity:.06;

            filter:blur(80px);

            pointer-events:none;

        }

        .scrollbar::-webkit-scrollbar{
            width:6px;
        }

        .scrollbar::-webkit-scrollbar-thumb{
            background:#333;
            border-radius:20px;
        }

        .fade-in{
            animation:fade .4s ease forwards;
        }

        @keyframes fade{

            from{
                opacity:0;
                transform:translateY(12px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }

        }

    </style>

</head>

<body>

    <!-- GLOW -->

    <div class="hero-glow top-[-200px] left-[-200px]"></div>

    <div class="hero-glow bottom-[-200px] right-[-200px]"></div>

    <!-- HEADER -->

    <header class="sticky top-0 z-50 border-b border-white/5 bg-black/70 backdrop-blur-2xl">

        <div class="max-w-7xl mx-auto px-4 md:px-8 h-20 flex items-center justify-between gap-4">

            <!-- BRAND -->

            <a
                href="index.html"
                class="flex items-center gap-4">

                <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-[#caa85c] to-[#8b6a2b] flex items-center justify-center text-black font-black text-xl">
                    A
                </div>

                <div>

                    <h1 class="serif gold text-lg md:text-2xl uppercase tracking-[0.2em]">
                        Abella Joias
                    </h1>

                    <p class="text-[10px] uppercase tracking-[0.3em] text-zinc-500 mt-1">
                        Catálogo Premium
                    </p>

                </div>

            </a>

            <!-- ACTIONS -->

            <div class="flex items-center gap-3">

                <a
                    href="index.html"
                    class="hidden md:flex h-12 px-6 rounded-2xl glass items-center justify-center text-xs font-black uppercase tracking-[0.2em] hover:border-[#caa85c] transition-all">

                    ← Categorias

                </a>

                <a
                    href="carrinho.html"
                    class="relative h-12 px-6 rounded-2xl bg-[#caa85c] text-black flex items-center justify-center text-xs font-black uppercase tracking-[0.2em]">

                    🛒 Carrinho

                    <span
                        id="cartCount"
                        class="ml-3 bg-black text-white rounded-full min-w-[24px] h-6 px-2 flex items-center justify-center text-[10px]">

                        0

                    </span>

                </a>

            </div>

        </div>

    </header>

    <!-- HERO -->

    <section class="relative overflow-hidden">

        <div class="max-w-7xl mx-auto px-4 md:px-8 py-16 md:py-24">

            <div class="max-w-4xl">

                <p class="gold uppercase tracking-[0.35em] text-xs font-black">
                    Categoria Premium
                </p>

                <h2
                    id="categoriaNome"
                    class="serif text-5xl md:text-7xl font-black leading-none mt-5">

                    Carregando...

                </h2>

                <p
                    id="categoriaDescricao"
                    class="text-zinc-400 text-lg leading-relaxed mt-8 max-w-2xl">

                    Explore as linhas exclusivas da coleção premium Abella Joias.

                </p>

            </div>

        </div>

    </section>

    <!-- LOADING -->

    <div
        id="loading"
        class="max-w-7xl mx-auto px-4 md:px-8 pb-12">

        <div class="glass rounded-[2rem] p-16 text-center">

            <div class="w-16 h-16 border-4 border-zinc-800 border-t-[#caa85c] rounded-full animate-spin mx-auto"></div>

            <p class="text-zinc-500 uppercase tracking-[0.3em] text-xs font-black mt-8">

                Carregando Subcategorias

            </p>

        </div>

    </div>

    <!-- GRID -->

    <main
        id="gridSubcategorias"
        class="max-w-7xl mx-auto px-4 md:px-8 pb-20 hidden">

    </main>

    <!-- FIREBASE CONFIG -->

    <script src="js/firebase/firebase-config.js"></script>

    <!-- CARRINHO -->

    <script src="js/services/carrinhoService.js"></script>

    <script>

        // ==========================================================
        // FIREBASE
        // ==========================================================

        const db =
            firebase.database();

        // ==========================================================
        // STATE
        // ==========================================================

        let categoriaSlug =
            '';

        let categoriaAtual =
            null;

        // ==========================================================
        // INIT
        // ==========================================================

        document.addEventListener(
            'DOMContentLoaded',
            async () => {

                try{

                    atualizarCarrinho();

                    const params =
                        new URLSearchParams(
                            window.location.search
                        );

                    categoriaSlug =
                        (
                            params.get('categoria') ||
                            params.get('id') ||
                            ''
                        )
                        .toString()
                        .trim();

                    if(!categoriaSlug){

                        console.error(
                            'Categoria não informada.'
                        );

                        window.location.href =
                            'index.html';

                        return;

                    }

                    await carregarCategoria();

                }catch(error){

                    console.error(
                        'Erro INIT:',
                        error
                    );

                    mostrarErro(
                        'Erro ao iniciar página.'
                    );

                }

            }
        );

        // ==========================================================
        // CARRINHO
        // ==========================================================

        function atualizarCarrinho(){

            try{

                if(
                    window.carrinhoService &&
                    typeof carrinhoService.getResumo === 'function'
                ){

                    const resumo =
                        carrinhoService.getResumo();

                    document.getElementById(
                        'cartCount'
                    ).innerText =
                        resumo.totalPecas || 0;

                    return;

                }

                // FALLBACK LEGADO

                const cart =
                    JSON.parse(
                        localStorage.getItem(
                            'abella_carrinho'
                        ) || '[]'
                    );

                const total =
                    cart.reduce(
                        (acc,item)=>
                            acc + (
                                parseInt(item.quantidade) || 0
                            ),
                        0
                    );

                document.getElementById(
                    'cartCount'
                ).innerText =
                    total;

            }catch(error){

                console.error(
                    'Erro atualizarCarrinho:',
                    error
                );

                document.getElementById(
                    'cartCount'
                ).innerText =
                    '0';

            }

        }

        // ==========================================================
        // STORAGE IMAGE
        // ==========================================================

        function resolverImagemFirebase(url){

            try{

                if(!url){

                    return 'https://via.placeholder.com/1200x1200/111111/caa85c?text=ABELLA';

                }

                url =
                    String(url).trim();

                if(
                    url.startsWith('http://') ||
                    url.startsWith('https://')
                ){

                    return url;

                }

                if(url.startsWith('gs://')){

                    const semGs =
                        url.replace(
                            'gs://',
                            ''
                        );

                    const primeiraBarra =
                        semGs.indexOf('/');

                    if(primeiraBarra === -1){

                        return '';

                    }

                    const bucket =
                        semGs.substring(
                            0,
                            primeiraBarra
                        );

                    const caminho =
                        semGs.substring(
                            primeiraBarra + 1
                        );

                    return `https://firebasestorage.googleapis.com/v0/b/${bucket}/o/${encodeURIComponent(caminho)}?alt=media`;

                }

                return url;

            }catch(error){

                console.error(
                    'Erro imagem:',
                    error
                );

                return 'https://via.placeholder.com/1200x1200/111111/caa85c?text=ABELLA';

            }

        }

        // ==========================================================
        // CARREGAR CATEGORIA
        // ==========================================================

        async function carregarCategoria(){

            try{

                console.log(
                    'Carregando categoria:',
                    categoriaSlug
                );

                // ======================================================
                // BUSCA DIRETA
                // ======================================================

                let snap =
                    await db
                    .ref(
                        `abella/categories/${categoriaSlug}`
                    )
                    .once('value');

                // ======================================================
                // FALLBACK categories
                // ======================================================

                if(!snap.exists()){

                    snap =
                        await db
                        .ref('categories')
                        .child(categoriaSlug)
                        .once('value');

                }

                // ======================================================
                // FALLBACK abella/categories LISTA
                // ======================================================

                if(!snap.exists()){

                    const allSnap =
                        await db
                        .ref('abella/categories')
                        .once('value');

                    const all =
                        allSnap.val() || {};

                    const found =
                        Object.entries(all)
                        .find(([key]) => {

                            return (
                                key.toLowerCase() ===
                                categoriaSlug.toLowerCase()
                            );

                        });

                    if(found){

                        categoriaAtual =
                            found[1];

                    }

                }else{

                    categoriaAtual =
                        snap.val();

                }

                if(!categoriaAtual){

                    console.error(
                        'Categoria não encontrada:',
                        categoriaSlug
                    );

                    mostrarErro(
                        'Categoria não encontrada.'
                    );

                    return;

                }

                console.log(
                    'Categoria carregada:',
                    categoriaAtual
                );

                preencherHero();

                const subcategorias =
                    categoriaAtual.subcategories ||
                    categoriaAtual.subcategorias ||
                    {};

                const listaSubcategorias =
                    Object.entries(subcategorias);

                // ======================================================
                // SEM SUBCATEGORIAS
                // ======================================================

                if(listaSubcategorias.length === 0){

                    window.location.href =
                        `produtos.html?categoria=${encodeURIComponent(categoriaSlug)}`;

                    return;

                }

                renderizarSubcategorias(
                    listaSubcategorias
                );

            }catch(error){

                console.error(
                    'Erro carregarCategoria:',
                    error
                );

                mostrarErro(
                    'Erro ao carregar categoria.'
                );

            }

        }

        // ==========================================================
        // HERO
        // ==========================================================

        function preencherHero(){

            document.getElementById(
                'categoriaNome'
            ).innerText =
                categoriaAtual.name ||
                categoriaAtual.nome ||
                categoriaSlug;

            document.getElementById(
                'categoriaDescricao'
            ).innerText =
                categoriaAtual.description ||
                categoriaAtual.descricao ||
                'Explore as linhas exclusivas da coleção premium Abella Joias.';

        }

        // ==========================================================
        // RENDER
        // ==========================================================

        function renderizarSubcategorias(lista){

            const grid =
                document.getElementById(
                    'gridSubcategorias'
                );

            const loading =
                document.getElementById(
                    'loading'
                );

            loading.classList.add(
                'hidden'
            );

            grid.classList.remove(
                'hidden'
            );

            if(!lista.length){

                grid.innerHTML = `

                    <div class="glass rounded-[2rem] p-12 text-center">

                        <div class="text-6xl mb-6">
                            💎
                        </div>

                        <h2 class="text-3xl font-black">
                            Nenhuma subcategoria encontrada
                        </h2>

                    </div>

                `;

                return;

            }

            grid.innerHTML = `

                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 w-full fade-in">

                    ${lista.map(([slug,sub]) => {

                       const image =
    ImageHelper.obterImagem(sub);

                        return `

                            <div
                                onclick="abrirProdutos('${slug}')"
                                class="glass rounded-[2rem] overflow-hidden cursor-pointer hover-lift group border border-white/5">

                                <!-- IMAGE -->

                                <div class="aspect-square overflow-hidden relative bg-black">

                                    <img
                                        src="${image}"
                                        alt="${sub.name || slug}"
                                        class="w-full h-full object-cover group-hover:scale-105 transition-all duration-700"
                                        loading="lazy"
                                        onerror="this.src='https://via.placeholder.com/1200x1200/111111/caa85c?text=ABELLA'">

                                    <div class="absolute inset-0 bg-gradient-to-t from-black via-black/10 to-transparent"></div>

                                    <div class="absolute top-5 left-5">

                                        <div class="bg-black/70 border border-white/10 backdrop-blur-xl rounded-full px-4 py-2 text-[10px] uppercase tracking-[0.25em] font-black">

                                            Subcategoria

                                        </div>

                                    </div>

                                </div>

                                <!-- CONTENT -->

                                <div class="p-6">

                                    <div class="flex items-center justify-between gap-4">

                                        <div>

                                            <h3 class="text-2xl font-black leading-tight">

                                                ${sub.name || sub.nome || slug}

                                            </h3>

                                            <p class="text-zinc-500 text-sm mt-3 leading-relaxed">

                                                Clique para explorar os produtos premium desta coleção.

                                            </p>

                                        </div>

                                        <div class="w-14 h-14 rounded-2xl bg-[#caa85c] text-black flex items-center justify-center font-black text-xl shrink-0">

                                            →

                                        </div>

                                    </div>

                                </div>

                            </div>

                        `;

                    }).join('')}

                </div>

            `;

        }

        // ==========================================================
        // ERRO
        // ==========================================================

        function mostrarErro(texto){

            const loading =
                document.getElementById(
                    'loading'
                );

            loading.innerHTML = `

                <div class="glass rounded-[2rem] p-16 text-center border border-red-500/20">

                    <div class="text-6xl mb-6">
                        ⚠
                    </div>

                    <h2 class="text-3xl font-black">
                        ${texto}
                    </h2>

                    <button
                        onclick="window.location.href='index.html'"
                        class="mt-8 h-14 px-8 rounded-2xl bg-[#caa85c] text-black font-black uppercase tracking-[0.2em]">

                        Voltar

                    </button>

                </div>

            `;

        }

        // ==========================================================
        // OPEN PRODUCTS
        // ==========================================================

        function abrirProdutos(subcategoria){

            const categoria =
                encodeURIComponent(
                    categoriaSlug
                );

            const sub =
                encodeURIComponent(
                    subcategoria
                );

            window.location.href =
                `produtos.html?categoria=${categoria}&subcategoria=${sub}`;

        }

        // ==========================================================
        // EVENTS
        // ==========================================================

        window.addEventListener(
            'carrinhoAtualizado',
            atualizarCarrinho
        );

        // ==========================================================
        // GLOBAL
        // ==========================================================

        window.abrirProdutos =
            abrirProdutos;

    </script>

</body>
</html>
