<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
</head>
<body class="bg-zinc-900 text-zinc-100 p-6 font-sans min-h-screen">

    <div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <div class="md:col-span-1 bg-zinc-950 border border-zinc-800 p-5 rounded-2xl h-fit space-y-4 text-left">
            <h3 id="formTitulo" class="text-sm font-bold text-white uppercase tracking-wider border-b border-zinc-900 pb-2">Cadastrar Parceiro Galvânica</h3>
            <form id="formGalv" onsubmit="salvarGalvanicaUI(event)" class="space-y-4">
                <input type="hidden" id="galvId">
                <div class="space-y-1">
                    <label class="text-[10px] uppercase text-zinc-400 font-bold">Razão Social / Nome Fantasia *</label>
                    <input type="text" id="galvNome" required placeholder="Ex: Galvânica Limeira Gold" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-2 text-xs outline-none focus:border-[#caa85c]">
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] uppercase text-zinc-400 font-bold">WhatsApp / Telefone Comercial *</label>
                    <input type="tel" id="galvWhats" required placeholder="19988207658" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-2 text-xs outline-none focus:border-[#caa85c]">
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] uppercase text-zinc-400 font-bold">Endereço de Entrega (Limeira) *</label>
                    <input type="text" id="galvEnd" required placeholder="Av. Industrial, 450 - Distrito" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-2 text-xs outline-none focus:border-[#caa85c]">
                </div>
                <button type="submit" class="w-full bg-[#caa85c] text-black font-black py-2.5 rounded-xl text-xs uppercase tracking-wider transition-all">
                    Salvar Parceiro Logístico
                </button>
            </form>
        </div>

        <div class="md:col-span-2 bg-zinc-950 border border-zinc-800 p-5 rounded-2xl flex flex-col">
            <h3 class="text-sm font-bold text-white uppercase tracking-wider border-b border-zinc-900 pb-2 mb-4 text-left">Galvânicas Credenciadas</h3>
            <div id="loading" class="text-center py-6 text-zinc-500 text-xs uppercase tracking-widest">⏳ Carregando dados...</div>
            <div id="lista-galvanicas" class="space-y-2 text-left"></div>
        </div>
    </div>

    <script src="../js/firebase/firebase-config.js"></script>
    <script src="../js/services/galvanicaService.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => { carregarGalvanicasUI(); });

        async function carregarGalvanicasUI() {
            const container = document.getElementById('lista-galvanicas');
            const loading = document.getElementById('loading');
            container.innerHTML = '';
            loading.classList.remove('hidden');

            try {
                const list = await galvanicaService.listarTodas();
                loading.classList.add('hidden');

                const keys = Object.keys(list);
                if(keys.length === 0) {
                    container.innerHTML = '<p class="text-zinc-600 text-xs italic py-4">Nenhuma galvânica credenciada no sistema.</p>';
                    return;
                }

                keys.forEach(id => {
                    const g = list[id];
                    const div = document.createElement('div');
                    div.className = "p-3 bg-zinc-900 border border-zinc-800 rounded-xl flex justify-between items-center";
                    div.innerHTML = `
                        <div>
                            <span class="text-xs text-white font-bold uppercase">${g.nome}</span>
                            <p class="text-[9px] text-zinc-500 font-mono">📍 Endereço: ${g.endereco} | Tel: ${g.whatsapp}</p>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="editarGalvUI('${id}','${g.nome}','${g.whatsapp}','${g.endereco}')" class="bg-zinc-800 hover:bg-zinc-700 px-3 py-1 text-[10px] font-bold rounded-lg transition-all">Editar</button>
                            <button onclick="deletarGalvUI('${id}')" class="bg-red-950/20 border border-red-900/40 text-red-400 px-3 py-1 text-[10px] font-bold rounded-lg transition-all">Excluir</button>
                        </div>
                    `;
                    container.appendChild(div);
                });
            } catch(e) { loading.innerText = "❌ Falha ao processar tabela de parceiros."; }
        }

        function editarGalvUI(id, nome, whats, endereco) {
            document.getElementById('galvId').value = id;
            document.getElementById('galvNome').value = nome;
            document.getElementById('galvWhats').value = whats;
            document.getElementById('galvEnd').value = endereco;
            document.getElementById('formTitulo').innerText = "Modificar Parceiro Galvânica";
        }

        async function salvarGalvanicaUI(e) {
            e.preventDefault();
            const payload = {
                nome: document.getElementById('galvNome').value.trim(),
                whatsapp: document.getElementById('galvWhats').value.trim().replace(/\D/g, ''),
                endereco: document.getElementById('galvEnd').value.trim(),
                active: true
            };

            await galvanicaService.salvar(document.getElementById('galvId').value, payload);
            document.getElementById('formGalv').reset();
            document.getElementById('galvId').value = '';
            document.getElementById('formTitulo').innerText = "Cadastrar Parceiro Galvânica";
            await carregarGalvanicasUI();
        }

        async function deletarGalvUI(id) {
            if(confirm("Deseja expurgar esta galvânica do mapa de frete integrado?")) {
                await galvanicaService.deletar(id);
                await carregarGalvanicasUI();
            }
        }
    </script>
</body>
</html>
