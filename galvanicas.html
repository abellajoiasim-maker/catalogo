<div class="p-6 max-w-7xl mx-auto space-y-6 animate-fade-in">
    <div class="flex flex-col md:flex-row md:items-center md:justify-between border-b border-gray-100 pb-4 gap-4">
        <div>
            <h1 class="text-2xl font-bold text-gray-800 flex items-center gap-2">
                <span>🚚</span> Galvânicas Parceiras & Logística
            </h1>
            <p class="text-sm text-gray-500 mt-1">Gerencie os parceiros de banho em Limeira e visualize os banners e selos ativos no catálogo.</p>
        </div>
        <button onclick="abrirModalGalvanica()" class="bg-gray-900 hover:bg-gray-800 text-white font-medium px-5 py-2.5 rounded-xl shadow-sm transition-all flex items-center gap-2 text-sm whitespace-nowrap md:self-center">
            <span>➕</span> Cadastrar Nova Galvânica
        </button>
    </div>

    <div class="space-y-3">
        <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider font-mono">Empresas Parceiras Cadastradas</h3>
        <div id="grid-galvanicas" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full text-center py-12 text-gray-400 font-medium">
                ⏳ Buscando parceiros logísticos no Firebase...
            </div>
        </div>
    </div>
</div>

<div id="modalGalvanica" class="hidden fixed inset-0 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4 z-50 animate-fade-in overflow-y-auto">
    <div class="bg-white rounded-2xl max-w-xl w-full p-6 shadow-xl space-y-4 relative my-8">
        <div class="flex items-center justify-between border-b border-gray-100 pb-3">
            <h3 id="modalGalvanicaTitulo" class="text-base font-bold text-gray-800">Nova Galvânica Parceira</h3>
            <button onclick="fecharModalGalvanica()" class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
        </div>
        
        <input type="hidden" id="galvanicaId">

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Nome da Galvânica</label>
                <input type="text" id="galvanicaNome" placeholder="Ex: Franco Galvânica" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2 text-xs text-gray-800 focus:ring-2 focus:ring-amber-500 outline-none">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Selo / Status Visual</label>
                <input type="text" id="galvanicaSelo" placeholder="Ex: PARCEIRO" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2 text-xs text-gray-800 focus:ring-2 focus:ring-amber-500 outline-none uppercase font-bold">
            </div>

            <div class="sm:col-span-2">
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Descrição Comercial / Especialidades</label>
                <input type="text" id="galvanicaDescricao" placeholder="Ex: Mais de 20 anos de tradição em Ouro, Prata e Ródio." class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2 text-xs text-gray-800 focus:ring-2 focus:ring-amber-500 outline-none">
            </div>

            <div class="sm:col-span-2">
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Endereço de Entrega</label>
                <input type="text" id="galvanicaEndereco" placeholder="Rua, Número - Bairro, Limeira" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2 text-xs text-gray-800 focus:ring-2 focus:ring-amber-500 outline-none">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Telefone Fixo / Comercial</label>
                <input type="text" id="galvanicaTelefone" placeholder="(19) 3451-6246" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2 text-xs text-gray-800 focus:ring-2 focus:ring-amber-500 outline-none">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">WhatsApp (Apenas Números com DDD)</label>
                <input type="text" id="galvanicaWhatsapp" placeholder="Ex: 5519984202600" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2 text-xs text-gray-800 focus:ring-2 focus:ring-amber-500 outline-none font-mono">
            </div>

            <div class="sm:col-span-2">
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">URL da Imagem / Banner</label>
                <input type="text" id="galvanicaImagem" placeholder="https://..." class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2 text-xs text-gray-800 focus:ring-2 focus:ring-amber-500 outline-none font-mono">
            </div>
        </div>

        <div class="border border-dashed border-gray-200 rounded-xl p-2 bg-gray-50 flex items-center justify-center h-24 overflow-hidden">
            <img id="galvanicaPreviewModal" src="" class="hidden w-full h-full object-cover rounded-lg">
            <span id="galvanicaPreviewPlaceholder" class="text-xs text-gray-400">Preview do Banner (Horizontal)</span>
        </div>

        <div class="flex items-center justify-end gap-2 border-t border-gray-50 pt-3 mt-4">
            <button onclick="fecharModalGalvanica()" class="bg-gray-100 hover:bg-gray-200 text-gray-600 font-medium px-4 py-2 rounded-xl text-xs transition-all">Cancelar</button>
            <button id="btnSalvarGalvanica" onclick="salvarGalvanicaFirebase()" class="bg-amber-500 hover:bg-amber-600 text-white font-medium px-5 py-2 rounded-xl text-xs transition-all">Salvar Galvânica</button>
        </div>
    </div>
</div>

<script>
    var _GALVANICAS_CACHE = {};

    var checadorGalvanicas = setInterval(function() {
        if (typeof db !== "undefined") {
            clearInterval(checadorGalvanicas);
            escutarGalvanicasParceiras();
            setupLivePreviewGalvanica();
        }
    }, 300);

    function setupLivePreviewGalvanica() {
        var inputImg = document.getElementById('galvanicaImagem');
        if(inputImg) {
            inputImg.addEventListener('input', function(e) {
                var img = document.getElementById('galvanicaPreviewModal');
                var placeholder = document.getElementById('galvanicaPreviewPlaceholder');
                if(e.target.value.trim() !== "") {
                    img.src = e.target.value.trim();
                    img.classList.remove('hidden');
                    placeholder.classList.add('hidden');
                } else {
                    img.classList.add('hidden');
                    placeholder.classList.remove('hidden');
                }
            });
        }
    }

    function escutarGalvanicasParceiras() {
        // Aponta para a chave real do seu print: 'galvanicas'
        db.ref('galvanicas').on('value', function(snapshot) {
            var dados = snapshot.val();
            var container = document.getElementById('grid-galvanicas');
            if(!container) return;

            if(!dados) {
                container.innerHTML = `<div class="col-span-full text-center py-12 bg-white border border-dashed border-gray-200 rounded-2xl text-gray-400 font-medium">🚚 Nenhuma galvânica sincronizada.</div>`;
                return;
            }

            _GALVANICAS_CACHE = dados;
            container.innerHTML = '';

            Object.keys(dados).forEach(function(id) {
                var g = dados[id];
                var fotoPadrao = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="%23ccc" stroke-width="2"><rect width="20" height="12" x="2" y="6" rx="2"/></svg>';

                var card = document.createElement('div');
                card.className = "bg-white border border-gray-200 rounded-2xl overflow-hidden shadow-xs hover:shadow-md transition-all flex flex-col justify-between";
                card.innerHTML = `
                    <div>
                        <div class="w-full h-28 bg-gray-100 relative overflow-hidden">
                            <img src="${g.imagem || fotoPadrao}" class="absolute inset-0 w-full h-full object-cover" onerror="this.src='${fotoPadrao}'">
                            ${g.selo ? `
                                <span class="absolute top-3 right-3 bg-amber-500 text-white text-[9px] font-black px-2 py-0.5 rounded-md shadow-xs uppercase tracking-wider">
                                    ⭐ ${g.selo}
                                </span>
                            ` : ''}
                        </div>
                        
                        <div class="p-4 space-y-2">
                            <h4 class="font-bold text-gray-800 text-base uppercase tracking-wide truncate">${g.nome || 'Sem Nome'}</h4>
                            <p class="text-xs text-gray-600 font-medium italic line-clamp-2">"${g.descricao || 'Parceiro oficial de banhos no atacado.'}"</p>
                            
                            <div class="text-[11px] text-gray-500 space-y-1 pt-2 border-t border-gray-50">
                                <div class="flex items-start gap-1"><span>📍</span> <span class="truncate">${g.endereco || 'Não informado'}</span></div>
                                <div class="flex items-center gap-1"><span>📞</span> <span>Fixo: ${g.telefone || 'N/A'}</span></div>
                                <div class="flex items-center gap-1"><span>💬</span> <span class="text-emerald-600 font-semibold font-mono">Whats: ${g.whatsapp || 'N/A'}</span></div>
                            </div>
                        </div>
                    </div>

                    <div class="flex items-center justify-end gap-3 bg-gray-50/50 px-4 py-2.5 border-t border-gray-100">
                        <button onclick="editarGalvanica('${id}')" class="text-xs font-bold text-gray-600 hover:text-gray-800 transition-all">Editar</button>
                        <button onclick="deletarGalvanica('${id}')" class="text-xs font-bold text-rose-600 hover:bg-rose-50 px-2 py-1 rounded-md transition-all">Excluir</button>
                    </div>
                `;
                container.appendChild(card);
            });
        });
    }

    function abrirModalGalvanica() {
        document.getElementById('galvanicaId').value = '';
        document.getElementById('galvanicaNome').value = '';
        document.getElementById('galvanicaSelo').value = 'PARCEIRO';
        document.getElementById('galvanicaDescricao').value = '';
        document.getElementById('galvanicaEndereco').value = '';
        document.getElementById('galvanicaTelefone').value = '';
        document.getElementById('galvanicaWhatsapp').value = '';
        document.getElementById('galvanicaImagem').value = '';
        
        document.getElementById('galvanicaPreviewModal').classList.add('hidden');
        document.getElementById('galvanicaPreviewPlaceholder').classList.remove('hidden');
        document.getElementById('modalGalvanicaTitulo').innerText = "Nova Galvânica Parceira";
        document.getElementById('modalGalvanica').classList.remove('hidden');
    }

    function fecharModalGalvanica() { document.getElementById('modalGalvanica').classList.add('hidden'); }

    function editarGalvanica(id) {
        var g = _GALVANICAS_CACHE[id];
        if(!g) return;

        document.getElementById('galvanicaId').value = id;
        document.getElementById('galvanicaNome').value = g.nome || '';
        document.getElementById('galvanicaSelo').value = g.selo || '';
        document.getElementById('galvanicaDescricao').value = g.descricao || '';
        document.getElementById('galvanicaEndereco').value = g.endereco || '';
        document.getElementById('galvanicaTelefone').value = g.telefone || '';
        document.getElementById('galvanicaWhatsapp').value = g.whatsapp || '';
        document.getElementById('galvanicaImagem').value = g.imagem || '';
        
        var img = document.getElementById('galvanicaPreviewModal');
        var placeholder = document.getElementById('galvanicaPreviewPlaceholder');
        if(g.imagem) {
            img.src = g.imagem;
            img.classList.remove('hidden');
            placeholder.classList.add('hidden');
        } else {
            img.classList.add('hidden');
            placeholder.classList.remove('hidden');
        }

        document.getElementById('modalGalvanicaTitulo').innerText = "Editar Cadastro de Galvânica";
        document.getElementById('modalGalvanica').classList.remove('hidden');
    }

    function salvarGalvanicaFirebase() {
        var id = document.getElementById('galvanicaId').value;
        var nome = document.getElementById('galvanicaNome').value.trim();
        var selo = document.getElementById('galvanicaSelo').value.trim();
        var descricao = document.getElementById('galvanicaDescricao').value.trim();
        var endereco = document.getElementById('galvanicaEndereco').value.trim();
        var telefone = document.getElementById('galvanicaTelefone').value.trim();
        var whatsapp = document.getElementById('galvanicaWhatsapp').value.trim();
        var imagem = document.getElementById('galvanicaImagem').value.trim();

        if(!nome) { alert("⚠️ O nome da galvânica é obrigatório!"); return; }

        var dados = {
            nome: nome,
            selo: selo,
            descricao: descricao,
            endereco: endereco,
            telefone: telefone,
            whatsapp: whatsapp,
            imagem: imagem
        };

        if(id) {
            db.ref(`galvanicas/${id}`).update(dados).then(function() { fecharModalGalvanica(); });
        } else {
            db.ref('galvanicas').push(dados).then(function() { fecharModalGalvanica(); });
        }
    }

    function deletarGalvanica(id) {
        if(confirm("⚠️ Deseja remover permanentemente esta galvânica do banco de dados?")) {
            db.ref(`galvanicas/${id}`).remove();
        }
    }
</script>
