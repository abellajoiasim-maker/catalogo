<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-storage-compat.js"></script>
</head>
<body class="bg-zinc-900 text-zinc-100 p-6 font-sans min-h-screen">

    <div class="max-w-7xl mx-auto space-y-6">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-zinc-950 p-6 rounded-2xl border border-zinc-800">
            <div>
                <h2 class="text-xl font-bold text-white">💎 Gerenciamento de Catálogo</h2>
                <p class="text-xs text-zinc-500 mt-1">Insira, edite, filtre e faça upload de imagens para seus produtos brutas.</p>
            </div>
            <button onclick="abrirModalProduto()" class="bg-[#caa85c] hover:bg-[#bda152] text-black font-bold text-xs px-4 py-2.5 rounded-xl uppercase tracking-wider transition-all">
                + Novo Produto
            </button>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 bg-zinc-950 p-4 rounded-xl border border-zinc-800">
            <input type="text" id="filtroTexto" oninput="mudarPagina(1)" placeholder="Buscar por Nome ou SKU..." class="bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-2 text-xs outline-none focus:border-[#caa85c]">
            <select id="filtroCategoria" onchange="mudarPagina(1)" class="bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-2 text-xs outline-none focus:border-[#caa85c]"><option value="">Todas as Categorias</option></select>
            <select id="filtroSubcategoria" onchange="mudarPagina(1)" class="bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-2 text-xs outline-none focus:border-[#caa85c]"><option value="">Todas as Subcategorias</option></select>
        </div>

        <div id="loading" class="text-center py-12 text-zinc-500 text-xs uppercase tracking-widest">⏳ Processando catálogo de joias...</div>
        <div id="grid-produtos" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4"></div>

        <div class="flex justify-center items-center gap-4 pt-4">
            <button onclick="retrocederPagina()" class="bg-zinc-950 border border-zinc-800 text-zinc-400 hover:text-white px-4 py-2 rounded-xl text-xs transition-all">Anterior</button>
            <span id="infoPagina" class="text-xs font-mono text-zinc-500">Página 1 de 1</span>
            <button onclick="avancarPagina()" class="bg-zinc-950 border border-zinc-800 text-zinc-400 hover:text-white px-4 py-2 rounded-xl text-xs transition-all">Próxima</button>
        </div>
    </div>

    <div id="modalProduto" class="fixed inset-0 bg-black/80 backdrop-blur-xs z-50 flex items-center justify-center hidden p-4">
        <div class="bg-zinc-950 border border-zinc-800 rounded-2xl w-full max-w-xl overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
            <div class="p-6 border-b border-zinc-900 flex justify-between items-center">
                <h3 id="modalTitulo" class="text-sm font-bold text-white uppercase tracking-wider">Novo Registro de Produto</h3>
                <button onclick="fecharModalProduto()" class="text-zinc-500 hover:text-white text-xs">✕</button>
            </div>
            <form id="formProduto" onsubmit="salvarProdutoForm(event)" class="p-6 space-y-4 overflow-y-auto flex-1 text-left">
                <input type="hidden" id="prodId">
                <div class="grid grid-cols-3 gap-4">
                    <div class="col-span-1 space-y-1">
                        <label class="text-[10px] uppercase text-zinc-400 font-bold">Código SKU *</label>
                        <input type="text" id="prodSku" required class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-2 text-xs outline-none focus:border-[#caa85c]">
                    </div>
                    <div class="col-span-2 space-y-1">
                        <label class="text-[10px] uppercase text-zinc-400 font-bold">Nome Completo do Produto *</label>
                        <input type="text" id="prodName" required class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-2 text-xs outline-none focus:border-[#caa85c]">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="text-[10px] uppercase text-zinc-400 font-bold">Categoria Mãe *</label>
                        <select id="prodCategory" required onchange="sincronizarSubcategoriasForm()" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-2.5 text-xs outline-none focus:border-[#caa85c]"></select>
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] uppercase text-zinc-400 font-bold">Subcategoria Vinculada</label>
                        <select id="prodSubcategory" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-2.5 text-xs outline-none focus:border-[#caa85c]"><option value="">Nenhuma</option></select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="text-[10px] uppercase text-zinc-400 font-bold">Preço de Tabela (R$) *</label>
                        <input type="number" step="0.01" id="prodPrice" required class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-2 text-xs outline-none focus:border-[#caa85c]">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] uppercase text-zinc-400 font-bold">Peso Bruto (Gramas) *</label>
                        <input type="number" step="0.01" id="prodWeight" required class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-2 text-xs outline-none focus:border-[#caa85c]">
                    </div>
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] uppercase text-zinc-400 font-bold">Imagem do Produto (Upload para Storage Oficial)</label>
                    <input type="file" id="prodFile" accept="image/*" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-1.5 text-xs text-zinc-400 file:bg-zinc-800 file:border-0 file:text-white file:rounded-lg file:px-2 file:py-1 file:mr-2">
                    <input type="text" id="prodImageUrl" placeholder="Ou insira link HTTP / gs://" class="w-full mt-2 bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-2 text-xs outline-none focus:border-[#caa85c]">
                </div>
                <div class="flex items-center gap-2 pt-2">
                    <input type="checkbox" id="prodActive" checked class="rounded border-zinc-800 text-[#caa85c] focus:ring-0">
                    <label for="prodActive" class="text-xs text-zinc-300 font-medium">Disponível para venda imediata no catálogo</label>
                </div>
                <div class="pt-4 border-t border-zinc-900 flex justify-end gap-2">
                    <button type="button" onclick="fecharModalProduto()" class="bg-zinc-900 text-zinc-400 px-4 py-2 rounded-xl text-xs font-semibold hover:text-white">Cancelar</button>
                    <button type="submit" class="bg-[#caa85c] text-black font-bold px-5 py-2 rounded-xl text-xs uppercase tracking-wider">Salvar Registro</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/firebase/firebase-config.js"></script>
    <script src="../js/utils/money.js"></script>
    <script src="../js/utils/storage.js"></script>
    <script src="../js/services/produtoService.js"></script>
    <script src="../js/services/categoriaService.js"></script>
    <script>
        let paginaAtual = 1;
        const itensPorPagina = 12;
        let listaCategoriasCache = {};

        document.addEventListener('DOMContentLoaded', async () => {
            await inicializarComponentesMapeamento();
            await carregarProdutosTabela();
        });

        async function inicializarComponentesMapeamento() {
            try {
                listaCategoriasCache = await categoriaService.listarTodas() || {};
                const fCat = document.getElementById('filtroCategoria');
                const pCat = document.getElementById('prodCategory');
                
                fCat.innerHTML = '<option value="">Todas as Categorias</option>';
                pCat.innerHTML = '<option value="" disabled selected>Selecione...</option>';

                Object.keys(listaCategoriasCache).forEach(key => {
                    const c = listaCategoriasCache[key];
                    const nome = c.name || c.nome || key;
                    fCat.innerHTML += `<option value="${key}">${nome}</option>`;
                    pCat.innerHTML += `<option value="${key}">${nome}</option>`;
                });
            } catch(e) { console.error("Erro ao popular filtros", e); }
        }

        function sincronizarSubcategoriasForm() {
            const catKey = document.getElementById('prodCategory').value;
            const subSelect = document.getElementById('prodSubcategory');
            subSelect.innerHTML = '<option value="">Nenhuma</option>';
            
            if(catKey && listaCategoriasCache[catKey] && listaCategoriasCache[catKey].subcategories) {
                const subs = listaCategoriasCache[catKey].subcategories;
                Object.keys(subs).forEach(subKey => {
                    subSelect.innerHTML += `<option value="${subKey}">${subs[subKey].name || subKey}</option>`;
                });
            }
        }

        async function carregarProdutosTabela() {
            const grid = document.getElementById('grid-produtos');
            const loading = document.getElementById('loading');
            grid.innerHTML = '';
            loading.classList.remove('hidden');

            const filtros = {
                text: document.getElementById('filtroTexto').value,
                category: document.getElementById('filtroCategoria').value,
                subcategory: document.getElementById('filtroSubcategory').value,
                onlyActive: false
            };

            try {
                const res = await produtoService.obterPaginado(paginaAtual, itensPorPagina, filtros);
                loading.classList.add('hidden');

                document.getElementById('infoPagina').innerText = `Página ${res.currentPage} de ${res.totalPages || 1}`;

                if(res.items.length === 0) {
                    grid.innerHTML = '<p class="col-span-full text-zinc-500 text-xs italic text-center py-8">Nenhum item localizado no escopo atual.</p>';
                    return;
                }

                res.items.forEach(p => {
                    const card = document.createElement('div');
                    card.className = `bg-zinc-950 border ${p.active ? 'border-zinc-800' : 'border-red-900/40'} rounded-xl p-3 flex flex-col justify-between text-left space-y-2 relative`;
                    const srcImg = window.StorageUtils.converterUrlStorage(p.image);
                    
                    card.innerHTML = `
                        <div class="aspect-square bg-zinc-900 rounded-lg overflow-hidden flex items-center justify-center">
                            <img src="${srcImg}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/150'">
                        </div>
                        <div>
                            <span class="text-[8px] bg-zinc-900 text-zinc-400 font-mono px-1.5 py-0.5 rounded border border-zinc-800 block truncate">SKU: ${p.sku}</span>
                            <h4 class="text-white font-bold text-xs mt-1 truncate uppercase">${p.name}</h4>
                            <p class="text-[10px] text-[#caa85c] font-bold font-mono mt-0.5">${window.MoneyUtils.format(p.price)} | ${p.weight.toFixed(2)}g</p>
                        </div>
                        <div class="grid grid-cols-2 gap-1 pt-1 border-t border-zinc-900">
                            <button onclick="editarProdutoId('${p.id}')" class="bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-zinc-300 text-[10px] py-1 rounded-lg transition-all">Editar</button>
                            <button onclick="deletarProdutoId('${p.id}')" class="bg-red-950/20 hover:bg-red-950/60 border border-red-900/40 text-red-400 text-[10px] py-1 rounded-lg transition-all">Excluir</button>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch(e) {
                console.error(e);
                loading.innerText = "❌ Falha crítica de comunicação na leitura do catálogo.";
            }
        }

        function mudarPagina(p) { paginaAtual = p; carregarProdutosTabela(); }
        function retrocederPagina() { if(paginaAtual > 1) mudarPagina(paginaAtual - 1); }
        function avancarPagina() { mudarPagina(paginaAtual + 1); }

        function abrirModalProduto() {
            document.getElementById('formProduto').reset();
            document.getElementById('prodId').value = '';
            document.getElementById('modalTitulo').innerText = "Novo Registro de Produto";
            document.getElementById('modalProduto').classList.remove('hidden');
        }
        function fecharModalProduto() { document.getElementById('modalProduto').classList.add('hidden'); }

        async function editarProdutoId(id) {
            abrirModalProduto();
            document.getElementById('modalTitulo').innerText = "Modificar Registro de Produto";
            const prods = await produtoService.listarTodos();
            const p = prods.find(item => item.id === id);
            if(p) {
                document.getElementById('prodId').value = p.id;
                document.getElementById('prodSku').value = p.sku;
                document.getElementById('prodName').value = p.name;
                document.getElementById('prodCategory').value = p.category;
                sincronizarSubcategoriasForm();
                document.getElementById('prodSubcategory').value = p.subcategory;
                document.getElementById('prodPrice').value = p.price;
                document.getElementById('prodWeight').value = p.weight;
                document.getElementById('prodImageUrl').value = p.image;
                document.getElementById('prodActive').checked = p.active;
            }
        }

        async function salvarProdutoForm(e) {
            e.preventDefault();
            const fileInput = document.getElementById('prodFile');
            let imgUrl = document.getElementById('prodImageUrl').value.trim();

            if(fileInput.files.length > 0 && typeof firebase !== 'undefined' && firebase.storage) {
                const file = fileInput.files[0];
                const refStorage = firebase.storage().ref(`images/produtos/${Date.now()}_${file.name}`);
                const snap = await refStorage.put(file);
                imgUrl = `gs://${snap.metadata.bucket}/${snap.metadata.fullPath}`;
            }

            const payload = {
                sku: document.getElementById('prodSku').value.trim(),
                name: document.getElementById('prodName').value.trim(),
                category: document.getElementById('prodCategory').value,
                subcategory: document.getElementById('prodSubcategory').value,
                price: parseFloat(document.getElementById('prodPrice').value),
                weight: parseFloat(document.getElementById('prodWeight').value),
                active: document.getElementById('prodActive').checked
            };
            payload.image = imgUrl;

            await produtoService.salvar(document.getElementById('prodId').value, payload);
            fecharModalProduto();
            await carregarProdutosTabela();
        }

        async function deletarProdutoId(id) {
            if(confirm("Deseja expurgar permanentemente este registro de produto?")) {
                await produtoService.deletar(id);
                await carregarProdutosTabela();
            }
        }
    </script>
</body>
</html>
