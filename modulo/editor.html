<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Super Editor V7 • Gestão Avançada</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>

  <script src="../js/firebase/firebase-config.js"></script>

  <style>
    .input-dark {
      background-color: rgb(24 24 27);
      border: 1px solid rgb(39 39 42);
      color: white;
      border-radius: 0.5rem;
      padding: 0.75rem;
      width: 100%;
      margin-bottom: 0.5rem;
    }

    .tab-btn.active {
      background: #caa85c;
      color: black;
      font-weight: 700;
      border-radius: 0.75rem;
      padding: 0.5rem 1rem;
      font-size: 0.75rem;
    }

    .tab-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      color: white;
      border-radius: 0.75rem;
      padding: 0.5rem 1rem;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .tab-btn:hover {
      background: rgba(255,255,255,0.10);
    }
  </style>
</head>

<body class="bg-black text-white">
  <div class="max-w-7xl mx-auto p-4">

    <header class="bg-zinc-950 border border-zinc-900 rounded-2xl p-5 mb-4">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
        <div>
          <h1 class="text-2xl font-bold text-[#caa85c]">Super Editor V7</h1>
          <p class="text-xs text-zinc-500">Controle Total • Criação, Edição, Variações e Imagens Sincronizadas</p>
        </div>
        <div class="flex flex-wrap gap-2 w-full sm:w-auto">
          <button id="btnCriarNovo" onclick="abrirCriacaoPorAba()" class="px-4 py-2 bg-[#caa85c] text-black rounded-xl text-xs font-bold hover:bg-opacity-90 transition-all">
            ➕ Criar Item
          </button>
          <button id="btnRefresh" onclick="carregarTudo()" class="px-4 py-2 bg-zinc-900 border border-zinc-800 text-zinc-300 rounded-xl text-xs font-bold hover:bg-zinc-800 transition-all">
            Sincronizar Vitrine
          </button>
        </div>
      </div>
    </header>

    <section class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5">
      <div class="bg-zinc-950 border border-zinc-900 rounded-xl p-4">
        <div class="text-zinc-500 text-[10px]">Produtos</div>
        <div id="statProdutos" class="text-2xl font-bold">0</div>
      </div>
      <div class="bg-zinc-950 border border-zinc-900 rounded-xl p-4">
        <div class="text-zinc-500 text-[10px]">Categorias</div>
        <div id="statCategorias" class="text-2xl font-bold">0</div>
      </div>
      <div class="bg-zinc-950 border border-zinc-900 rounded-xl p-4">
        <div class="text-zinc-500 text-[10px]">Subcategorias</div>
        <div id="statSubs" class="text-2xl font-bold">0</div>
      </div>
      <div class="bg-zinc-950 border border-zinc-900 rounded-xl p-4">
        <div class="text-zinc-500 text-[10px]">Pausados</div>
        <div id="statPausados" class="text-2xl font-bold">0</div>
      </div>
    </section>

    <section class="bg-zinc-950 border border-zinc-900 rounded-xl p-4 mb-4">
      <div class="grid md:grid-cols-5 gap-3">
        <input
          id="buscaGlobal"
          type="text"
          class="w-full md:col-span-2 bg-zinc-900 border border-zinc-800 rounded-lg p-3 text-sm focus:outline-none focus:border-zinc-700"
          placeholder="Buscar SKU, Nome, Categoria..."
          oninput="adicionarDebounceBusca()"
        />
        <select id="filtroTipo" class="bg-zinc-900 border border-zinc-800 rounded-lg p-3 text-sm focus:outline-none" onchange="renderCurrentTab()">
          <option value="todos">Todos</option>
          <option value="produto">Produtos</option>
          <option value="categoria">Categorias</option>
          <option value="subcategoria">Subcategorias</option>
        </select>
        <select id="filtroCategoria" class="bg-zinc-900 border border-zinc-800 rounded-lg p-3 text-sm focus:outline-none" onchange="renderProdutos()">
          <option value="">Todas Categorias</option>
        </select>
        <select id="filtroSubcategoria" class="bg-zinc-900 border border-zinc-800 rounded-lg p-3 text-sm focus:outline-none" onchange="renderProdutos()">
          <option value="">Todas Subcategorias</option>
        </select>
      </div>
    </section>

    <section class="flex gap-2 mb-4">
      <button class="tab-btn active" data-tab="produtos" type="button" onclick="alternarAba(this)">Produtos</button>
      <button class="tab-btn" data-tab="categorias" type="button" onclick="alternarAba(this)">Categorias</button>
      <button class="tab-btn" data-tab="subcategorias" type="button" onclick="alternarAba(this)">Subcategorias</button>
    </section>

    <section>
      <div id="tab-produtos" class="grid grid-cols-1 gap-3"></div>
      <div id="tab-categorias" class="hidden grid grid-cols-1 gap-3"></div>
      <div id="tab-subcategorias" class="hidden grid grid-cols-1 gap-3"></div>
    </section>

    <div id="status" class="text-xs text-zinc-500 mt-6"></div>
  </div>

  <div
    id="drawer"
    class="fixed top-0 right-0 h-full w-[600px] bg-zinc-950 border-l border-zinc-800 hidden z-50 overflow-y-auto shadow-2xl"
  >
    <div class="p-5">
      <div class="flex justify-between mb-5">
        <h2 id="drawerTitle" class="text-lg font-bold text-[#caa85c]">Editor Avançado</h2>
        <button type="button" onclick="fecharDrawer()" class="text-xl hover:text-red-400">✕</button>
      </div>
      <div id="drawerContent"></div>
    </div>
  </div>

  <script>
  function resolverDB() {
    if (window.db) return window.db;
    if (window.firebase && window.firebase.apps && window.firebase.apps.length > 0) {
      return window.firebase.database();
    }
    return null;
  }

  const statusEl = document.getElementById('status');
  const STATE = {
    db: null,
    produtos: [],
    categorias: {},
    buscaDebounceTimer: null
  };

  const CONFIG = {
    debounceBusca: 200,
    firebaseRetries: 30,
    firebaseRetryDelay: 100
  };

  const DataService = {
    getSubcategory(obj) { return obj?.subcategory ?? obj?.subCategory ?? ''; },
    getImage(obj) { return obj?.imagem ?? obj?.image ?? obj?.img ?? ''; },
    getPrice(obj) { return Number(obj?.preco ?? obj?.price ?? 0); },
    getWeight(obj) { return Number(obj?.peso ?? obj?.weight ?? 0); },
    getDesc(obj) { return obj?.description ?? obj?.descricao ?? ''; }
  };

  function setStatus(msg, type = 'info') {
    const color = type === 'error' ? 'text-red-400' : type === 'ok' ? 'text-green-400' : 'text-zinc-500';
    statusEl.className = `text-xs mt-6 ${color}`;
    statusEl.textContent = msg;
  }

  function escapeHtml(str) {
    return String(str ?? '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;');
  }

  function escapeAttr(str) {
    return String(str ?? '').replaceAll("'", "\\'").replaceAll('"', '&quot;');
  }

  function gerarSlug(texto) {
    return texto.toString().toLowerCase().trim()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9 -]/g, '')
      .replace(/\s+/g, '-')
      .replace(/-+/g, '-');
  }

  function converterGsUrl(url) {
    let stringUrl = String(url ?? '').trim();
    if (!stringUrl) return '';
    if (stringUrl.includes('drive.google.com')) {
      try {
        let idArquivo = '';
        if (stringUrl.includes('/d/')) idArquivo = stringUrl.split('/d/')[1].split('/')[0];
        else if (stringUrl.includes('id=')) idArquivo = stringUrl.split('id=')[1].split('&')[0];
        if (idArquivo) return `https://drive.google.com/uc?export=view&id=${idArquivo}`;
      } catch (e) {}
    }
    if (stringUrl.startsWith('gs://')) {
      try {
        const semProtocolo = stringUrl.replace('gs://', '');
        const idx = semProtocolo.indexOf('/');
        if (idx === -1) return stringUrl;
        return `https://firebasestorage.googleapis.com/v1/b/${semProtocolo.substring(0, idx)}/o/${encodeURIComponent(semProtocolo.substring(idx + 1))}?alt=media`;
      } catch (e) {}
    }
    return stringUrl;
  }

  function tratarInputImagem(inputElement, previewId) {
    if (!inputElement) return;
    let valor = inputElement.value.trim();
    if (valor.startsWith('gs://') || valor.includes('drive.google.com')) {
      valor = converterGsUrl(valor);
      inputElement.value = valor;
    }
    const preview = document.getElementById(previewId);
    if (preview) {
      preview.src = valor;
      preview.style.opacity = '1';
    }
  }

  function handleImageError(img) {
    img.style.opacity = '0';
    const container = img.parentNode;
    if (container) {
      const fallback = container.querySelector('.fallback-container');
      if (fallback) fallback.style.display = 'flex';
    }
  }

  function abrirDrawer(titulo, html) {
    document.getElementById('drawerTitle').textContent = titulo;
    document.getElementById('drawerContent').innerHTML = html;
    document.getElementById('drawer').classList.remove('hidden');
  }

  function fecharDrawer() {
    document.getElementById('drawer').classList.add('hidden');
    document.getElementById('drawerContent').innerHTML = '';
  }

  function alternarAba(btn) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    
    const tab = btn.dataset.tab;
    document.getElementById('tab-produtos').classList.add('hidden');
    document.getElementById('tab-categorias').classList.add('hidden');
    document.getElementById('tab-subcategorias').classList.add('hidden');
    document.getElementById(`tab-${tab}`).classList.remove('hidden');
    
    renderCurrentTab();
  }

  function adicionarDebounceBusca() {
    clearTimeout(STATE.buscaDebounceTimer);
    STATE.buscaDebounceTimer = setTimeout(() => {
      renderCurrentTab();
    }, CONFIG.debounceBusca);
  }

  function abrirCriacaoPorAba() {
    const tab = getActiveTab();
    if (tab === 'produtos') criarProdutoForm();
    else if (tab === 'categorias') criarCategoriaForm();
    else if (tab === 'subcategorias') criarSubcategoriaForm();
  }

  async function carregarTudo(){
    try {
      if (!STATE.db) {
        STATE.db = resolverDB();
        if (!STATE.db) {
          setTimeout(carregarTudo, 500);
          return;
        }
      }
      
      const pathCat = typeof window.getAbellaPath === 'function' ? window.getAbellaPath('categories') : 'categories';
      const pathProd = typeof window.getAbellaPath === 'function' ? window.getAbellaPath('products') : 'products';

      const snapCat = await STATE.db.ref(pathCat).once('value');
      STATE.categorias = snapCat.val() || {};

      const snapProd = await STATE.db.ref(pathProd).once('value');
      const dados = snapProd.val() || {};
      STATE.produtos = Object.entries(dados).map(([id, p]) => ({ id, ...p }));

      popularFiltros();
      renderAll();
      setStatus('✅ Catálogo perfeitamente sincronizado com as páginas de venda', 'ok');
    } catch(err) {
      console.error(err);
      setStatus('❌ Erro de conexão com o banco de dados Firebase', 'error');
    }
  }

  function atualizarEstatisticas() {
    document.getElementById('statProdutos').innerText = STATE.produtos.length;
    document.getElementById('statCategorias').innerText = Object.keys(STATE.categorias).length;
    let totalSubs = 0;
    Object.values(STATE.categorias).forEach(cat => totalSubs += Object.keys(cat?.subcategories || {}).length);
    document.getElementById('statSubs').innerText = totalSubs;
    document.getElementById('statPausados').innerText = STATE.produtos.filter(p => p.paused).length;
  }

  function popularFiltros() {
    const selCat = document.getElementById('filtroCategoria');
    const selSub = document.getElementById('filtroSubcategoria');
    if (!selCat || !selSub) return;

    let catOptions = `<option value="">Todas Categorias</option>`;
    Object.keys(STATE.categorias).forEach(c => catOptions += `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`);
    selCat.innerHTML = catOptions;

    const allSubs = new Set();
    Object.values(STATE.categorias).forEach(cat => Object.keys(cat?.subcategories || {}).forEach(s => allSubs.add(s)));
    let subOptions = `<option value="">Todas Subcategorias</option>`;
    [...allSubs].forEach(s => subOptions += `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`);
    selSub.innerHTML = subOptions;
  }

  function getActiveTab() {
    return document.querySelector('.tab-btn.active')?.dataset?.tab || 'produtos';
  }

  function renderCurrentTab() {
    const t = getActiveTab();
    const btn = document.getElementById('btnCriarNovo');
    if(btn) {
      if (t === 'produtos') btn.innerText = "➕ Novo Produto";
      else if (t === 'categorias') btn.innerText = "➕ Nova Categoria";
      else if (t === 'subcategorias') btn.innerText = "➕ Nova Subcategoria";
    }

    if (t === 'produtos') renderProdutos();
    else if (t === 'categorias') renderCategorias();
    else if (t === 'subcategorias') renderSubcategorias();
  }

  function renderAll() {
    atualizarEstatisticas();
    renderCurrentTab();
  }

  // ==========================================================
  // GERENCIADOR DE VARIANTES EM TEMPO REAL (MÓDULO NOVO)
  // ==========================================================
  function adicionarLinhaVariacao(nome = '', valor = '', preco = 0, peso = 0) {
    const container = document.getElementById('containerVariacoes');
    if (!container) return;

    const div = document.createElement('div');
    div.className = "grid grid-cols-12 gap-2 mb-2 bg-zinc-900 p-2 rounded-lg border border-zinc-800 item-variacao";
    div.innerHTML = `
      <div class="col-span-3">
        <input type="text" class="input-dark !mb-0 text-xs var-nome" placeholder="Ex: Tamanho" value="${escapeHtml(nome)}">
      </div>
      <div class="col-span-3">
        <input type="text" class="input-dark !mb-0 text-xs var-valor" placeholder="Ex: 45cm" value="${escapeHtml(valor)}">
      </div>
      <div class="col-span-3">
        <input type="number" step="0.01" class="input-dark !mb-0 text-xs var-preco" placeholder="+ R$ Pr." value="${preco || ''}">
      </div>
      <div class="col-span-2">
        <input type="number" step="0.01" class="input-dark !mb-0 text-xs var-peso" placeholder="+ Peso" value="${peso || ''}">
      </div>
      <div class="col-span-1 flex items-center justify-center">
        <button type="button" onclick="this.parentNode.parentNode.remove()" class="text-red-400 hover:text-red-600 text-sm font-bold">✕</button>
      </div>
    `;
    container.appendChild(div);
  }

  function coletarVariacoesForm() {
    const arr = [];
    document.querySelectorAll('.item-variacao').forEach(div => {
      const nome = div.querySelector('.var-nome').value.trim();
      const valor = div.querySelector('.var-valor').value.trim();
      const preco = parseFloat(div.querySelector('.var-preco').value) || 0;
      const peso = parseFloat(div.querySelector('.var-peso').value) || 0;

      if (nome && valor) {
        arr.push({ name: nome, value: valor, price: preco, preco: preco, weight: peso, peso: peso });
      }
    });
    return arr;
  }

  // ==========================================================
  // RENDERIZADORES DAS LISTAGENS
  // ==========================================================
  function renderProdutos() {
    const container = document.getElementById('tab-produtos');
    if (!container) return;

    const termos = (document.getElementById('buscaGlobal').value || '').toLowerCase();
    const filtroCat = document.getElementById('filtroCategoria').value;
    const filtroSub = document.getElementById('filtroSubcategoria').value;

    const filtrados = STATE.produtos.filter(p => {
      const texto = (p.name || '').toLowerCase() + ' ' + (p.sku || '').toLowerCase() + ' ' + (p.category || '').toLowerCase() + ' ' + (DataService.getSubcategory(p)).toLowerCase();
      return (termos === '' || texto.includes(termos)) && (!filtroCat || p.category === filtroCat) && (!filtroSub || DataService.getSubcategory(p) === filtroSub);
    });

    if (filtrados.length === 0) {
      container.innerHTML = `<div class="text-sm text-zinc-500 p-4">Nenhum produto correspondente.</div>`;
      return;
    }

    let html = '';
    filtrados.forEach(p => {
      const isPaused = p.paused;
      const cardBg = isPaused ? 'bg-zinc-950 opacity-60 border-red-900/40' : 'bg-zinc-950 border-zinc-900';
      const statusTag = isPaused ? `<span class="bg-red-950 text-red-400 border border-red-800 text-[10px] px-2 py-0.5 rounded-full font-bold">PAUSADO</span>` : `<span class="bg-green-950 text-green-400 border border-green-800 text-[10px] px-2 py-0.5 rounded-full font-bold">ATIVO</span>`;
      const imgUrl = converterGsUrl(DataService.getImage(p));
      
      // Indicador de Variações Cadastradas
      const totalVars = p.variations ? (Array.isArray(p.variations) ? p.variations.length : Object.keys(p.variations).length) : 0;
      const varTag = totalVars > 0 ? `<span class="bg-amber-950/80 text-amber-400 border border-amber-900 text-[10px] px-2 py-0.5 rounded-full font-bold">${totalVars} VARIAÇÕES</span>` : '';

      html += `
        <div class="border rounded-2xl p-5 mb-1 transition-all hover:border-zinc-800 ${cardBg}">
          <div class="flex flex-col lg:flex-row gap-5 items-start lg:items-center justify-between">
            <div class="flex items-center gap-4 w-full lg:w-auto">
              <div class="w-20 h-20 bg-zinc-900 border border-zinc-800 rounded-xl overflow-hidden flex-shrink-0 flex items-center justify-center relative">
                <div class="fallback-container absolute inset-0 flex items-center justify-center bg-zinc-900 text-[10px] text-zinc-600">Sem Foto</div>
                ${DataService.getImage(p) ? `<img src="${escapeHtml(imgUrl)}" class="w-full h-full object-cover relative z-10" onerror="handleImageError(this)"/>` : ''}
              </div>
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2 mb-1">
                  ${statusTag}
                  ${varTag}
                  <span class="text-xs font-mono text-zinc-400 bg-zinc-900 px-2 py-0.5 rounded border border-zinc-800">${escapeHtml(p.sku || 'SEM SKU')}</span>
                </div>
                <h3 class="font-bold text-base text-white truncate">${escapeHtml(p.name || 'Sem nome definido')}</h3>
                <p class="text-xs text-zinc-500 line-clamp-1 mt-0.5">${escapeHtml(DataService.getDesc(p) || 'Sem descrição cadastrada.')}</p>
              </div>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 w-full lg:flex-1 max-w-3xl bg-zinc-900/40 p-3 rounded-xl border border-zinc-900">
              <div>
                <span class="text-[10px] text-zinc-500 block uppercase font-bold tracking-wider">Preço</span>
                <span class="text-sm font-semibold text-[#caa85c]">R$ ${DataService.getPrice(p).toFixed(2)}</span>
              </div>
              <div>
                <span class="text-[10px] text-zinc-500 block uppercase font-bold tracking-wider">Peso</span>
                <span class="text-sm font-semibold text-zinc-300">${DataService.getWeight(p)}g</span>
              </div>
              <div>
                <span class="text-[10px] text-zinc-500 block uppercase font-bold tracking-wider">Categoria</span>
                <span class="text-xs font-semibold text-zinc-400 truncate block">${escapeHtml(p.category || '—')}</span>
              </div>
              <div>
                <span class="text-[10px] text-zinc-500 block uppercase font-bold tracking-wider">Subcategoria</span>
                <span class="text-xs font-semibold text-zinc-400 truncate block">${escapeHtml(DataService.getSubcategory(p) || '—')}</span>
              </div>
            </div>

            <div class="flex gap-2 w-full lg:w-auto justify-end border-t border-zinc-900 lg:border-none pt-3 lg:pt-0">
              <button onclick="editarProduto('${escapeAttr(p.id)}')" class="bg-zinc-900 border border-zinc-800 p-2.5 rounded-xl hover:bg-zinc-800 text-zinc-300 transition-colors">✏️ Editar</button>
              <button onclick="duplicarProduto('${escapeAttr(p.id)}')" class="bg-zinc-900 border border-zinc-800 p-2.5 rounded-xl hover:bg-zinc-800 text-zinc-300 transition-colors">📄</button>
              <button onclick="pausarProduto('${escapeAttr(p.id)}')" class="bg-zinc-900 border border-zinc-800 p-2.5 rounded-xl hover:bg-zinc-800 text-zinc-300 transition-colors">⏸️</button>
              <button onclick="deletarProduto('${escapeAttr(p.id)}')" class="bg-zinc-900 border border-zinc-800 p-2.5 rounded-xl hover:border-red-950 text-red-400 transition-colors">🗑️</button>
            </div>
          </div>
        </div>`;
    });
    container.innerHTML = html;
  }

  function renderCategorias() {
    const el = document.getElementById('tab-categorias');
    if (!el) return;
    let html = '';
    Object.entries(STATE.categorias).forEach(([slug, cat]) => {
      const catImg = cat.imagem || cat.image || '';
      html += `
        <div class="bg-zinc-950 border border-zinc-900 rounded-xl p-4">
          <div class="flex items-center justify-between gap-4">
            <div class="flex items-center gap-4">
              <div class="w-12 h-12 bg-zinc-900 border border-zinc-800 rounded overflow-hidden relative flex items-center justify-center">
                 <div class="fallback-container absolute inset-0 flex items-center justify-center bg-zinc-900 text-[10px] text-zinc-600">📁</div>
                 ${catImg ? `<img src="${escapeHtml(converterGsUrl(catImg))}" class="w-full h-full object-cover relative z-10" onerror="handleImageError(this)"/>` : ''}
              </div>
              <div>
                <div class="font-bold text-white">${escapeHtml(cat?.name || slug)}</div>
                <div class="text-xs text-zinc-500">Slug da Categoria: ${escapeHtml(slug)}</div>
              </div>
            </div>
            <div class="flex gap-2">
              <button onclick="editarCategoria('${escapeAttr(slug)}')" class="bg-zinc-900 border border-zinc-800 p-2 rounded-lg hover:bg-zinc-800">✏️ Editar</button>
              <button onclick="deletarCategoria('${escapeAttr(slug)}')" class="bg-zinc-900 border border-zinc-800 p-2 rounded-lg text-red-400 hover:border-red-950">🗑️</button>
            </div>
          </div>
        </div>`;
    });
    el.innerHTML = html;
  }

  function renderSubcategorias() {
    const el = document.getElementById('tab-subcategorias');
    if (!el) return;
    let html = '';

              <div class="flex items-center gap-4">

  function carregarSubcategoriasProdutoCriacao() {
    const cat = document.getElementById('newCategoria')?.value;
    const select = document.getElementById('newSubcategoria');
    if (!select) return;
    select.innerHTML = '<option value="">Nenhuma</option>';
    if(!cat) return;
    Object.entries(STATE.categorias[cat]?.subcategories || {}).forEach(([slug, sub]) => {
      select.innerHTML += `<option value="${escapeHtml(slug)}">${escapeHtml(sub.name || slug)}</option>`;
    });

  async function salvarNovoProduto() {
    try {
      const nome = document.getElementById('newNome').value.trim();
      const sku = document.getElementById('newSku').value.trim();
      const cat = document.getElementById('newCategoria').value;
      if(!nome || !sku || !cat) {
        alert('Por favor, preencha Nome, SKU e selecione a Categoria!');
        return;
      }

      const img = document.getElementById('newImagem').value.trim();
      const preco = parseFloat(document.getElementById('newPreco').value) || 0;
      const peso = parseFloat(document.getElementById('newPeso').value) || 0;
      const subcat = document.getElementById('newSubcategoria').value;
      const variacoes = coletarVariacoesForm();

      const novoProduto = {
        name: nome,
        sku: sku,
        category: cat,
        subcategory: subcat,
        subCategory: subcat,
        price: preco,
        preco: preco,
        weight: peso,
        peso: peso,
        image: img,
        imagem: img,
        description: document.getElementById('newDescricao').value,
        descricao: document.getElementById('newDescricao').value,
        variations: variacoes,
        paused: false,
        createdAt: Date.now(),
        updatedAt: Date.now()
      };

      const pathProd = typeof window.getAbellaPath === 'function' ? window.getAbellaPath('products') : 'products';
      await STATE.db.ref(pathProd).push(novoProduto);
      fecharDrawer();
      await carregarTudo();
    } catch (e) { console.error(e); setStatus('❌ Erro ao criar novo produto', 'error'); }
  }

    try {

      const slug = gerarSlug(nome);
      if(STATE.categorias[slug]) return alert('Já existe uma categoria cadastrada com um nome idêntico!');

      const imgVal = document.getElementById('newCatImagem').value.trim();
      const pathCat = typeof window.getAbellaPath === 'function' ? window.getAbellaPath(`categories/${slug}`) : `categories/${slug}`;

      await STATE.db.ref(pathCat).set({
        name: nome,
        description: document.getElementById('newCatDesc').value,
        imagem: imgVal,
        image: imgVal,
        createdAt: Date.now(),
        updatedAt: Date.now()
      });
      fecharDrawer();
      await carregarTudo();
    } catch (e) { setStatus('❌ Erro ao salvar categoria', 'error'); }
  }

  async function salvarNovaSubcategoria() {
    try {

      const slug = gerarSlug(nome);
      if(STATE.categorias[parent]?.subcategories?.[slug]) return alert('Esta subcategoria já existe dentro desta categoria pai!');

      const gridVal = document.getElementById('newSubGrid').value.trim();
      const heroVal = document.getElementById('newSubHero').value.trim();
      const pathSub = typeof window.getAbellaPath === 'function' ? window.getAbellaPath(`categories/${parent}/subcategories/${slug}`) : `categories/${parent}/subcategories/${slug}`;

      await STATE.db.ref(pathSub).set({
        name: nome,
        title: nome,
        description: document.getElementById('newSubDesc').value,
        imagem: gridVal,
        grid: gridVal,
        gridImage: gridVal,
        hero: heroVal,
        heroImage: heroVal,
        createdAt: Date.now(),
        updatedAt: Date.now()
      });

      fecharDrawer();
      await carregarTudo();

  function editarProduto(id) {
    const p = STATE.produtos.find(prod => prod.id === id);
    if (!p) return;

    let catsHtml = '';
    Object.keys(STATE.categorias).forEach(cat => catsHtml += `<option value="${escapeHtml(cat)}" ${p.category === cat ? 'selected' : ''}>${escapeHtml(cat)}</option>`);
    
    let subCatsHtml = '<option value="">Nenhuma</option>';
    if (p.category && STATE.categorias[p.category]?.subcategories) {
      Object.entries(STATE.categorias[p.category].subcategories).forEach(([slug, s]) => {
        subCatsHtml += `<option value="${escapeHtml(slug)}" ${DataService.getSubcategory(p) === slug ? 'selected' : ''}>${escapeHtml(s.name || slug)}</option>`;
      });
    }

    const imgUrl = converterGsUrl(DataService.getImage(p));

    abrirDrawer('Editar Produto', `

        <div>
          <label class="text-xs text-zinc-400 block mb-1">Preço (R$)</label>
          <input id="editPreco" type="number" step="0.01" class="input-dark" value="${DataService.getPrice(p)}">
        </div>
        <div>
          <label class="text-xs text-zinc-400 block mb-1">Peso (g)</label>
          <input id="editPeso" type="number" step="0.01" class="input-dark" value="${DataService.getWeight(p)}">
        </div>
      </div>

      <label class="text-xs text-zinc-400 block mb-1">Categoria</label>
      <select id="editCategoria" class="input-dark" onchange="carregarSubcategoriasProdutoEdicao()">${catsHtml}</select>

        </div>
        <div class="grid grid-cols-12 gap-2 px-1 mb-1 text-[10px] text-zinc-500 font-bold uppercase">
          <div class="col-span-3">Nome</div>
          <div class="col-span-3">Valor</div>
          <div class="col-span-3">Adic. Preço</div>
          <div class="col-span-2">Adic. Peso</div>
        </div>
        <div id="containerVariacoes"></div>

      <label class="text-xs text-zinc-400 block mb-1">Link de Imagem</label>
