<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Galvânicas Parceiras • Abella Joias</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { background: #09090b; color: #f4f4f5; font-family: 'Inter', sans-serif; }
        .serif { font-family: 'Cinzel', serif; }
        .gold { color: #caa85c; }
        .border-premium { border-color: #1e1e24; }
    </style>
</head>
<body class="min-h-screen pb-12">
    <header class="border-b border-premium bg-zinc-950/50 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="index.html" class="text-xs font-bold text-zinc-400 hover:text-white transition-all flex items-center gap-2">
                <span>←</span> Voltar para a Loja
            </a>
            <span class="text-xs font-mono tracking-widest text-[#caa85c] font-bold">ABELLA JOIAS</span>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-12 space-y-12">
        <div class="text-center max-w-2xl mx-auto space-y-3">
            <span class="text-[10px] bg-amber-500/10 text-amber-400 border border-amber-500/20 font-black px-3 py-1 rounded-full uppercase tracking-widest">
                Logística Integrada
            </span>
            <h1 class="text-3xl font-black tracking-tight text-white sm:text-4xl">
                Galvânicas Parceiras em Limeira
            </h1>
            <p class="text-sm text-zinc-400 leading-relaxed">
                Compre no bruto e nós entregamos direto na galvânica da sua preferência em Limeira. 
                <span class="text-[#caa85c] font-semibold block mt-1">Frete grátis para compras acima de R$100.</span>
            </p>
        </div>

        <div id="loading" class="text-center py-12 text-zinc-600 font-mono text-xs uppercase tracking-widest">
            ⏳ Carregando mapa de galvânicas parceiras...
        </div>

        <div id="grid-galvanicas" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <script src="js/firebase/firebase-config.js"></script>
    <script src="js/services/galvanicaService.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await carregarParceirosGalvanica();
        });

        async function carheiroGalvanica() {} 
        
        async function carregarParceirosGalvanica() {
            const grid = document.getElementById('grid-galvanicas');
            const loading = document.getElementById('loading');
            try {
                const parceiros = await galvanicaService.listarTodas();
                loading.classList.add('hidden');
                grid.innerHTML = '';

                if(!parceiros || parceiros.length === 0) {
                    grid.innerHTML = `
                        <div class="col-span-full bg-zinc-900/20 border border-zinc-800 rounded-2xl p-8 text-center text-zinc-500 text-xs italic">
                            Nenhuma galvânica credenciada para entrega direta no momento.
                        </div>
                    `;
                    return;
                }

                parceiros.forEach(g => {
                    if(g.paused) return;
                    const card = document.createElement('div');
                    card.className = "bg-zinc-950 border border-zinc-900 rounded-2xl p-6 space-y-4 flex flex-col justify-between hover:border-zinc-800 transition-all";
                    
                    card.innerHTML = `
                        <div class="space-y-2">
                            <div class="flex items-start justify-between">
                                <h3 class="text-white font-bold text-base tracking-tight">${g.name || g.nome}</h3>
                                <span class="text-[9px] bg-zinc-900 text-zinc-400 px-2 py-0.5 rounded font-mono border border-zinc-800">Ativa</span>
                            </div>
                            <p class="text-xs text-zinc-500 leading-normal">${g.address || g.endereco || 'Bairro Industrial - Limeira/SP'}</p>
                        </div>
                        <div class="pt-4 border-t border-zinc-900 flex items-center justify-between">
                            <span class="text-[10px] font-mono text-[#caa85c]">⚡ Coleta Diária</span>
                            ${g.phone || g.whatsapp ? `
                            <a href="https://wa.me/${(g.phone || g.whatsapp).replace(/\D/g,'')}" target="_blank" class="text-xs bg-zinc-900 hover:bg-zinc-800 text-zinc-200 px-3 py-1.5 rounded-xl border border-zinc-800 transition-all">
                                Contato ➔
                            </a>` : ''}
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch(e) {
                console.error("Erro ao processar galvânicas parceiras:", e);
                loading.innerText = "❌ Falha na conexão com o banco de logística.";
            }
        }
    </script>
</body>
</html>
