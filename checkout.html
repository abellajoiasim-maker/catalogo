<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Finalizar Pedido • Abella Joias</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { background:#0b0b0b; color:#eee; font-family:'Inter', sans-serif; min-height: 100vh; }
        .serif { font-family:'Cinzel', serif; }
        .gold { color:#caa85c; }
        .bg-card { background:#141414; border:1px solid #2a2a2a; }
    </style>
</head>
<body class="pb-12">
    <header class="sticky top-0 bg-black/90 backdrop-blur border-b border-[#222] z-50">
        <div class="max-w-6xl mx-auto p-5 flex justify-between items-center">
            <a href="carrinho.html" class="text-xs text-gray-400 hover:text-white transition-all flex items-center gap-1">
                ← Ajustar Carrinho
            </a>
            <h1 class="serif gold text-sm uppercase tracking-widest">Checkout Seguro</h1>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4 lg:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="grid col-span-1 lg:col-span-2 space-y-4">
            <div class="bg-card rounded-2xl p-5 space-y-4">
                <h2 class="serif gold text-sm uppercase tracking-wider border-b border-zinc-900 pb-2">Identificação Obrigatória</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="space-y-1 text-left">
                        <label class="text-[10px] text-gray-400 uppercase font-bold">Nome Completo / Empresa:</label>
                        <input type="text" id="cliNome" class="w-full bg-black border border-zinc-800 rounded-xl px-3 py-2 text-sm text-white focus:border-[#caa85c] outline-none local-persist">
                    </div>
                    <div class="space-y-1 text-left">
                        <label class="text-[10px] text-gray-400 uppercase font-bold">WhatsApp de Contato:</label>
                        <input type="tel" id="cliWhats" placeholder="(19) 99999-0000" class="w-full bg-black border border-zinc-800 rounded-xl px-3 py-2 text-sm text-white focus:border-[#caa85c] outline-none local-persist">
                    </div>
                </div>

                <h3 class="text-xs font-bold uppercase text-gray-400 tracking-wider pt-4 border-t border-zinc-900 text-left">Logística de Entrega (Limeira ou Transportadora)</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3 text-left">
                    <div class="md:col-span-2 space-y-1">
                        <label class="text-[10px] text-zinc-500 uppercase font-bold">Nome da Galvânica ou Local de Entrega:</label>
                        <input type="text" id="entLocal" placeholder="Ex: Galvânica Americana" class="w-full bg-black border border-zinc-800 rounded-xl px-3 py-2 text-xs text-white focus:border-[#caa85c] outline-none local-persist">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] text-zinc-500 uppercase font-bold">Cidade:</label>
                        <input type="text" id="entCidade" value="Limeira - SP" class="w-full bg-black border border-zinc-800 rounded-xl px-3 py-2 text-xs text-white focus:border-[#caa85c] outline-none local-persist">
                    </div>
                </div>

                <div class="space-y-1 text-left pt-2">
                    <label class="text-[10px] text-gray-400 uppercase font-bold">Meio de Pagamento Preferencial:</label>
                    <select id="cliPagamento" class="w-full bg-black border border-zinc-800 rounded-xl px-3 py-2.5 text-sm text-white focus:border-[#caa85c] outline-none font-bold">
                        <option value="PIX">À Vista no PIX (5% de Desconto)</option>
                        <option value="Cartão de Crédito">Cartão de Crédito (Até 6x sem juros)</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="col-span-1">
            <div class="bg-card rounded-2xl p-5 space-y-4">
                <h2 class="serif gold text-sm uppercase tracking-wider border-b border-zinc-900 pb-2">Resumo Final</h2>
                <div class="space-y-2 text-xs font-mono text-gray-400 text-left">
                    <div class="flex justify-between"><span>Itens:</span><span id="finQtd" class="text-white font-bold">0</span></div>
                    <div class="flex justify-between"><span>Peso total:</span><span id="finPeso" class="text-white font-bold">0g</span></div>
                    <div class="flex justify-between border-t border-zinc-900 pt-2 text-sm">
                        <span class="text-white">Total Geral:</span>
                        <span id="finTotal" class="gold font-black text-lg">R$ 0,00</span>
                    </div>
                </div>
                <button onclick="processarEEnviarPedido()" class="w-full bg-[#caa85c] hover:bg-[#bda152] text-black font-black py-4 rounded-xl text-xs uppercase tracking-widest transition-all shadow-xl">
                    🚀 Confirmar e Chamar no WhatsApp
                </button>
            </div>
        </div>
    </main>

    <script src="js/firebase/firebase-config.js"></script>
    <script src="js/utils/money.js"></script>
    <script src="js/utils/storage.js"></script>
    <script src="js/services/carrinhoService.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const resumo = carrinhoService.getResumo();
            document.getElementById('finQtd').innerText = `${resumo.totalItens} pçs`;
            document.getElementById('finPeso').innerText = `${resumo.pesoTotal.toFixed(2)}g`;
            document.getElementById('finTotal').innerText = money.formatar(resumo.subtotal);

            // Carrega cache local
            document.querySelectorAll('.local-persist').forEach(el => {
                const salvo = localStorage.getItem(`chk_${el.id}`);
                if(salvo) el.value = salvo;
                el.addEventListener('input', () => localStorage.setItem(`chk_${el.id}`, el.value));
            });
        });

async function processarEEnviarPedido() {

    const nome =
        document.getElementById('cliNome')
        .value.trim();

    const whats =
        document.getElementById('cliWhats')
        .value.trim();

    const localEntrega =
        document.getElementById('entLocal')
        .value.trim();

    const cidade =
        document.getElementById('entCidade')
        .value.trim();

    const pagamento =
        document.getElementById('cliPagamento')
        .value;

    if (!nome || !whats || !localEntrega) {

        alert(
            "Preencha Nome, WhatsApp e Local de Entrega."
        );

        return;
    }

    const itens =
        CarrinhoService.getItens();

    if (!itens.length) {

        alert(
            "Seu carrinho está vazio."
        );

        return;
    }

    const resumo =
        CarrinhoService.calcularTotais();

    const desconto =
        pagamento === "PIX"
            ? resumo.descontoPix
            : 0;

    const totalFinal =
        pagamento === "PIX"
            ? resumo.totalPix
            : resumo.subtotal;

    try {

        const totalPedidosSnapshot =
            await firebase
                .database()
                .ref('abella/orders')
                .once('value');

        const quantidadePedidos =
            totalPedidosSnapshot.numChildren();

        const numeroPedido =
            `AB-${String(
                quantidadePedidos + 1
            ).padStart(6, '0')}`;

        const novoPedidoRef =
            firebase
                .database()
                .ref('abella/orders')
                .push();

        const pedido = {

            numeroPedido,

            cliente: nome,

            whats,

            cidade,

            formaPagamento:
                pagamento,

            observacoes: "",

            subtotal:
                resumo.subtotal,

            desconto,

            frete: 0,

            total:
                totalFinal,

            pesoTotal:
                Number(
                    resumo.pesoTotal
                    .toFixed(2)
                ),

            totalPecas:
                resumo.totalPecas,

            status: "Novo",

            entrega: {

                nome:
                    localEntrega,

                endereco: "",

                numero: "",

                bairro: ""
            },

            itens
        };

        await novoPedidoRef.set(
            pedido
        );

        let msg =
            `*NOVO PEDIDO - ABELLA JOIAS*\n\n`;

        msg +=
            `*Pedido:* ${numeroPedido}\n`;

        msg +=
            `*Cliente:* ${nome}\n`;

        msg +=
            `*WhatsApp:* ${whats}\n`;

        msg +=
            `*Cidade:* ${cidade}\n`;

        msg +=
            `*Local Entrega:* ${localEntrega}\n`;

        msg +=
            `*Pagamento:* ${pagamento}\n`;

        msg +=
            `*Peças:* ${resumo.totalPecas}\n`;

        msg +=
            `*Peso:* ${resumo.pesoTotal.toFixed(2)}g\n`;

        msg +=
            `*Subtotal:* ${money.formatar(resumo.subtotal)}\n`;

        if (desconto > 0) {

            msg +=
                `*Desconto PIX:* ${money.formatar(desconto)}\n`;
        }

        msg +=
            `*Total:* ${money.formatar(totalFinal)}\n\n`;

        msg +=
            `_Pedido aguardando conferência financeira._`;

        CarrinhoService.limpar();

        const url =
            `https://api.whatsapp.com/send?phone=5519988207658&text=${encodeURIComponent(msg)}`;

        window.open(
            url,
            '_blank'
        );

        window.location.href =
            'index.html';

    } catch (erro) {

        console.error(
            "Erro ao criar pedido:",
            erro
        );

        alert(
            "Não foi possível concluir o pedido."
        );
    }
}
    </script>
</body>
</html>
