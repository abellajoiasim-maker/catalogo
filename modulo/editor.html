<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Super Editor V7 • Gestão Avançada</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>

  <script src="../js/firebase/firebase-config.js"></script>

  <style>
    .input-dark {
      background-color: rgb(24 24 27);
      border: 1px solid rgb(39 39 42);
      color: white;
      border-radius: 0.5rem;
      padding: 0.75rem;
      width: 100%;
      margin-bottom: 0.5rem;
    }

    .tab-btn.active {
      background: #caa85c;
      color: black;
      font-weight: 700;
      border-radius: 0.75rem;
      padding: 0.5rem 1rem;
      font-size: 0.75rem;
    }

    .tab-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      color: white;
      border-radius: 0.75rem;
      padding: 0.5rem 1rem;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .tab-btn:hover {
      background: rgba(255,255,255,0.10);
    }
    
    /* Customização de Scrollbar para o ecossistema Escuro do Painel */
    .class-scrollbar-custom::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .class-scrollbar-custom::-webkit-scrollbar-track {
      background: transparent;
    }
    .class-scrollbar-custom::-webkit-scrollbar-thumb {
      background: #27272a;
      border-radius: 9999px;
    }
    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>

<body class="bg-black text-white p-4 md:p-8">
  
  <div class="max-w-7xl mx-auto space-y-6">

    <header class="bg-zinc-950 border border-zinc-900 rounded-2xl p-5">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
        <div>
          <h1 class="text-2xl font-bold text-[#caa85c]">Super Editor V7</h1>
          <p class="text-xs text-zinc-500">Controle Total • Criação, Edição e Imagens Sincronizadas em Espelho</p>
        </div>
        <div class="flex flex-wrap gap-2 w-full sm:w-auto">
          <button id="btnCriarNovo" onclick="abrirCriacaoPorAba()" class="flex-1 sm:flex-none px-4 py-2 bg-[#caa85c] text-black rounded-xl text-xs font-bold hover:bg-opacity-90 transition-all">
            ➕ Criar Item
          </button>
          <button id="btnRefresh" class="flex-1 sm:flex-none px-4 py-2 bg-zinc-900 border border-zinc-800 text-zinc-300 rounded-xl text-xs font-bold hover:bg-zinc-800 transition-all">
            Sincronizar Vitrine
          </button>
        </div>
      </div>
    </header>

    <section class="grid grid-cols-2 md:grid-cols-4 gap-3">
      <div class="bg-zinc-950 border border-zinc-900 rounded-xl p-4">
        <div class="text-zinc-500 text-[10px]">Produtos</div>
        <div id="statProdutos" class="text-2xl font-bold">0</div>
      </div>
      <div class="bg-zinc-950 border border-zinc-900 rounded-xl p-4">
        <div class="text-zinc-500 text-[10px]">Categorias</div>
        <div id="statCategorias" class="text-2xl font-bold">0</div>
      </div>
      <div class="bg-zinc-950 border border-zinc-900 rounded-xl p-4">
        <div class="text-zinc-500 text-[10px]">Subcategorias</div>
        <div id="statSubs" class="text-2xl font-bold">0</div>
      </div>
      <div class="bg-zinc-950 border border-zinc-900 rounded-xl p-4">
        <div class="text-zinc-500 text-[10px]">Pausados</div>
        <div id="statPausados" class="text-2xl font-bold">0</div>
      </div>
    </section>

    <section class="bg-zinc-950 border border-zinc-900 rounded-xl p-4">
      <div class="grid grid-cols-1 md:grid-cols-5 gap-3">
        <input
          id="buscaGlobal"
          type="text"
          class="w-full md:col-span-2 bg-zinc-900 border border-zinc-800 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-zinc-700 placeholder-zinc-500"
          placeholder="Buscar SKU, Nome, Categoria..."
        />
        <select id="filtroTipo" class="bg-zinc-900 border border-zinc-800 rounded-lg p-3 text-sm text-white focus:outline-none">
          <option value="todos">Todos</option>
          <option value="produto">Produtos</option>
          <option value="categoria">Categorias</option>
          <option value="subcategoria">Subcategorias</option>
        </select>
        <select id="filtroCategoria" class="bg-zinc-900 border border-zinc-800 rounded-lg p-3 text-sm text-white focus:outline-none">
          <option value="">Todas Categorias</option>
        </select>
        <select id="filtroSubcategoria" class="bg-zinc-900 border border-zinc-800 rounded-lg p-3 text-sm text-white focus:outline-none">
          <option value="">Todas Subcategorias</option>
        </select>
      </div>
    </section>

    <section class="flex gap-2 overflow-x-auto scrollbar-none pb-2 md:pb-0">
      <button class="tab-btn active whitespace-nowrap" data-tab="produtos" type="button">Produtos</button>
      <button class="tab-btn whitespace-nowrap" data-tab="categorias" type="button">Categorias</button>
      <button class="tab-btn whitespace-nowrap" data-tab="subcategorias" type="button">Subcategorias</button>
    </section>

    <section class="bg-zinc-950/40 rounded-2xl border border-zinc-900 overflow-hidden">
      <div class="overflow-x-auto w-full class-scrollbar-custom">
        <div id="tab-produtos" class="grid grid-cols-1 gap-3 p-1"></div>
        <div id="tab-categorias" class="hidden grid grid-cols-1 gap-3 p-1"></div>
        <div id="tab-subcategorias" class="hidden grid grid-cols-1 gap-3 p-1"></div>
      </div>
    </section>

    <div id="status" class="text-xs text-zinc-500 mt-6"></div>
  </div>

  <div id="drawer" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden transition-opacity duration-300">
    <div class="fixed inset-y-0 right-0 w-full sm:max-w-xl bg-zinc-950 border-l border-zinc-800 shadow-2xl flex flex-col h-full transform translate-x-full transition-transform duration-300" id="drawerContainer">
      
      <div class="p-6 border-b border-zinc-800 flex items-center justify-between bg-zinc-900/40">
        <h3 id="drawerTitle" class="text-lg font-bold text-white tracking-wide">Editar Registro</h3>
        <button onclick="fecharDrawer()" class="text-zinc-400 hover:text-white bg-zinc-800/50 px-3 py-1.5 rounded-xl transition text-xs">
          ✕ Fechar
        </button>
      </div>

      <div class="flex-1 overflow-y-auto p-6 space-y-4 class-scrollbar-custom">
        </div>

      <div class="p-4 border-t border-zinc-800 bg-zinc-950 flex gap-3">
        <button onclick="fecharDrawer()" class="flex-1 bg-zinc-900 hover:bg-zinc-800 text-zinc-400 font-medium py-3 rounded-xl transition text-sm">
          Cancelar
        </button>
        <button id="btnSalvarDrawer" class="flex-1 bg-[#caa85c] hover:bg-[#bfa054] text-black font-bold py-3 rounded-xl transition text-sm">
          Salvar Alterações
        </button>
      </div>

    </div>
  </div>

  <script>
    const db = firebase.database();
  function resolverDB() {
    if (window.db) return window.db;
    if (window.firebase && window.firebase.apps && window.firebase.apps.length > 0) {
      return window.firebase.database();
    }
    return null;
  }

  const statusEl = document.getElementById('status');
  const STATE = {
    db: null,
    produtos: [],
    categorias: {},
    buscaDebounceTimer: null
  };

  const CONFIG = {
    debounceBusca: 200,
    firebaseRetries: 30,
    firebaseRetryDelay: 100
  };

  const DataService = {
    getSubcategory(obj) { return obj?.subcategory ?? obj?.subCategory ?? ''; },
    getImage(obj) { return obj?.imagem ?? obj?.image ?? obj?.img ?? ''; },
    getPrice(obj) { return Number(obj?.preco ?? obj?.price ?? 0); },
    getWeight(obj) { return Number(obj?.peso ?? obj?.weight ?? 0); },
    getDesc(obj) { return obj?.description ?? obj?.descricao ?? ''; },
    getDizeres(obj) { return obj?.dizeres ?? obj?.sayings ?? []; },
    getIniciais(obj) { return obj?.iniciais ?? obj?.initials ?? []; }
  };

  function setStatus(msg, type = 'info') {
    const color = type === 'error' ? 'text-red-400' : type === 'ok' ? 'text-green-400' : 'text-zinc-500';
    statusEl.className = `text-xs mt-6 ${color}`;
    statusEl.textContent = msg;
  }

  function escapeHtml(str) {
    return String(str ?? '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;');
  }

  function escapeAttr(str) {
    return String(str ?? '').replaceAll("'", "\\'").replaceAll('"', '&quot;');
  }

  function gerarSlug(texto) {
    return texto.toString().toLowerCase().trim()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9 -]/g, '')
      .replace(/\s+/g, '-')
      .replace(/-+/g, '-');
  }

  function converterGsUrl(url) {
    let stringUrl = String(url ?? '').trim();
    if (!stringUrl) return '';
    if (stringUrl.includes('drive.google.com')) {
      try {
        let idArquivo = '';
        if (stringUrl.includes('/d/')) idArquivo = stringUrl.split('/d/')[1].split('/')[0];
        else if (stringUrl.includes('id=')) idArquivo = stringUrl.split('id=')[1].split('&')[0];
        if (idArquivo) return `https://drive.google.com/uc?export=view&id=${idArquivo}`;
      } catch (e) {}
    }
    if (stringUrl.startsWith('gs://')) {
      try {
        const semProtocolo = stringUrl.replace('gs://', '');
        const idx = semProtocolo.indexOf('/');
        if (idx === -1) return stringUrl;
        return `https://firebasestorage.googleapis.com/v1/b/${semProtocolo.substring(0, idx)}/o/${encodeURIComponent(semProtocolo.substring(idx + 1))}?alt=media`;
      } catch (e) {}
    }
    return stringUrl;
  }

  function tratarInputImagem(inputValue, imgElementId) {
  const previewImg = document.getElementById(imgElementId);
  if (!previewImg) return;

  let urlFinal = inputValue ? inputValue.trim() : '';
  if (!urlFinal) {
    previewImg.src = '';
    previewImg.classList.add('hidden');
    return;
  }

  // Se for caminho do Storage gs://, faz a conversão direta para HTTP estável
  if (urlFinal.startsWith('gs://')) {
    const semGs = urlFinal.replace('gs://', '');
    const primeiraBarra = semGs.indexOf('/');
    if (primeiraBarra !== -1) {
      const bucket = semGs.substring(0, primeiraBarra);
      const caminho = semGs.substring(primeiraBarra + 1);
      urlFinal = `https://firebasestorage.googleapis.com/v0/b/${bucket}/o/${encodeURIComponent(caminho)}?alt=media`;
    }
  }

  previewImg.src = urlFinal;
  previewImg.classList.remove('hidden');
  
  previewImg.onerror = () => {
    previewImg.classList.add('hidden');
    console.warn('Caminho de imagem inválido para pré-visualização no editor.');
  };
}

  function handleImageError(img) {
    img.style.opacity = '0';
    const container = img.parentNode;
    if (container) {
      const fallback = container.querySelector('.fallback-container');
      if (fallback) fallback.style.display = 'flex';
    }
  }

 function abrirDrawer(titulo, html) {
    document.getElementById('drawerTitle').textContent = titulo;
    
    // Localiza a div interna de conteúdo que está logo abaixo do cabeçalho do drawer
    const containerInterno = document.getElementById('drawerContainer').querySelector('.flex-1');
    if (containerInterno) {
      containerInterno.innerHTML = html;
    }
    
    // Remove a classe hidden e aplica a animação visual de deslizar
    const drawerGeral = document.getElementById('drawer');
    const drawerMenu = document.getElementById('drawerContainer');
    
    drawerGeral.classList.remove('hidden');
    setTimeout(() => {
      drawerMenu.classList.remove('translate-x-full');
    }, 50);
  }

  function fecharDrawer() {
    const drawerMenu = document.getElementById('drawerContainer');
    const drawerGeral = document.getElementById('drawer');
    
    drawerMenu.addClassList ? drawerMenu.classList.add('translate-x-full') : drawerMenu.style.transform = 'translateX(100%)';
    
    // Aguarda a animação terminar para esconder o container de fundo
    setTimeout(() => {
      drawerGeral.classList.add('hidden');
      const containerInterno = document.getElementById('drawerContainer').querySelector('.flex-1');
      if (containerInterno) containerInterno.innerHTML = '';
    }, 300);
  }
  function abrirCriacaoPorAba() {
    const tab = getActiveTab();
    if (tab === 'produtos') criarProdutoForm();
    else if (tab === 'categorias') criarCategoriaForm();
    else if (tab === 'subcategorias') criarSubcategoriaForm();
  }

  async function carregarTudo(){
    try {
      const snapCat = await STATE.db.ref(window.getAbellaPath('categories')).once('value');
      STATE.categorias = snapCat.val() || {};

      const snapProd = await STATE.db.ref(window.getAbellaPath('products')).once('value');
      const dados = snapProd.val() || {};
      STATE.produtos = Object.entries(dados).map(([id, p]) => ({ id, ...p }));

      popularFiltros();
      renderAll();
      setStatus('✅ Catálogo perfeitamente sincronizado com as páginas de venda', 'ok');
    } catch(err) {
      setStatus('❌ Erro de conexão com o banco de dados Firebase', 'error');
    }
  }

  function atualizarEstatisticas() {
    document.getElementById('statProdutos').innerText = STATE.produtos.length;
    document.getElementById('statCategorias').innerText = Object.keys(STATE.categorias).length;
    let totalSubs = 0;
    Object.values(STATE.categorias).forEach(cat => totalSubs += Object.keys(cat?.subcategories || {}).length);
    document.getElementById('statSubs').innerText = totalSubs;
    document.getElementById('statPausados').innerText = STATE.produtos.filter(p => p.paused).length;
  }

  function popularFiltros() {
    const selCat = document.getElementById('filtroCategoria');
    const selSub = document.getElementById('filtroSubcategoria');
    if (!selCat || !selSub) return;

    let catOptions = `<option value="">Todas Categorias</option>`;
    Object.keys(STATE.categorias).forEach(c => catOptions += `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`);
    selCat.innerHTML = catOptions;

    const allSubs = new Set();
    Object.values(STATE.categorias).forEach(cat => Object.keys(cat?.subcategories || {}).forEach(s => allSubs.add(s)));
    let subOptions = `<option value="">Todas Subcategorias</option>`;
    [...allSubs].forEach(s => subOptions += `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`);
    selSub.innerHTML = subOptions;
  }

  function getActiveTab() {
    return document.querySelector('.tab-btn.active')?.dataset?.tab || 'produtos';
  }

  function renderCurrentTab() {
    const t = getActiveTab();
    const btn = document.getElementById('btnCriarNovo');
    if(btn) {
      if (t === 'produtos') btn.innerText = "➕ Novo Produto";
      else if (t === 'categorias') btn.innerText = "➕ Nova Categoria";
      else if (t === 'subcategorias') btn.innerText = "➕ Nova Subcategoria";
    }

    if (t === 'produtos') renderProdutos();
    else if (t === 'categorias') renderCategorias();
    else if (t === 'subcategorias') renderSubcategorias();
  }

  function renderAll() {
    atualizarEstatisticas();
    renderCurrentTab();
  }

  // Métodos auxiliares para gerenciar as tags dinâmicas de Dizeres e Iniciais na UI do Drawer
  function adicionarTagInput(containerId, valor = '') {
    const container = document.getElementById(containerId);
    if (!container) return;
    const wrapper = document.createElement('div');
    wrapper.className = 'flex gap-2 mb-1 items-center tag-item-row';
    wrapper.innerHTML = `
      <input type="text" class="input-dark !mb-0 tag-value-input" value="${escapeHtml(valor)}" placeholder="Ex: Amor, Fé, A, B...">
      <button type="button" onclick="this.parentNode.remove()" class="bg-zinc-900 border border-zinc-800 text-red-400 px-3 py-2 rounded-lg hover:bg-zinc-800 text-xs">✕</button>
    `;
    container.appendChild(wrapper);
  }

  function extrairValoresTags(containerId) {
    const container = document.getElementById(containerId);
    if (!container) return [];
    const inputs = container.querySelectorAll('.tag-value-input');
    return Array.from(inputs).map(inp => inp.value.trim()).filter(val => val !== '');
  }

  // ==========================================================
  // RENDERIZADORES DAS LISTAGENS
  // ==========================================================
  function renderProdutos() {
    const container = document.getElementById('tab-produtos');
    if (!container) return;

    const termos = (document.getElementById('buscaGlobal').value || '').toLowerCase();
    const filtroCat = document.getElementById('filtroCategoria').value;
    const filtroSub = document.getElementById('filtroSubcategoria').value;

    const filtrados = STATE.produtos.filter(p => {
      const texto = (p.name || '').toLowerCase() + ' ' + (p.sku || '').toLowerCase() + ' ' + (p.category || '').toLowerCase() + ' ' + (DataService.getSubcategory(p)).toLowerCase();
      return (termos === '' || texto.includes(termos)) && (!filtroCat || p.category === filtroCat) && (!filtroSub || DataService.getSubcategory(p) === filtroSub);
    });

    if (filtrados.length === 0) {
      container.innerHTML = `<div class="text-sm text-zinc-500 p-4">Nenhum produto correspondente.</div>`;
      return;
    }

    let html = '';
    filtrados.forEach(p => {
      const isPaused = p.paused;
      const cardBg = isPaused ? 'bg-zinc-950 opacity-60 border-red-900/40' : 'bg-zinc-950 border-zinc-900';
      const statusTag = isPaused ? `<span class="bg-red-950 text-red-400 border border-red-800 text-[10px] px-2 py-0.5 rounded-full font-bold">PAUSADO</span>` : `<span class="bg-green-950 text-green-400 border border-green-800 text-[10px] px-2 py-0.5 rounded-full font-bold">ATIVO</span>`;
      const imgUrl = converterGsUrl(DataService.getImage(p));

      // Extrai contadores das variações cadastrados para exibir no card corporativo
      const qtdDizeres = DataService.getDizeres(p).length;
      const qtdIniciais = DataService.getIniciais(p).length;

      html += `
        <div class="border rounded-2xl p-5 mb-1 transition-all hover:border-zinc-800 ${cardBg}">
          <div class="flex flex-col lg:flex-row gap-5 items-start lg:items-center justify-between">
            <div class="flex items-center gap-4 w-full lg:w-auto">
              <div class="w-20 h-20 bg-zinc-900 border border-zinc-800 rounded-xl overflow-hidden flex-shrink-0 flex items-center justify-center relative">
                <div class="fallback-container absolute inset-0 flex items-center justify-center bg-zinc-900 text-[10px] text-zinc-600">Sem Foto</div>
                ${DataService.getImage(p) ? `<img src="${escapeHtml(imgUrl)}" class="w-full h-full object-cover relative z-10" onerror="handleImageError(this)"/>` : ''}
              </div>
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2 mb-1">
                  ${statusTag}
                  <span class="text-xs font-mono text-zinc-400 bg-zinc-900 px-2 py-0.5 rounded border border-zinc-800">${escapeHtml(p.sku || 'SEM SKU')}</span>
                </div>
                <h3 class="font-bold text-base text-white truncate">${escapeHtml(p.name || 'Sem nome definido')}</h3>
                <p class="text-xs text-zinc-500 line-clamp-1 mt-0.5">${escapeHtml(DataService.getDesc(p) || 'Sem descrição cadastrada.')}</p>
                
                <div class="flex gap-2 mt-2">
                  <span class="text-[10px] bg-zinc-900 text-zinc-400 px-2 py-0.5 rounded border border-zinc-800 font-medium">💬 Dizeres: ${qtdDizeres}</span>
                  <span class="text-[10px] bg-zinc-900 text-zinc-400 px-2 py-0.5 rounded border border-zinc-800 font-medium">🔤 Iniciais: ${qtdIniciais}</span>
                </div>
              </div>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 w-full lg:flex-1 max-w-3xl bg-zinc-900/40 p-3 rounded-xl border border-zinc-900">
              <div>
                <span class="text-[10px] text-zinc-500 block uppercase font-bold tracking-wider">Preço</span>
                <span class="text-sm font-semibold text-[#caa85c]">R$ ${DataService.getPrice(p).toFixed(2)}</span>
              </div>
              <div>
                <span class="text-[10px] text-zinc-500 block uppercase font-bold tracking-wider">Peso</span>
                <span class="text-sm font-semibold text-zinc-300">${DataService.getWeight(p)}g</span>
              </div>
              <div>
                <span class="text-[10px] text-zinc-500 block uppercase font-bold tracking-wider">Categoria</span>
                <span class="text-xs font-semibold text-zinc-400 truncate block">${escapeHtml(p.category || '—')}</span>
              </div>
              <div>
                <span class="text-[10px] text-zinc-500 block uppercase font-bold tracking-wider">Subcategoria</span>
                <span class="text-xs font-semibold text-zinc-400 truncate block">${escapeHtml(DataService.getSubcategory(p) || '—')}</span>
              </div>
            </div>

            <div class="flex gap-2 w-full lg:w-auto justify-end border-t border-zinc-900 lg:border-none pt-3 lg:pt-0">
              <button onclick="editarProduto('${escapeAttr(p.id)}')" class="bg-zinc-900 border border-zinc-800 p-2.5 rounded-xl hover:bg-zinc-800 text-zinc-300 transition-colors">✏️ Editar</button>
              <button onclick="duplicarProduto('${escapeAttr(p.id)}')" class="bg-zinc-900 border border-zinc-800 p-2.5 rounded-xl hover:bg-zinc-800 text-zinc-300 transition-colors">📄</button>
              <button onclick="pausarProduto('${escapeAttr(p.id)}')" class="bg-zinc-900 border border-zinc-800 p-2.5 rounded-xl hover:bg-zinc-800 text-zinc-300 transition-colors">⏸️</button>
              <button onclick="deletarProduto('${escapeAttr(p.id)}')" class="bg-zinc-900 border border-zinc-800 p-2.5 rounded-xl hover:border-red-950 text-red-400 transition-colors">🗑️</button>
            </div>
          </div>
        </div>`;
    });
    container.innerHTML = html;
  }

  function renderCategorias() {
    const el = document.getElementById('tab-categorias');
    if (!el) return;
    let html = '';
    Object.entries(STATE.categorias).forEach(([slug, cat]) => {
      const catImg = cat.imagem || cat.image || '';
      html += `
        <div class="bg-zinc-950 border border-zinc-900 rounded-xl p-4">
          <div class="flex items-center justify-between gap-4">

  async function salvarNovoProduto() {
  try {
    const nomeEl = document.getElementById('newNome');
    const skuEl = document.getElementById('newSku');
    const catEl = document.getElementById('newCategoria');
    const subcatEl = document.getElementById('newSubcategoria');
    const descEl = document.getElementById('newDescricao');
    const imgEl = document.getElementById('newImagem');
    const precoEl = document.getElementById('newPreco');
    const pesoEl = document.getElementById('newPeso');

    if (!nomeEl || !skuEl) {
      setStatus('❌ Erro: Campos fundamentais de criação ausentes.', 'error');
      return;
    }

    const nome = nomeEl.value.trim();
    const sku = skuEl.value.trim();
    if (!nome || !sku) {
      setStatus('❌ Erro: Nome e SKU são obrigatórios.', 'error');
      return;
    }

    const preco = precoEl ? (parseFloat(precoEl.value) || 0) : 0;
    const peso = pesoEl ? (parseFloat(pesoEl.value) || 0) : 0;
    const subcat = subcatEl ? subcatEl.value : '';

    let listaDizeres = [];
    let listaIniciais = [];
    try {
      if (typeof extrairValoresTags === 'function') {
        listaDizeres = extrairValoresTags('newDizeresContainer') || [];
        listaIniciais = extrairValoresTags('newIniciaisContainer') || [];
      }
    } catch (e) {
      console.warn('Falha ao extrair tags na criação:', e);
    }

    // Gera um ID único baseado no timestamp para evitar colisões no Firebase
    const novoId = 'p_' + Date.now();

    const payload = {
      id: novoId,
      name: nome,
      sku: sku,
      category: catEl ? catEl.value : '',
      subcategory: subcat,
      subCategory: subcat,
      price: preco,
      preco: preco,
      weight: peso,
      peso: peso,
      image: imgEl ? imgEl.value.trim() : '',
      imagem: imgEl ? imgEl.value.trim() : '',
      description: descEl ? descEl.value.trim() : '',
      descricao: descEl ? descEl.value.trim() : '',
      ativo: true,
      dizeres: listaDizeres.length > 0 ? listaDizeres : null,
      sayings: listaDizeres.length > 0 ? listaDizeres : null,
      iniciais: listaIniciais.length > 0 ? listaIniciais : null,
      initials: listaIniciais.length > 0 ? listaIniciais : null,
      createdAt: Date.now(),
      updatedAt: Date.now()
    };

    let path = `products/${novoId}`;
    if (window && typeof window.getAbellaPath === 'function') {
      path = window.getAbellaPath(`products/${novoId}`);
    }

    await STATE.db.ref(path).set(payload);

    setStatus('✅ Novo produto cadastrado com sucesso!', 'success');
    fecharDrawer();
    await carregarTudo();

  } catch (e) {
    console.error('Erro ao criar novo produto:', e);
    setStatus('❌ Erro ao registrar novo produto no Firebase.', 'error');
  }
}

 async function salvarProduto(id) {
  try {
    if (!id) {
      setStatus('❌ Erro: ID do produto inválido.', 'error');
      return;
    }

    // 1. Captura e higienização dos elementos do DOM para evitar erros de ".value" de elementos inexistentes
    const nomeEl = document.getElementById('editNome');
    const skuEl = document.getElementById('editSku');
    const catEl = document.getElementById('editCategoria');
    const subcatEl = document.getElementById('editSubcategoria');
    const descEl = document.getElementById('editDescricao');
    const imgEl = document.getElementById('editImagem');
    const precoEl = document.getElementById('editPreco');
    const pesoEl = document.getElementById('editPeso');

    // Validações básicas e fallback seguro (se o campo não existir na tela, assume vazio ou zero)
    const nome = nomeEl ? nomeEl.value.trim() : '';
    const sku = skuEl ? skuEl.value.trim() : '';
    const category = catEl ? catEl.value : '';
    const subcat = subcatEl ? subcatEl.value : '';
    const description = descEl ? descEl.value.trim() : '';
    const img = imgEl ? imgEl.value.trim() : '';
    const preco = precoEl ? (parseFloat(precoEl.value) || 0) : 0;
    const peso = pesoEl ? (parseFloat(pesoEl.value) || 0) : 0;

    // 2. Extração segura das listas (Garante que se retornar vazio, envie null ou um array limpo)
    let listaDizeres = [];
    let listaIniciais = [];

    try {
      if (typeof extrairValoresTags === 'function') {
        listaDizeres = extrairValoresTags('editDizeresContainer') || [];
        listaIniciais = extrairValoresTags('editIniciaisContainer') || [];
      }
    } catch (errTags) {
      console.warn('[Aviso] Falha ao extrair tags/customizações:', errTags);
    }

    // 3. Montagem do objeto de atualização de forma simétrica (Mantém inglês e português)
    const payload = {
      name: nome,
      sku: sku,
      category: category,
      subcategory: subcat,
      subCategory: subcat, // Mantém compatibilidade com outros scripts antigos
      price: preco,
      preco: preco,
      weight: peso,
      peso: peso,
      image: img,
      imagem: img,
      description: description,
      descricao: description,
      // Se a lista estiver vazia, salvamos como null para limpar no Firebase e não gerar nós quebrados
      dizeres: listaDizeres.length > 0 ? listaDizeres : null,
      sayings: listaDizeres.length > 0 ? listaDizeres : null,
      iniciais: listaIniciais.length > 0 ? listaIniciais : null,
      initials: listaIniciais.length > 0 ? listaIniciais : null,
      updatedAt: Date.now()
    };

    // 4. Caminho dinâmico seguro do Firebase
    let path = `products/${id}`;
    if (window && typeof window.getAbellaPath === 'function') {
      path = window.getAbellaPath(`products/${id}`);
    }

    // 5. Persistência atômica no Banco
    await STATE.db.ref(path).update(payload);

    // Feedback visual de sucesso e fechamento do painel
    if (typeof setStatus === 'function') {
      setStatus('✅ Produto salvo com sucesso!', 'success');
    }
    
    if (typeof fecharDrawer === 'function') fecharDrawer();
    if (typeof carregarTudo === 'function') await carregarTudo();

  } catch (e) {
    console.error('Erro detalhado ao salvar no Firebase:', e);
    if (typeof setStatus === 'function') {
      setStatus('❌ Erro ao salvar dados no Firebase', 'error');
    }
  }
}

        imagem: imgVal,
        image: imgVal, 
        updatedAt: Date.now()
      });
      fecharDrawer();
      await carregarTudo();
    } catch(e) { setStatus('❌ Erro ao atualizar categoria', 'error'); }
  }

  async function duplicarProduto(id) {
    const p = STATE.produtos.find(prod => prod.id === id);
    if (!p) return;
    const copia = { ...p, sku: (p.sku || '') + '-COPY', createdAt: Date.now(), updatedAt: Date.now() };
    delete copia.id;
    await STATE.db.ref(window.getAbellaPath('products')).push(copia);
    await carregarTudo();
  }

  async function pausarProduto(id) {
    const p = STATE.produtos.find(prod => prod.id === id);
    if (!p) return;
    await STATE.db.ref(window.getAbellaPath(`products/${id}`)).update({ paused: !p.paused, updatedAt: Date.now() });
    await carregarTudo();
  }

  async function deletarProduto(id) {
    if (confirm('Deseja realmente excluir permanentemente este item da sua base?')) {
      await STATE.db.ref(window.getAbellaPath('products')).child(id).remove();
      await carregarTudo();
    }
  }

  async function deletarCategoria(slug) {
    if (confirm(`Deseja excluir a categoria [${slug}]? Isso não apagará os produtos, mas eles perderão o vínculo de menu.`)) {
      await STATE.db.ref(window.getAbellaPath(`categories/${slug}`)).remove();
      await carregarTudo();
    }
  }

  async function deletarSubcategoria(catSlug, subSlug) {
    if (confirm(`Deseja excluir a subcategoria [${subSlug}] da categoria [${catSlug}]?`)) {
      await STATE.db.ref(window.getAbellaPath(`categories/${catSlug}/subcategories/${subSlug}`)).remove();
      await carregarTudo();
    }
  }

  function wireSearch() {
    document.getElementById('buscaGlobal').addEventListener('input', () => {
      clearTimeout(STATE.buscaDebounceTimer);
      STATE.buscaDebounceTimer = setTimeout(renderCurrentTab, CONFIG.debounceBusca);
    });
    ['filtroTipo', 'filtroCategoria', 'filtroSubcategoria'].forEach(id => {
      document.getElementById(id)?.addEventListener('change', () => renderCurrentTab());
    });
  }

  function wireTabs() {
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        ['produtos', 'categories', 'subcategorias'].forEach(t => {
          const el = document.getElementById('tab-' + (t === 'categories' ? 'categorias' : t));
          if(el) el.classList.add('hidden');
        });
        const targetEl = document.getElementById('tab-' + btn.dataset.tab);
        if(targetEl) targetEl.classList.remove('hidden');
        renderCurrentTab();
      });
    });
  }

  (async function init() {
    let t = 0;
    // Aguarda o Firebase DB estar disponível
    while(!STATE.db && t < CONFIG.firebaseRetries){
      STATE.db = resolverDB();
      if(!STATE.db) { await new Promise(r => setTimeout(r, CONFIG.firebaseRetryDelay)); t++; }
    }
    if (!STATE.db) return setStatus('❌ Falha de carregamento do Firebase SDK', 'error');

    // Aguarda a função getAbellaPath estar disponível no escopo global
    let tPath = 0;
    while(typeof window.getAbellaPath !== 'function' && tPath < CONFIG.firebaseRetries){
      await new Promise(r => setTimeout(r, CONFIG.firebaseRetryDelay));
      tPath++;
    }

    // Se mesmo assim não carregar, cria um fallback temporário para não travar a UI
    if (typeof window.getAbellaPath !== 'function') {
      console.warn('Aviso: window.getAbellaPath não foi encontrada. Usando caminhos padrão.');
      window.getAbellaPath = function(p) { return p; }; 
    }

    wireTabs();
    wireSearch();
    document.getElementById('btnRefresh').addEventListener('click', () => carregarTudo());
    await carregarTudo();
  })();

  window.editarProduto = editarProduto; window.salvarProduto = salvarProduto;
  window.duplicarProduto = duplicarProduto; window.pausarProduto = pausarProduto;
  window.deletarProduto = deletarProduto; window.editarCategoria = editarCategoria;
  window.salvarCategoria = salvarCategoria; window.editarSubcategoria = editarSubcategoria;
  window.salvarSubcategoria = salvarSubcategoria; window.fecharDrawer = fecharDrawer;
  window.tratarInputImagem = tratarInputImagem; window.handleImageError = handleImageError;
  window.carregarSubcategoriasProduto = carregarSubcategoriasProduto;
  window.abrirCriacaoPorAba = abrirCriacaoPorAba; window.salvarNovoProduto = salvarNovoProduto;
  window.carregarSubcategoriasProdutoCriacao = carregarSubcategoriasProdutoCriacao;
  window.deletarCategoria = deletarCategoria; window.deletarSubcategoria = deletarSubcategoria;
  window.adicionarTagInput = adicionarTagInput;
  </script>
</body>
</html>
