<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Finalizar Pedido • Abella Joias</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }
        :root{
            --gold:#caa85c;
            --bg:#050505;
            --card:#111111;
            --line:#222222;
        }
        body{
            background: radial-gradient(circle at top,#171717 0%,#050505 45%);
            color:#fff;
            font-family:'Inter',sans-serif;
            min-height:100vh;
            overflow-x:hidden;
        }

        /* BOTÃO VOLTAR PREMIUM ABELLA */
        .back-button{
            display:flex;
            align-items:center;
            gap:12px;
            height:52px;
            padding:0 22px;
            border-radius:18px;
            background: linear-gradient(135deg, rgba(202,168,92,.18), rgba(202,168,92,.08));
            border:1px solid rgba(202,168,92,.35);
            color:#f5e7c2;
            font-size:12px;
            font-weight:900;
            letter-spacing:.18em;
            text-transform:uppercase;
            cursor:pointer;
            transition:.28s ease;
            backdrop-filter:blur(12px);
            box-shadow: 0 10px 30px rgba(0,0,0,.35);
        }
        .back-button:hover{
            transform:translateY(-2px);
            border-color:#caa85c;
            background: linear-gradient(135deg, rgba(202,168,92,.28), rgba(202,168,92,.12));
            box-shadow: 0 0 24px rgba(202,168,92,.18), 0 12px 34px rgba(0,0,0,.45);
        }
        .back-button:active{
            transform:scale(.98);
        }
        .back-button-icon{
            width:32px;
            height:32px;
            border-radius:12px;
            display:flex;
            align-items:center;
            justify-content:center;
            background:rgba(255,255,255,.08);
            font-size:16px;
            flex-shrink:0;
        }

        .serif{
            font-family:'Cinzel',serif;
        }
        .gold{
            color:var(--gold);
        }
        .glass{
            background:rgba(18,18,18,.92);
            backdrop-filter:blur(18px);
            border:1px solid rgba(255,255,255,.06);
        }
        .hero-glow{
            position:absolute;
            width:600px;
            height:600px;
            background: radial-gradient(circle, var(--gold) 0%, transparent 70%);
            opacity:.05;
            filter:blur(80px);
            pointer-events:none;
        }
        input, textarea, select{
            background:#181818 !important;
            border:1px solid #2b2b2b !important;
            color:#fff !important;
            transition:.25s ease;
        }
        input:focus, textarea:focus, select:focus{
            border-color:var(--gold) !important;
            box-shadow: 0 0 0 3px rgba(202,168,92,.15);
            outline:none;
        }
        .scrollbar::-webkit-scrollbar{
            width:6px;
        }
        .scrollbar::-webkit-scrollbar-thumb{
            background:#333;
            border-radius:20px;
        }
        .fade-in{
            animation:fade .35s ease forwards;
        }
        @keyframes fade{
            from{
                opacity:0;
                transform:translateY(10px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        @media(max-width:768px) {
            header .h-20 {
                height: auto;
                min-height: 76px;
                padding: 14px 0;
            }
            .back-button {
                height: 44px;
                padding: 0 16px;
                border-radius: 14px;
                gap: 8px;
            }
            .back-button span:last-child {
                display: none;
            }
            .back-button-icon {
                width: 28px;
                height: 28px;
                font-size: 14px;
            }
        }

        @media(max-width:640px){
            .back-button{
                width:100%;
                justify-content:center;
                height:54px;
                font-size:11px;
            }
            .back-button span:last-child {
                display: inline;
            }
        }
    </style>
</head>

    <script>
        const db = firebase.database();

        const CONFIG = {
            descontoPix: 5,
            parcelasMax: 6,
            freteFixo: 15,
            freteGratisAlvo: 100,
            pedidoMinimo: 300,
            whatsEmpresa: '5519999999999'
        };

        let itensCarrinho = [];

        function formatarPesoSeguro(peso) {
            if (typeof window.formatarPeso === 'function') {
                return window.formatarPeso(peso);
            }
            const p = parseFloat(peso) || 0;
            return p.toFixed(2);
        }

        function obterImagemProdutoSegura(item) {
            let url = item.image || item.imagem || item.thumbnail || '';
            if (typeof window.obterImagemProduto === 'function') {
                return window.obterImagemProduto(url);
            }
            if (window.ImageHelper && typeof window.ImageHelper.converterGsUrl === 'function') {
                return window.ImageHelper.converterGsUrl(url);
            }
            try {
                if (!url) return 'https://via.placeholder.com/100/111111/caa85c?text=Joia';
                url = String(url).trim();
                if (url.startsWith('http://') || url.startsWith('https://')) return url;
                if (url.startsWith('gs://')) {
                    const semGs = url.replace('gs://', '');
                    const primeiraBarra = semGs.indexOf('/');
                    if (primeiraBarra === -1) return url;
                    const bucket = semGs.substring(0, primeiraBarra);
                    const caminho = semGs.substring(primeiraBarra + 1);
                    return `https://firebasestorage.googleapis.com/v0/b/${bucket}/o/${encodeURIComponent(caminho)}?alt=media`;
                }
                return url;
            } catch (err) {
                return 'https://via.placeholder.com/100/111111/caa85c?text=Joia';
            }
        }

        function formatarMoedaSeguro(valor) {
            if (window.MoneyUtils && typeof window.MoneyUtils.format === 'function') {
                return window.MoneyUtils.format(valor);
            }
            if (window.money && typeof window.money.formatar === 'function') {
                return window.money.formatar(valor);
            }
            return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(parseFloat(valor) || 0);
        }

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                itensCarrinho = (typeof window.carrinhoService !== 'undefined' && window.carrinhoService.obterItens) 
                    ? (window.carrinhoService.obterItens() || []) 
                    : (window.CarrinhoService && typeof window.CarrinhoService.getItens === 'function' ? window.CarrinhoService.getItens() : []);

                if (!itensCarrinho.length) {
                    alert('Seu carrinho está vazio.');
                    window.location.href = 'index.html';
                    return;
                }

                await carregarConfiguracoes();
                renderizarItens();
                atualizarResumo();
            } catch (erro) {
                console.error('[CHECKOUT ERRO INICIALIZAÇÃO]', erro);
            }
        });

async function carregarConfiguracoes() {
    try {
        if (typeof window.getAbellaPath !== 'function') return;

        const snap = await db.ref(window.getAbellaPath('settings')).once('value');
        if (snap.exists()) {
            const s = snap.val() || {};
            CONFIG.descontoPix = parseFloat(s.pix ?? s.pixDesc ?? s.descontoPix ?? 5);
            CONFIG.parcelasMax = parseInt(s.parcelas ?? s.parcelasMax ?? 6);
            CONFIG.freteFixo = parseFloat(s.freteFixo ?? 15);
            CONFIG.freteGratisAlvo = parseFloat(s.freteGratisAlvo ?? 100);
            CONFIG.pedidoMinimo = parseFloat(s.pedidoMinimo ?? 300);
            CONFIG.whatsEmpresa = (s.whatsEmpresa || '5519999999999').replace(/\D/g,'');

            // Resolução robusta da logo idêntica ao comportamento do carrinho
            let logoPath = s.logo || s.logoUrl || '';
            if (typeof window.obterLogo === 'function') {
                logoPath = window.obterLogo();
            }

            if (logoPath) {
                const img = document.getElementById('abellaLogoImg');
                const fallback = document.getElementById('abellaLogoFallback');
                
                if (img) {
                    let urlFinal = logoPath.trim();
                    if (window.ImageHelper && typeof window.ImageHelper.converterGsUrl === 'function') {
                        urlFinal = window.ImageHelper.converterGsUrl(logoPath);
                    } else if (typeof window.resolverImagemFirebase === 'function') {
                        urlFinal = window.resolverImagemFirebase(logoPath);
                    } else if (urlFinal.startsWith('gs://')) {
                        const semGs = urlFinal.replace('gs://', '');
                        const primeiraBarra = semGs.indexOf('/');
                        if (primeiraBarra !== -1) {
                            const bucket = semGs.substring(0, primeiraBarra);
                            const caminho = semGs.substring(primeiraBarra + 1);
                            urlFinal = `https://firebasestorage.googleapis.com/v0/b/${bucket}/o/${encodeURIComponent(caminho)}?alt=media`;
                        }
                    }

                    img.src = urlFinal;
                    img.onload = () => {
                        img.classList.remove('hidden');
                        if (fallback) fallback.classList.add('hidden');
                    };
                    img.onerror = () => {
                        img.classList.add('hidden');
                        if (fallback) fallback.classList.remove('hidden');
                    };
                }
            }
        }
    } catch (e) {
        console.warn('Erro ao processar configurações da logo:', e);
    }
}
        function renderizarItens() {
            const container = document.getElementById('lista-itens-checkout');
            if (!container) return;
            container.innerHTML = '';

            itensCarrinho.forEach(item => {
                const qtd = parseInt(item.quantidade, 10) || 1;
                const preco = parseFloat(item.precoFinal ?? item.price ?? item.preco ?? item.precoUnitario ?? 0);
                const total = preco * qtd;
                const imagem = obterImagemProdutoSegura(item);
                const nomeLimpo = String(item.name || item.titulo || item.nome || 'Produto').replace(/</g, "&lt;").replace(/>/g, "&gt;");
                const vNome = String(item.variacaoSelecionada || '').trim();
                const exibirVariacao = vNome ? `<span class="block text-[10px] text-[#caa85c] font-bold mt-0.5 uppercase tracking-wide">Variação: ${vNome}</span>` : '';

                container.innerHTML += `
                    <div class="flex items-center gap-4 border border-white/5 rounded-2xl p-3 bg-zinc-900/40">
                        <img src="${imagem}" class="w-16 h-16 rounded-xl object-cover bg-black border border-zinc-800 shrink-0" alt="${nomeLimpo}">
                        <div class="flex-1 min-w-0">
                            <h3 class="font-bold text-sm truncate text-white uppercase tracking-wide">${nomeLimpo}</h3>
                            ${exibirVariacao}
                            <p class="text-zinc-500 text-xs mt-0.5">${qtd}x • ${formatarMoedaSeguro(preco)}</p>
                        </div>
                        <span class="font-black text-sm text-[#caa85c] shrink-0">${formatarMoedaSeguro(total)}</span>
                    </div>
                `;
            });
        }

        function calcularTotais() {
            let qtd = 0;
            let peso = 0;
            let subtotal = 0;

            itensCarrinho.forEach(item => {
                const quantidade = parseInt(item.quantidade, 10) || 1;
                const preco = parseFloat(item.precoFinal ?? item.price ?? item.preco ?? item.precoUnitario ?? 0);
                const pesoItem = parseFloat(item.peso || item.pesoUnitario || 0);

                qtd += quantidade;
                peso += pesoItem * quantidade;
                subtotal += preco * quantidade;
            });

            const pagamento = document.querySelector('input[name="formaPagamento"]:checked')?.value || 'PIX';
            let desconto = 0;

            if (pagamento === 'PIX') {
                desconto = subtotal * ((CONFIG.descontoPix || 0) / 100);
            }

            let frete = 0;
            if (subtotal > 0 && subtotal < (CONFIG.freteGratisAlvo || 100)) {
                frete = parseFloat(CONFIG.freteFixo || 0);
            }

            const total = subtotal - desconto + frete;

            return { qtd, peso, subtotal, desconto, frete, total, pagamento };
        }

      function atualizarResumo() {
    try {
        const t = calcularTotais();
        
        // Quantidade total de peças
        const qtdEl = document.getElementById('res-qtd');
        if (qtdEl) qtdEl.innerText = `${t.totalPecas || 0} pçs`;
        
        // Subtotal
        const subtotalEl = document.getElementById('res-subtotal');
        if (subtotalEl) subtotalEl.innerText = formatarMoedaSeguro(t.subtotal);
        
        // Desconto PIX
        const descontoEl = document.getElementById('res-desconto');
        const boxDesconto = document.getElementById('box-desconto');
        if (descontoEl) {
            descontoEl.innerText = `- ${formatarMoedaSeguro(t.desconto)}`;
            if (boxDesconto) {
                if (t.desconto > 0) {
                    boxDesconto.classList.remove('hidden');
                    boxDesconto.classList.add('flex');
                } else {
                    boxDesconto.classList.remove('flex');
                    boxDesconto.classList.add('hidden');
                }
            }
        }
        
        // Peso (Usa o formatador nativo do peso.js que já coloca a unidade 'g' ou 'kg')
        const pesoEl = document.getElementById('res-peso');
        if (pesoEl) {
            pesoEl.innerText = typeof formatarPesoSeguro === 'function' 
                ? formatarPesoSeguro(t.peso) 
                : (typeof formatarPeso === 'function' ? formatarPeso(t.peso) : `${t.peso.toFixed(2)} g`);
        }

        // Frete (Evita o erro de elemento nulo procurando por 'res-frete')
        const freteEl = document.getElementById('res-frete');
        if (freteEl) {
            freteEl.innerText = t.frete > 0 ? formatarMoedaSeguro(t.frete) : 'Grátis (Limeira)';
        }

        // Total Final
        const totalEl = document.getElementById('res-total');
        if (totalEl) totalEl.innerText = formatarMoedaSeguro(t.total);

        // Aviso Dinâmico de Frete (opcional, se houver o container na tela)
        const avisoFrete = document.getElementById('aviso-frete-checkout');
        if (avisoFrete) {
            if (t.subtotal >= CONFIG.freteGratisAlvo) {
                avisoFrete.innerHTML = `🎉 Parabéns! Seu pedido atingiu <b>${formatarMoedaSeguro(CONFIG.freteGratisAlvo)}</b> e ganhou <b>Frete Grátis</b> para Limeira!`;
                avisoFrete.className = "p-3 rounded-xl bg-emerald-950/40 border border-emerald-900/40 text-emerald-400 text-xs text-center";
            } else {
                const restante = CONFIG.freteGratisAlvo - t.subtotal;
                avisoFrete.innerHTML = `Faltam apenas <b>${formatarMoedaSeguro(restante)}</b> para garantir o <b>Frete Grátis</b> para Limeira.`;
                avisoFrete.className = "p-3 rounded-xl bg-zinc-900/60 border border-zinc-800 text-zinc-400 text-xs text-center";
            }
        }
    } catch (error) {
        console.error('[ERRO INTERNO ATUALIZAR RESUMO]:', error);
    }
}

        function gerarPDF(autoPrint = false) {
            try {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF({ orientation: 'p', unit: 'mm', format: 'a4' });
                
                const t = calcularTotais();
                const cliente = document.getElementById('cli-nome')?.value || 'Não informado';
                const whats = document.getElementById('cli-whats')?.value || 'Não informado';
                const city = document.getElementById('cli-cidade')?.value || 'Não informado';
                const obs = document.getElementById('obs-pedido')?.value || 'Sem observações';

                doc.setFont('Helvetica', 'bold');
                doc.setFontSize(22);
                doc.setTextColor(186, 154, 91);
                doc.text('ABELLA JOIAS', 105, 20, { align: 'center' });
                
                doc.setFont('Helvetica', 'normal');
                doc.setFontSize(10);
                doc.setTextColor(100, 100, 100);
                doc.text('ROMANEIO DE PEDIDO PREMIUM', 105, 26, { align: 'center' });
                doc.text(new Date().toLocaleString('pt-BR'), 105, 31, { align: 'center' });

                doc.setDrawColor(220, 220, 220);
                doc.setFillColor(248, 248, 248);
                doc.roundedRect(14, 38, 182, 28, 3, 3, 'FD');
                
                doc.setFont('Helvetica', 'bold');
                doc.setFontSize(10);
                doc.setTextColor(50, 50, 50);
                doc.text('DADOS DO CLIENTE & ENTREGA', 18, 44);
                
                doc.setFont('Helvetica', 'normal');
                doc.text(`Cliente: ${cliente}`, 18, 51);
                doc.text(`WhatsApp: ${whats}`, 18, 56);
                doc.text(`Cidade: ${city}`, 18, 61);
                doc.text(`Pagamento: ${t.pagamento}`, 120, 51);
                doc.text(`Total Peças: ${t.qtd} pçs`, 120, 56);
                doc.text(`Peso Total: ${formatarPesoSeguro(t.peso)}g`, 120, 61);

                let y = 74;
                doc.setFont('Helvetica', 'bold');
                doc.setFontSize(9);
                doc.setFillColor(240, 240, 240);
                doc.rect(14, y, 182, 7, 'F');
                doc.setTextColor(50, 50, 50);
                
                doc.text('REF', 16, y + 5);
                doc.text('PRODUTO', 45, y + 5);
                doc.text('QTD', 115, y + 5, { align: 'center' });
                doc.text('VALOR UN.', 140, y + 5, { align: 'right' });
                doc.text('TOTAL', 190, y + 5, { align: 'right' });

                y += 7;
                doc.setFont('Helvetica', 'normal');
                doc.setTextColor(80, 80, 80);

                itensCarrinho.forEach(item => {
                    if (y > 260) { doc.addPage(); y = 20; }
                    
                    const ref = item.id || item.codigo || item.sku || '-';
                    const vNome = item.variacaoSelecionada ? ` (${item.variacaoSelecionada})` : '';
                    const nome = (item.name || item.titulo || item.nome || 'Produto') + vNome;
                    const qtd = parseInt(item.quantidade, 10) || 1;
                    const preco = parseFloat(item.precoFinal ?? item.price ?? item.preco ?? item.precoUnitario ?? 0);

                    doc.text(ref, 16, y + 5);
                    doc.text(nome.substring(0, 35), 45, y + 5);
                    doc.text(String(qtd), 115, y + 5, { align: 'center' });
                    doc.text(formatarMoedaSeguro(preco), 140, y + 5, { align: 'right' });
                    doc.text(formatarMoedaSeguro(preco * qtd), 190, y + 5, { align: 'right' });
                    
                    y += 7;
                });

                y += 5;
                if (y > 250) { doc.addPage(); y = 20; }
                doc.setDrawColor(200, 200, 200);
                doc.line(14, y, 196, y);
                
                y += 6;
                doc.text(`Subtotal: ${formatarMoedaSeguro(t.subtotal)}`, 195, y, { align: 'right' });
                if(t.desconto > 0) {
                    y += 5;
                    doc.text(`Desconto PIX: -${formatarMoedaSeguro(t.desconto)}`, 195, y, { align: 'right' });
                }
                y += 5;
                doc.text(`Frete: ${t.frete > 0 ? formatarMoedaSeguro(t.frete) : 'Grátis'}`, 195, y, { align: 'right' });
                
                y += 8;
                doc.setFont('Helvetica', 'bold');
                doc.setFontSize(12);
                doc.setTextColor(186, 154, 91);
                doc.text(`VALOR TOTAL: ${formatarMoedaSeguro(t.total)}`, 195, y, { align: 'right' });

                if (autoPrint) {
                    doc.autoPrint();
                    window.open(doc.output('bloburl'), '_blank');
                } else {
                    doc.save(`romaneio_abella_${Date.now()}.pdf`);
                }
            } catch (err) {
                console.error('Erro ao gerar arquivo PDF:', err);
                alert('Erro na compilação do PDF.');
            }
        }

        async function finalizarPedido() {
            const nome = document.getElementById('cli-nome')?.value.trim();
            const whats = document.getElementById('cli-whats')?.value.trim();
            const cidade = document.getElementById('cli-cidade')?.value.trim();
            const local = document.getElementById('ent-local')?.value.trim();
            const rua = document.getElementById('ent-rua')?.value.trim();
            const num = document.getElementById('ent-numero')?.value.trim();
            const bairro = document.getElementById('ent-bairro')?.value.trim();
            const cidadeEnt = document.getElementById('ent-cidade')?.value.trim();
            const obs = document.getElementById('obs-pedido')?.value.trim();

            if (!nome || !whats || !cidade || !local || !rua || !num || !bairro || !cidadeEnt) {
                alert('Por favor, preencha todos os campos obrigatórios (*).');
                return;
            }

            const t = calcularTotais();

            let msg = `✨ *NOVO PEDIDO CONFIRMADO - ABELLA JOIAS* ✨\n\n`;
            msg += `👤 *DADOS DO CLIENTE:*\n`;
            msg += `▪️ *Nome:* ${nome}\n`;
            msg += `▪️ *WhatsApp:* ${whats}\n`;
            msg += `▪️ *Cidade:* ${cidade}\n\n`;
            
            msg += `📦 *DADOS DE ENTREGA:*\n`;
            msg += `▪️ *Local:* ${local}\n`;
            msg += `▪️ *Endereço:* ${rua}, Nº ${num}\n`;
            msg += `▪️ *Bairro:* ${bairro} - ${cidadeEnt}\n\n`;

            msg += `📊 *RESUMO FINANCEIRO:*\n`;
            msg += `▪️ *Total de Peças:* ${t.qtd} pçs\n`;
            msg += `▪️ *Peso Total:* ${formatarPesoSeguro(t.peso)}g\n`;
            msg += `▪️ *Subtotal:* ${formatarMoedaSeguro(t.subtotal)}\n`;
            if (t.desconto > 0) msg += `▪️ *Desconto PIX:* -${formatarMoedaSeguro(t.desconto)}\n`;
            msg += `▪️ *Frete:* ${t.frete > 0 ? formatarMoedaSeguro(t.frete) : 'Grátis (Galvânicas Limeira)'}\n`;
            msg += `▪️ *Forma de Pagamento:* ${t.pagamento}\n`;
            msg += `⭐ *TOTAL FINAL:* ${formatarMoedaSeguro(t.total)}\n\n`;

            if (obs) msg += `📝 *Observações:* ${obs}\n\n`;

            msg += `💬 O meu pedido já foi gerado com sucesso! Fico no aguardo do envio do *link de pagamento* e da confirmação do *prazo de entrega*. Obrigado!`;

            const urlWhats = `https://api.whatsapp.com/send?phone=${CONFIG.whatsEmpresa}&text=${encodeURIComponent(msg)}`;
            
            if (typeof window.carrinhoService !== 'undefined' && window.carrinhoService.limpar) {
                window.carrinhoService.limpar();
            } else if (window.CarrinhoService && typeof window.CarrinhoService.limpar === 'function') {
                window.CarrinhoService.limpar();
            }
            
            window.open(urlWhats, '_blank');
        }

        window.visualizarRomaneio = visualizarRomaneio;
        window.fecharModal = fecharModal;
        window.gerarPDF = gerarPDF;
        window.finalizarPedido = finalizarPedido;
        window.atualizarResumo = atualizarResumo;
    </script>
