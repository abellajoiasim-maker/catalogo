<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Catálogo • Abella Joias</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { background: transparent; color: #eee; font-family: 'Inter', sans-serif; }
        .serif { font-family: 'Cinzel', serif; }
        .gold { color: #caa85c; }
        .bg-card { background: #141414; border: 1px solid #222; }
        
        input, select {
            background: #1a1a1a !important;
            border: 1px solid #333 !important;
            color: #fff !important;
            transition: all 0.2s ease;
        }
        input:focus, select:focus {
            border-color: #caa85c !important;
            outline: none;
            box-shadow: 0 0 0 2px rgba(202, 168, 92, 0.1);
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: #caa85c; }
    </style>
</head>
<body class="p-1 md:p-4">

    <div class="max-w-7xl mx-auto space-y-6">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-zinc-950 p-6 rounded-2xl border border-zinc-900 shadow-xl">
            <div>
                <div class="flex items-center gap-2">
                    <span class="w-1.5 h-4 bg-[#caa85c] rounded-full"></span>
                    <h2 class="serif text-base font-bold text-white uppercase tracking-wider">💎 Gerenciamento de Catálogo de Joias</h2>
                </div>
                <p class="text-xs text-zinc-500 mt-1">Insira, edite, controle estados de veiculação e trate mídias no nó centralizado abella/products.</p>
            </div>
            <button id="btnNovoProduto" class="bg-[#caa85c] hover:bg-[#bda152] text-black font-black text-xs px-5 py-3 rounded-xl uppercase tracking-wider transition-all shadow-md shadow-amber-500/5">
                + Novo Produto
            </button>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 bg-zinc-950 p-4 rounded-xl border border-zinc-900">
            <div class="flex flex-col space-y-1">
                <label class="text-[9px] uppercase font-bold text-zinc-500 tracking-wider">Termo de Pesquisa</label>
                <input type="text" id="filtroTexto" placeholder="Buscar por Nome ou SKU..." class="w-full rounded-xl px-4 py-2.5 text-xs">
            </div>
            <div class="flex flex-col space-y-1">
                <label class="text-[9px] uppercase font-bold text-zinc-500 tracking-wider">Filtrar Categoria</label>
                <select id="filtroCategoria" class="w-full rounded-xl px-4 py-2.5 text-xs">
                    <option value="">Todas as Categorias</option>
                </select>
            </div>
            <div class="flex flex-col space-y-1">
                <label class="text-[9px] uppercase font-bold text-zinc-500 tracking-wider">Filtrar Subcategoria</label>
                <select id="filtroSubcategoria" class="w-full rounded-xl px-4 py-2.5 text-xs">
                    <option value="">Todas as Subcategorias</option>
                </select>
            </div>
        </div>

        <div id="loading" class="text-center py-16 text-zinc-500 text-xs font-mono uppercase tracking-widest animate-pulse">⏳ Indexando referências no Realtime Database...</div>
        <div id="grid-produtos" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4"></div>

        <div class="flex justify-center items-center gap-4 pt-4">
            <button id="btnPagAnt" class="bg-zinc-950 border border-zinc-900 text-zinc-400 hover:text-white px-4 py-2 rounded-xl text-xs font-medium transition-all hover:bg-zinc-900">Anterior</button>
            <span id="infoPagina" class="text-xs font-mono text-zinc-500 bg-zinc-950 px-3 py-1 rounded-md border border-zinc-900">Página 1 de 1</span>
            <button id="btnPagProx" class="bg-zinc-950 border border-zinc-900 text-zinc-400 hover:text-white px-4 py-2 rounded-xl text-xs font-medium transition-all hover:bg-zinc-900">Próxima</button>
        </div>
    </div>

    <div id="modalProduto" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4 transition-all">
        <div class="bg-zinc-950 border border-zinc-900 rounded-2xl w-full max-w-xl overflow-hidden shadow-2xl flex flex-col max-h-[92vh]">
            <div class="p-5 border-b border-zinc-900 flex justify-between items-center bg-zinc-950">
                <h3 id="modalTitulo" class="serif text-xs font-bold text-white uppercase tracking-wider">Novo Registro de Produto</h3>
                <button id="btnFecharModalTopo" class="text-zinc-500 hover:text-white text-sm transition-all p-1">✕</button>
            </div>
            
            <form id="formProduto" class="p-6 space-y-4 overflow-y-auto flex-1 text-left">
                <input type="hidden" id="prodId">
                
                <div class="grid grid-cols-3 gap-4">
                    <div class="col-span-1 space-y-1">
                        <label class="text-[10px] uppercase text-zinc-400 font-bold tracking-wider">Código SKU *</label>
                        <input type="text" id="prodSku" required placeholder="Ex: AN-0021" class="w-full rounded-xl px-3 py-2.5 text-xs">
                    </div>
                    <div class="col-span-2 space-y-1">
                        <label class="text-[10px] uppercase text-zinc-400 font-bold tracking-wider">Nome do Produto Bruto *</label>
                        <input type="text" id="prodName" required placeholder="Ex: Anel Solitário Cravejado" class="w-full rounded-xl px-3 py-2.5 text-xs">
                    </div>
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="text-[10px] uppercase text-zinc-400 font-bold tracking-wider">Categoria Mãe *</label>
                        <select id="prodCategory" required class="w-full rounded-xl px-3 py-2.5 text-xs"></select>
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] uppercase text-zinc-400 font-bold tracking-wider">Subcategoria Vinculada</label>
                        <select id="prodSubcategory" class="w-full rounded-xl px-3 py-2.5 text-xs">
                            <option value="">Nenhuma</option>
                        </select>
                    </div>
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="text-[10px] uppercase text-zinc-400 font-bold tracking-wider">Preço de Atacado (R$) *</label>
                        <input type="number" step="0.01" id="prodPrice" required placeholder="0.00" class="w-full rounded-xl px-3 py-2.5 text-xs font-mono">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] uppercase text-zinc-400 font-bold tracking-wider">Peso Bruto (Gramas) *</label>
                        <input type="number" step="0.01" id="prodWeight" required placeholder="0.00" class="w-full rounded-xl px-3 py-2.5 text-xs font-mono">
                    </div>
                </div>
                
                <div class="bg-zinc-900/40 border border-zinc-900 p-4 rounded-xl space-y-3">
                    <div class="space-y-1">
                        <label class="text-[10px] uppercase text-zinc-400 font-bold tracking-wider block">Arquivo Físico (Upload Storage)</label>
                        <input type="file" id="prodFile" accept="image/*" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-zinc-400 file:bg-zinc-800 file:border-0 file:text-white file:rounded-lg file:px-3 file:py-1 file:mr-2 file:text-[10px] file:font-bold file:uppercase file:cursor-pointer">
                    </div>
                    <div class="relative flex py-1 items-center">
                        <div class="flex-grow border-t border-zinc-800/60"></div>
                        <span class="flex-shrink mx-3 text-[9px] uppercase font-mono text-zinc-600">ou referência remota</span>
                        <div class="flex-grow border-t border-zinc-800/60"></div>
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] uppercase text-zinc-400 font-bold tracking-wider">Endereço da Imagem (URL ou gs://)</label>
                        <input type="text" id="prodImageUrl" placeholder="Ex: gs://catalogo-abella-joias... / http://..." class="w-full rounded-xl px-3 py-2.5 text-xs font-mono">
                    </div>
                </div>
                
                <div class="flex items-center gap-2.5 py-1">
                    <input type="checkbox" id="prodActive" checked class="w-4 h-4 rounded border-zinc-800 text-[#caa85c] focus:ring-0 bg-zinc-900 cursor-pointer">
                    <label for="prodActive" class="text-xs text-zinc-400 select-none cursor-pointer">Disponível para venda imediata na vitrine do catálogo</label>
                </div>
                
                <div class="pt-4 border-t border-zinc-900 flex justify-end gap-2 bg-zinc-950">
                    <button type="button" id="btnFecharModalForm" class="bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-zinc-400 px-4 py-2.5 rounded-xl text-xs font-bold hover:text-white uppercase tracking-wider transition-all">Cancelar</button>
                    <button type="submit" id="btnSalvarForm" class="bg-[#caa85c] hover:bg-[#bda152] text-black font-black px-6 py-2.5 rounded-xl text-xs uppercase tracking-wider transition-all shadow-md">Salvar Registro</button>
                </div>
            </form>
        </div>
    </div>

    <script>
    window.produtoServiceBridge = window.produtoService || {
        async listarTodos() {
            const snap = await firebase.database().ref('abella/products').once('value');
            const dados = snap.val() || {};
            return Object.keys(dados).map(key => ({ id: key, ...dados[key] }));
        },
        async salvar(id, payload) {
            if (id) {
                await firebase.database().ref(`abella/products/${id}`).update(payload);
            } else {
                await firebase.database().ref('abella/products').push(payload);
            }
            return true;
        },
        async deletar(id) {
            await firebase.database().ref(`abella/products/${id}`).remove();
            return true;
        }
    };
    
    window.categoriaServiceBridge = window.categoriaService || {
        async listarTodas() {
            const snap = await firebase.database().ref('abella/categories').once('value');
            return snap.val() || {};
        }
    };
    </script>

    <script>
    (function() {
        'use strict';

        let paginaAtual = 1;
        const itensPorPagina = 12;
        let listaCategoriasCache = {};
        let totalValoresFiltrados = [];

        const DOM = {
            grid: document.getElementById('grid-produtos'),
            loading: document.getElementById('loading'),
            infoPagina: document.getElementById('infoPagina'),
            filtroTexto: document.getElementById('filtroTexto'),
            filtroCategoria: document.getElementById('filtroCategoria'),
            filtroSubcategoria: document.getElementById('filtroSubcategoria'),
            btnNovo: document.getElementById('btnNovoProduto'),
            btnAnt: document.getElementById('btnPagAnt'),
            btnProx: document.getElementById('btnPagProx'),
            modal: document.getElementById('modalProduto'),
            modalTitulo: document.getElementById('modalTitulo'),
            form: document.getElementById('formProduto'),
            btnFecharTopo: document.getElementById('btnFecharModalTopo'),
            btnFecharForm: document.getElementById('btnFecharModalForm'),
            prodId: document.getElementById('prodId'),
            prodSku: document.getElementById('prodSku'),
            prodName: document.getElementById('prodName'),
            prodCategory: document.getElementById('prodCategory'),
            prodSubcategory: document.getElementById('prodSubcategory'),
            prodPrice: document.getElementById('prodPrice'),
            prodWeight: document.getElementById('prodWeight'),
            prodFile: document.getElementById('prodFile'),
            prodImageUrl: document.getElementById('prodImageUrl'),
            prodActive: document.getElementById('prodActive')
        };

        document.addEventListener('DOMContentLoaded', async () => {
            configurarEventos();
            await carregarMapeamentoFiltros();
            await sincronizarEfetivoCatalogo();
        });

        function configurarEventos() {
            DOM.btnNovo.addEventListener('click', abrirModalForm);
            DOM.btnFecharTopo.addEventListener('click', fecharModalForm);
            DOM.btnFecharForm.addEventListener('click', fecharModalForm);
            DOM.form.addEventListener('submit', processarPersistenciaProduto);
            
            DOM.filtroTexto.addEventListener('input', () => { resetarPaginaESincronizar(); });
            DOM.filtroCategoria.addEventListener('change', () => { 
                sincronizarFiltroSubcategorias(); 
                resetarPaginaESincronizar(); 
            });
            DOM.filtroSubcategoria.addEventListener('change', () => { resetarPaginaESincronizar(); });
            
            DOM.prodCategory.addEventListener('change', sincronizarSubcategoriasForm);

            DOM.btnAnt.addEventListener('click', () => { if(paginaAtual > 1) { paginaAtual--; renderizarPaginaFiltrada(); } });
            DOM.btnProx.addEventListener('click', () => {
                const totalPaginas = Math.ceil(filtrarItensMemoria().length / itensPorPagina) || 1;
                if(paginaAtual < totalPaginas) { paginaAtual++; renderizarPaginaFiltrada(); }
            });

            // Delegação Otimizada de Eventos no Grid (Preve vazamentos de memória I/O)
            DOM.grid.addEventListener('click', (e) => {
                const btnEditar = e.target.closest('.btn-editar-prod');
                const btnExcluir = e.target.closest('.btn-excluir-prod');
                
                if (btnEditar) {
                    executarMapeamentoEdicao(btnEditar.dataset.id);
                } else if (btnExcluir) {
                    apagarRegistroProduto(btnExcluir.dataset.id);
                }
            });
        }

        async function carregarMapeamentoFiltros() {
            try {
                listaCategoriasCache = await window.categoriaServiceBridge.listarTodas() || {};
                
                DOM.filtroCategoria.innerHTML = '<option value="">Todas as Categorias</option>';
                DOM.prodCategory.innerHTML = '<option value="" disabled selected>Selecione...</option>';

                Object.keys(listaCategoriasCache).forEach(key => {
                    const c = listaCategoriasCache[key];
                    const nome = c.name || key;
                    DOM.filtroCategoria.innerHTML += `<option value="${key}">${nome.toUpperCase()}</option>`;
                    DOM.prodCategory.innerHTML += `<option value="${key}">${nome.toUpperCase()}</option>`;
                });
            } catch(e) {
                console.error("Falha ao mapear categorias nos filtros:", e);
            }
        }

        function sincronizarFiltroSubcategorias() {
            const catKey = DOM.filtroCategoria.value;
            DOM.filtroSubcategoria.innerHTML = '<option value="">Todas as Subcategorias</option>';
            
            if(catKey && listaCategoriasCache[catKey] && listaCategoriasCache[catKey].subcategories) {
                const subs = listaCategoriasCache[catKey].subcategories;
                Object.keys(subs).forEach(subKey => {
                    DOM.filtroSubcategoria.innerHTML += `<option value="${subKey}">${(subs[subKey].name || subKey).toUpperCase()}</option>`;
                });
            }
        }

        function sincronizarSubcategoriasForm() {
            const catKey = DOM.prodCategory.value;
            DOM.prodSubcategory.innerHTML = '<option value="">Nenhuma</option>';
            
            if(catKey && listaCategoriasCache[catKey] && listaCategoriasCache[catKey].subcategories) {
                const subs = listaCategoriasCache[catKey].subcategories;
                Object.keys(subs).forEach(subKey => {
                    DOM.prodSubcategory.innerHTML += `<option value="${subKey}">${subs[subKey].name || subKey}</option>`;
                });
            }
        }

        function resetarPaginaESincronizar() {
            paginaAtual = 1;
            renderizarPaginaFiltrada();
        }

        async function sincronizarEfetivoCatalogo() {
            DOM.grid.innerHTML = '';
            DOM.loading.classList.remove('hidden');

            try {
                totalValoresFiltrados = await window.produtoServiceBridge.listarTodos();
                renderizarPaginaFiltrada();
            } catch(e) {
                console.error(e);
                DOM.loading.innerText = "❌ Falha crítica ao processar referências com Firebase RTDB.";
            }
        }

        // Concentra a computação de filtros encadeados em memória
        function filtrarItensMemoria() {
            const txt = DOM.filtroTexto.value.toLowerCase().trim();
            const cat = DOM.filtroCategoria.value;
            const sub = DOM.filtroSubcategoria.value;

            return totalValoresFiltrados.filter(p => {
                const matchTexto = !txt || 
                    (p.name && p.name.toLowerCase().includes(txt)) || 
                    (p.sku && p.sku.toLowerCase().includes(txt));
                const matchCat = !cat || p.category === cat;
                const matchSub = !sub || p.subcategory === sub;
                return matchTexto && matchCat && matchSub;
            });
        }

        function renderizarPaginaFiltrada() {
            DOM.grid.innerHTML = '';
            DOM.loading.classList.add('hidden');

            const itensFiltrados = filtrarItensMemoria();
            const totalPaginas = Math.ceil(itensFiltrados.length / itensPorPagina) || 1;
            
            // Corrige transbordamento de página vazia caso mude filtros
            if (paginaAtual > totalPaginas) paginaAtual = totalPaginas;
            
            DOM.infoPagina.innerText = `Página ${paginaAtual} de ${totalPaginas}`;

            if(itensFiltrados.length === 0) {
                DOM.grid.innerHTML = '<p class="col-span-full text-zinc-600 text-xs italic text-center py-12 font-mono">[Nenhum item localizado nos parâmetros informados]</p>';
                return;
            }

            const inicio = (paginaAtual - 1) * itensPorPagina;
            const fim = inicio + itensPorPagina;
            const itensExibidos = itensFiltrados.slice(inicio, fim);

            itensExibidos.forEach(p => {
                const card = document.createElement('div');
                const isAtivo = p.active === true || p.active === "true" || p.active === undefined;
                
                card.className = `bg-zinc-950/80 border rounded-2xl p-3 flex flex-col justify-between text-left space-y-2.5 transition-all hover:bg-zinc-950 ${isAtivo ? 'border-zinc-900' : 'border-amber-900/30 opacity-40 bg-zinc-950/20'}`;
                
                let srcImg = 'https://via.placeholder.com/150';
                if(p.image) {
                    srcImg = (window.StorageUtils && typeof window.StorageUtils.converterUrlStorage === 'function') 
                        ? window.StorageUtils.converterUrlStorage(p.image) 
                        : p.image.replace('gs://', 'https://storage.googleapis.com/');
                }
                
                const formatadoPrice = (window.MoneyUtils && typeof window.MoneyUtils.format === 'function')
                    ? window.MoneyUtils.format(p.price)
                    : `R$ ${parseFloat(p.price || 0).toFixed(2).replace('.', ',')}`;

                card.innerHTML = `
                    <div class="aspect-square bg-zinc-900 rounded-xl overflow-hidden flex items-center justify-center border border-zinc-800/40 relative">
                        <img src="${srcImg}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/200'">
                        ${!isAtivo ? '<span class="absolute top-2 right-2 text-[8px] px-1.5 py-0.5 bg-amber-950 border border-amber-900/40 text-amber-400 rounded uppercase font-mono tracking-wider">Pausado</span>' : ''}
                    </div>
                    <div class="min-w-0">
                        <span class="text-[8px] font-mono text-zinc-500 bg-zinc-900 px-2 py-0.5 rounded border border-zinc-800 tracking-wider">SKU: ${p.sku || 'N/A'}</span>
                        <h4 class="text-white font-bold text-xs mt-2 truncate uppercase tracking-wide">${p.name || 'Sem nome'}</h4>
                        <div class="flex items-center justify-between gap-1 mt-1 font-mono text-[10px]">
                            <span class="text-[#caa85c] font-bold">${formatadoPrice}</span>
                            <span class="text-zinc-500 text-[9px]">${parseFloat(p.weight || 0).toFixed(2)}g bruto</span>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-1.5 pt-1.5 border-t border-zinc-900">
                        <button class="btn-editar-prod bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-zinc-300 text-[10px] py-1.5 font-bold rounded-lg transition-all uppercase tracking-wider" data-id="${p.id}">Editar</button>
                        <button class="btn-excluir-prod bg-red-950/10 hover:bg-red-950/40 border border-red-900/20 text-red-400 text-[10px] py-1.5 font-bold rounded-lg transition-all uppercase tracking-wider" data-id="${p.id}">Excluir</button>
                    </div>
                `;
                DOM.grid.appendChild(card);
            });
        }

        function abrirModalForm() {
            DOM.form.reset();
            DOM.prodId.value = '';
            DOM.modalTitulo.innerText = "Novo Registro de Produto";
            DOM.modal.classList.remove('hidden');
            setTimeout(() => DOM.prodSku.focus(), 50);
        }

        function fecharModalForm() { DOM.modal.classList.add('hidden'); }

        async function executarMapeamentoEdicao(id) {
            const alvo = totalValoresFiltrados.find(item => item.id === id);
            if(!alvo) return;

            abrirModalForm();
            DOM.modalTitulo.innerText = "Modificar Registro de Produto";

            DOM.prodId.value = alvo.id || '';
            DOM.prodSku.value = alvo.sku || '';
            DOM.prodName.value = alvo.name || '';
            DOM.prodCategory.value = alvo.category || '';
            
            sincronizarSubcategoriasForm();
            DOM.prodSubcategory.value = alvo.subcategory || '';
            
            DOM.prodPrice.value = alvo.price || '';
            DOM.prodWeight.value = alvo.weight || '';
            DOM.prodImageUrl.value = alvo.image || '';
            DOM.prodActive.checked = alvo.active === true || alvo.active === "true" || alvo.active === undefined;
        }

        async function processarPersistenciaProduto(e) {
            e.preventDefault();
            const btnSalvar = document.getElementById('btnSalvarForm');
            const textoOriginal = btnSalvar.innerText;
            
            btnSalvar.innerText = "⏳ SALVANDO...";
            btnSalvar.disabled = true;

            let finalImgUrl = DOM.prodImageUrl.value.trim();

            try {
                // Upload estruturado para Firebase Storage se houver arquivo anexado
                if(DOM.prodFile.files.length > 0 && typeof firebase !== 'undefined' && firebase.storage) {
                    const arquivo = DOM.prodFile.files[0];
                    const pathRef = firebase.storage().ref(`images/produtos/${Date.now()}_${arquivo.name}`);
                    const metadataSnap = await pathRef.put(arquivo);
                    finalImgUrl = `gs://${metadataSnap.metadata.bucket}/${metadataSnap.metadata.fullPath}`;
                }

                const payload = {
                    sku: DOM.prodSku.value.trim(),
                    name: DOM.prodName.value.trim(),
                    category: DOM.prodCategory.value,
                    subcategory: DOM.prodSubcategory.value,
                    price: parseFloat(DOM.prodPrice.value) || 0,
                    weight: parseFloat(DOM.prodWeight.value) || 0,
                    image: finalImgUrl,
                    active: DOM.prodActive.checked,
                    lastUpdate: Date.now()
                };

                // Corrigido chamada do método unificado para o serviceBridge
                await window.produtoServiceBridge.salvar(DOM.prodId.value, payload);
                
                fecharModalForm();
                await sincronizarEfetivoCatalogo();
            } catch(err) {
                console.error(err);
                alert("Erro ao persistir informações no Firebase.");
            } finally {
                btnSalvar.innerText = textoOriginal;
                btnSalvar.disabled = false;
            }
        }

        async function apagarRegistroProduto(id) {
            if(confirm("Deseja expurgar permanentemente este registro de produto no Firebase?")) {
                try {
                    await window.produtoServiceBridge.deletar(id);
                    await sincronizarEfetivoCatalogo();
                } catch(err) {
                    alert("Erro ao remover registro.");
                }
